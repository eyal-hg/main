<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>HK · התיק שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0C4068; --navy2:#164F7D; --cyan:#39ABE2; --coral:#E8635A;
  --bg:#F4F7FA; --w:#fff; --bd:#E6ECF4; --bd2:#D9E3EF;
  --green:#13895b; --red:#dc4436; --orange:#c98404; --purple:#7557E3;
  --ink:#0C4068; --ink2:#4A6B87; --ink3:#8AA0B4;
  --sh:0 6px 18px rgba(12,64,104,.08);
  --sh2:0 12px 34px rgba(12,64,104,.14);
  --r:16px; --r2:14px; --r3:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Rubik,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cdd9e6;border-radius:9px}

/* ===== SHELL ===== */
.app{display:flex;min-height:100vh}
.rail{width:62px;background:var(--navy);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0;
  position:sticky;top:0;height:100vh;flex-shrink:0}
.rail .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#39ABE2,#2b86b8);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;letter-spacing:.5px;margin-bottom:12px}
.rail .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#87b3d1;transition:.15s}
.rail .ic:hover{background:rgba(255,255,255,.09);color:#fff}
.rail .ic.on{background:rgba(57,171,226,.22);color:#fff}
.rail .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.main{flex:1;min-width:0}
.top{height:62px;display:flex;align-items:center;gap:18px;padding:0 26px;background:var(--w);border-bottom:1px solid var(--bd);
  position:sticky;top:0;z-index:40}
.crumb{font-size:13px;color:var(--ink3);display:flex;align-items:center;gap:7px}
.crumb b{color:var(--ink);font-weight:600}
.crumb .lnk{color:var(--ink2);cursor:pointer}
.crumb .lnk:hover{color:var(--cyan)}
.search{flex:1;max-width:330px;position:relative}
.search input{width:100%;height:36px;border:1px solid var(--bd);border-radius:11px;background:var(--bg);
  padding:0 34px 0 12px;font:inherit;font-size:13px;color:var(--ink);outline:none}
.search input::placeholder{color:var(--ink3)}
.search input:focus{border-color:var(--cyan);background:#fff}
.search svg{position:absolute;right:11px;top:9px;width:16px;height:16px;stroke:var(--ink3);fill:none;stroke-width:1.8}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink2)}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;
  font-size:11px;font-weight:600}
.wrap{padding:22px 26px 60px;max-width:1560px;margin:0 auto}

/* ===== GENERIC ===== */
.card{background:var(--w);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.h h2{font-size:15px;font-weight:600}
.h .sub{font-size:12px;color:var(--ink3);font-weight:400}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:8px;font-size:11.5px;
  font-weight:500;background:var(--bg);color:var(--ink2);border:1px solid var(--bd)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.pill{display:inline-flex;align-items:center;height:23px;padding:0 9px;border-radius:7px;font-size:11px;font-weight:600}
.pill.money{background:#E6F4FC;color:#1e7fb4}
.pill.moneyp{background:#EFEAFD;color:#5C41C4}
.pill.meet{background:#E5F5EE;color:#0f7350}
.pill.arch{background:#EEF2F7;color:#8AA0B4}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:10px;font-size:12.5px;
  font-weight:500;border:1px solid var(--bd2);background:#fff;color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.pri{background:var(--cyan);border-color:var(--cyan);color:#fff}
.btn.pri:hover{background:#2b96c9;border-color:#2b96c9;color:#fff}
.btn.nav{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.nav:hover{background:#0a3455;color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:11.5px;border-radius:8px}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ===== HERO ===== */
.hero{background:linear-gradient(105deg,#0C4068 0%,#164F7D 52%,#1d5f93 100%);border-radius:var(--r);
  padding:20px 26px;color:#fff;box-shadow:0 10px 26px rgba(12,64,104,.22);display:flex;align-items:stretch;gap:0;margin-bottom:16px}
.hero .seg{padding:0 28px;border-left:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;justify-content:center}
.hero .seg:first-child{padding-right:0}
.hero .seg:last-child{border-left:none;padding-left:0;flex:1}
.hero .lbl{font-size:11.5px;color:#9fc6e0;margin-bottom:5px;font-weight:400}
.hero .big{font-size:31px;font-weight:600;letter-spacing:-.5px;line-height:1.1}
.hero .big small{font-size:15px;font-weight:400;opacity:.75;margin-inline-start:4px}
.hero .fine{font-size:11.5px;color:#8fbcd8;margin-top:5px}
.hero h1{font-size:16px;font-weight:600;margin-bottom:3px}
.mixbar{height:8px;border-radius:5px;overflow:hidden;display:flex;margin:9px 0 9px;width:300px}
.mixleg{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:#cfe4f2}
.mixleg span{display:inline-flex;align-items:center;gap:5px}
.mixleg b{color:#fff;font-weight:600}
.threat{display:flex;flex-direction:column;gap:6px}
.threat .tr{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#dceaf5;cursor:pointer;padding:2px 0}
.threat .tr:hover{color:#fff}
.threat .tr b{font-weight:600;color:#fff;min-width:14px;text-align:center}
.threat .tr .arw{opacity:0;transition:.15s;font-size:11px}
.threat .tr:hover .arw{opacity:.8}

/* ===== ATTENTION STRIP ===== */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.att{background:var(--w);border:1px solid var(--bd);border-radius:var(--r2);box-shadow:var(--sh);padding:13px 15px;
  border-right:3px solid var(--c);position:relative;transition:.15s}
.att:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.att .t{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.att .t h3{font-size:13px;font-weight:600}
.att .t .n{margin-inline-start:auto;font-size:20px;font-weight:600;color:var(--c);line-height:1}
.att .rows{display:flex;flex-direction:column;gap:4px}
.att .rw{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);
  background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px 8px;cursor:pointer;transition:.12s}
.att .rw:hover{background:#fff;border-color:var(--c);color:var(--ink)}
.att .rw .nm{font-weight:500;color:var(--ink)}
.att .rw .dt{margin-inline-start:auto;font-size:10.5px;color:var(--ink3)}
.att .rw.done{opacity:.42;text-decoration:line-through}
.att .ok{position:absolute;left:11px;bottom:11px;font-size:10.5px;color:var(--green);font-weight:500;display:none}

/* ===== TABLE ===== */
.tbar{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.tbar h2{font-size:15px;font-weight:600}
.tbar .hint{font-size:11.5px;color:var(--ink3)}
.fchips{display:flex;gap:6px;margin-inline-start:auto}
.fc{height:29px;padding:0 12px;border-radius:9px;border:1px solid var(--bd);background:#fff;font-size:12px;
  color:var(--ink2);display:inline-flex;align-items:center;gap:6px;transition:.13s}
.fc:hover{border-color:var(--cyan);color:var(--cyan)}
.fc.on{background:var(--navy);border-color:var(--navy);color:#fff}
.fc .c{font-size:10.5px;opacity:.7}
.dd{position:relative}
.dd .ddb{height:29px;padding:0 11px;border-radius:9px;border:1px solid var(--bd);background:#fff;font-size:12px;
  color:var(--ink2);display:inline-flex;align-items:center;gap:7px}
.dd .ddm{position:absolute;top:34px;right:0;background:#fff;border:1px solid var(--bd);border-radius:11px;
  box-shadow:var(--sh2);padding:5px;min-width:170px;z-index:30;display:none}
.dd.open .ddm{display:block}
.dd .ddm button{display:block;width:100%;text-align:right;padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--ink2)}
.dd .ddm button:hover{background:var(--bg);color:var(--ink)}
.dd .ddm button.on{color:var(--cyan);font-weight:500}

.tbl{background:var(--w);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.thead{display:grid;grid-template-columns:var(--g);align-items:center;padding:11px 0;border-bottom:1px solid var(--bd);
  font-size:11.5px;color:var(--ink3);font-weight:500;background:#FBFDFF}
.trow{display:grid;grid-template-columns:var(--g);align-items:center;border-bottom:1px solid #F0F4F9;position:relative;
  transition:.13s;cursor:pointer}
.trow:last-child{border-bottom:none}
.trow:hover{background:#FAFCFE}
.trow::before{content:'';position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--rk,transparent)}
.trow.done{opacity:.5}
.tc{padding:13px 12px;min-width:0}
.tc.co{padding-right:20px}
.co .nm{font-size:13.5px;font-weight:600;line-height:1.3}
.co .hp{font-size:11px;color:var(--ink3);margin-top:1px}
.bal{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.bal small{font-size:11px;font-weight:400;color:var(--ink3);margin-inline-start:3px}
.wt{display:flex;align-items:center;gap:8px}
.wt .tr8{flex:1;height:6px;background:#EEF3F8;border-radius:4px;overflow:hidden;max-width:100px}
.wt .tr8 i{display:block;height:100%;background:linear-gradient(90deg,#7ec8ec,#39ABE2);border-radius:4px}
.wt .pc{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:38px}
.trend{font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.trend.up{color:var(--green)} .trend.dn{color:var(--red)} .trend.na{color:var(--ink3);font-weight:400}
.st{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);text-align:right;line-height:1.35}
.st:hover .stx{color:var(--cyan);text-decoration:underline;text-underline-offset:3px}
.stx{transition:.12s}
.mat{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.mat .warn{display:block;font-size:11px;color:var(--orange);margin-top:2px;font-weight:500}
.mat .none{color:var(--ink3)}
.acts{display:flex;align-items:center;gap:4px;justify-content:flex-start;padding-left:14px}
.iact{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink3);
  border:1px solid transparent;transition:.13s;opacity:0}
.trow:hover .iact{opacity:1}
.iact:hover{background:var(--bg);border-color:var(--bd);color:var(--cyan)}
.iact.ok:hover{color:var(--green);border-color:#bfe3d3;background:#F0F9F5}
.iact svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chev{color:var(--ink3);opacity:.6}
.tfoot{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#FBFDFF;border-top:1px solid var(--bd);
  font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
.tfoot .lg{display:inline-flex;align-items:center;gap:5px}
.tfoot b{color:var(--ink);font-weight:600}
.quiet{margin-top:12px;text-align:center;font-size:12px;color:var(--ink3)}

/* ===== CARD (screen B) ===== */
.ctxbar{background:linear-gradient(90deg,#0C4068,#1a5party);}
.ctxbar{display:flex;align-items:center;gap:12px;background:#0C4068;color:#fff;border-radius:var(--r2);
  padding:11px 16px;margin-bottom:14px;box-shadow:var(--sh)}
.ctxbar .lb{font-size:11.5px;color:#9fc6e0}
.ctxbar b{font-weight:600;font-size:13px}
.ctxbar .sp{flex:1}
.ctxbar .btn{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.24);color:#fff}
.ctxbar .btn:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.4);color:#fff}
.ctxbar .btn.go{background:#39ABE2;border-color:#39ABE2}
.ctxbar .btn.go:hover{background:#2b96c9;border-color:#2b96c9}

.chead{padding:16px 22px;display:flex;align-items:center;gap:16px;margin-bottom:12px}
.chead .av{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#0C4068,#1d5f93);color:#fff;
  display:grid;place-items:center;font-size:16px;font-weight:600;flex-shrink:0}
.chead h1{font-size:21px;font-weight:600;display:flex;align-items:center;gap:10px}
.chead .meta{font-size:12px;color:var(--ink2);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chead .meta b{color:var(--ink);font-weight:500}
.chead .meta .sep{color:var(--bd2)}
.chead .cta{margin-inline-start:auto;display:flex;gap:8px;flex-shrink:0}

.alert{display:flex;align-items:center;gap:13px;background:#FDF1F0;border:1px solid #F6CFCC;border-right:3px solid var(--coral);
  border-radius:var(--r2);padding:12px 16px;margin-bottom:14px}
.alert .ib{width:26px;height:26px;border-radius:8px;background:var(--coral);color:#fff;display:grid;place-items:center;
  font-size:14px;font-weight:700;flex-shrink:0}
.alert .tx b{color:#c0392e;font-size:13.5px;font-weight:600}
.alert .tx div{font-size:11.5px;color:#98544d;margin-top:2px}
.alert .btns{margin-inline-start:auto;display:flex;gap:7px}

.kpis{display:grid;grid-template-columns:repeat(7,1fr);background:var(--w);border:1px solid var(--bd);
  border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.kpi{padding:14px 16px;border-left:1px solid var(--bd)}
.kpi:last-child{border-left:none}
.kpi .k{font-size:11px;color:var(--ink3);margin-bottom:6px;line-height:1.3;min-height:29px}
.kpi .v{font-size:20px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .v small{font-size:12px;font-weight:400;color:var(--ink3);margin-inline-start:3px}
.kpi .m{height:4px;background:#EEF3F8;border-radius:3px;margin-top:8px;overflow:hidden}
.kpi .m i{display:block;height:100%;border-radius:3px}
.kpi .n{font-size:10.5px;margin-top:5px}

.anav{display:flex;gap:2px;background:var(--w);border:1px solid var(--bd);border-radius:12px;padding:4px;
  margin-bottom:16px;box-shadow:var(--sh);position:sticky;top:62px;z-index:35}
.anav button{padding:7px 13px;border-radius:9px;font-size:12.5px;color:var(--ink2);transition:.13s}
.anav button:hover{background:var(--bg);color:var(--ink)}
.anav button.on{background:var(--navy);color:#fff}
.anav .sp{flex:1}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.blk{padding:17px 20px}
.blk+.blk{margin-top:16px}
.ring{animation:ring 1.6s ease-out 1;box-shadow:0 0 0 3px rgba(57,171,226,.45),var(--sh)}
@keyframes ring{0%,40%{box-shadow:0 0 0 4px rgba(57,171,226,.5),var(--sh)}100%{box-shadow:0 0 0 3px rgba(57,171,226,.35),var(--sh)}}

/* chart */
.chart{margin-top:14px}
.plot{position:relative;height:174px;display:flex;align-items:flex-end;gap:14px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart .bx{width:100%;max-width:58px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#5cbde9,#39ABE2)}
.chart .col.last .bx{background:linear-gradient(180deg,#164F7D,#0C4068)}
.chart .vl{font-size:12.5px;font-weight:600;margin-bottom:7px;font-variant-numeric:tabular-nums}
.xax{display:flex;gap:14px;margin-top:9px}
.xax span{flex:1;text-align:center;font-size:11px;color:var(--ink3)}
.avgline{position:absolute;right:0;left:0;border-top:1px dashed #9fc0d6;z-index:2}
.avgline span{position:absolute;left:0;top:-17px;font-size:10.5px;color:var(--ink3);background:#fff;padding:0 6px;border-radius:5px}

.catrow{display:grid;grid-template-columns:105px 1fr 92px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #F3F7FB}
.catrow:last-of-type{border-bottom:none}
.catrow .cn{font-size:12.5px;color:var(--ink2)}
.catrow .cb{height:8px;background:#EEF3F8;border-radius:5px;overflow:hidden;position:relative}
.catrow .cb i{position:absolute;top:0;bottom:0;border-radius:5px}
.catrow .cv{font-size:13px;font-weight:600;text-align:left;font-variant-numeric:tabular-nums}
.net{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)}
.net .l{font-size:12px;color:var(--ink3)}
.net .v{font-size:16px;font-weight:600;color:var(--green);font-variant-numeric:tabular-nums}

.supbar{height:12px;border-radius:7px;overflow:hidden;display:flex;margin:12px 0 13px}
.supleg{display:flex;flex-direction:column;gap:8px}
.supleg .s{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink2)}
.supleg .s b{margin-inline-start:auto;color:var(--ink);font-weight:600}
.supnote{margin-top:12px;padding:9px 12px;background:#FFF8EC;border:1px solid #F5E3C4;border-radius:10px;
  font-size:11.5px;color:#8a6410}

/* meeting block */
.mtg{display:flex;align-items:center;gap:14px;padding:14px 18px}
.mtg .ic{width:38px;height:38px;border-radius:11px;background:#E6F4FC;color:#1e7fb4;display:grid;place-items:center;flex-shrink:0}
.mtg .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mtg h3{font-size:13.5px;font-weight:600}
.mtg .s{font-size:11.5px;color:var(--ink3);margin-top:2px}
.mtg .lnks{margin-inline-start:auto;display:flex;gap:7px}

/* ===== MEMORY ===== */
.memhd{display:flex;align-items:center;gap:12px;padding:16px 20px 0;flex-wrap:wrap}
.memhd h2{font-size:16px;font-weight:600}
.memhd .cnt{font-size:11.5px;color:var(--ink3);display:flex;gap:10px;align-items:center}
.memhd .cnt span{display:inline-flex;align-items:center;gap:5px}
.utabs{display:flex;gap:6px;margin-inline-start:auto}
.ut{display:flex;align-items:center;gap:8px;padding:6px 11px 6px 8px;border-radius:11px;border:1px solid var(--bd);
  background:#fff;transition:.13s}
.ut:hover{border-color:var(--cyan)}
.ut.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ut .av{width:24px;height:24px;border-radius:50%;background:var(--bg);color:var(--ink2);display:grid;place-items:center;
  font-size:10px;font-weight:600}
.ut.on .av{background:rgba(255,255,255,.2);color:#fff}
.ut .nm{font-size:12.5px;font-weight:500;line-height:1.2}
.ut .rl{font-size:10px;opacity:.7;line-height:1.2}
.ut .n{font-size:10.5px;background:var(--bg);border-radius:6px;padding:1px 6px;color:var(--ink2)}
.ut.on .n{background:rgba(255,255,255,.18);color:#fff}

.rule{display:flex;align-items:flex-start;gap:11px;margin:14px 20px 0;padding:11px 14px;background:#FDF1F0;
  border:1px solid #F6CFCC;border-radius:12px}
.rule .fl{width:20px;height:20px;border-radius:6px;background:var(--coral);color:#fff;display:grid;place-items:center;
  font-size:11px;flex-shrink:0;margin-top:1px}
.rule p{font-size:12px;color:#8f544e;line-height:1.55}
.rule p b{color:#b8382c;font-weight:600}

.mfilt{display:flex;gap:6px;padding:14px 20px 0;flex-wrap:wrap}

/* =========================================================

const NUM = n => n.toLocaleString('en-US');
const TOTAL = 2505858;

let CO = [

  bal:568900, trend:'dn', st:'חריגת תקציב — 114% מהיעד', risk:'red', grp:'live', mat:'30.06', warn:null,
  focus:'budget'},
 {id:'rimon', nm:'רימון יצחק', hp:'025664109', mgr:'שמרית טובול', prod:'Money+', pc:'moneyp',

 {id:'shahar', nm:'שחר לוגיסטיקה', hp:null, mgr:null, prod:null, bal:null, trend:'na',

/* ===== התיק המלא — 80 חברות =====
   שמונה החברות למעלה נושאות את התוכן; השאר נוצרות דטרמיניסטית (LCG, בלי Math.random)
   באותו אלגוריתם ובאותו זרע כמו js/data.js, כדי ששני המסכים יציגו את אותו תיק. */
(function seedPortfolio(){
  const A=['אלפא','ברק','גל','דלתא','הדר','ורד','זוהר','חורש','טל','יובל','כרמל','לביא','מגן','נוף','סהר','עומר','פלג','צור','קדם','רימון','שחף','תמר','אביב','בזלת','גפן','דקל','הראל','ורדית','זית','חמדה'];
  const B=['תעשיות','שיווק','הנדסה','לוגיסטיקה','בנייה','אחזקות','מערכות','ייבוא','מזון','טכנולוגיות','אנרגיה','רהיטים','טקסטיל','דפוס','חשמל','פלסטיק','תקשורת','רכב','נדל״ן','מתכת','אריזות','כימיקלים','ספנות','תעופה','ביטחון'];
  const MGRS=['טל מלקר','שמרית טובול','נועה ברששת','אבי מזרחי','דנה שקד','יוסי אלימלך'];
  const PRODS=[['Money','money'],['Money+','moneyp'],['Meeting','meet']];
  let s=97;
  const rnd=()=>((s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff);
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const used=new Set(CO.map(c=>c.nm));
  let n=0;
  while(CO.length<80){
    let nm; let guard=0;
    do{ nm=pick(A)+' '+pick(B); guard++; }while(used.has(nm)&&guard<400);
    used.add(nm); n++;
    const r=rnd();
    const grp = r<0.10?'arch' : r<0.17?'setup' : 'live';
    const bal = grp==='live' ? 40000+Math.floor(rnd()*760)*1000 : null;
    const coop = grp==='live' ? Math.floor(rnd()*26) : null;
    const alert = grp==='live' && rnd()<0.20;
    const high = alert && rnd()<0.45;
    const [pl,pc] = grp==='arch' ? [null,null] : PRODS[Math.floor(rnd()*3)];
    const late = grp==='live' && coop>14;
    CO.push({
      id:'g'+n, nm, hp:String(510000000+Math.floor(rnd()*4999999)),
      mgr: grp==='arch'?null:MGRS[Math.floor(rnd()*MGRS.length)],
      prod:pl, pc:pc, bal,
      trend: grp!=='live' ? 'na' : (rnd()<0.55?'up':'dn'),
      st: grp==='arch' ? 'ארכיון'

      grp,
      mat: grp==='live' ? (late?'12.06':'01.07') : null,
      warn: grp==='setup' ? 'טרם התקבל חומר' : (late? coop+' יום' : null),
      focus: high?'cash' : alert?'budget' : late?'material' : grp==='setup'?'setup' : null,
      gen:true
    });
  }
})();

 {id:'a2', t:'לא הביאו חומר', c:'#c98404', items:[

CO.filter(c=>c.gen).forEach(c=>{

/* רשימת המשתמשים היא נתון של החברה. לחברה שאין לה עדיין משתמשים

const MEM = {

function row(c){
  const w = c.bal? (c.bal/TOTAL_ALL*100) : 0;
  const trend = c.trend==='up'?'<span class="trend up">↑ עולה</span>'
    : c.trend==='dn'?'<span class="trend dn">↓ יורדת</span>':'<span class="trend na">— אין נתון</span>';
  const attFor = ATT.find(a=>a.items.some(i=>i.co===c.id && !HANDLED[a.id+i.co]));
  const isDone = c.grp==='live' && !attFor && ATT.some(a=>a.items.some(i=>i.co===c.id));
  return `<div class="trow ${isDone?'done':''}" data-id="${c.id}" style="--rk:${RK[c.risk]}">
    <div class="tc co"><div class="nm">${c.nm}</div><div class="hp">${c.hp?'ח.פ. '+c.hp:'ח.פ. לא הוזן'}</div></div>
    <div class="tc">${c.prod?`<span class="pill ${c.pc}">${c.prod}</span>`:'<span class="pill arch">—</span>'}</div>
    <div class="tc" style="font-size:12.5px;color:${c.mgr?'var(--ink2)':'var(--ink3)'}">${c.mgr||'לא שויך'}</div>
    <div class="tc">${c.bal?`<span class="bal">${NUM(c.bal)}<small>₪</small></span>`:'<span style="color:var(--ink3)">—</span>'}</div>
    <div class="tc"><div class="wt">${c.bal?`<span class="tr8"><i style="width:${w}%"></i></span><span class="pc">${w.toFixed(1)}%</span>`:'<span class="pc" style="color:var(--ink3)">—</span>'}</div></div>
    <div class="tc">${trend}</div>
    <div class="tc"><div class="st" ${c.focus?`data-focus="${c.focus}" data-stop="1"`:''} style="${c.focus?'cursor:pointer':''}">
      <i class="dot" style="background:${RK[c.risk]}"></i><span class="stx">${isDone?'טופל היום':c.st}</span></div></div>
    <div class="tc"><div class="mat">${c.mat||'<span class="none">—</span>'}${c.warn?`<span class="warn">${c.warn}</span>`:''}</div></div>
    <div class="tc acts">
      ${attFor?`<button class="iact ok done-b" data-stop="1" data-att="${attFor.id}" data-co="${c.id}" title="סמן כטופל">${IC.chk}</button>`:''}
      <span class="iact chev" style="opacity:.55">${IC.chev}</span>
    </div>
  </div>`;
}

function markHandled(att,coid){
  ATT.find(a=>a.id===att).items.filter(i=>i.co===coid).forEach(i=>HANDLED[att+i.co]=1);
  const cname = co(coid).nm;
  screenA();
  toast(`<span class="ck">✓</span> <b>${cname}</b> — סומן כטופל וירד מהתור`, ()=>{
    ATT.find(a=>a.id===att).items.filter(i=>i.co===coid).forEach(i=>delete HANDLED[att+i.co]);
    screenA();
  });
}

    <div class="v">${val}${unit?`<small>${unit}</small>`:''}</div>
    ${pct!=null?`<div class="m"><i style="width:${Math.min(pct,100)}%;background:${col}"></i></div>`:''}
    ${note?`<div class="n" style="color:${col||'var(--ink3)'}">${note}</div>`:''}</div>`;
  return `<div class="kpis">
    ${k('יתרה כוללת', NUM(FIN.bal),'₪','נכון ל־02.07')}
    ${k('מסגרת אשראי', NUM(FIN.credit),'₪','')}
    ${k('ניצול מסגרת','<span style="color:var(--red)">107</span>','%','מעל המסגרת',100,'#dc4436')}
    ${k('יתרה צפויה סוף החודש','<span style="color:var(--red)">-495,490</span>','₪','אם לא ישתנה דבר')}
    ${k('חריגה צפויה בעוד','<span style="color:var(--red)">9</span>','ימים','')}
    ${k('עמידה בתקציב הוצאות','82','%','מהתקציב שנקבע',82,'#c98404')}
    ${k('עמידה ביעד הכנסות','95','%','מהיעד החודשי',95,'#13895b')}
  </div>`;
}

      <div class="avgline" style="bottom:${(avg/mx)*H}px"></div>

        <div class="vl">${m.v}</div><div class="bx" style="height:${(m.v/mx)*H}px"></div></div>`).join('')}
    </div>

}
function cats(){

    <span class="cb"><i style="right:0;width:${Math.abs(c.v)/mx*100}%;background:${c.pos?'#13895b':'#E8635A'}"></i></span>

function sups(){

function voiceStats(id){
  const d = MEM[id]&&MEM[id].co;
  if(!Array.isArray(d)) return `<p style="font-size:12.5px;color:var(--ink2);line-height:1.65">
    עוד לא כתבת כאן כלום — ואף אחד אחר לא. הזיכרון של החברה הזו ריק לגמרי.</p>
    <button class="btn sm pri" style="margin-top:11px">כתוב את הרשומה הראשונה</button>`;
  const t = tally(d);
  const line=(c,l,n,s)=>`<div style="display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink2)">
    <i class="dot" style="background:${c}"></i><span>${l}</span>
    <b style="margin-inline-start:auto;color:var(--ink);font-weight:600">${n}</b></div>
    ${s?`<div style="font-size:11px;color:var(--ink3);margin:-4px 0 2px 0;padding-inline-start:16px">${s}</div>`:''}`;
  return line('#39ABE2','רשומות שהמערכת כתבה',t.sys,'מתוך הפגישה החודשית של 02.07')
    + line('#7557E3','רשומות שאתה כתבת',t.adv,'לא נשלחות ללקוח')
    + line('#E8635A','במחלוקת — הגרסה שלך קובעת',t.dis,'')
    + line('#8AA0B4','נתוני מערכת קשיחים',t.fact,'לא ניתנים לערעור')
    + `<div style="margin-top:6px;padding-top:11px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--ink3);line-height:1.65">
       העוזר AI וסיכומי הפגישות של החברה הזו קוראים את שתי השכבות — ומעדיפים את שלך.</div>`;
}
function memCount(id,u){
  const d=MEM[id]&&MEM[id][u];
  if(!Array.isArray(d)) return '0';
  const t=tally(d); return t.sys+t.adv+t.fact;
}
function tally(topics){
  let sys=0,adv=0,dis=0,fact=0;
  topics.forEach(t=>t.units.forEach(u=>{
    if(u.k==='sys') sys++;
    if(u.k==='fact') fact++;
    if(u.k==='fixed'){adv++; sys++;}
    if(u.k==='dis'){sys++;adv++;dis++;}
    if(u.k==='adv') adv++;
    if(u.replies) adv+=u.replies.length;
  }));
  return {sys,adv,dis,fact};
}

/* ---------- MEMORY RENDER ---------- */
function memory(id){
  const data = MEM[id] ? MEM[id][MEMTAB] : 'never';
  const UL = usersFor(id);
  if(!UL.some(x=>x.id===MEMTAB)) MEMTAB='co';
  const u = UL.find(x=>x.id===MEMTAB);
  const head = `
  <div class="memhd">
    <h2>הזיכרון${MEMTAB!=='co'?' · '+u.nm:''}</h2>
    ${Array.isArray(data)?(()=>{const t=tally(data);return `<div class="cnt">
      <span><i class="dot" style="background:#39ABE2"></i>${t.sys} מהמערכת</span>
      <span><i class="dot" style="background:#7557E3"></i>${t.adv} ממני</span>
      ${t.dis?`<span><i class="dot" style="background:#E8635A"></i>${t.dis} במחלוקת</span>`:''}
    </div>`;})():''}
    <div class="utabs">
      ${UL.map(x=>`<button class="ut ${MEMTAB===x.id?'on':''}" data-t="${x.id}">
        <span class="av">${x.ini}</span>
        <span><span class="nm">${x.nm}</span><br><span class="rl">${x.rl}</span></span>
        <span class="n">${memCount(id,x.id)}</span></button>`).join('')}
    </div>
  </div>`;

  if(data==='never'||!data) return head + `<div class="empty">
    <div class="ic">${IC.pen}</div>
    <h3>אין עדיין פגישות — ולכן המערכת לא כתבה כלום</h3>
    <p>הזיכרון של החברה הזו ריק. אתה יכול להיות הכותב הראשון: מה שאתה יודע עליה ולא נאמר בשום הקלטה יישמר כאן וייכנס לעוזר ה־AI ולסיכומי הפגישות הבאות.</p>
    ${composer('first','מה אתה יודע על החברה הזו?')}</div>`;

  if(data==='empty') return head + `<div class="empty">
    <div class="ic">${IC.pen}</div>
    <h3>המערכת עוד לא כתבה על ${u.nm}</h3>
    <p>${u.nm} נכחה בפגישה החודשית ולא נרשמה לה אמירה, ולכן אין למערכת ממה לכתוב. זה בדיוק המקום שבו אתה הכותב הראשון.</p>
    ${composer('firstu','מה אתה יודע על '+u.nm+'?')}</div>`;

  const t = tally(data);
  return head + `
  <div class="rule">
    <div class="fl">⚑</div>
    <p><b>כשיש מחלוקת — הגרסה שלך קובעת.</b> המערכת שומרת את מה ששמעה למען השקיפות, אבל העוזר AI, סיכומי הפגישות והתראות התזרים משתמשים במה שכתבת. נתון מערכת קשיח (כמו פרטי משתמשים) לא ניתן לערעור — על עובדה לא מתווכחים.</p>
  </div>
  <div class="mfilt">
    ${[['all','הכל',t.sys+t.adv+t.fact],['sys','מה שהמערכת שמעה',t.sys],['adv','הקול שלי',t.adv],['dis','במחלוקת',t.dis]]
      .filter(x=>x[0]!=='dis'||t.dis)
      .map(([k,l,n])=>`<button class="mf ${MEMF===k?'on':''}" data-f="${k}">
        ${k!=='all'?`<i class="d" style="background:${k==='sys'?'#39ABE2':k==='adv'?'#7557E3':'#E8635A'}"></i>`:''}${l}<span class="n">${n}</span></button>`).join('')}
  </div>
  ${data.map(tp=>topicHTML(tp)).join('')}
  <div style="padding:6px 20px 20px">
    ${composer('voice','מה שאתה יודע ולא נאמר בהקלטה — כתוב כאן')}
  </div>`;
}

function topicHTML(tp){
  let units = tp.units;
  if(MEMF==='dis') units = units.filter(u=>u.k==='dis');
  if(MEMF==='sys') units = units.filter(u=>u.k==='sys'||u.k==='fact'||u.k==='dis'||u.k==='fixed');
  if(MEMF==='adv') units = units.filter(u=>u.k==='adv'||u.k==='dis'||u.k==='fixed'||(u.replies&&u.replies.length));
  if(!units.length) return '';
  const dis = tp.units.some(u=>u.k==='dis');
  return `<div class="topic">
    <div class="th"><h3>${tp.t}</h3><span class="u">עודכן ${tp.up}</span>
      ${dis?'<span class="badge chip" style="color:#b8382c;background:#FDF1F0;border-color:#F6CFCC">במחלוקת</span>':''}</div>
    ${units.map(u=>unitHTML(u,tp)).join('')}
    ${MEMF==='all'||MEMF==='adv'?composer('t_'+tp.id,'הוסף מה שאתה יודע על '+tp.t.replace(/^מצב /,'')):''}
  </div>`;
}

function unitHTML(u,tp){
  if(u.k==='dis'){
    if(MEMF==='sys') return entry({k:'sys',tx:u.sys.tx,src:u.sys.src,state:'disputed'});
    if(MEMF==='adv') return `<div class="ctxline">◆ <b>הגרסה שלך</b> · חולקת על מה שהמערכת שמעה בנושא ${tp.t}</div>`
      + entry({k:'adv',tx:u.adv.tx,dt:u.adv.dt,asrc:u.adv.asrc,vis:u.adv.vis});
    return `<div class="dis">
      <div class="dh"><div class="fl">⚑</div><b>במחלוקת — טל חולק על מה שהמערכת שמעה</b><span class="dt">${u.dt}</span></div>
      ${entry({k:'sys',tx:u.sys.tx,src:u.sys.src,state:'disputed'})}
      <div class="keep"><span class="ln"></span><span>נשמר — לא בשימוש · לא נמחק, כדי שנדע מה נשמע בחדר</span><span class="ln"></span></div>
      ${entry({k:'adv',tx:u.adv.tx,dt:u.adv.dt,asrc:u.adv.asrc,vis:u.adv.vis})}
      <div class="ruling"><span class="cr">קובע בתיק</span><p>${u.rul}</p></div>
    </div>`;
  }
  if(u.k==='fixed'){
    if(MEMF==='sys') return entry({k:'sys',tx:u.was.tx,src:u.was.src,state:'replaced'});
    return entry({k:'adv',tx:u.tx,dt:u.dt,asrc:u.asrc,vis:u.vis,fixed:1,was:u.was});
  }
  if(MEMF==='adv' && u.k==='sys'){
    return (u.replies||[]).map(r=>
      `<div class="ctxline">◆ <b>תוספת שלך</b> · נכתבה מתחת לרשומה של המערכת בנושא ${tp.t}</div>`
      + entry({k:'adv',tx:r.tx,dt:r.dt,asrc:r.asrc,vis:r.vis})).join('');
  }
  let h = entry(u);
  if(u.replies && u.replies.length && MEMF!=='sys'){
    h += `<div class="thread">` + u.replies.map(r=>
      entry({k:'adv',tx:r.tx,dt:r.dt,asrc:r.asrc,vis:r.vis})).join('') + `</div>`;
  }
  return h;
}

function entry(u){
  if(u.k==='fact') return `<div class="ent fact">
    <div class="sig"><span class="who">◈ נתון מערכת</span><span class="src">${u.src}</span>
      <span class="stamp lock">🔒 לא ניתן לערער</span></div>
    <p>${u.tx}</p></div>`;

  if(u.k==='sys'){
    const dis = u.state==='disputed', rep = u.state==='replaced';
    return `<div class="ent sys">
      <div class="sig"><span class="who">✧ HK AI · המערכת שמעה</span>
        <span class="src">מתוך <u>${u.src}</u></span>
        ${u.state==='ok'?`<span class="stamp ok">✓ ${u.stamp}</span>`:''}
        ${u.state==='pending'?`<span class="stamp prv">ממתין לסקירה שלך</span>`:''}
        ${dis?`<span class="stamp" style="background:#FDF1F0;color:#b8382c">⚑ סומן כלא מדויק · לא בשימוש</span>`:''}
        ${rep?`<span class="stamp prv">הוחלף בגרסה שלך</span>`:''}
      </div>
      <p style="${dis||rep?'color:var(--ink3)':''}">${u.tx}</p>
      ${(dis||rep)?'':`<div class="row2">
        <button class="ea">${IC.eye} מאיפה זה?</button>
        <button class="ea ok">${IC.chk} מדויק</button>
        <button class="ea mine">${IC.pen} תקן</button>
        <button class="ea bad">${IC.x} לא מדויק</button>
        <button class="ea mine k">${IC.plus} הוסף מהידע שלי</button>
      </div>`}
    </div>`;
  }
  /* advisor */
  const visT = u.vis==='me'?['🔒 רק אני רואה','lock']:['לא נשלח ללקוח · משותף לצוות','prv'];
  return `<div class="ent adv">
    <div class="sig"><span class="who">◆ טל מלקר · יועץ</span><span class="src">${u.dt}</span>
      ${u.fixed?`<span class="stamp" style="background:#EAE2FB;color:#5C41C4">תיקון לרשומת המערכת</span>`:''}
      ${u.pin?`<span class="stamp pin">📌 מוצמד</span>`:''}
      <span class="stamp ${visT[1]}" style="margin-inline-start:${u.pin?'0':'auto'}">${visT[0]}</span></div>
    <p>${u.tx}</p>
    <div class="advsrc">מקור: <b>${u.asrc}</b></div>
    ${u.was?`<div class="was"><div class="l">✧ מה שהמערכת כתבה במקור · ${u.was.src}</div><p>${u.was.tx}</p></div>`:''}
    <div class="row2">
      <button class="ea mine">${IC.pen} עריכה</button>
      <button class="ea">📌 ${u.pin?'בטל הצמדה':'הצמד לראש'}</button>
      <button class="ea">${u.vis==='me'?'שתף עם הצוות':'🔒 הפוך לפרטי'}</button>
    </div>
  </div>`;
}

function composer(key,ph){
  const open = COMPOSER===key;
  return `<div class="comp ${open?'open':''}" data-c="${key}">
    ${open?`<textarea placeholder="${ph}" autofocus></textarea>
      <div class="cf">
        <span style="font-size:11px;color:var(--ink3)">מקור:</span>
        <div class="seg2"><button class="on">מהיכרות אישית</button><button>שיחה מחוץ לפגישה</button><button>מהשטח</button></div>
        <span style="font-size:11px;color:var(--ink3);margin-inline-start:8px">נראות:</span>
        <div class="seg2"><button class="on">הצוות</button><button>רק אני</button></div>
        <span class="sp"></span>
        <button class="btn sm" data-x="1">ביטול</button>
        <button class="btn sm pri">שמור בזיכרון</button>
      </div>`
    :`<div class="ph"><span class="pl">+</span><span>${ph}</span>
       <span style="margin-inline-start:auto;font-size:11px;color:var(--ink3)">נכתב בשמך · לא נשלח ללקוח</span></div>`}
  </div>`;
}

function bindMem(){
  const root = $('#b-mem'); if(!root) return;
  root.querySelectorAll('.ut').forEach(b=>b.onclick=()=>{MEMTAB=b.dataset.t;MEMF='all';COMPOSER=null;
    root.innerHTML=memory(OPEN.id);bindMem();});
  root.querySelectorAll('.mf').forEach(b=>b.onclick=()=>{MEMF=b.dataset.f;COMPOSER=null;
    root.innerHTML=memory(OPEN.id);bindMem();});
  root.querySelectorAll('.comp').forEach(c=>{
    c.onclick=e=>{ if(e.target.closest('[data-x]')){COMPOSER=null;root.innerHTML=memory(OPEN.id);bindMem();return;}
      if(c.classList.contains('open'))return;
      COMPOSER=c.dataset.c; root.innerHTML=memory(OPEN.id); bindMem();
      const ta=root.querySelector('.comp.open textarea'); if(ta) ta.focus(); };
  });
  root.querySelectorAll('.seg2 button').forEach(b=>b.onclick=e=>{e.stopPropagation();
    b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
  root.querySelectorAll('.ea').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const t=b.textContent.trim();
    if(t.includes('מאיפה')) toast('מקור: <b>פגישה חודשית · 02.07</b> — נפתח בתמלול בנקודת האמירה');
    else if(t.includes('מדויק')&&!t.includes('לא')) toast('<span class="ck">✓</span> סומן כמדויק · יתווסף חותם "אושר ע״י טל"');
    else if(t.includes('לא מדויק')) toast('<span class="ck">⚑</span> נפתחה מחלוקת · כתוב את הגרסה שלך — היא זו שתקבע בתיק');
    else if(t.includes('תקן')||t.includes('עריכה')) toast('העורך נפתח עם הטקסט המקורי · בשמירה הרשומה עוברת לבעלותך');
    else if(t.includes('הוסף')) toast('נפתח פתיל תחת הרשומה של המערכת');
    else toast('עודכן');
  });
}

/* boot */
/* ===== הטמעה: מסתירים את המעטפת ומדווחים גובה לאפליקציה ===== */
/* התיק שנוצר כאן דטרמיניסטית מקבל את השמות האמיתיים מהאפליקציה,
   כדי ש"פתיחת החברה" תמיד תמצא את מי שלחצו עליו. */
window.addEventListener('message',function(e){
  const d=e.data||{};
  if(d.hkClCard){ const c=CO.find(x=>x.nm===d.hkClCard); if(c){ openCard(c.id,null,null); } return; }
  if(!Array.isArray(d.hkClNames)) return;
  const named=new Set(CO.filter(c=>!c.gen).map(c=>c.nm));
  const pool=d.hkClNames.filter(r=>r&&r.nm&&!named.has(r.nm));
  /* מוחקים את מה שנוצר מקומית ומרכיבים מחדש מהתיק האמיתי של האפליקציה */
  CO=CO.filter(c=>!c.gen);
  ATT.forEach(a=>{ a.items=a.items.filter(i=>!/^g\d+$/.test(i.co)); });
  const PRODS={money:['Money','money'],'money+':['Money+','moneyp'],meeting:['Meeting','meet']};
  pool.forEach((r,n)=>{
    const grp = r.adv==='ארכיון'?'arch' : r.adv==='בהקמה'?'setup' : 'live';
    const high = grp==='live' && r.hl==='high';
    const mid  = grp==='live' && r.hl==='mid';
    const late = grp==='live' && r.coop>14;
    const [pl,pc] = (grp!=='arch' && PRODS[r.prod]) || [null,null];
    const c={ id:'g'+(n+1), nm:r.nm, hp:r.hp||null, mgr: grp==='arch'?null:(r.mgr||null),
      prod:pl, pc:pc, bal: grp==='live'?r.bal:null,
      trend: grp!=='live'?'na':(high||mid?'dn':'up'),
      st: grp==='arch'?'ארכיון' : grp==='setup'?'בהקמה — ממתין להרשאות בנק'
        : high?'חריגה צפויה בעו״ש' : mid?'קרוב לתקרת התקציב'
        : late?'תקין — חומר חסר' : 'תקין — עומד ביעדים',
      risk: grp==='arch'?'grey' : grp==='setup'?'cyan' : high?'red' : mid?'orange' : 'green',
      grp, mat: grp==='live'?(late?'12.06':'01.07'):null,
      warn: grp==='setup'?'טרם התקבל חומר':(late?r.coop+' יום':null),
      focus: high?'cash' : mid?'budget' : late?'material' : grp==='setup'?'setup' : null,
      gen:true };
    CO.push(c);
    if(c.risk==='red')   ATT[0].items.push({co:c.id, tx:c.nm, dt:'בעו״ש', focus:'cash'});
    if(c.warn&&grp==='live') ATT[1].items.push({co:c.id, tx:c.nm, dt:c.warn, focus:'material'});
    if(c.risk==='orange')ATT[2].items.push({co:c.id, tx:c.nm, dt:'קרוב לתקרה', focus:'budget'});
    if(grp==='setup')    ATT[3].items.push({co:c.id, tx:c.nm, dt:'טרם התקבל חומר', focus:'setup'});
  });
  TOTAL_ALL = CO.reduce((a,c)=>a+(c.bal||0),0);
  if(!OPEN) screenA(); else openCard(OPEN.id,OPEN.focus,OPEN.att);
});
function openInApp(id,nm,tab){
  if(parent!==window){ parent.postMessage({hkClOpen:1,id:id,nm:nm,tab:tab||'dash'},'*'); }
  else toast('נפתחת סביבת העבודה של '+nm);
}
(function(){
  if(!/[?&]embed=1/.test(location.search)) return;
  document.body.classList.add('is-embedded');
  parent.postMessage({hkClReady:1},'*');
  var last=0;
  function report(){
    var h=Math.ceil(document.documentElement.scrollHeight);
    if(Math.abs(h-last)>2){ last=h; parent.postMessage({hkCl:1,h:h},'*'); }
  }
  window.addEventListener('load',report);
  setInterval(report,350);
  new MutationObserver(report).observe(document.body,{childList:true,subtree:true,attributes:true});
})();

screenA();
(function(){
  const p=new URLSearchParams(location.search);
  if(p.get('c')) openCard(p.get('c'), p.get('f')||null, p.get('att')||null);
  if(p.get('tab')){MEMTAB=p.get('tab'); const r=$('#b-mem'); if(r){r.innerHTML=memory(OPEN.id);bindMem();}}
  if(p.get('mf')){MEMF=p.get('mf'); const r=$('#b-mem'); if(r){r.innerHTML=memory(OPEN.id);bindMem();}}
  if(p.get('y')){ const go=()=>{document.documentElement.scrollTop=+p.get('y');};
    go(); setTimeout(go,250); setTimeout(go,800);}
})();
</script>
