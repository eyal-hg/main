<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>מעקב ופערים</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#F4F7FA; --surface:#fff;
  --border:#e6ecf4; --border-strong:#d3dced;
  --text:#0C4068; --muted:#64748b; --soft:#9aa7bb;
  --accent:#1B6C9C; --accent-soft:#EAF4FB;
  --act:#3B9AD2;            /* בפועל */
  --flow:#BFE2F5;           /* בתזרים — צבוע בחודש קדימה */
  --pos:#13895b; --pos-soft:#e7f7ef;
  --neg:#dc4436; --neg-soft:#fdeceb;
  --warn:#c98404;
  --shadow-sm:0 2px 8px rgba(15,35,65,.06);
  --shadow-md:0 6px 18px rgba(12,64,104,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:"Rubik",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
.app{max-width:1150px;margin:0 auto;padding:26px 22px 70px}

/* כותרת */
.page-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.brand-dot{width:44px;height:44px;border-radius:14px;background:#1B6C9C;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px}
.page-head h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.3px}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:2px}

/* שורת חודשים + מקרא */
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mbtn{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 16px;font-size:12.5px;font-weight:600;color:var(--muted);box-shadow:var(--shadow-sm)}
.mbtn.on{background:var(--text);border-color:var(--text);color:#fff}
.mbtn small{font-weight:500;opacity:.75;margin-inline-start:5px}
.topbar .sp{flex:1}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 11px}
.lg i{width:12px;height:12px;border-radius:4px}
.lg .sw-act{background:var(--act)}
.lg .sw-flow{background:repeating-linear-gradient(45deg,var(--flow),var(--flow) 3px,#D8EEF9 3px,#D8EEF9 6px)}
.lg .sw-gap{background:#E9EFF5;border:1px solid var(--border-strong)}

/* סיכום: שני כרטיסים — הכנסות והוצאות */
.sumrow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
@media(max-width:980px){.sumrow{grid-template-columns:1fr}}
/* שורת רווחיות בין קבוצות הדוח */
.pr-row{display:grid;grid-template-columns:190px 1fr 1fr;gap:20px;align-items:center;background:#EEF7FD;border:1px solid #D8EAF6;border-radius:16px;box-shadow:var(--shadow-sm);padding:15px 22px;margin:4px 0 26px}
.pr-row .pr-name{font-size:13.5px;font-weight:800}
.pr-row .pr-cell span{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
.pr-row .pr-cell b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.pr-row .pr-cell b.pos{color:var(--text)} .pr-row .pr-cell b.neg{color:var(--neg)}
.pr-row .pr-d{text-align:start;font-size:11.5px;font-weight:600;color:var(--muted)}
.pr-row .pr-d b{display:block;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.pr-row .pr-d.pos b{color:var(--text)} .pr-row .pr-d.neg b{color:var(--neg)}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-md);padding:16px 22px}
.scard .sc-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.scard .k{font-size:13px;font-weight:700}
.scard .k small{font-weight:500;color:var(--muted);margin-inline-start:6px}
.scard .g{font-size:12px;font-weight:600;color:var(--muted)}
.scard .g b{font-size:17px;font-weight:800;margin-inline-start:6px;font-variant-numeric:tabular-nums}
.scard .g.pos b{color:var(--pos)} .scard .g.neg b{color:var(--neg)} .scard .g.warn b{color:var(--warn)}
.scard .bl-bar{height:13px}

/* קבוצות ושורות */
.grp{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-md);margin-bottom:18px;overflow:hidden}
.grp-h{display:flex;align-items:center;gap:8px;padding:12px 22px;font-size:13px;font-weight:700;background:var(--accent-soft)}
.grp-h .dot{width:8px;height:8px;border-radius:50%}
.grp-h .cnt{margin-inline-start:auto;font-size:11.5px;color:var(--muted);font-weight:500}
.grp-gap{display:flex;gap:8px;align-items:center;font-size:11.5px;font-weight:600}
.grp-gap b{font-variant-numeric:tabular-nums;font-weight:800}
.gg-pos{color:#B26B12;background:#FFF3E6;border:1px solid #F3D9B4;border-radius:999px;padding:3px 11px}
.gg-neg{color:#B3372A;background:#FDECEA;border:1px solid #F5C6C0;border-radius:999px;padding:3px 11px}
.gg-ok{color:#0F6D48;background:#EDF8F1;border:1px solid #A7E0BF;border-radius:999px;padding:3px 11px}
.bl-row{display:grid;grid-template-columns:190px 120px 1fr 140px;gap:20px;align-items:center;padding:15px 22px;border-top:1px solid var(--border)}
.bl-tgt{border-radius:10px;padding:4px 10px;margin:-4px -10px}
.bl-tgt span{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
.bl-tgt b{font-size:15.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.src-tag{display:inline-block;font-size:9.5px;font-weight:700;border-radius:999px;padding:1.5px 8px;margin-top:3px;white-space:nowrap}
.src-tag.avg{background:repeating-linear-gradient(45deg,#eef2f8,#eef2f8 3px,#e0e7f1 3px,#e0e7f1 6px);color:#64748b;border:1px solid #d3dced}
.src-tag.man{background:#EAF4FB;color:#2C7FB0;border:1px solid #bcd9f6}
.src-tag.goal-inc{background:#e2f3e9;color:#13895b;border:1px solid #a7e0bf}
.src-tag.goal-exp{background:#fdf4e3;color:#c98404;border:1px solid #ecd9a8}
.bl-row:hover{background:#FAFCFE}
.bl-name{font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.bl-name .nm{display:inline-flex;align-items:center;gap:3px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;
  color:var(--text);background:none;border:0;padding:2px 7px 2px 4px;margin:-2px -7px -2px -4px;border-radius:8px;transition:.12s;text-align:start}
.bl-name .nm svg{width:13px;height:13px;color:var(--soft);flex:0 0 auto;transition:transform .12s}
.bl-name .nm:hover{background:var(--accent-soft);color:var(--accent)}
.bl-name .nm:hover svg{color:var(--accent);transform:translateX(-2px)}
.bl-name .cv{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:5px;background:var(--accent-soft);color:var(--accent);transition:transform .12s;flex:0 0 auto}
.bl-name .cv.open{transform:rotate(180deg)}
.bl-txs{grid-column:1/-1;background:#FBFDFF;border-top:1px dashed var(--border-strong);border-radius:0;margin:10px -22px -15px;padding:10px 22px 13px}
.bl-tx{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12px;color:var(--muted)}
.bl-tx+.bl-tx{border-top:1px solid #F1F6FA}
.bl-tx .d{font-variant-numeric:tabular-nums;color:var(--soft);flex:0 0 44px}
.bl-tx .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl-tx .v{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text)}
.tx-tag{flex:0 0 auto;font-size:10px;font-weight:700;border-radius:999px;padding:2px 9px;min-width:56px;text-align:center}
.tx-tag.act{background:var(--act);color:#fff}
.tx-tag.flow{background:repeating-linear-gradient(45deg,var(--flow),var(--flow) 4px,#D8EEF9 4px,#D8EEF9 8px);color:#2C7FB0}
.tx-tag.blr{background:repeating-linear-gradient(45deg,#9B85D6,#9B85D6 4px,#E4DCF6 4px,#E4DCF6 8px);color:#4A3580}
.bl-name .tiny{display:block;font-size:10.5px;color:var(--soft);font-weight:500;margin-top:1px}
.bl-mid{min-width:0}
.bl-bar{position:relative;height:11px;background:none;display:flex;align-items:center;overflow:visible}
.bl-track{position:relative;height:11px;background:#E9EFF5;border-radius:999px;overflow:hidden;display:flex;width:86%;flex:0 0 86%}
.bl-bar .seg{height:100%}
.bl-bar .seg.act{background:var(--act);border-start-start-radius:999px;border-end-start-radius:999px}
.bl-bar .seg.flow{background:repeating-linear-gradient(45deg,var(--flow),var(--flow) 4px,#D8EEF9 4px,#D8EEF9 8px)}
.bl-bar .seg.over{background:var(--neg)}
.bl-bar{overflow:visible}
.bl-bar .seg{flex-shrink:0}
.bl-bar .seg.blrow{background:repeating-linear-gradient(45deg,#9B85D6,#9B85D6 4px,#E4DCF6 4px,#E4DCF6 8px)}
.n-blrow b{color:#6B4FA0}
.n-over b{font-weight:700;color:var(--text)}
.bl-on{display:inline-block;font-size:10.5px;font-weight:700;color:#6B4FA0;background:#F6F1FB;border:1px solid #DCD0EC;border-radius:999px;padding:3px 11px;cursor:pointer;font-family:inherit}
.bl-on:hover{filter:brightness(.96)}
.bl-set{display:inline-block;font-size:10.5px;font-weight:700;color:#5B7A99;background:#fff;border:1.5px dashed #C9D6E4;border-radius:999px;padding:3px 10px;cursor:pointer;font-family:inherit}
.bl-set:hover{border-color:#39ABE2;color:#2C7FB0}
.ble-modes{display:inline-flex;background:#F1F5F9;border:1.5px solid var(--border);border-radius:10px;padding:3px;gap:2px;margin-bottom:13px}
.ble-modes button{font-family:inherit;font-size:12px;font-weight:600;color:var(--muted);background:none;border:0;border-radius:7px;padding:6px 14px;cursor:pointer;transition:.12s}
.ble-modes button.on{background:#fff;color:var(--text);font-weight:700;box-shadow:0 1px 3px rgba(12,64,104,.13)}
.ble-wt{border:1px solid var(--border);border-radius:11px;padding:11px 13px;margin-top:11px}
.ble-wt-h{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--text);margin-bottom:8px}
.ble-wsum{font-size:11px;border-radius:999px;padding:2px 10px}
.ble-wsum.ok{background:#EDF8F1;color:#0F6D48}
.ble-wsum.bad{background:#FDECEA;color:#B3372A}
.ble-wrow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;color:var(--muted)}
.ble-wd{flex:0 0 70px;font-weight:600;color:var(--text)}
.ble-wrow input{width:64px;font-family:inherit;font-size:13px;font-weight:700;color:var(--text);border:1.5px solid var(--border-strong);border-radius:8px;padding:5px 9px;outline:none;text-align:center}
.ble-wrow input:focus{border-color:var(--accent)}
.ble-wa{margin-inline-start:auto;font-variant-numeric:tabular-nums;color:var(--text)}
.ble-even{font-family:inherit;font-size:11px;font-weight:700;color:#2C7FB0;background:#EAF4FB;border:1px solid #BCD9F6;border-radius:999px;padding:4px 12px;cursor:pointer;margin-top:7px}
.ble-err{font-size:11.5px;color:#B3372A;background:#FDECEA;border:1px solid #F5C6C0;border-radius:9px;padding:7px 12px;margin-top:9px;font-weight:600}
.gt-save[disabled]{background:#CBD8E3;cursor:not-allowed}
.ble-days{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 4px}
.ble-wdays{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 11px}
.ble-fwd{font-size:11px;color:var(--soft);margin-bottom:10px}
.ble-day{width:42px;height:38px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:.12s}
.ble-day:hover{border-color:var(--accent)}
.ble-day.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ble-sum{font-size:12px;color:var(--muted);line-height:1.6;background:#F7FAFD;border:1px solid var(--border);border-radius:10px;padding:10px 13px}
.ble-sum b{color:var(--text);font-variant-numeric:tabular-nums}
.seg.spill{margin-inline-start:5px;border-radius:999px;height:11px}
.seg.spill.exp{background:repeating-linear-gradient(45deg,#E24B4A,#E24B4A 4px,#F7C1C1 4px,#F7C1C1 8px)}
.seg.spill.inc{background:repeating-linear-gradient(45deg,#4CAF7D,#4CAF7D 4px,#C6E9D6 4px,#C6E9D6 8px)}
.sw-blrow{display:inline-block;width:12px;height:12px;border-radius:4px;background:repeating-linear-gradient(45deg,#9B85D6,#9B85D6 3px,#E4DCF6 3px,#E4DCF6 6px);vertical-align:-2px}
.sw-spill{display:inline-block;width:14px;height:11px;border-radius:999px;background:repeating-linear-gradient(45deg,#E24B4A,#E24B4A 3px,#F7C1C1 3px,#F7C1C1 6px);vertical-align:-2px}
.bl-nums .n-clk{cursor:pointer;border-radius:7px;padding:1px 5px;margin:-1px -5px;transition:.12s}
.bl-nums .n-clk:hover{background:#EAF2F9;text-decoration:underline}
.bl-nums{display:flex;gap:16px;font-size:11px;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.bl-nums b{font-weight:700;color:var(--text)}
.bl-nums .n-act b{color:var(--act)}
.bl-nums .n-flow b{color:#5AA8D6}
.bl-nums .n-tgt{margin-inline-start:auto}
.bl-gap{text-align:start;font-size:12px;font-weight:600;color:var(--muted)}
.bl-gap b{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.bl-gap.pos b{color:var(--pos)}
.bl-gap.neg b{color:var(--neg)}
.bl-gap.warn b{color:var(--warn)}
.bl-gap.zero b{color:var(--soft)}

/* פופאפ פעולות הקטגוריה */
.pop-ov{position:fixed;inset:0;background:rgba(12,64,104,.34);display:none;align-items:center;justify-content:center;z-index:60}
.pop-ov.show{display:flex}
.pop{background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(12,64,104,.25);width:min(600px,94vw);max-height:84vh;display:flex;flex-direction:column;overflow:hidden}
.pop-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 22px 10px}
.pop-h b{font-size:15.5px;font-weight:800}
.pop-h .sub{font-size:12px;color:var(--muted);margin-top:2px}
.pop-x{border:0;background:none;font-size:15px;color:var(--soft);cursor:pointer;padding:4px 9px;border-radius:8px}
.pop-x:hover{background:#F1F4F7;color:var(--text)}
.pop-body{overflow-y:auto;padding:2px 22px 16px}
.pop-body .bl-tx{padding:7px 0;font-size:12.5px}
.pop-sum{display:flex;gap:18px;border-top:1.5px solid var(--border-strong);margin-top:8px;padding-top:10px;font-size:12px;color:var(--muted)}
.pop-sum b{color:var(--text);font-weight:800;font-variant-numeric:tabular-nums}
#toast{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(50%);background:#0C4068;color:#fff;font-size:12.5px;font-weight:600;border-radius:999px;padding:9px 20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
#toast.on{opacity:1}

/* ===== סיווג הפער ===== */
.bl-gap.sub b{color:var(--soft)}
.bl-gap .subtag{display:inline-block;margin-top:5px;font-size:9.5px;font-weight:600;color:var(--soft);background:#F4F7FA;border-radius:999px;padding:2px 8px}
.gt-chip{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:10px;font-weight:700;border-radius:999px;padding:2.5px 9px;cursor:pointer;border:1px solid transparent;white-space:nowrap;font-family:inherit}
.gt-chip .cx{opacity:.5;font-size:8px}
.gt-chip:hover{filter:brightness(.965)}
.gt-wait{background:#FFF3E6;color:#B26B12;border-color:#F3D9B4}
.gt-soon{background:#F1F5F9;color:#6B7A8C;border-color:#E1E8EF}
.gt-bad{background:#FDECEA;color:#B3372A;border-color:#F5C6C0}
.gt-tgt{background:#EAF4FB;color:#2C7FB0;border-color:#BCD9F6}
.gt-built{background:#F6F1FB;color:#6B4FA0;border-color:#DCD0EC}
.gt-set{background:#fff;color:#C2410C;border-color:#EFB48D;border-style:dashed}
.gt-set:hover{background:#FFF7F2}
.gt-note{display:block;font-size:10px;color:var(--soft);font-weight:500;margin-top:3px;line-height:1.35}
/* גייט */
.gate{display:flex;align-items:center;gap:12px;background:#FFF7F2;border:1px solid #EFB48D;border-radius:14px;padding:12px 18px;margin-bottom:16px}
.gate .gi{width:26px;height:26px;border-radius:8px;background:#FBE2D0;color:#C2410C;display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 auto}
.gate .gtx{font-size:12.5px;font-weight:600;color:#8A3D14;line-height:1.45}
.gate .gtx b{font-weight:800}
.gate .gtx small{display:block;font-size:11px;color:#A9714D;font-weight:500;margin-top:1px}
.gate .gbtn{margin-inline-start:auto;background:#C2410C;color:#fff;border:0;border-radius:9px;padding:8px 15px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.gate .gbtn:hover{background:#A9370A}
.gate.ok{background:#F0F9F3;border-color:#A7E0BF}
.gate.ok .gi{background:#D6F0E1;color:#13895b}
.gate.ok .gtx{color:#0F6D48} .gate.ok .gtx small{color:#4E9273}
/* פוטר תת-סף */
.sub-foot{display:flex;align-items:center;gap:8px;padding:9px 22px;font-size:11.5px;color:var(--muted);background:#FAFCFD;border-top:1px dashed var(--border-strong)}
.sub-foot b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.sub-foot .why{margin-inline-start:auto;font-size:10.5px;color:var(--soft)}
/* פירוק הפער בכרטיס סיכום */
.g-split{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.g-split span{font-size:10px;font-weight:700;border-radius:999px;padding:2.5px 9px;white-space:nowrap;border:1px solid transparent}
/* פופאפ סיווג */
.gt-opt{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1.5px solid var(--border);border-radius:12px;cursor:pointer;margin-bottom:8px;transition:.12s}
.gt-opt:hover{border-color:var(--accent);background:#FAFCFE}
.gt-opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px rgba(57,171,226,.13)}
.gt-opt .rd{width:15px;height:15px;border-radius:50%;border:2px solid #C6D3E0;flex:0 0 auto;margin-top:1.5px;display:grid;place-items:center}
.gt-opt.on .rd{border-color:var(--accent)}
.gt-opt.on .rd::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent)}
.gt-opt b{font-size:13px;font-weight:700;display:block}
.gt-opt small{font-size:11px;color:var(--muted);display:block;margin-top:2px;line-height:1.4}
.gt-opt .act-h{display:inline-block;font-size:10px;font-weight:700;color:#2C7FB0;background:#EAF4FB;border-radius:999px;padding:1.5px 8px;margin-top:5px}
.gt-ai{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#F6F1FB;border:1px solid #DCD0EC;border-radius:10px;padding:10px 13px;margin-bottom:13px}
.gt-ai-h{flex:0 0 auto;font-size:11px;font-weight:800;color:#6B4FA0}
.gt-ai-t{flex:1;min-width:200px;font-size:11.5px;color:#5B5470;line-height:1.5}
.gt-ai-t b{color:#6B4FA0}
.gt-ai-btn{flex:0 0 auto;font-family:inherit;font-size:11.5px;font-weight:700;color:#fff;background:#7557E3;border:0;border-radius:9px;padding:7px 14px;cursor:pointer}
.gt-ai-btn:hover{filter:brightness(.93)}
.gt-sug{display:flex;align-items:center;gap:8px;background:#EAF4FB;border:1px solid #BCD9F6;color:#2C7FB0;font-size:11.5px;font-weight:600;border-radius:10px;padding:9px 12px;margin-bottom:13px;line-height:1.4}
.gt-hd{display:flex;align-items:baseline;gap:8px;background:#F7FAFD;border:1px solid var(--border);border-radius:11px;padding:10px 13px;margin-bottom:13px}
.gt-hd .amt{font-size:19px;font-weight:800;color:var(--warn);font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.gt-hd .mt{font-size:11px;color:var(--muted);font-weight:600;margin-inline-start:auto;text-align:end;line-height:1.4}
.gt-req{font-size:11.5px;font-weight:700;color:var(--text);margin:12px 0 6px}
.gt-req i{font-style:normal;color:#C2410C}
.gt-txt{width:100%;font-family:inherit;font-size:12.5px;border:1.5px solid var(--border-strong);border-radius:10px;padding:9px 11px;resize:vertical;min-height:54px;outline:none;color:var(--text);box-sizing:border-box}
.gt-txt:focus{border-color:var(--accent)}
.gt-foot{display:flex;gap:6px;align-items:center;border-top:1.5px solid var(--border-strong);padding-top:13px;margin-top:15px}
.gt-save{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 20px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.gt-save:hover{filter:brightness(.95)}
.gt-save[disabled]{background:#CBD8E3;cursor:not-allowed;filter:none}
.gt-clear{background:none;border:0;color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:9px 11px;border-radius:9px}
.gt-clear:hover{background:#F1F4F7;color:var(--text)}
.gt-nav{margin-inline-start:auto;display:flex;gap:5px;align-items:center;font-size:11px;color:var(--soft)}
.gt-nav button{background:#F1F4F7;border:0;border-radius:8px;padding:7px 12px;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--text);cursor:pointer}
.gt-nav button:hover{background:#E4EAF1}

body.is-embedded{background:transparent}
body.is-embedded .app{max-width:none;padding:4px 2px 26px}
body.is-embedded .page-head{display:none}
</style>
</head>
<body>
<script>if(location.search.includes('embed=1'))document.body.classList.add('is-embedded');</script>
<div class="app">

  <div class="page-head">
    <div class="brand-dot">HK</div>
    <div>
      <h1>מעקב ופערים</h1>
      <div class="sub">היעד מול הבפועל ומה שכבר צבוע בתזרים — והפער שנשאר</div>
    </div>
  </div>

  <div class="topbar">
    <span id="months"></span>
    <span class="sp"></span>
    <span class="lg"><i class="sw-act"></i> בפועל</span>
    <span class="lg"><i class="sw-flow"></i> בתזרים · צבוע קדימה</span>
    <span class="lg"><i class="sw-blrow"></i> שורה תקציבית · שורות דמה</span>
    <span class="lg"><i class="sw-spill"></i> המשך אחרי סוף הבר = חריגה</span>
    <span class="lg"><i class="sw-gap"></i> פער</span>
  </div>

  <div class="sumrow" id="sumrow"></div>
  <div id="groups"></div>
</div>
<div class="pop-ov" id="popOv">
  <div class="pop">
    <div class="pop-h"><div><b id="popTitle"></b><div class="sub" id="popSub"></div></div><button class="pop-x" onclick="closeTxPop()">✕</button></div>
    <div class="pop-body" id="popBody"></div>
  </div>
</div>
<div class="pop-ov" id="blOv">
  <div class="pop" style="width:min(460px,94vw)">
    <div class="pop-h"><div><b id="blTitle"></b><div class="sub">שורה תקציבית — הפער מתפזר כשורות דמה על הימים שנבחרו</div></div><button class="pop-x" onclick="blClose()">✕</button></div>
    <div class="pop-body" id="blBody" style="padding-bottom:18px"></div>
  </div>
</div>
<div class="pop-ov" id="gtOv">
  <div class="pop" style="width:min(520px,94vw)">
    <div class="pop-h"><div><b id="gtTitle"></b><div class="sub" id="gtSub"></div></div><button class="pop-x" onclick="closeGtPop()">✕</button></div>
    <div class="pop-body" id="gtBody"></div>
  </div>
</div>
<div id="toast"></div>

<script>
const nf=new Intl.NumberFormat('he-IL');
/* target = היעד; act = בפועל החודש; flow = צבוע בתזרים קדימה; futFlow = הצבוע בחודש עתידי */
const GROUPS=[
 {label:'הכנסות', kind:'inc', color:'#1B6C9C', rows:[
   {label:'הכנסות ממכירות - מזומן',  target:89950, act:60000, flow:22000, src:'goal', parties:['פדיון קופה — סניף ראשי','פדיון קופה — סניף צפון']},
   {label:'הכנסות ממכירות - סליקה',  target:77010, act:48000, flow:25000, src:'avg', gt:['wait'], pend:2, parties:['ישראכרט סליקה','ויזה כאל סליקה']},
   {label:'הכנסות מסליקה - דיירקט',  target:23501, act:22000, flow:6000, src:'avg', parties:['סליקה דיירקט']},
   {label:'הכנסות ממכירות - אלקטרה', target:80583, act:40000, flow:18000, bl:22583, blDays:[5,15,25], src:'manual', pend:3, parties:['אלקטרה מוצרי צריכה','אלקטרה — חשבונית 4471']},
   {label:'הכנסות - חברות שילוח',    target:29553, act:18000, flow:9000, src:'avg', gt:['changed'], gn:['הלקוח איבד את מוסך רם — ההסכם לא יחודש החודש'], parties:['וולט תקבולים','תן ביס']},
 ]},
 {label:'עלות המכר', kind:'exp', color:'#c98404', rows:[
   {label:'קניות מלאי',  target:155000, act:90000, flow:40000, src:'goal', parties:['בז״ן — דלקים','פז חברת נפט','ספקי משנה']},
   {label:'קבלני משנה',  target:28333,  act:20000, flow:12000, src:'avg', gt:['changed'], gn:['פרויקט דחוף ללקוח גדול — תוגברו קבלנים מעבר לתוכנית'], parties:['י.כהן עבודות','ר.לוי קבלנות']},
 ]},
 {label:'הוצאות תפעוליות', kind:'exp', color:'#7557E3', rows:[
   {label:'שכר עבודה',    target:97333, act:93000, flow:8000, src:'manual', parties:['משכורות צוות','ביטוח לאומי','פנסיה — מנורה']},
   {label:'שכירות',       target:22000, act:22000, flow:0, src:'avg', parties:['שכירות משרדים — נכסי רובע']},
   {label:'הוצאות תפעול', target:18433, act:9000,  flow:5000, src:'avg', parties:['חשמל — חח״י','ארנונה','תקשורת — בזק']},
   {label:'פרסום ושיווק', target:15667, act:7000,  flow:6000, src:'goal', gt:['built'], gn:['ההערכה בבנייה התבססה על רבעון חזק — גבוהה מדי לחודש רגיל'], parties:['גוגל אדס','פייסבוק']},
   {label:'מוסדות מס',    target:24179, act:6000,  flow:17500, src:'avg', parties:['מקדמות מס הכנסה','מע״מ']},
 ]},
 {label:'מימון, השקעות ובעלים', kind:'exp', color:'#4CAF7D', rows:[
   {label:'מימון ועמלות בנק', target:9100,  act:4500, flow:2500, src:'avg', parties:['עמלות עו״ש — לאומי','ריבית מסגרת']},
   {label:'פיקדונות והשקעות', target:12000, act:6000, flow:6000, src:'avg', parties:['הפקדה לפיקדון חודשי']},
   {label:'תשלומי הלוואה',    target:8000,  act:8000, flow:0, src:'avg', parties:['החזר הלוואה — פועלים']},
   {label:'משיכות בעלים',     target:15000, act:5000, flow:5000, src:'manual', parties:['משיכת בעלים — צחי']},
 ]},
];
const MONTHS=[
  {label:'יוני 2026', tag:'החודש'},
  {label:'יולי 2026', tag:'חודש הבא'},
  {label:'אוגוסט 2026', tag:'עוד חודשיים'},
];
let mi=0;

/* בחודש עתידי אין בפועל — רק מה שכבר צבוע בתזרים */
function rowVals(r){
  if(mi===0) return {act:r.act, flow:r.flow, bl:r.bl||0};
  return {act:0, flow:Math.round(r.target*(mi===1?0.72:0.38))};
}
/* שורה תקציבית (bl) = שורות דמה שממלאות את העקומה כדי שהתחזית תישאר
   ריאלית — אבל הן לא ידיעה, ולכן **לא** סוגרות את פער הניהול.
   פער שכולו שורה תקציבית עדיין דורש הגדרה. */
function gapOf(r){ const v=rowVals(r); return r.target-v.act-v.flow; }
/* השורה התקציבית ממשיכה לכל החודשים קדימה: ההגדרה (ימים/משקלים) קבועה,
   והסכום מחושב מחדש פר חודש — הפער שנותר ÷ הפיזור. עד שמשנים אותה כאן. */
function blOf(r){
  if(mi===0) return r.bl||0;
  if(!r.bl&&!r.blMode&&!r.blDays) return 0;
  const v=rowVals(r); return Math.max(r.target-v.act-v.flow,0);
}

/* ===== סיווג הפער =====
   ה-type עונה "מי חייב לי פעולה?" — לא מתאר את הפער אלא את הבעלוּת עליו.  */
/* הפער = יעד − בפועל − צבוע. כל מה שאנחנו מאמינים בו כבר צבוע —
   ולכן הפער הוא החלק מהיעד שאין עליו שום ידיעה. "טרם הגיע הזמן" אינו סיבה:
   אם זה רק עניין של זמן, זה צבוע. את היעד לא מתקנים באמצע חודש —
   הוא נקבע בבניית שלושת החודשים עם הלקוח, והפער מודד כמה דייקנו. */
const GAP_TYPES={
  wait:    {lbl:'מחכה לחומר מהלקוח', chip:'מחכה לחומר',   cls:'gt-wait', note:false,
            hint:'הידיעה קיימת אצל הלקוח — אי אפשר לצבוע עד שהחומר יגיע',
            act:'תזכורת הבוט בקבוצה + פריט בתור · מטופל יום-יום'},
  changed: {lbl:'המציאות השתנתה',     chip:'המציאות השתנתה', cls:'gt-bad', note:true,
            hint:'התוכנית הייתה נכונה כשנבנתה — העולם זז: לקוח אבד, מחיר עלה, עונה חלשה',
            act:'עולה לפגישה עם היועץ ונכנס לזיכרון — היעד לא מתוקן'},
  shifted: {lbl:'התזמון זז',           chip:'התזמון זז',    cls:'gt-tgt', note:true,
            hint:'הסכום יגיע — אבל בחודש אחר ממה שתכננו. הסה״כ נכון, הפריסה טעתה',
            act:'נרשם ללמידה על הפריסה — היעד לא מתוקן'},
  built:   {lbl:'טעינו בבנייה',        chip:'טעינו בבנייה',  cls:'gt-built', note:false,
            hint:'ברירת המחדל כשאין הסבר אחר — ההערכה מהבנייה לא פגשה את המציאות, ולא יודעים למה',
            act:'נרשם ללמידה — מתוקן רק בבניית שלושת החודשים הבאים'}
};
/* סף מהותיות — שלושה פרמטרים: סכום לבד ואחוז לבד שניהם שקריים.
   רצפה: מתחתיה אף פעם לא. תקרה: מעליה תמיד. באמצע — אחוז מהיעד.
   ניתן לכוונון פר חברה בהגדרות חברה › תזרים ותפעול. */
let GAP_TH={floor:1000, pct:5, ceil:25000};
try{ const s=JSON.parse(localStorage.getItem('hkGapTh')||'null'); if(s) GAP_TH=Object.assign(GAP_TH,s); }catch(e){}
window.addEventListener('message',e=>{ if(e.data&&e.data.hk==='gapTh'){ GAP_TH=Object.assign(GAP_TH,e.data.th); render(); } });

function gtOf(r){ return (r.gt||[])[mi]||null; }
function gnOf(r){ return (r.gn||[])[mi]||''; }
function gtSet(r,k,n){ r.gt=r.gt||[]; r.gn=r.gn||[]; r.gt[mi]=k; r.gn[mi]=n||''; }
/* מהותי = דורש סוג. מתחת לסף — אפור ושקט, לא נספר. */
/* אותו סף מהותיות לשני הכיוונים: פער (חסר) וחריגה (עודף).
   עודף מוגזם הוא לא "בסדר" — הוא טעות תחזית באותה מידה, רק בכיוון השני. */
function matMag(g,target){
  if(g<GAP_TH.floor) return false;
  if(g>=GAP_TH.ceil) return true;
  return target>0 && (g/target*100)>=GAP_TH.pct;
}
function matOf(r){ const g=gapOf(r); return g>0&&matMag(g,r.target); }
function matNeg(r){ const g=gapOf(r); return g<0&&matMag(-g,r.target); }
/* המלצת AI מהזיכרון של הלקוח: הזיכרון יודע דברים שהמספרים לא —
   "מוסך רם עוזב", "החשבונית תוגש ביולי". ה-AI מציע סיבה + נימוק עם מקור,
   והמתפעל מאמץ בלחיצה או בוחר אחרת. הצעה — לא סמכות. */
const AI_SUG={
 'הכנסות ממכירות - אלקטרה':{k:'shifted',
   why:'בקבוצת הוואטסאפ (28.05) הלקוח כתב שהחשבונית לאלקטרה תוגש רק בתחילת יולי',
   note:'חשבונית אלקטרה תוגש ביולי — התקבול זז חודש קדימה'},
 'הכנסות - חברות שילוח':{k:'changed',
   why:'בזיכרון הלקוח (פגישת מאי): מוסך רם מתנתק — צפויה ירידה בהכנסות השילוח',
   note:'הלקוח איבד את מוסך רם — ההסכם לא יחודש'},
};
function gtAdopt(){
  const r=GROUPS[GTP.gi].rows[GTP.ri], s=AI_SUG[r.label]; if(!s) return;
  GTP.k=s.k; GTP.n=s.note; gtRender();
}
/* ===== עריכת שורה תקציבית — בחירת ימי הפיזור =====
   משנים תאריכים ← שורות הדמה מתפזרות מחדש (הפער ÷ הימים). ביטול כל
   הימים = ביטול השורה התקציבית, והפער חוזר להיות חשוף בעקומה. */
let BLE=null;
function blOpen(gi,ri){
  const r=GROUPS[gi].rows[ri];
  BLE={gi,ri, mode:r.blMode||'dates', wd:(r.blWd!=null?r.blWd:null), days:(r.blDays||[]).slice(),
       w:Object.assign({},r.blW||{})};   // משקל פר תאריך באחוזים
  document.getElementById('blTitle').textContent=r.label;
  blRender();
  document.getElementById('blOv').classList.add('show');
}
function blClose(){document.getElementById('blOv').classList.remove('show');BLE=null;}
function blMode(m){ BLE.mode=m; blRender(); }
function blTg(d){
  const i=BLE.days.indexOf(d);
  if(i<0){ BLE.days.push(d); } else { BLE.days.splice(i,1); delete BLE.w[d]; }
  BLE.days.sort((a,b)=>a-b); blEven(); blRender();
}
/* ברירת מחדל: חלוקה שווה. עריכת משקל שוברת אותה — והסכום חייב 100. */
function blEven(){ const n=BLE.days.length; BLE.days.forEach((d,i)=>{ BLE.w[d]=Math.round(100/n)+(i===0?100-Math.round(100/n)*n:0); }); }
function blSetW(d,v){
  BLE.w[d]=Math.max(0,Math.round(+v||0));
  /* עדכון במקום — רינדור מלא היה מפיל את הפוקוס אחרי כל ספרה */
  const r=GROUPS[BLE.gi].rows[BLE.ri], g=gapOf(r), sum=blWSum(), ok=sum===100;
  const wa=document.getElementById('bleWa'+d); if(wa) wa.textContent=nf.format(Math.round(g*(BLE.w[d]||0)/100))+' ₪';
  const ws=document.getElementById('bleWSum'); if(ws){ ws.textContent='סה״כ '+sum+'%'; ws.className='ble-wsum '+(ok?'ok':'bad'); }
  const er=document.getElementById('bleErr'); if(er) er.style.display=ok?'none':'';
  const sv=document.getElementById('bleSave'); if(sv) sv.disabled=!ok;
}
function blWSum(){ return BLE.days.reduce((s,d)=>s+(BLE.w[d]||0),0); }
function blRender(focusless){
  const r=GROUPS[BLE.gi].rows[BLE.ri], g=gapOf(r);
  const DAYS=[1,5,10,15,20,25,28];
  const MODES=[['daily','כל יום'],['weekly','פעם בשבוע'],['dates','לפי תאריכים']];
  let body=`<div class="ble-fwd">הפיזור חל מהחודש הזה ולכל החודשים קדימה — עד שישונה כאן.</div><div class="ble-modes">${MODES.map(([k,l])=>`<button class="${BLE.mode===k?'on':''}" onclick="blMode('${k}')">${l}</button>`).join('')}</div>`;
  if(BLE.mode==='daily'){
    body+=`<div class="ble-sum">הפער <b>${nf.format(g)} ₪</b> יתפזר שווה על <b>כל יום עסקים</b> שנותר — <b>${nf.format(Math.round(g/18))} ₪</b> ליום (נותרו 18).</div>`;
  }else if(BLE.mode==='weekly'){
    const WD=[['א׳',0],['ב׳',1],['ג׳',2],['ד׳',3],['ה׳',4],['ו׳',5]];
    if(BLE.wd==null) BLE.wd=0;
    body+=`<div class="ble-wdays">${WD.map(([l,i])=>`<button class="ble-day ${BLE.wd===i?'on':''}" onclick="BLE.wd=${i};blRender()">${l}</button>`).join('')}</div>
      <div class="ble-sum">הפער <b>${nf.format(g)} ₪</b> יתפזר <b>בכל יום ${WD[BLE.wd][0]}</b> — <b>${nf.format(Math.round(g/3))} ₪</b> לשורה, 3 ימי ${WD[BLE.wd][0]} שנותרו החודש.</div>`;
  }else{
    const sum=blWSum(), ok=sum===100;
    body+=`<div class="ble-days">${DAYS.map(d=>`<button class="ble-day ${BLE.days.includes(d)?'on':''}" onclick="blTg(${d})">${d}</button>`).join('')}</div>`;
    if(BLE.days.length){
      body+=`<div class="ble-wt">
        <div class="ble-wt-h">משקל לכל תאריך <span class="ble-wsum ${ok?'ok':'bad'}" id="bleWSum">סה״כ ${sum}%</span></div>
        ${BLE.days.map(d=>`<div class="ble-wrow"><span class="ble-wd">${d} בחודש</span>
          <input type="number" min="0" max="100" value="${BLE.w[d]||0}" oninput="blSetW(${d},this.value)">
          <span class="ble-wp">%</span>
          <b class="ble-wa" id="bleWa${d}">${nf.format(Math.round(g*(BLE.w[d]||0)/100))} ₪</b></div>`).join('')}
        <button class="ble-even" onclick="blEven();blRender()">חלוקה שווה</button>
      </div>`;
      body+=`<div class="ble-err" id="bleErr" ${ok?'style="display:none"':''}>המשקלים חייבים להסתכם ב-100% כדי לשמור</div>`;
    }else{
      body+=`<div class="ble-sum">בלי ימים אין שורה תקציבית — הפער יישאר חשוף בעקומה</div>`;
    }
  }
  const savable=BLE.mode!=='dates'||!BLE.days.length||blWSum()===100;
  body+=`<div class="gt-foot" style="border:none;padding-top:10px">
       <button class="gt-save" id="bleSave" ${savable?'':'disabled'} onclick="blSave()">${(BLE.mode==='dates'&&!BLE.days.length)?'ביטול השורה התקציבית':'שמירת הפיזור'}</button>
       <button class="gt-clear" onclick="blClose()">ביטול</button>
     </div>`;
  document.getElementById('blBody').innerHTML=body;
}
function blSave(){
  const r=GROUPS[BLE.gi].rows[BLE.ri];
  if(BLE.mode==='dates'&&!BLE.days.length){ delete r.bl; delete r.blDays; delete r.blW; delete r.blMode; toast('השורה התקציבית בוטלה — הפער חשוף בעקומה'); }
  else{
    r.blMode=BLE.mode;
    if(BLE.mode==='weekly') r.blWd=(BLE.wd==null?0:BLE.wd);
    if(BLE.mode==='dates'){ r.blDays=BLE.days.slice(); r.blW=Object.assign({},BLE.w); }
    if(!r.bl) r.bl=gapOf(r);
    toast(BLE.mode==='daily'?'הפיזור: כל יום עסקים':BLE.mode==='weekly'?('הפיזור: פעם בשבוע — יום '+['א׳','ב׳','ג׳','ד׳','ה׳','ו׳'][BLE.wd==null?0:BLE.wd]):'הפיזור נשמר — '+BLE.days.map(d=>d+' ('+BLE.w[d]+'%)').join(' · '));
  }
  blClose(); render();
}
/* ההצעה של המערכת — שורות פתוחות בטבלת ההזנה. הצעה בלבד: רק המתפעל יודע. */
function gtSuggest(r){ return (r.pend&&mi===0)?'wait':null; }
function allRows(){ const o=[]; GROUPS.forEach((g,gi)=>g.rows.forEach((r,ri)=>o.push({g,r,gi,ri}))); return o; }
function gapsUntyped(){ return allRows().filter(x=>(matOf(x.r)||matNeg(x.r))&&!gtOf(x.r)); }
function gapsSub(){ const l=allRows().filter(x=>gapOf(x.r)>0&&!matOf(x.r));
  return {n:l.length, sum:l.reduce((s,x)=>s+gapOf(x.r),0)}; }


function barHtml(r,kind,noTgt){
  const v=rowVals(r), t=r.target;
  const total=v.act+v.flow, over=total>t;
  /* הבר עצמו = היעד: המסלול נגמר תמיד באותו מקום (86% מהרוחב).
     בר מלא עד הסוף = עמדנו ביעד. חריגה = מילוי שממשיך **אחרי סוף הבר**,
     בשטח שלשאר השורות פשוט אין. בלי קווים, בלי מה לפרש. */
  const actIn=over?Math.min(v.act,t):v.act;
  const aPct=Math.min(actIn/t,1)*100;
  const fPct=over?Math.max(t-actIn,0)/t*100:Math.max(Math.min((v.act+v.flow)/t,1)*100-aPct,0);
  const mPct=over?0:Math.max(Math.min(total/t,1)*100-aPct-fPct,0);
  const spill=over?Math.min((total-t)/t*86,13):0;
  const bl=blOf(r), bPct=(!over&&bl)?Math.max(Math.min((total+bl)/t,1)*100-aPct-fPct-mPct,0):0;
  const gi_=arguments[3], ri_=arguments[4];
  const clk=(f)=>(gi_!=null)?` onclick="openTxPop(${gi_},${ri_},'${f}')" class="n-clk"`:'';
  return `<div class="bl-bar">
    <span class="bl-track">
      <i class="seg act" style="width:${aPct.toFixed(1)}%"></i>
      <i class="seg flow" style="width:${fPct.toFixed(1)}%"></i>
        ${bPct?`<i class="seg blrow" style="width:${bPct.toFixed(1)}%" title="שורה תקציבית — שורות דמה"></i>`:''}
    </span>
    ${over?`<i class="seg spill ${kind==='exp'?'exp':'inc'}" style="width:${spill.toFixed(1)}%" title="מעבר ליעד"></i>`:''}
  </div>
  <div class="bl-nums">
    <span class="n-act"${clk('0')}>בפועל <b>${nf.format(v.act)}</b></span>
    <span class="n-flow"${clk('1')}>בתזרים <b>${nf.format(v.flow)}</b></span>
    ${blOf(r)?`<span class="n-blrow"${clk('2')}>שורה תקציבית <b>${nf.format(blOf(r))}</b></span>`:''}
    ${over?`<span class="n-over">${kind==='exp'?'חריגה':'מעל היעד'} <b>${nf.format(total-t)}</b></span>`:''}
    ${noTgt?'':`<span class="n-tgt">יעד <b>${nf.format(t)}</b></span>`}
  </div>`;
}
/* דריל קטגוריה: כל הפעולות — בפועל + בתזרים */
function txSplit(total,fracs,days,parties,f){
  const out=[]; let acc=0;
  fracs.forEach((fr,ix)=>{
    const v=ix===fracs.length-1?total-acc:Math.round(total*fr/500)*500||Math.round(total*fr);
    acc+=v;
    out.push({d:days[ix],t:parties[ix%parties.length],v,f});
  });
  return out.filter(x=>x.v>0);
}
function txsOf(r){
  const v=rowVals(r), P=r.parties||[r.label];
  let out=[];
  if(v.act>0) out=out.concat(txSplit(v.act, v.act>60000?[0.5,0.3,0.2]:v.act>15000?[0.6,0.4]:[1],
    ['03.06','10.06','18.06'], P, 0));
  if(v.flow>0) out=out.concat(txSplit(v.flow, v.flow>30000?[0.6,0.4]:[1],
    ['24.06','29.06'], P.slice().reverse(), 1));
  /* שורות הדמה של השורה התקציבית — הן חלק מהעקומה, ולכן חלק מהפירוט */
  const bl=blOf(r);
  if(bl){
    const days=(r.blDays&&r.blDays.length)?r.blDays:[5,15,25];
    const w=r.blW||{};
    days.forEach(d=>{
      const amt=Object.keys(w).length?Math.round(bl*(w[d]||0)/100):Math.round(bl/days.length);
      if(amt) out.push({d:String(d).padStart(2,'0')+'.06', t:'שורה תקציבית — שורת דמה', v:amt, f:2});
    });
  }
  return out;
}
let TXPOP=null;
function openTxPop(gi,ri,flt){
  TXPOP={gi,ri,flt:(flt==null?null:+flt)};
  const g=GROUPS[gi], r=g.rows[ri], v=rowVals(r);

  let txs=txsOf(r);
  if(TXPOP.flt!=null) txs=txs.filter(x=>(x.f||0)===TXPOP.flt);

    `<div class="pop-sum"><span>בפועל <b>${nf.format(v.act)}</b></span><span>בתזרים <b>${nf.format(v.flow)}</b></span>${blOf(r)?`<span>שורה תקציבית <b>${nf.format(blOf(r))}</b></span>`:''}<span>יעד <b>${nf.format(r.target)}</b></span></div>`;
  document.getElementById('popOv').classList.add('show');
}
function closeTxPop(){document.getElementById('popOv').classList.remove('show');}
/* מקור היעד — אותה שפה כמו בתזרים העתידי */
function srcTag(r,kind){
  if(r.src==='goal') return `<span class="src-tag goal-${kind==='inc'?'inc':'exp'}">${kind==='inc'?'↑ יעד הכנסה':'↓ יעד הוצאה'}</span>`;
  if(r.src==='manual') return '<span class="src-tag man">שונה ידנית</span>';
  return '<span class="src-tag avg">ממוצע 3 ח׳</span>';
}
/* עריכת יעד במקום — לחיצה על המספר */
/* צ'יפ השורה התקציבית יושב ליד שם הקטגוריה — הוא מאפיין של השורה,
   לא של הפער, ועמודת הפער נשארת למספר ולסיווג. */
function blChip(r,gi,ri){
  if(blOf(r)) return `<button class="bl-on" onclick="event.stopPropagation();blOpen(${gi},${ri})" title="בעקומה כשורות דמה בימים ${(r.blDays||[]).join(' · ')} בחודש · לחיצה לעריכה">שורה תקציבית פעילה ✎</button>`;
  /* זמין בכל קטגוריה — גם כשאין פער כרגע, כדי שאפשר יהיה להגדיר מראש */
  return `<button class="bl-set" onclick="event.stopPropagation();blOpen(${gi},${ri})">＋ שורה תקציבית</button>`;
}
function gapHtml(r,kind,gi,ri){
  const g=gapOf(r);
  if(g===0) return `<div class="bl-gap pos">✓ מכוסה במלואו<b>0</b></div>`;
  if(g<0){
    const c=kind==='exp'?'neg':'pos', lbl=kind==='exp'?'חריגה מהיעד':'מעל היעד';
    const mat=matNeg(r), k=gtOf(r), T=k?GAP_TYPES[k]:null;
    let tail='';
    if(!mat) tail='';
    else if(T){ const note=gnOf(r);
      tail=`<button class="gt-chip ${T.cls}" onclick="openGtPop(${gi},${ri})" title="לחיצה לשינוי הסיווג">${T.chip}<span class="cx">✎</span></button>`
         + (note?`<span class="gt-note">${note}</span>`:''); }
    else tail=`<button class="gt-chip gt-set" onclick="openGtPop(${gi},${ri})">+ הגדרת החריגה</button>`;
    return `<div class="bl-gap ${c}">${lbl}<b>-${nf.format(Math.abs(g))}</b>${tail}</div>`; }

  /* פער חיובי — הצבע נגזר מהמהותיות ומהסוג, לא מהגודל.
     פער שמכוסה בשורה תקציבית מקבל תווית משלו — הוא בעקומה, אבל הוא לא ידיעה. */
  const bl=blOf(r);
  const mat=matOf(r), k=gtOf(r), T=k?GAP_TYPES[k]:null;
  let tail;
  if(!mat){
    tail=`<span class="subtag">מתחת לסף — לא דורש הגדרה</span>`;
  }else if(T){
    const note=gnOf(r);
    tail=`<button class="gt-chip ${T.cls}" onclick="openGtPop(${gi},${ri})" title="לחיצה לשינוי הסיווג">${T.chip}<span class="cx">✎</span></button>`
       + (note?`<span class="gt-note">${note}</span>`:'');
  }else{
    tail=`<button class="gt-chip gt-set" onclick="openGtPop(${gi},${ri})">+ הגדרת הפער</button>`;
  }
  const lbl=bl>=g?'פער בשורה תקציבית':'נותר לצביעה בתזרים';
  const blNote='';
  return `<div class="bl-gap ${mat?'warn':'sub'}">${lbl}<b>${nf.format(g)}</b>${tail}${blNote}</div>`;
}

function render(){
  document.getElementById('months').innerHTML=MONTHS.map((m,i)=>
    `<button class="mbtn ${i===mi?'on':''}" onclick="mi=${i};render()">${m.tag}<small>${m.label}</small></button>`).join('');

  /* גייט: פער מהותי בלי סוג חוסם את שלב הבדיקה */
  const un=gapsUntyped(), unSum=un.reduce((s,x)=>s+gapOf(x.r),0);
  try{ parent.postMessage({hk:'gapGate', n:un.length, sum:unSum, month:MONTHS[mi].label},'*'); }catch(e){}

  /* סיכום: הכנסות והוצאות — בר + פער לכל אחד + פירוק הפער לפי סוג */
  const sumCard=(label,kind)=>{
    const rows=GROUPS.filter(g=>g.kind===kind).flatMap(g=>g.rows);
    const T=rows.reduce((s,r)=>s+r.target,0);
    const A=rows.reduce((s,r)=>s+rowVals(r).act,0);
    const F=rows.reduce((s,r)=>s+rowVals(r).flow,0);
    const G=T-A-F;
    const gCls=G===0?'pos':G<0?(kind==='exp'?'neg':'pos'):'warn';
    const gTxt=G===0?'✓ מכוסה':G<0?(kind==='exp'?'חריגה':'מעל היעד'):'נותר לצביעה בתזרים';
    return `<div class="scard">
      <div class="sc-top"><span class="k">${label}<small>${MONTHS[mi].label}</small></span>
        <span class="g ${gCls}">${gTxt}<b>${G<0?'-':''}${nf.format(Math.abs(G))} ₪</b></span></div>
      ${barHtml({target:T,act:A,flow:F},kind)}
    </div>`;
  };
  document.getElementById('sumrow').innerHTML=sumCard('כלל ההכנסות','inc')+sumCard('כלל ההוצאות','exp');

  /* רווחיות מצטברת — שורות בין הקבוצות, כמו בדוח תזרים */
  const PROFIT_AFTER={1:'רווח גולמי',2:'רווח תפעולי',3:'רווח נקי'};
  const gAgg=g=>({T:g.rows.reduce((s,r)=>s+r.target,0),
                  C:g.rows.reduce((s,r)=>s+rowVals(r).act+rowVals(r).flow,0)});
  let cumT=0, cumC=0;
  document.getElementById('groups').innerHTML=GROUPS.map((g,gi)=>{
    const a=gAgg(g);
    if(g.kind==='inc'){cumT+=a.T;cumC+=a.C;}else{cumT-=a.T;cumC-=a.C;}
    let out=`
    <div class="grp">
      <div class="grp-h"><span class="dot" style="background:${g.color}"></span>${g.label}
        <span class="cnt">${g.rows.length} קטגוריות</span>
        ${(()=>{ const pos=g.rows.reduce((s,r)=>s+Math.max(gapOf(r),0),0),
                 neg=g.rows.reduce((s,r)=>s+Math.max(-gapOf(r),0),0);
          return `<span class="grp-gap">${pos?`<span class="gg-pos">פער <b>${nf.format(pos)}</b></span>`:''}${neg?`<span class="gg-neg">${g.kind==='exp'?'חריגה':'מעל היעד'} <b>${nf.format(neg)}</b></span>`:''}${!pos&&!neg?'<span class="gg-ok">מכוסה ✓</span>':''}</span>`;})()}</div>
      ${g.rows.map((r,ri)=>{
        return `
        <div class="bl-row">
          <div class="bl-name"><button class="nm" onclick="openTxPop(${gi},${ri})" title="הפעולות של הקטגוריה החודש">${r.label}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m15 18-6-6 6-6"/></svg></button>
            ${blChip(r,gi,ri)}</div>
          <div class="bl-tgt" title="היעד נקבע בבניית שלושת החודשים עם הלקוח — לא נערך באמצע חודש"><span>יעד</span><b>${nf.format(r.target)}</b>${srcTag(r,g.kind)}</div>
          <div class="bl-mid">${barHtml(r,g.kind,true,gi,ri)}</div>
          ${gapHtml(r,g.kind,gi,ri)}
        </div>`;}).join('')}
      ${(()=>{ const l=g.rows.filter(r=>gapOf(r)>0&&!matOf(r));
        return l.length?`<div class="sub-foot">${l.length} ${l.length===1?'קטגוריה':'קטגוריות'} מתחת לסף · <b>${nf.format(l.reduce((s,r)=>s+gapOf(r),0))} ₪</b>
          <span class="why">מתחת ל-${nf.format(GAP_TH.floor)} ₪ או ${GAP_TH.pct}% מהיעד — לא דורש הגדרה</span></div>`:''; })()}
    </div>`;
    if(PROFIT_AFTER[gi]){
      out+=`<div class="pr-row">
        <div class="pr-name">${PROFIT_AFTER[gi]}</div>
        <div class="pr-cell"><span>יעד</span><b class="${cumT<0?'neg':'pos'}">${nf.format(cumT)}</b></div>
        <div class="pr-cell"><span>צפי · בפועל + בתזרים</span><b class="${cumC<0?'neg':'pos'}">${nf.format(cumC)}</b></div>
      </div>`;
    }
    return out;
  }).join('');
}
/* ===== פופאפ סיווג הפער — UI פנימי, לא נסגר בלחיצת רקע ===== */
let GTP=null;
function openGtPop(gi,ri){

function closeGtPop(){ document.getElementById('gtOv').classList.remove('show'); GTP=null; }

function gtNote(v){ GTP.n=v; const b=document.getElementById('gtSaveBtn'); if(b) b.disabled=!gtValid(); }
function gtValid(){ return GTP && GTP.k && (!GAP_TYPES[GTP.k].note || GTP.n.trim().length>2); }
function gtRender(){
  const r=GROUPS[GTP.gi].rows[GTP.ri], g0=gapOf(r), over=g0<0, g=Math.abs(g0), sug=over?null:gtSuggest(r), pct=r.target>0?(g/r.target*100):0;

    `<div class="gt-hd"><span class="amt">${nf.format(g)} ₪</span>

       <span class="mt">${why}<br>יעד ${nf.format(r.target)} ₪</span></div>`
  + (sug&&!gtOf(r)?`<div class="gt-sug">◆ <span>יש <b>${r.pend}</b> שורות פתוחות בטבלת ההזנה לקטגוריה — ההצעה היא <b>מחכה לחומר</b>. רק אתה יודע אם זה נכון.</span></div>`:'')
  + (AI_SUG[r.label]&&!gtOf(r)?`<div class="gt-ai"><span class="gt-ai-h">✦ מהזיכרון של הלקוח</span>

      <button class="gt-ai-btn" onclick="gtAdopt()">אימוץ ההצעה</button></div>`:'')
  + Object.keys(GAP_TYPES).filter(k=>!(over&&k==='wait')).map(k=>{
      const T=GAP_TYPES[k];
      return `<div class="gt-opt ${GTP.k===k?'on':''}" onclick="gtPick('${k}')">
        <span class="rd"></span>

    }).join('')
  + (need?`<div class="gt-req">הסבר בשורה אחת <i>· חובה</i></div>
      <textarea class="gt-txt" oninput="gtNote(this.value)" placeholder="${GTP.k==='changed'?'מה השתנה בעולם? (עולה לפגישה ולזיכרון)':GTP.k==='shifted'?'לאיזה חודש זה זז, ולמה?':'למה ההערכה בבנייה הייתה שגויה?'}">${GTP.n||''}</textarea>
      <div style="font-size:10.5px;color:var(--soft);margin-top:5px">${GTP.k==='changed'?'המשפט הזה עולה להכנה לפגישה ולזיכרון הלקוח.':'נרשם ללמידה — היעד עצמו לא מתוקן באמצע חודש.'}</div>`:'')
  + `<div class="gt-foot">
      <button class="gt-save" id="gtSaveBtn" ${gtValid()?'':'disabled'} onclick="gtSave()">שמירת הסיווג</button>
      ${gtOf(r)?'<button class="gt-clear" onclick="gtRemove()">הסרת הסיווג</button>':''}
      <span class="gt-nav">${gapsUntyped().length?`<span>${gapsUntyped().length} פערים ללא סוג</span><button onclick="gtNext()">הבא ←</button>`:'<span>כל הפערים מסווגים ✓</span>'}</span>
     </div>`;
}
function gtSave(){
  if(!gtValid()) return;
  const r=GROUPS[GTP.gi].rows[GTP.ri];
  gtSet(r,GTP.k,GTP.n);
  toast('הפער סווג — '+GAP_TYPES[GTP.k].lbl);
  const left=gapsUntyped();
  if(left.length){ openGtPop(left[0].gi,left[0].ri); } else { closeGtPop(); }
  render();
}
