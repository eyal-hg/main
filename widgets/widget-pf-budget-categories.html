<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
 *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
 :root{--navy:#0C4068;--cyan:#39ABE2;--green:#1e8a4c;--red:#d93025;--yellow:#f0b429;--gray:#818181;--gray2:#a0a8b8;--line:#e6ecf2;--shadow:0px 1px 50px rgba(0,0,0,0.08)}
 body{font-family:'Rubik',sans-serif;background:#e8eef4;direction:rtl;color:#273736;display:flex;justify-content:center;padding:28px}
 .widget{background:#fff;border-radius:14px;box-shadow:var(--shadow);width:560px;max-width:100%;overflow:hidden}
 .w-head{display:flex;align-items:center;gap:11px;padding:16px 20px 6px}
 .w-icon{width:36px;height:36px;border-radius:10px;background:rgba(228,131,117,.15);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
 .w-title{font-size:16px;font-weight:600;color:var(--navy)}
 .w-sub{font-size:11px;color:var(--gray2);margin-top:1px}
 .list{padding:6px 20px 4px}
 .crow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #f3f5f8}
 .crow:first-child{border-top:none}
 .cn{width:96px;font-size:13px;font-weight:500;color:var(--navy);flex:0 0 auto}
 .cbar{flex:1;position:relative;height:22px;background:#f2f5f8;border-radius:7px;overflow:hidden}
 .cbar .bg{position:absolute;inset-inline-start:0;top:0;height:100%;background:#e3ebf2}
 .cbar .fg{position:absolute;inset-inline-start:0;top:0;height:100%;border-radius:7px}
 .cbar .fg.ok{background:var(--green)} .cbar .fg.over{background:var(--red)} .cbar .fg.near{background:var(--yellow)}
 .cbar .mk{position:absolute;top:-2px;height:26px;width:2px;background:var(--navy)}
 .cv{width:96px;flex:0 0 auto;text-align:left;direction:ltr}
 .cv .d{font-size:13px;font-weight:700}
 .cv .d.over{color:var(--red)} .cv .d.ok{color:var(--green)} .cv .d.near{color:#b8860b}
 .cv .s{font-size:10px;color:var(--gray2)}
 .w-foot{display:flex;align-items:center;justify-content:space-between;padding:11px 20px 14px;border-top:1px solid #f0f4f7}
 .w-update{font-size:10px;color:var(--gray2)} .w-link{font-size:11px;font-weight:500;color:var(--cyan);cursor:pointer}
</style></head>
<body>
<div class="widget">
 <div class="w-head"><div class="w-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="#E48375" stroke-width="1.7"/><path d="M8 13l3 3 5-6" stroke="#E48375" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
 <div><div class="w-title">חריגות תקציב לפי קטגוריה</div><div class="w-sub">ביצוע מול תקציב מצרפי · הקו השחור = יעד התקציב</div></div></div>
 <div class="list" id="list"></div>
 <div class="w-foot"><div class="w-update">מסווג אוטומטית מתנועות Bizibox</div><div class="w-link">פירוט לפי סעיף ←</div></div>
</div>
<script>
const K=[
 {n:'שכר עבודה',   budget:640000,actual:712000},
 {n:'ספקים',       budget:820000,actual:868000},
 {n:'שכירות',      budget:210000,actual:210000},
 {n:'מסים ואגרות', budget:180000,actual:154000},
 {n:'שיווק',       budget:120000,actual:96000},
 {n:'אחזקה',       budget:90000, actual:118000},
];
const f=v=>(v/1000).toFixed(0)+'k';
const MK=78; // budget marker at 78% of bar width -> leaves room to show overflow
document.getElementById('list').innerHTML=K.map(c=>{
 const p=Math.round(c.actual/c.budget*100), diff=c.actual-c.budget;
 const st=p>100?'over':(p>=95?'near':'ok');
 const w=Math.min(p/100*MK,100);
 return `<div class="crow">
   <div class="cn">${c.n}</div>
   <div class="cbar"><div class="fg ${st}" style="width:${w}%"></div><div class="mk" style="inset-inline-start:${MK}%"></div></div>
   <div class="cv"><div class="d ${st}">${diff>0?'+':''}${f(diff)} ₪</div><div class="s">${p}% מהתקציב</div></div>
 </div>`;
}).join('');
</script>
<style id="hk-embed-style">
html.embed,html.embed body{background:transparent !important;height:auto !important;min-height:0 !important;width:auto !important}
html.embed body{display:block !important;padding:0 !important;margin:0 !important}
html.embed .widget{margin:0 !important;width:100% !important;max-width:none !important;box-shadow:0 1px 2px rgba(12,64,104,.05),0 10px 28px rgba(12,64,104,.05) !important;border:1px solid #eef2f6 !important}
</style>
<script id="hk-embed-js">
(function(){
  if(location.hash!=="#embed"&&self===top)return;
  document.documentElement.classList.add("embed");
  var file=(location.pathname.split("/").pop()||"");
  function report(){var el=document.querySelector(".widget")||document.body;var h=Math.ceil(el.getBoundingClientRect().height)+10;if(h>60)parent.postMessage({hkEmbed:1,src:file,h:h},"*");}
  addEventListener("load",function(){report();[120,400,900,1600].forEach(function(t){setTimeout(report,t);});});
  addEventListener("resize",report);
  if(window.ResizeObserver){try{new ResizeObserver(report).observe(document.documentElement);}catch(e){}}
})();
</script>
</body></html>
