<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
 *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
 :root{--navy:#0C4068;--cyan:#39ABE2;--green:#1e8a4c;--red:#d93025;--yellow:#f0b429;--amber:#e8743a;--gray:#818181;--gray2:#a0a8b8;--line:#e6ecf2;--shadow:0px 1px 50px rgba(0,0,0,0.08)}
 body{font-family:'Rubik',sans-serif;background:#e8eef4;direction:rtl;color:#273736;display:flex;justify-content:center;padding:28px}
 .widget{background:#fff;border-radius:14px;box-shadow:var(--shadow);width:560px;max-width:100%;overflow:hidden}
 .w-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px;gap:10px}
 .w-hl{display:flex;align-items:center;gap:11px}
 .w-icon{width:36px;height:36px;border-radius:10px;background:rgba(217,48,37,.1);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
 .w-title{font-size:16px;font-weight:600;color:var(--navy)}
 .w-sub{font-size:11px;color:var(--gray2);margin-top:1px}
 .w-count{font-size:12.5px;font-weight:600;color:var(--red);background:rgba(217,48,37,.1);border-radius:20px;padding:5px 13px}
 .list{padding:6px 0 2px}
 .rrow{display:flex;align-items:center;gap:13px;padding:13px 20px;border-top:1px solid #f3f5f8}
 .rrow:first-child{border-top:none}
 .sev{width:4px;align-self:stretch;border-radius:3px;flex:0 0 auto}
 .sev.high{background:var(--red)} .sev.mid{background:var(--amber)} .sev.low{background:var(--yellow)}
 .rmain{flex:1;min-width:0}
 .rn{font-size:14px;font-weight:600;color:var(--navy)}
 .rm{font-size:11.5px;color:var(--gray2);margin-top:2px;display:flex;align-items:center;gap:6px}
 .rm .cause{color:var(--amber)}
 .rdays{text-align:center;flex:0 0 auto;min-width:66px}
 .rdays .num{font-size:20px;font-weight:700;color:var(--navy);line-height:1}
 .rdays .lab{font-size:9.5px;color:var(--gray2);margin-top:2px}
 .ramt{text-align:left;flex:0 0 auto;min-width:96px}
 .ramt .v{font-size:14px;font-weight:700;color:var(--red);direction:ltr}
 .ramt .l{font-size:9.5px;color:var(--gray2)}
 .w-foot{display:flex;align-items:center;justify-content:space-between;padding:11px 20px 14px;border-top:1px solid #f0f4f7}
 .w-update{font-size:10px;color:var(--gray2)} .w-link{font-size:11px;font-weight:500;color:var(--cyan);cursor:pointer}
</style></head>
<body>
<div class="widget">
 <div class="w-head"><div class="w-hl"><div class="w-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2v6M12 22a8 8 0 0 0 8-8c0-4-4-8-8-12-4 4-8 8-8 12a8 8 0 0 0 8 8z" stroke="#d93025" stroke-width="1.7" stroke-linejoin="round"/></svg></div>
 <div><div class="w-title">חברות בסיכון תזרימי</div><div class="w-sub">צפויות לחרוג מרצפת התקציב / מסגרת האשראי</div></div></div>
 <div class="w-count" id="cnt">—</div></div>
 <div class="list" id="list"></div>
 <div class="w-foot"><div class="w-update">חיזוי מבוסס תקציב + תזרים צפוי · נכון ל-2.7.2026</div><div class="w-link">כל ההתראות ←</div></div>
</div>
<script>
const R=[
 {n:'מטעי גבעון',   days:6, gap:-142000, cause:'הוצאות שכר מעל התקציב', sev:'high'},
 {n:'אנרגי גולני',  days:12,gap:-72000,  cause:'תשלום ספק מעל התקציב',  sev:'mid'},
];
const f=v=>(v<0?'-':'')+Math.abs(v).toLocaleString('en-US')+' ₪';
document.getElementById('cnt').textContent=R.length+' חברות';
document.getElementById('list').innerHTML=R.map(c=>`
 <div class="rrow">
   <span class="sev ${c.sev}"></span>
   <div class="rmain"><div class="rn">${c.n}</div><div class="rm">סיבה: <span class="cause">${c.cause}</span></div></div>
   <div class="rdays"><div class="num">${c.days}</div><div class="lab">ימים לחריגה</div></div>
   <div class="ramt"><div class="v">${f(c.gap)}</div><div class="l">פער צפוי מהתקציב</div></div>
 </div>`).join('');
</script>
<style id="hk-embed-style">
html.embed,html.embed body{background:transparent !important;height:auto !important;min-height:0 !important;width:auto !important}
html.embed body{display:block !important;padding:0 !important;margin:0 !important}
html.embed .widget{margin:0 !important;width:100% !important;max-width:none !important;box-shadow:0 1px 2px rgba(12,64,104,.05),0 10px 28px rgba(12,64,104,.05) !important;border:1px solid #eef2f6 !important}
</style>
<script id="hk-embed-js">
(function(){
  if(location.hash!=="#embed"&&self===top)return;
  document.documentElement.classList.add("embed");
  var file=(location.pathname.split("/").pop()||"");
  function report(){var el=document.querySelector(".widget")||document.body;var h=Math.ceil(el.getBoundingClientRect().height)+10;if(h>60)parent.postMessage({hkEmbed:1,src:file,h:h},"*");}
  addEventListener("load",function(){report();[120,400,900,1600].forEach(function(t){setTimeout(report,t);});});
  addEventListener("resize",report);
  if(window.ResizeObserver){try{new ResizeObserver(report).observe(document.documentElement);}catch(e){}}
})();
</script>
</body></html>
