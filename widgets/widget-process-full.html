<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ווידגט תהליך — HK</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:   #0C4068;
      --cyan:   #39ABE2;
      --warm:   #E48375;
      --bg:     #d4dde8;
      --white:  #ffffff;
      --dark:   #273736;
      --gray:   #818181;
      --gray2:  #a0a8b8;
      --green:  #1e8a4c;
      --shadow: 0px 1px 50px 0px rgba(0,0,0,0.08);
      --r: 8px;
    }
    body {
      font-family: 'Rubik', sans-serif;
      background: var(--bg);
      direction: rtl;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    /* ── card shell (matches dashboard.html) ── */
    .card {
      background: var(--white);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      overflow: hidden;
      width: 640px;
    }

    /* ── header ── */
    .ch {
      display: flex; flex-direction: column; align-items: flex-start;
      gap: 2px; padding: 14px 16px 0;
    }
    .ch-title {
      display: flex; align-items: center; gap: 5px;
      font-size: 14px; font-weight: 500; color: var(--dark);
    }
    .ch-title svg { opacity: .4; }

    /* ── progress bar section ── */
    .cpb { padding: 10px 16px 4px; }

    /* top row: title right, target left */
    .pbl-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 18px;
    }
    .pbl-title { font-size: 13px; font-weight: 500; color: var(--dark); }
    .pbl-target {
      display: flex; align-items: center; gap: 5px;
      font-size: 13px; color: var(--gray2);
    }
    .pbl-target svg { opacity: .45; }

    /* bar wrap — holds bubble + bar */
    .pbt-wrap { position: relative; margin-bottom: 6px; }

    /* bubble above bar */
    .pbt-bubble {
      position: absolute;
      top: -26px;
      transform: translateX(50%);
      background: var(--white);
      border: 1px solid #e2eaf2;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 12px; font-weight: 500; color: var(--navy);
      white-space: nowrap;
      box-shadow: 0 1px 6px rgba(12,64,104,.08);
    }

    .pbt { height: 12px; background: #deeef8; border-radius: 20px; overflow: visible; direction: ltr; position: relative; }
    .pbf { height: 100%; border-radius: 20px; background: var(--cyan); transition: width .4s ease; }

    /* scale labels */
    .pbl-scale {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--gray2); margin-top: 4px;
    }

    /* bottom note */
    .pbl-note {
      text-align: left;
      font-size: 12px; font-weight: 500; color: var(--dark);
      margin-top: 6px;
    }
    .pbl-note span { color: var(--gray2); font-weight: 400; }

    /* ── divider ── */
    .divider { height: 1px; background: #f2f4f7; margin: 12px 0 0; }

    /* ── steps list ── */
    .steps-list {
      padding: 0 16px 4px;
      max-height: 285px; /* ~5 שלבים */
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #d0dae6 transparent;
    }
    .steps-list::-webkit-scrollbar { width: 4px; }
    .steps-list::-webkit-scrollbar-thumb { background: #d0dae6; border-radius: 4px; }
    .steps-list::-webkit-scrollbar-track { background: transparent; }

    .step-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #f5f6f8;
      position: relative;
    }
    .step-row:last-child { border-bottom: none; }

    /* left connector line */
    .step-row:not(:last-child) .step-icon-wrap::after {
      content: '';
      position: absolute;
      right: 28px; top: 36px;
      width: 1.5px; height: calc(100% - 18px);
      background: #e6ecf2;
    }

    .step-icon-wrap {
      position: relative;
      flex-shrink: 0;
      width: 28px;
      display: flex; justify-content: center;
    }

    /* circle icon */
    .step-circle {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 11px; font-weight: 600;
    }
    .step-circle.done {
      background: var(--cyan); color: #fff;
    }
    .step-circle.active {
      background: #fff; color: var(--cyan);
      border: 2px solid var(--cyan);
      box-shadow: 0 0 0 3px rgba(57,171,226,.14);
    }
    .step-circle.pending {
      background: #f0f4f7; color: var(--gray2);
      border: 1.5px solid #e2e8f0;
    }

    /* check svg for done */
    .step-circle.done::after {
      content: '';
      display: block;
      width: 6px; height: 10px;
      border: 2px solid #fff;
      border-top: none; border-right: none;
      transform: rotate(-45deg) translate(1px,-1px);
    }

    .step-body { flex: 1; min-width: 0; }

    .step-name {
      font-size: 13px; font-weight: 500; color: var(--dark);
      margin-bottom: 2px;
    }
    .step-name.active { color: var(--navy); font-weight: 600; }
    .step-name.pending { color: var(--gray2); font-weight: 400; }

    /* meeting row */
    .step-meeting {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--gray);
      margin-top: 2px;
    }
    .step-meeting svg { flex-shrink: 0; opacity: .5; }

    /* active pill */
    .step-badge {
      font-size: 10px; font-weight: 500;
      background: rgba(57,171,226,.1); color: var(--cyan);
      border-radius: 10px; padding: 2px 8px;
      white-space: nowrap; align-self: flex-start; margin-top: 2px;
    }
    .step-badge.done-badge {
      background: rgba(30,138,76,.08); color: var(--green);
    }

    /* ── footer ── */
    .cd {
      font-size: 11px; color: var(--gray2);
      text-align: right; padding: 8px 16px 12px;
      border-top: 1px solid #f2f4f7;
      display: flex; align-items: center; justify-content: space-between;
    }
    .cd-next {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; color: var(--navy); font-weight: 500;
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Header -->
  <div class="ch">
    <div class="ch-title">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="6.5" stroke="#273736" stroke-width="1.5"/>
        <path d="M8 5v3.5l2 2" stroke="#273736" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      תהליך ליווי עסקי
    </div>
  </div>

  <!-- Progress bar -->
  <div class="cpb">
    <div class="pbl-top">
      <div class="pbl-title">תהליך ליווי עסקי</div>
      <div class="pbl-target">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
          <circle cx="7" cy="7" r="5.5" stroke="#a0a8b8" stroke-width="1.3"/>
          <path d="M7 4.5V7l1.5 1.5" stroke="#a0a8b8" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        16 שלבים
      </div>
    </div>
    <div class="pbt-wrap">
      <!-- bubble positioned at 18% (שלב 3 מתוך 16) -->
      <div class="pbt-bubble" style="left: 18%; transform: translateX(-50%);">שלב 3</div>
      <div class="pbt">
        <div class="pbf" style="width:18%;"></div>
      </div>
    </div>
    <div class="pbl-scale">
      <span>16</span>
      <span>0</span>
    </div>
    <div class="pbl-note"><span>שלב נוכחי</span> · בנייה</div>
  </div>

  <div class="divider"></div>

  <!-- Steps list -->
  <div class="steps-list">

    <!-- שלב 1 — הושלם -->
    <div class="step-row">
      <div class="step-icon-wrap">
        <div class="step-circle done"></div>
      </div>
      <div class="step-body">
        <div class="step-name">היכרות ראשונית</div>
        <div class="step-meeting">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
            <rect x="1" y="2" width="10" height="9" rx="1.5" stroke="#818181" stroke-width="1.2"/>
            <path d="M4 1v2M8 1v2" stroke="#818181" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M1 5h10" stroke="#818181" stroke-width="1.2"/>
          </svg>
          פגישה הושלמה · 12.01.2026
        </div>
      </div>
      <div class="step-badge done-badge">הושלם</div>
    </div>

    <!-- שלב 2 — הושלם -->
    <div class="step-row">
      <div class="step-icon-wrap">
        <div class="step-circle done"></div>
      </div>
      <div class="step-body">
        <div class="step-name">אבחון עסקי</div>
        <div class="step-meeting">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
            <rect x="1" y="2" width="10" height="9" rx="1.5" stroke="#818181" stroke-width="1.2"/>
            <path d="M4 1v2M8 1v2" stroke="#818181" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M1 5h10" stroke="#818181" stroke-width="1.2"/>
          </svg>
          פגישה הושלמה · 20.01.2026
        </div>
      </div>
      <div class="step-badge done-badge">הושלם</div>
    </div>

    <!-- שלב 3 — פעיל -->
    <div class="step-row">
      <div class="step-icon-wrap">
        <div class="step-circle active">3</div>
      </div>
      <div class="step-body">
        <div class="step-name active">בניית תוכנית עבודה</div>
        <div class="step-meeting">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
            <rect x="1" y="2" width="10" height="9" rx="1.5" stroke="#39ABE2" stroke-width="1.2"/>
            <path d="M4 1v2M8 1v2" stroke="#39ABE2" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M1 5h10" stroke="#39ABE2" stroke-width="1.2"/>
          </svg>
          <span style="color:var(--cyan);">פגישה קרובה · 28.01.2026</span>
        </div>
      </div>
      <div class="step-badge">בתהליך</div>
    </div>

    <!-- שלב 4 — עתידי -->
    <div class="step-row">
      <div class="step-icon-wrap">
        <div class="step-circle pending">4</div>
      </div>
      <div class="step-body">
        <div class="step-name pending">יישום ומעקב</div>
        <div class="step-meeting">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
            <rect x="1" y="2" width="10" height="9" rx="1.5" stroke="#a0a8b8" stroke-width="1.2"/>
            <path d="M4 1v2M8 1v2" stroke="#a0a8b8" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M1 5h10" stroke="#a0a8b8" stroke-width="1.2"/>
          </svg>
          טרם נקבע מועד
        </div>
      </div>
    </div>

    <!-- שלב 5 — עתידי -->
    <div class="step-row">
      <div class="step-icon-wrap">
        <div class="step-circle pending">5</div>
      </div>
      <div class="step-body">
        <div class="step-name pending">סיכום ומסקנות</div>
        <div class="step-meeting">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
            <rect x="1" y="2" width="10" height="9" rx="1.5" stroke="#a0a8b8" stroke-width="1.2"/>
            <path d="M4 1v2M8 1v2" stroke="#a0a8b8" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M1 5h10" stroke="#a0a8b8" stroke-width="1.2"/>
          </svg>
          טרם נקבע מועד
        </div>
      </div>
    </div>

  </div>


</div>


<style id="hk-embed-style">
html.embed,html.embed body{background:transparent !important;height:auto !important;min-height:0 !important;width:auto !important}
html.embed{--red:#d16a60 !important;--warm:#e2a196 !important}
html.embed body{display:block !important;padding:0 !important;margin:0 !important;align-items:flex-start !important;justify-content:flex-start !important;gap:0 !important}
html.embed .section-label,html.embed .screen-head,html.embed .nav{display:none !important}
html.embed .section-group:has(.wcard),html.embed .wcard{display:none !important}
html.embed .section-group{gap:0 !important;padding:0 !important;width:100% !important}
html.embed .widget{margin:0 auto !important;width:100% !important;max-width:640px !important;box-shadow:0 1px 2px rgba(12,64,104,.05),0 10px 28px rgba(12,64,104,.05) !important;border:1px solid #eef2f6 !important}
</style>



<script id="hk-embed-js">
(function(){
  if(location.hash!=="#embed"&&self===top)return;
  document.documentElement.classList.add("embed");
  var file=(location.pathname.split("/").pop()||"");
  function report(){
    var el=document.querySelector(".widget")||document.body;
    var h=Math.ceil(el.getBoundingClientRect().height)+10;
    if(h>80)parent.postMessage({hkEmbed:1,src:file,h:h},"*");
  }
  addEventListener("load",function(){report();[120,400,900,1600].forEach(function(t){setTimeout(report,t);});});
  addEventListener("resize",report);
  if(window.ResizeObserver){try{new ResizeObserver(report).observe(document.documentElement);}catch(e){}}
})();
</script>

</body>
</html>
