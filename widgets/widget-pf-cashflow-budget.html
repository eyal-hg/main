<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
 *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
 :root{--navy:#0C4068;--cyan:#39ABE2;--green:#1e8a4c;--red:#d93025;--yellow:#f0b429;--amber:#e8743a;--gray:#818181;--gray2:#a0a8b8;--line:#e6ecf2;--shadow:0px 1px 50px rgba(0,0,0,0.08)}
 body{font-family:'Rubik',sans-serif;background:#e8eef4;direction:rtl;color:#273736;display:flex;justify-content:center;padding:28px}
 .widget{background:#fff;border-radius:14px;box-shadow:var(--shadow);width:640px;max-width:100%;overflow:hidden}
 .w-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;gap:10px}
 .w-hl{display:flex;align-items:center;gap:11px}
 .w-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#0C4068,#39ABE2);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
 .w-title{font-size:16px;font-weight:600;color:var(--navy)}
 .w-sub{font-size:11px;color:var(--gray2);margin-top:1px}
 .strip{display:flex;margin:4px 20px 6px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
 .si{flex:1;padding:10px 14px}
 .si+.si{border-right:1px solid var(--line)}
 .si .l{font-size:10.5px;color:var(--gray2)}
 .si .v{font-size:17px;font-weight:700;color:var(--navy);direction:ltr;text-align:right;margin-top:2px}
 .si .v.red{color:var(--red)} .si .v.green{color:var(--green)}
 /* category groups */
 .grp{padding:2px 20px}
 .grp-t{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--navy);margin:10px 0 2px}
 .grp-t .gl{font-size:10px;font-weight:500;color:var(--gray2)}
 .crow{display:grid;grid-template-columns:96px 1fr 46px 132px 104px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #f5f7fa}
 .crow:first-of-type{border-top:none}
 .cn{font-size:12.5px;font-weight:500;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .track{position:relative;height:9px;background:#eef3f7;border-radius:6px}
 .fill{position:absolute;inset-inline-start:0;top:0;height:100%;border-radius:6px}
 .fill.ok{background:var(--green)} .fill.near{background:var(--yellow)} .fill.over{background:var(--red)} .fill.inc{background:var(--cyan)}
 .mk{position:absolute;top:-3px;width:2px;height:15px;background:var(--navy);border-radius:2px;inset-inline-start:84.7%}
 .pct{font-size:10.5px;font-weight:700;direction:ltr;text-align:center;border-radius:999px;padding:2px 0}
 .pct.ok{color:var(--green);background:rgba(30,138,76,.1)} .pct.near{color:#b8860b;background:rgba(240,180,41,.14)} .pct.over{color:var(--red);background:rgba(217,48,37,.1)} .pct.inc{color:#1668a0;background:rgba(57,171,226,.13)}
 .amt{font-size:11px;color:var(--gray2);text-align:start;white-space:nowrap}
 .amt b{color:var(--navy);font-weight:600;font-size:11.5px}
 .eff{font-size:10.5px;font-weight:700;direction:ltr;text-align:center;border-radius:999px;padding:3px 0;white-space:nowrap}
 .eff.plus{color:var(--green);background:rgba(30,138,76,.1)}
 .eff.minus{color:var(--red);background:rgba(217,48,37,.1)}
 .eff.zero{color:var(--gray2);background:#f1f4f7}
 /* summary equation */
 .sum{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 20px 0;background:#f4f9f6;border:1px solid #d9ecdf;border-radius:11px;padding:11px 16px;flex-wrap:wrap}
 .sum .st{font-size:12px;color:var(--navy);font-weight:500}
 .sum .st b{font-weight:700}
 .sum .sv{font-size:16px;font-weight:700;color:var(--green);direction:ltr}
 .w-foot{display:flex;align-items:center;justify-content:space-between;padding:11px 20px 14px;border-top:1px solid #f0f4f7;margin-top:12px}
 .w-update{font-size:10px;color:var(--gray2)}
 .w-link{font-size:11px;font-weight:500;color:var(--cyan);cursor:pointer}
</style></head>
<body>
<div class="widget">
 <div class="w-head">
   <div class="w-hl">
     <div class="w-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M3 15l5-5 4 3 6-7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 20h18" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".6"/></svg></div>
     <div><div class="w-title">בקרת תזרים מול תקציב</div><div class="w-sub">התקציב לפי קטגוריות — ביצוע וצפי, וההשפעה על התזרים · יולי · כל החברות שלי</div></div>
   </div>
 </div>
 <div class="strip">
   <div class="si"><div class="l">תקציב תזרים חודשי</div><div class="v">2,400,000 ₪</div></div>
   <div class="si"><div class="l">ביצוע מתחילת החודש</div><div class="v">1,932,400 ₪</div></div>
   <div class="si"><div class="l">פער מול תקציב</div><div class="v red">-289,161 ₪</div></div>
   <div class="si"><div class="l">צפי סוף חודש</div><div class="v green">+118,000 ₪</div></div>
 </div>
 <div id="groups"></div>
 <div class="sum" id="sum"></div>
 <div class="w-foot"><div class="w-update">מתעדכן אוטומטית מ-Bizibox · נכון ל-2.7.2026</div><div class="w-link">פתיחת תזרים מלא ←</div></div>
</div>
<script>
// תקציב לפי קטגוריות: budget=תקציב חודשי, fc=צפי לסוף החודש. eff = ההשפעה על התזרים מול התקציב
// (הכנסה מעל תקציב = פלוס לתזרים; הוצאה מעל תקציב = מינוס)
const INCOME=[{n:'הכנסות ממכירות', budget:2400000, fc:2496000}];
const EXPENSE=[
  {n:'שכר עבודה',   budget:640000, fc:676000},
  {n:'ספקים',       budget:820000, fc:838000},
  {n:'שכירות',      budget:210000, fc:210000},
  {n:'מסים ואגרות', budget:180000, fc:134000},
  {n:'שיווק',       budget:120000, fc:82000},
  {n:'אחזקה',       budget:90000,  fc:98000},
];
const fk=v=>(v<0?'-':'+')+Math.round(Math.abs(v)/1000)+'k ₪';
const fm=v=>Math.round(v/1000)+'k';
const CAP=118, MK=100/CAP*100; // סוף הסקאלה 118% — כדי שחריגה תיראה; הקו השחור = 100% תקציב
function row(c,isInc){
  const p=Math.round(c.fc/c.budget*100);
  const eff=isInc ? (c.fc-c.budget) : (c.budget-c.fc);   // effect on cashflow
  const st=isInc?'inc':(p>100?'over':(p>=95?'near':'ok'));
  const w=Math.min(p,CAP)/CAP*100;
  return `<div class="crow">
    <span class="cn">${c.n}</span>
    <div class="track"><div class="fill ${st}" style="width:${w}%"></div><div class="mk"></div></div>
    <span class="pct ${st}">${p}%</span>
    <span class="amt">צפי <b>${fm(c.fc)}</b> / תקציב ${fm(c.budget)}</span>
    <span class="eff ${eff>0?'plus':(eff<0?'minus':'zero')}">${eff===0?'בדיוק בתקציב':fk(eff)+' לתזרים'}</span>
  </div>`;
}
const incEff=INCOME.reduce((s,c)=>s+(c.fc-c.budget),0);
const expEff=EXPENSE.reduce((s,c)=>s+(c.budget-c.fc),0);
document.getElementById('groups').innerHTML=
  `<div class="grp"><div class="grp-t">הכנסות <span class="gl">צפי מול תקציב</span></div>${INCOME.map(c=>row(c,true)).join('')}</div>`+
  `<div class="grp"><div class="grp-t">הוצאות <span class="gl">לפי קטגוריות התקציב · הקו השחור = 100% תקציב</span></div>${EXPENSE.map(c=>row(c,false)).join('')}</div>`;
document.getElementById('sum').innerHTML=
  `<span class="st">צפי סוף חודש: הכנסות <b>${fk(incEff)}</b> · הוצאות <b>${fk(expEff)}</b> מול התקציב</span>
   <span class="sv">= +118,000 ₪ לתזרים</span>`;
</script>
<style id="hk-embed-style">
html.embed,html.embed body{background:transparent !important;height:auto !important;min-height:0 !important;width:auto !important}
html.embed body{display:block !important;padding:0 !important;margin:0 !important}
html.embed .widget{margin:0 !important;width:100% !important;max-width:none !important;box-shadow:0 1px 2px rgba(12,64,104,.05),0 10px 28px rgba(12,64,104,.05) !important;border:1px solid #eef2f6 !important}
</style>
<script id="hk-embed-js">
(function(){
  if(location.hash!=="#embed"&&self===top)return;
  document.documentElement.classList.add("embed");
  var file=(location.pathname.split("/").pop()||"");
  function report(){var el=document.querySelector(".widget")||document.body;var h=Math.ceil(el.getBoundingClientRect().height)+10;if(h>60)parent.postMessage({hkEmbed:1,src:file,h:h},"*");}
  addEventListener("load",function(){report();[120,400,900,1600].forEach(function(t){setTimeout(report,t);});});
  addEventListener("resize",report);
  if(window.ResizeObserver){try{new ResizeObserver(report).observe(document.documentElement);}catch(e){}}
})();
</script>
</body></html>
