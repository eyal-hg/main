<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
 *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
 :root{--navy:#0C4068;--cyan:#39ABE2;--green:#1e8a4c;--red:#d93025;--yellow:#f0b429;--gray:#818181;--gray2:#a0a8b8;--line:#e6ecf2;--shadow:0px 1px 50px rgba(0,0,0,0.08)}
 body{font-family:'Rubik',sans-serif;background:#e8eef4;direction:rtl;display:flex;justify-content:center;padding:28px}
 .widget{background:#fff7f5;border:1px solid #f6d9d2;border-radius:14px;box-shadow:var(--shadow);width:340px;max-width:100%;overflow:hidden}
 .kpi{padding:16px 18px 15px;display:flex;flex-direction:column;gap:11px;min-height:160px}
 .kpi-top{display:flex;align-items:center;gap:9px}
 .kpi-ic{width:30px;height:30px;border-radius:8px;background:rgba(217,48,37,.12);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
 .kpi-l{font-size:12.5px;color:#c0392b;font-weight:500}
 .kpi-n{font-size:34px;font-weight:700;color:#c0392b;line-height:1}
 .kpi-n small{font-size:14px;font-weight:500;color:#c98a82}
 .risk-bar{display:flex;gap:4px}
 .risk-bar span{height:7px;border-radius:3px;flex:1;background:#f0d3ce}
 .risk-bar span.on{background:#d93025}
 .kpi-foot{margin-top:auto;font-size:11.5px;color:#b0574d;display:flex;align-items:center;gap:6px}
</style></head>
<body>
<div class="widget"><div class="kpi">
 <div class="kpi-top">
   <div class="kpi-ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" stroke="#d93025" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9v4M12 17h.01" stroke="#d93025" stroke-width="1.8" stroke-linecap="round"/></svg></div>
   <div class="kpi-l">חברות בסיכון תזרימי</div>
 </div>
 <div class="kpi-n">2 <small>מתוך 5</small></div>
 <div class="risk-bar"><span class="on"></span><span class="on"></span><span></span><span></span><span></span></div>
 <div class="kpi-foot"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 8v5M12 16h.01" stroke="#b0574d" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="#b0574d" stroke-width="1.6"/></svg>צפויות לחרוג מהתקציב ב-14 הימים הקרובים</div>
</div></div>
<style id="hk-embed-style">
html.embed,html.embed body{background:transparent !important;height:auto !important;min-height:0 !important;width:auto !important}
html.embed body{display:block !important;padding:0 !important;margin:0 !important}
html.embed .widget{margin:0 !important;width:100% !important;max-width:none !important;box-shadow:0 1px 2px rgba(12,64,104,.05),0 10px 28px rgba(12,64,104,.05) !important}
</style>
<script id="hk-embed-js">
(function(){
  if(location.hash!=="#embed"&&self===top)return;
  document.documentElement.classList.add("embed");
  var file=(location.pathname.split("/").pop()||"");
  function report(){var el=document.querySelector(".widget")||document.body;var h=Math.ceil(el.getBoundingClientRect().height)+10;if(h>60)parent.postMessage({hkEmbed:1,src:file,h:h},"*");}
  addEventListener("load",function(){report();[120,400,900,1600].forEach(function(t){setTimeout(report,t);});});
  addEventListener("resize",report);
  if(window.ResizeObserver){try{new ResizeObserver(report).observe(document.documentElement);}catch(e){}}
})();
</script>
</body></html>
