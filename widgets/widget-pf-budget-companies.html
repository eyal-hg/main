<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
 *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
 :root{--navy:#0C4068;--cyan:#39ABE2;--green:#1e8a4c;--red:#d93025;--yellow:#f0b429;--amber:#e8743a;--gray:#818181;--gray2:#a0a8b8;--line:#e6ecf2;--shadow:0px 1px 50px rgba(0,0,0,0.08)}
 body{font-family:'Rubik',sans-serif;background:#e8eef4;direction:rtl;color:#273736;display:flex;justify-content:center;padding:28px}
 .widget{background:#fff;border-radius:14px;box-shadow:var(--shadow);width:560px;max-width:100%;overflow:hidden}
 .w-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 6px;gap:10px}
 .w-hl{display:flex;align-items:center;gap:11px}
 .w-icon{width:36px;height:36px;border-radius:10px;background:rgba(57,171,226,.12);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
 .w-title{font-size:16px;font-weight:600;color:var(--navy)}
 .w-sub{font-size:11px;color:var(--gray2);margin-top:1px}
 .legend{display:flex;gap:11px}
 .lg{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--gray)}
 .lg .d{width:8px;height:8px;border-radius:50%}
 .list{padding:8px 20px 4px}
 .row{padding:11px 0;border-top:1px solid #f3f5f8}
 .row:first-child{border-top:none}
 .rt{display:flex;align-items:center;gap:9px;margin-bottom:9px}
 .rt .nm{font-size:13.5px;font-weight:600;color:var(--navy)}
 .rt .amt{font-size:11.5px;color:var(--gray2);direction:ltr;margin-inline-start:auto}
 .rt .amt b{color:var(--navy);font-weight:600}
 .track{position:relative;height:9px;background:#eef3f7;border-radius:6px;overflow:visible}
 .fill{position:absolute;inset-inline-start:0;top:0;height:100%;border-radius:6px}
 .fill.ok{background:var(--green)} .fill.near{background:var(--yellow)} .fill.over{background:var(--red)}
 .mark{position:absolute;top:-3px;width:2px;height:15px;background:var(--navy);border-radius:2px}
 .pct{font-size:10.5px;font-weight:700;direction:ltr;border-radius:999px;padding:2px 9px;flex:0 0 auto}
 .pct.ok{color:var(--green);background:rgba(30,138,76,.1)} .pct.near{color:#b8860b;background:rgba(240,180,41,.14)} .pct.over{color:var(--red);background:rgba(217,48,37,.1)}
 .rl{display:flex;align-items:center;gap:10px}
 .rl .track{flex:1}
 .w-foot{display:flex;align-items:center;justify-content:space-between;padding:11px 20px 14px;border-top:1px solid #f0f4f7}
 .w-update{font-size:10px;color:var(--gray2)} .w-link{font-size:11px;font-weight:500;color:var(--cyan);cursor:pointer}
</style></head>
<body>
<div class="widget">
 <div class="w-head">
   <div class="w-hl"><div class="w-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="#39ABE2" stroke-width="1.8" stroke-linecap="round"/></svg></div>
   <div><div class="w-title">עמידה בתקציב לפי חברה</div><div class="w-sub">ביצוע הוצאות מול התקציב החודשי · הקו = 100% תקציב</div></div></div>
   <div class="legend"><div class="lg"><span class="d" style="background:#1e8a4c"></span>בתקציב</div><div class="lg"><span class="d" style="background:#f0b429"></span>קרוב</div><div class="lg"><span class="d" style="background:#d93025"></span>חריגה</div></div>
 </div>
 <div class="list" id="list"></div>
 <div class="w-foot"><div class="w-update">בקרת תזרים מבוססת תקציב · מתעדכן יומית</div><div class="w-link">ניהול תקציבים ←</div></div>
</div>
<script>
const C=[
 {n:'אנרגי אינטרנשיונל',budget:420000,actual:345000},
 {n:'מטעי גבעון',        budget:265000,actual:301000},
 {n:'אנרגי גולני',       budget:510000,actual:489000},
 {n:'משה עובד',          budget:180000,actual:153000},
 {n:'רימון יצחק',        budget:340000,actual:214000},
];
const f=v=>v.toLocaleString('en-US');
document.getElementById('list').innerHTML=C.map(c=>{
 const p=Math.round(c.actual/c.budget*100);
 const st=p>100?'over':(p>=90?'near':'ok');
 const w=Math.min(p,118);          // cap the visual so overflow is visible but bounded
 return `<div class="row">
   <div class="rt"><span class="nm">${c.n}</span><span class="pct ${st}">${p}%</span><span class="amt"><b>${f(c.actual)}</b> / ${f(c.budget)} ₪</span></div>
   <div class="rl">
     <div class="track"><div class="fill ${st}" style="width:${w*0.847}%"></div><div class="mark" style="inset-inline-start:84.7%"></div></div>
   </div>
 </div>`;
}).join('');
</script>
<style id="hk-embed-style">
html.embed,html.embed body{background:transparent !important;height:auto !important;min-height:0 !important;width:auto !important}
html.embed body{display:block !important;padding:0 !important;margin:0 !important}
html.embed .widget{margin:0 !important;width:100% !important;max-width:none !important;box-shadow:0 1px 2px rgba(12,64,104,.05),0 10px 28px rgba(12,64,104,.05) !important;border:1px solid #eef2f6 !important}
</style>
<script id="hk-embed-js">
(function(){
  if(location.hash!=="#embed"&&self===top)return;
  document.documentElement.classList.add("embed");
  var file=(location.pathname.split("/").pop()||"");
  function report(){var el=document.querySelector(".widget")||document.body;var h=Math.ceil(el.getBoundingClientRect().height)+10;if(h>60)parent.postMessage({hkEmbed:1,src:file,h:h},"*");}
  addEventListener("load",function(){report();[120,400,900,1600].forEach(function(t){setTimeout(report,t);});});
  addEventListener("resize",report);
  if(window.ResizeObserver){try{new ResizeObserver(report).observe(document.documentElement);}catch(e){}}
})();
</script>
</body></html>
