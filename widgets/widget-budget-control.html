<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<title>בקרת תקציב</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Rubik',sans-serif;background:#e8eef4;padding:32px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}

:root{
  --navy:#0C4068;--cyan:#39ABE2;--green:#1e8a4c;--red:#d93025;--yellow:#f0b429;
  --gray:#818181;--gray2:#a0a8b8;--shadow:0px 1px 50px rgba(0,0,0,0.08)
}

/* ── PICKER ── */
.wcard{width:200px;background:#fff;border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.wcard-text{padding:12px 12px 8px}
.wcard-text h4{font-size:13px;font-weight:600;color:var(--navy)}
.wcard-text p{font-size:11px;color:var(--gray);margin-top:3px}
.wcard-preview{background:#f7fafd;height:96px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.mp-row{display:flex;align-items:center;justify-content:space-between;font-size:10px}
.mp-name{color:var(--navy);font-weight:500}
.mp-pill{padding:2px 6px;border-radius:10px;font-weight:600;font-size:9px}
.wcard-foot{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid #f0f4f8}
.wcard-foot span{font-size:10px;color:var(--gray2)}
.add-btn{font-size:11px;font-family:inherit;padding:3px 10px;border-radius:20px;border:1.5px solid var(--cyan);color:var(--cyan);background:none;cursor:pointer;font-weight:500}
.add-btn.on{background:var(--cyan);color:#fff}

/* ── WIDGET ── */
.widget{width:560px;background:#fff;border-radius:12px;box-shadow:var(--shadow);overflow:hidden}

/* header */
.wh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 14px}
.wh h2{font-size:14px;font-weight:700;color:var(--navy)}
.month-sel{display:flex;align-items:center;gap:5px;background:#f0f4f8;border-radius:8px;padding:5px 10px}
.month-sel select{font-family:inherit;font-size:12px;font-weight:500;color:var(--navy);border:none;background:none;outline:none;cursor:pointer}

/* summary strip */
.strip{display:flex;border-top:1px solid #f0f4f8;border-bottom:1px solid #f0f4f8}
.s-cell{flex:1;padding:10px 0;text-align:center}
.s-cell:not(:last-child){border-left:1px solid #f0f4f8}
.s-val{font-size:17px;font-weight:700}
.s-val.red{color:var(--red)}
.s-val.amber{color:var(--yellow)}
.s-lbl{font-size:10px;color:var(--gray);margin-top:2px}

/* tabs */
.tabs{display:flex;align-items:center;gap:6px;padding:12px 20px 8px}
.tab{font-family:inherit;font-size:11px;font-weight:500;padding:4px 12px;border-radius:20px;border:1.5px solid #dde4ee;background:none;color:var(--gray);cursor:pointer}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* table */
.thead{display:grid;grid-template-columns:1fr 68px 68px 68px 95px 28px;padding:0 20px 6px;align-items:end}
.thead span{font-size:10px;color:var(--gray2);font-weight:500;text-align:center}
.thead span:first-child{text-align:right}
.th-cf{display:flex;align-items:center;justify-content:center;gap:3px}
.th-cf::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--cyan);display:inline-block}

.row{display:grid;grid-template-columns:1fr 68px 68px 68px 95px 28px;padding:8px 20px;align-items:center;border-top:1px solid #f5f8fb;transition:background .1s}
.row:hover{background:#f9fbfd}
.row.flag{background:#fffbf0}
.row.surplus-row{background:#f0faf5}

.cat{display:flex;align-items:center;gap:8px}
.cat-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.cat-name{font-size:12px;font-weight:600;color:var(--navy)}
.cat-sub{font-size:10px;color:var(--gray);margin-top:1px}

.num{font-size:12px;font-weight:500;color:#273736;text-align:center}
.num.dim{color:#c0c8d8}
.num.low{color:var(--red)}   /* income below budget */
.num.over{color:var(--yellow)}  /* expense above budget */

/* "חסר" chip */
.missing{text-align:center}
.miss-chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.miss-chip.has{background:#fff3cd;color:#856404}
.miss-chip.surplus{background:#e8f5ee;color:var(--green)}
.miss-chip.ok{font-size:10px;font-weight:400;color:#b0bac8}

.done-btn{width:26px;height:26px;border-radius:7px;border:1.5px solid #e0e6ee;background:none;cursor:pointer;color:#b0bac8;display:flex;align-items:center;justify-content:center;transition:all .12s}
.done-btn:hover{border-color:var(--cyan);color:var(--cyan)}

.empty{padding:28px;text-align:center;color:var(--gray);font-size:12px}

.wfoot{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-top:1px solid #f0f4f8;margin-top:2px}
.wfoot span{font-size:10px;color:var(--gray2)}
</style>
</head>
<body>

<!-- PICKER -->
<div class="wcard">
  <div class="wcard-text">
    <h4>בקרת תקציב</h4>
    <p>פעולות חסרות בתזרים</p>
  </div>
  <div class="wcard-preview">
    <div class="mp-row"><span class="mp-name">הוצאות פרטיות</span><span class="mp-pill" style="background:#fff3cd;color:#856404">₪800 חסר</span></div>
    <div class="mp-row"><span class="mp-name">חובות ספקים</span><span class="mp-pill" style="background:#fff3cd;color:#856404">₪1,000 חסר</span></div>
    <div class="mp-row"><span class="mp-name">מוצרי אשראי</span><span class="mp-pill" style="background:#fde8e8;color:var(--red)">לא מתוקצב</span></div>
    <div class="mp-row"><span class="mp-name">הכנסות ממכירות</span><span class="mp-pill" style="background:#fde8e8;color:var(--red)">₪42K מתחת ליעד</span></div>
  </div>
  <div class="wcard-foot">
    <span>בקרה</span>
    <button class="add-btn" onclick="this.classList.toggle('on');this.textContent=this.classList.contains('on')?'− 1 +':'+ הוספה'">+ הוספה</button>
  </div>
</div>

<!-- FULL WIDGET -->
<div class="widget">

  <div class="wh">
    <h2>בקרת תקציב</h2>
    <div class="month-sel">
      <svg width="13" height="13" fill="none" stroke="#818181" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <select onchange="render()">
        <option>ינואר 2026</option><option>פברואר 2026</option><option>מרץ 2026</option>
        <option>אפריל 2026</option><option>מאי 2026</option><option selected>יוני 2026</option>
        <option>יולי 2026</option><option>אוגוסט 2026</option><option>ספטמבר 2026</option>
        <option>אוקטובר 2026</option><option>נובמבר 2026</option><option>דצמבר 2026</option>
      </select>
    </div>
  </div>

  <div class="strip" id="strip"></div>

  <div class="thead">
    <span>קטגוריה</span>
    <span>תקציב</span>
    <span>בפועל</span>
    <span class="th-cf">תזרים</span>
    <span>חסר / עודף</span>
    <span></span>
  </div>

  <div id="body"></div>

  <div class="wfoot">
    <span>עדכון אחרון: 30.06.2026</span>
  </div>

</div>

<script>
const DATA = [
  // income — below budget is the issue
  { id:1, type:'income',  icon:'💰', bg:'#e8f5ee', name:'הכנסות ממכירות',             budget:50000, actual:7500,  cf:6500  },
  { id:2, type:'income',  icon:'💳', bg:'#e8f4fb', name:'הכנסות סליקה',               budget:30000, actual:6172,  cf:8000  },
  { id:3, type:'income',  icon:'👤', bg:'#fef8e7', name:'משיכות והזרמות בעלים',       budget:45000, actual:0,     cf:5000  },
  { id:5, type:'expense', icon:'🏠', bg:'#fde8e8', name:'הוצאות פרטיות',              budget:5000,  actual:6200,  cf:0     },
  { id:6, type:'expense', icon:'📦', bg:'#fef0e8', name:'חובות ספקים',                budget:2000,  actual:3000,  cf:0     },
  { id:7, type:'expense', icon:'🚗', bg:'#e8f4fb', name:'אחזקת רכב ונסיעות',         budget:7000,  actual:2526,  cf:2000  },
  { id:8, type:'expense', icon:'💻', bg:'#f0e8fb', name:'תוכנות ושירותים דיגיטליים', budget:4000,  actual:1380,  cf:1500  },
  { id:9, type:'expense', icon:'🏛️', bg:'#f7fafd', name:'תשלומי הלוואה',              budget:3000,  actual:2067,  cf:933   },
  { id:10,type:'expense', icon:'💳', bg:'#fde8e8', name:'מוצרי אשראי',                budget:0,     actual:1044,  cf:0     },
];

const done = new Set();
let tab = 'all';

const fmt = n => n > 0 ? '₪' + n.toLocaleString('he-IL') : '—';

// חסר בתזרים = actual - cf
const cfMissing = r => r.budget - r.actual - r.cf;

// חריגת תקציב: income below target OR expense above budget / unbudgeted
const hasBudgetIssue = r => {
  if (r.type === 'income') return r.actual < r.budget * 0.8;
  return r.actual > r.budget || (r.budget === 0 && r.actual > 0);
};

function setTab(t, el) {
  tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  render();
}

function render() {
  const rows = DATA.filter(r => {
    if (done.has(r.id)) return false;
    if (tab === 'cf')     return cfMissing(r) > 0;
    if (tab === 'budget') return hasBudgetIssue(r);
    return cfMissing(r) > 0 || hasBudgetIssue(r);
  });

  // strip
  const totalCfMissing = DATA.filter(r=>!done.has(r.id)).reduce((s,r)=>s+cfMissing(r),0);
  const incomeShort    = DATA.filter(r=>r.type==='income'&&!done.has(r.id)&&r.budget>0).reduce((s,r)=>s+Math.max(0,r.budget-r.actual),0);
  const expenseOver    = DATA.filter(r=>r.type==='expense'&&!done.has(r.id)).reduce((s,r)=>s+Math.max(0,r.actual-r.budget),0);
  document.getElementById('strip').innerHTML = `
    <div class="s-cell"><div class="s-val red">₪${incomeShort.toLocaleString('he-IL')}</div><div class="s-lbl">פער בהכנסות</div></div>
    <div class="s-cell"><div class="s-val amber">₪${expenseOver.toLocaleString('he-IL')}</div><div class="s-lbl">פער בהוצאות</div></div>`;

  if (!rows.length) {
    document.getElementById('body').innerHTML = `<div class="empty">✅ אין פערים לטיפול</div>`;
    return;
  }

  document.getElementById('body').innerHTML = rows.map(r => {
    const miss = cfMissing(r);
    const budgetIssue = hasBudgetIssue(r);

    // color actual: red if income far below budget, amber if expense over budget
    let actualCls = 'num';
    if (r.type === 'income' && r.actual < r.budget * 0.8) actualCls += ' low';
    if (r.type === 'expense' && r.actual > r.budget)     actualCls += ' over';

    const missingChip = miss > 0
      ? `<span class="miss-chip has">₪${miss.toLocaleString('he-IL')}</span>`
      : miss < 0
      ? `<span class="miss-chip surplus">+₪${Math.abs(miss).toLocaleString('he-IL')}</span>`
      : `<span class="miss-chip ok">—</span>`;

    const rowCls = miss > 0 ? ' flag' : miss < 0 ? ' surplus-row' : '';
    return `<div class="row${rowCls}" id="r${r.id}">
      <div class="cat">
        <div>
          <div class="cat-name">${r.name}</div>
          <div class="cat-sub">${r.type === 'income' ? 'הכנסה' : 'הוצאה'}</div>
        </div>
      </div>
      <div class="num${r.budget===0?' dim':''}">${fmt(r.budget)}</div>
      <div class="${actualCls}">${fmt(r.actual)}</div>
      <div class="num${r.cf===0&&r.actual>0?' dim':''}">${fmt(r.cf)}</div>
      <div class="missing">${missingChip}</div>
      <button class="done-btn" onclick="done.add(${r.id});render()" title="טופל">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>`;
  }).join('');
}

render();
</script>

<style id="hk-embed-style">
html.embed,html.embed body{background:transparent !important;height:auto !important;min-height:0 !important;width:auto !important}
html.embed{--red:#d16a60 !important;--warm:#e2a196 !important}
html.embed body{display:block !important;padding:0 !important;margin:0 !important;align-items:flex-start !important;justify-content:flex-start !important;gap:0 !important}
html.embed .section-label,html.embed .screen-head,html.embed .nav{display:none !important}
html.embed .section-group:has(.wcard),html.embed .wcard{display:none !important}
html.embed .section-group{gap:0 !important;padding:0 !important;width:100% !important}
html.embed .widget{margin:0 auto !important;width:100% !important;max-width:640px !important;box-shadow:0 1px 2px rgba(12,64,104,.05),0 10px 28px rgba(12,64,104,.05) !important;border:1px solid #eef2f6 !important}
</style>



<script id="hk-embed-js">
(function(){
  if(location.hash!=="#embed"&&self===top)return;
  document.documentElement.classList.add("embed");
  var file=(location.pathname.split("/").pop()||"");
  function report(){
    var el=document.querySelector(".widget")||document.body;
    var h=Math.ceil(el.getBoundingClientRect().height)+10;
    if(h>80)parent.postMessage({hkEmbed:1,src:file,h:h},"*");
  }
  addEventListener("load",function(){report();[120,400,900,1600].forEach(function(t){setTimeout(report,t);});});
  addEventListener("resize",report);
  if(window.ResizeObserver){try{new ResizeObserver(report).observe(document.documentElement);}catch(e){}}
})();
</script>

</body>
</html>
