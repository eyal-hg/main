<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
 *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
 :root{--navy:#0C4068;--cyan:#39ABE2;--green:#1e8a4c;--red:#d93025;--yellow:#f0b429;--gray:#818181;--gray2:#a0a8b8;--line:#e6ecf2;--shadow:0px 1px 50px rgba(0,0,0,0.08)}
 body{font-family:'Rubik',sans-serif;background:#e8eef4;direction:rtl;display:flex;justify-content:center;padding:28px}
 .widget{background:#fff;border-radius:14px;box-shadow:var(--shadow);width:340px;max-width:100%;overflow:hidden}
 .kpi{padding:16px 18px 15px;display:flex;flex-direction:column;gap:11px;min-height:160px}
 .kpi-top{display:flex;align-items:center;gap:9px}
 .kpi-ic{width:30px;height:30px;border-radius:8px;background:rgba(30,138,76,.12);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
 .kpi-l{font-size:12.5px;color:var(--gray);font-weight:500}
 .kpi-row{display:flex;align-items:center;gap:14px}
 .kpi-n{font-size:29px;font-weight:700;color:var(--navy);direction:ltr;line-height:1}
 .kpi-n small{font-size:15px;color:var(--gray2);font-weight:500}
 .kpi-tags{display:flex;flex-direction:column;gap:4px;font-size:11px}
 .kpi-tags b{font-weight:600}
 .tg{display:flex;align-items:center;gap:6px;color:var(--gray)}
 .tg .d{width:8px;height:8px;border-radius:50%}
 .kpi-foot{margin-top:auto;font-size:11px;color:var(--gray2)}
</style></head>
<body>
<div class="widget"><div class="kpi">
 <div class="kpi-top">
   <div class="kpi-ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 3v9l6 3" stroke="#1e8a4c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" stroke="#1e8a4c" stroke-width="1.8"/></svg></div>
   <div class="kpi-l">עמידה בתקציב — תיק לקוחות</div>
 </div>
 <div class="kpi-row">
   <svg width="72" height="72" viewBox="0 0 72 72">
     <circle cx="36" cy="36" r="30" fill="none" stroke="#eef3f7" stroke-width="9"/>
     <circle cx="36" cy="36" r="30" fill="none" stroke="#1e8a4c" stroke-width="9" stroke-linecap="round"
       stroke-dasharray="188.5" stroke-dashoffset="75.4" transform="rotate(-90 36 36)"/>
     <text x="36" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0C4068">60%</text>
   </svg>
   <div class="kpi-tags">
     <div class="tg"><span class="d" style="background:#1e8a4c"></span><b>3</b> בתקציב</div>
     <div class="tg"><span class="d" style="background:#f0b429"></span><b>1</b> קרוב לגבול</div>
     <div class="tg"><span class="d" style="background:#d93025"></span><b>1</b> בחריגה</div>
   </div>
 </div>
 <div class="kpi-foot">3 מתוך 5 חברות בתוך מסגרת התקציב</div>
</div></div>
<style id="hk-embed-style">
html.embed,html.embed body{background:transparent !important;height:auto !important;min-height:0 !important;width:auto !important}
html.embed body{display:block !important;padding:0 !important;margin:0 !important}
html.embed .widget{margin:0 !important;width:100% !important;max-width:none !important;box-shadow:0 1px 2px rgba(12,64,104,.05),0 10px 28px rgba(12,64,104,.05) !important;border:1px solid #eef2f6 !important}
</style>
<script id="hk-embed-js">
(function(){
  if(location.hash!=="#embed"&&self===top)return;
  document.documentElement.classList.add("embed");
  var file=(location.pathname.split("/").pop()||"");
  function report(){var el=document.querySelector(".widget")||document.body;var h=Math.ceil(el.getBoundingClientRect().height)+10;if(h>60)parent.postMessage({hkEmbed:1,src:file,h:h},"*");}
  addEventListener("load",function(){report();[120,400,900,1600].forEach(function(t){setTimeout(report,t);});});
  addEventListener("resize",report);
  if(window.ResizeObserver){try{new ResizeObserver(report).observe(document.documentElement);}catch(e){}}
})();
</script>
</body></html>
