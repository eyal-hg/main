<script id="src" type="text/markdown"># הג׳וב הלילי של התקשורת — אפיון למימוש

הג׳וב שממלא את מסך **תקשורת** (`docs/adv3/meetings.html`) — רשימה אחת של
ארבעה ערוצים: פגישה · שיחת טלפון · קבוצת וואטסאפ · עוזר AI, ולכל פריט
זירה עם אותם תוצרים: סיכום, משימות, זיכרון, ולפי הערוץ גם משוב, תמלול
או ההודעות עצמן.

בליבו הג׳וב עושה שני דברים — **סיכום** ו**עדכון זיכרון** — וכל השאר
נגזרות שלהם: המשימות והתובנות הן חלק מפלט הסיכום, ה-embeddings הם
אינדקס על הסיכומים, וההשלמות הן ריצה חוזרת על מה שנפל.

נקודת המוצא: לא כל התקשורת נוצרת בלילה. אירוע עם סוף מעובד בסופו;
הג׳וב הלילי סוגר את היום — ואת המספרים של הבוקר סוגר **ג׳וב הבוקר**
(רענון הבנקים), שמסתיים בכתיבת "תקציר הבוקר" (§2א).

---

## 1 · עקרונות שאינם ניתנים למשא ומתן

1. **אירוע עם סוף מעובד בסופו; יום מעובד בלילה.** פגישה ושיחה מסתיימות —
   העיבוד שלהן מיידי. לקבוצה ולעוזר אין סוף — היחידה שלהן היא יום, ואותו
   סוגר הג׳וב הלילי.
2. **בלי שיוך לחברה אין עיבוד.** שיחה שלא שויכה לא מתומללת ולא מסוכמת —
   ההקלטה נשמרת והשיחה ממתינה בתור הלא־מזוהות. השיוך (ידני של היועץ)
   הוא הטריגר, ואז העיבוד רץ מיד — לא מחכה ללילה.
3. **הזיכרון ניזון מסיכומים, לא מחומר גלם.** כל קטגוריית זיכרון
   (`MEM_CATS`) מקבלת את סיכום האינטראקציה + המסמך הנוכחי שלה, ומחזירה
   "אין עדכון" או מסמך מעודכן. המודל לא קורא תמלולים מלאים בלילה.
4. **דובר לא מזוהה לא נכנס לזיכרון אישי.** מספר זר בקבוצה מסוכם ברמת
   החברה בלבד, ומסומן: *"אינו מזוהה — מה שנאמר ממנו לא שויך לזיכרון
   אישי"*. אין ניחוש זהות.
5. **הג׳וב אידמפוטנטי.** ריצה חוזרת על אותו יום (אחרי כשל, או ידנית)
   מחליפה את התוצרים של אותו יום — לא מכפילה שורות, משימות או רשומות
   זיכרון.

---

## 2 · אחריות הג׳וב — מה רץ בלילה

רץ פר חברה, בחלון 02:00–03:00 (הפרוטוטיפ מציג `רץ ב-02:10`).

1. **מסכם את קבוצות הוואטסאפ שהיו פעילות באותו יום.**
   קבוצה בלי הודעות היום — אין שורה, אין "סיכום ריק". קבוצה עם הודעות
   מקבלת שורת `wa` אחת ליום עם: סיכום (מה עלה בקבוצה), תובנות, משימות
   מוצעות, שורות זיכרון, וההודעות עצמן. אם היו הודעות אך אין מה להוסיף
   לזיכרון — זה נאמר במפורש (*"לא נמצא מה להוסיף לזיכרון"*), כי שקט הוא
   מידע.
2. **מסכם את ערוץ הוואטסאפ של כל יוזר מול העוזר באותו יום — עיבוד
   פר יוזר, שורה אחת לחברה.**
   **בסקופ: ערוץ הוואטסאפ בלבד** — השיחה האחת הפתוחה תמיד של היוזר מול
   העוזר, שבה עוברות גם הודעות התפעול, התזכורות והתגובות שלו עליהן.
   זו תקשורת שקורית מחוץ למוצר, ואין ליועץ שום מקום אחר לראות אותה.
   הצ׳אט שבתוך האפליקציה (שאילתות על הדשבורד) הוא שימוש במוצר —
   לא נכנס למסך התקשורת ולא מסוכם בלילה.
   הסיכום רץ **לכל יוזר בנפרד**: הצ׳אט הוא שיחה אישית נמשכת, ההקשר של
   כל שאלה הוא השיחה שלו, והקטגוריות האישיות בזיכרון (`scope:'user'`)
   חייבות קלט משויך לאדם. אין ערבוב צ׳אטים של שני אנשים בקריאת מודל אחת.
   הסיכום מפריד בין מה **שהיוזר** העלה לבין מה **שהמערכת** דחפה
   (תזכורת, משימה) — סיגנל הוא מה שהוא שאל וענה, לא מה שנשלח אליו.
   ההצגה לעומת זאת היא **שורת `ai` אחת ליום־חברה** — אחרת חברה עם כמה
   יוזרים פעילים מציפה את הרשימה. בזירה, סקשן פר יוזר (כמו "מי כתב"
   בקבוצה): מה הוא שאל, מה זה מגלה, וההתכתבות עצמה. משימות ושורות
   זיכרון נושאות את היוזר שממנו נולדו.
3. **מריץ את מעבר הזיכרון** על כל הסיכומים החדשים של היום — כולל
   סיכומי פגישות ושיחות שנוצרו במהלך היום — קטגוריה־קטגוריה לפי
   הפרומפטים של `MEM_CATS`, בהפרדת scope (חברה / משתמש).
4. **משלים את מה שנפל.** שיחה ששויכה אך העיבוד שלה נכשל, פגישה שהוקלטה
   אך אין לה סיכום — הג׳וב מזהה ומריץ שוב. זו רשת הביטחון, לא המסלול
   הראשי.
5. **מעדכן את מוני התור.** ספירת הלא־מזוהות לרצועת "ממתין לשיוך"
   ולמסך היועץ (`UNID`), כולל התיישנות: שיחה לא משויכת מעל N ימים
   עולה בדוח התפעול היומי.
6. **מייצר Embeddings לכל הסיכומים של היום.** כל סיכום שנוצר —
   פגישה, שיחה, קבוצה, עוזר — נחתך ומוטמע (embedding) לחיפוש סמנטי.
   זה מה שמאפשר לשורת החיפוש של המסך לענות על "מתי דיברנו על המסגרת"
   גם כשהמילה המדויקת לא הופיעה, ולהכנה־לפגישה לשלוף "מה השתנה מאז"
   מכל הערוצים. מוטמעים סיכומים ותובנות — לא תמלולים גולמיים.
7. **מפרסם את שורות היום למסך.** כל התוצרים נכתבים בסטטוס
   **«סיכום נוצר»** — לערוצים האוטומטיים אין שלב אישור אנושי.

**מה לא רץ בלילה:** תמלול וסיכום פגישה (בסיום ההקלטה) · תמלול וסיכום
שיחה משויכת (מיידי עם השיוך) · המשוב על היועץ (נגזר מסיכום הפגישה,
בערוץ `meet` בלבד) · תקציר הבוקר (§2א).

### 2א · ג׳וב הבוקר — תקציר הבוקר

תקציר הבוקר **אינו** חלק מהג׳וב הלילי: הוא צריך את מספרי הבוקר, ולכן
הוא הצעד המסיים של **ג׳וב הבוקר** — זה שמריץ את רענון הבנקים. אין
תלות־תזמון בין שני הג׳ובים ("לרוץ אחרון ולקוות") — כל אחד מסיים את
מה ששלו:

- **לילה (02:00):** תקשורת ← סיכומים, זיכרון, embeddings.
- **בוקר (עם סיום רענון הבנקים, ~06:00):** מספרים טריים ← ואז הפסקה
  שמחברת אותם: **כל הזיכרון** של החברה (מסמכי `MEM_CATS`, שעודכנו
  בלילה) + המספרים שזה עתה נמשכו ← "תקציר הבוקר" שבדשבורד הלקוח
  (`docs/cli/dashboard.html`).

החותמת שבפרוטוטיפ היא החוזה: *"מהזיכרון והמספרים — לא מהמקורות
הגולמיים"*. הנרטיב מקשר לראיות (jump לווידג׳טים); אדום עמוק שמור
לסכנה הכספית עצמה בלבד; שפת הלקוח — white-label, בלי HK.
אם רענון הבנקים נכשל — התקציר נכתב מהזיכרון בלבד, עם מספרי אתמול
מסומנים כ*"נכון לאתמול"* — לא ממתין ולא נעלם.
במהלך היום התקציר מתרענן: אירוע שמעובד (סיכום פגישה שאושר) מפעיל
כתיבה מחדש עם *"עודכן HH:MM, אחרי …"*.

## 3 · צינור הריצה

```
02:00, פר חברה
──► [1] איסוף: הודעות הקבוצות של היום · שיחות היום עם העוזר
──► [2] סיכום פר קבוצה / פר משתמש (AI)
──► [3] חילוץ תוצרים: תובנות · משימות מוצעות · שורות זיכרון (AI)
──► [4] מעבר זיכרון על כל סיכומי היום, קטגוריה־קטגוריה (AI, MEM_CATS)
──► [5] השלמות: עיבודים שנכשלו במהלך היום (שיחות/פגישות)
──► [6] Embeddings לכל סיכומי היום                    (מודל הטמעה)
──► [7] פרסום: שורות communications + עדכון מונים   (קוד, טרנזקציה)

ג׳וב הבוקר (בסיום רענון הבנקים):
──► [B1] משיכת יתרות ותנועות מהבנקים
──► [B2] תקציר הבוקר: כל הזיכרון + המספרים ← פסקה    (AI, פר חברה)
```

- שלבים [2]–[4] הם קריאות מודל נפרדות עם קלט תחום — לא פרומפט אחד ענק.
  בערוץ העוזר: קריאה פר יוזר פעיל, והרכבת שורת החברה בקוד.
- שלב [7] דטרמיניסטי: כתיבה אטומית פר יום־חברה (מחיקת תוצרי אותו יום
  אם קיימים, כתיבה מחדש — עקרון 5).
- כשל בקבוצה אחת לא מפיל את השאר; הפריט נרשם ל-[5] של הלילה הבא
  ולדוח התפעול.

```sql
-- שורה אחת בכל הרשימה = communication אחד

  happened_on   DATE NOT NULL,            -- לערוצי יום: היום המסוכם
  happened_at   TIMESTAMPTZ,              -- לפגישה/שיחה: מועד האירוע
  source_id     BIGINT,                   -- fk לפי ערוץ: meeting / call / group / user

  meta          JSONB NOT NULL DEFAULT '{}',  -- משך, כיוון, מוני הודעות/כותבים

## 7 · מקרי קצה שחובה לכסות

1. **יום בלי פעילות בערוץ** — אין שורה. לא יוצרים "סיכום ריק" (2.1).
2. **הודעות אחרי חצות** — הודעה מ-00:30 שייכת ליום החדש; הג׳וב של
   הלילה הבא יתפוס אותה. אין "יום כפול".
3. **שיוך שיחה בזמן ריצת הג׳וב** — העיבוד המיידי של השיוך גובר;
   שלב ההשלמות מדלג על מה שכבר בעיבוד (נעילה על `call_id`).
4. **מספר זר שהפך מזוהה** — שיוך המספר במסך הטלפונים חל מרגע השיוך
   והלאה. אין עיבוד רטרואקטיבי של סיכומי עבר, אבל שורות "אינו מזוהה"
   ישנות נשארות נכונות לזמנן.
5. **אותו משתמש בשתי חברות (why='two')** — השיוך ידני בלבד; בבורר כל
   שורה היא «שם הלקוח — חברה». הג׳וב לא מנחש.
6. **ריצה כפולה / הרצה ידנית אחרי תיקון** — `UNIQUE(company_id, ran_for)`
   + כתיבה אטומית פר יום: התוצרים מוחלפים, משימות שכבר אושרו ידנית
   לא נמחקות (מפתח לפי `source_line_hash`).
7. **קבוצה שנוספה באמצע יום** — נכנסת לסריקה מהלילה הראשון שלה; אין
   עיבוד היסטוריה אחורה אלא בהרצה ידנית עם `date`.

<script>
/* =====================================================================
   מנוע העריכה. יחידת העריכה היא סעיף: בתצוגה הוא מרונדר, בעריכה הוא
   ה-Markdown הגולמי שלו — כך שהייצוא חוזר למקור בלי אובדן.
   ===================================================================== */
const KEY='hkNightlySpec.v1';
const SRC=document.getElementById('src').textContent;

/* ---------- פיצול לסעיפים לפי ## ---------- */
function split(md){
  const lines=md.split('\n'), secs=[]; let cur={t:'',lv:0,body:[]};
  let fence=false;
  for(const ln of lines){
    if(/^```/.test(ln)) fence=!fence;
    const m=!fence&&ln.match(/^(#{2,3})\s+(.*)$/);
    if(m){ if(cur.t||cur.body.length) secs.push(cur);
      cur={t:m[2].trim(),lv:m[1].length,body:[]}; }
    else cur.body.push(ln);
  }
  if(cur.t||cur.body.length) secs.push(cur);
  if(secs.length&&!secs[0].t){ secs[0].t='פתיח'; secs[0].lv=0; }
  return secs;
}

/* ---------- רנדור Markdown (התת־קבוצה שהמסמך משתמש בה) ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,(m,c)=>'<code>'+c+'</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
}
function render(md){
  const L=md.split('\n'), out=[]; let i=0;
  const flush=(tag,items)=>out.push('<'+tag+'>'+items.map(x=>'<li>'+inline(x)+'</li>').join('')+'</'+tag+'>');
  while(i<L.length){
    let ln=L[i];
    if(/^```/.test(ln)){                       /* בלוק קוד */
      const lang=ln.slice(3).trim(); i++; const buf=[];
      while(i<L.length&&!/^```/.test(L[i])) buf.push(L[i++]);
      i++; out.push('<pre><code data-lang="'+esc(lang)+'">'+esc(buf.join('\n'))+'</code></pre>');
      continue;
    }
    if(/^\|/.test(ln)){                        /* טבלה */
      const rows=[]; while(i<L.length&&/^\|/.test(L[i])) rows.push(L[i++]);
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=cells(rows[0]); const body=rows.slice(2).map(cells);
      out.push('<table><thead><tr>'+head.map(h=>'<th>'+inline(h)+'</th>').join('')+
        '</tr></thead><tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+
        '</tr>').join('')+'</tbody></table>');
      continue;
    }
    if(/^>\s?/.test(ln)){                      /* ציטוט */
      const buf=[]; while(i<L.length&&/^>\s?/.test(L[i])) buf.push(L[i++].replace(/^>\s?/,''));
      out.push('<blockquote>'+render(buf.join('\n'))+'</blockquote>'); continue;
    }
    if(/^\s*[-*]\s+/.test(ln)){                /* רשימה */
      const buf=[]; while(i<L.length&&/^\s*[-*]\s+/.test(L[i])){
        let it=L[i++].replace(/^\s*[-*]\s+/,'');
        while(i<L.length&&/^\s{2,}\S/.test(L[i])&&!/^\s*[-*]\s+/.test(L[i])) it+=' '+L[i++].trim();
        buf.push(it);
      } flush('ul',buf); continue;
    }
    if(/^\s*\d+\.\s+/.test(ln)){               /* רשימה ממוספרת */
      const buf=[]; while(i<L.length&&/^\s*\d+\.\s+/.test(L[i])){
        let it=L[i++].replace(/^\s*\d+\.\s+/,'');
        while(i<L.length&&/^\s{2,}\S/.test(L[i])&&!/^\s*\d+\.\s+/.test(L[i])) it+=' '+L[i++].trim();
        buf.push(it);
      } flush('ol',buf); continue;
    }
    if(/^---+\s*$/.test(ln)){ out.push('<hr>'); i++; continue; }
    if(/^#{1,4}\s+/.test(ln)){
      const m=ln.match(/^(#+)\s+(.*)$/); out.push('<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>');
      i++; continue;
    }
    if(!ln.trim()){ i++; continue; }
    const buf=[];                              /* פסקה */
    while(i<L.length&&L[i].trim()&&!/^(```|\||>|#{1,4}\s|---+\s*$|\s*[-*]\s|\s*\d+\.\s)/.test(L[i]))
      buf.push(L[i++]);
    out.push('<p>'+inline(buf.join(' '))+'</p>');
  }
  return out.join('');
}

/* ---------- מצב ---------- */
let ST = {secs:null, meta:{}};
try{ const raw=localStorage.getItem(KEY); if(raw) ST=JSON.parse(raw); }catch(e){}
const BASE=split(SRC);
if(!ST.secs||ST.secs.length!==BASE.length) ST.secs=BASE.map(s=>s.body.join('\n'));
if(!ST.meta) ST.meta={};

let dirty=false, tmr=null;
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(ST));
    mark('נשמר '+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}),true);
  }catch(e){ mark('השמירה נכשלה — ייצא לקובץ',false); }
  dirty=false;
}
function mark(t,ok){ const e=document.getElementById('saved');
  e.textContent=t; e.classList.toggle('on',!!ok); }
function touch(){ dirty=true; mark('שינויים לא שמורים…',false);
  clearTimeout(tmr); tmr=setTimeout(save,900); }

/* ---------- בנייה ---------- */
function build(){
  const host=document.getElementById('doc'), nav=document.getElementById('nav');
  host.innerHTML=''; nav.innerHTML='';
  BASE.forEach((s,ix)=>{
    const id='s'+ix, meta=ST.meta[id]||{};
    const el=document.createElement('section');
    el.className='sec'+(meta.st?' '+meta.st:'')+(meta.cm?' cmon':'');
    el.id=id;
    const numMatch=s.t.match(/^([\d]+[א]?)\s*·\s*(.*)$/);
    el.innerHTML=
      '<div class="sec-h">'+
        (numMatch?'<span class="num">'+esc(numMatch[1])+'</span>':'')+
        '<span class="ttl">'+esc(numMatch?numMatch[2]:s.t)+'</span>'+
        '<span class="st">'+
          '<button class="ok'+(meta.st==='ok'?' on':'')+'" onclick="setSt(\''+id+'\',\'ok\')" title="אושר">אושר</button>'+
          '<button class="talk'+(meta.st==='talk'?' on':'')+'" onclick="setSt(\''+id+'\',\'talk\')" title="דורש דיון">לדיון</button>'+
        '</span>'+
        '<span class="acts">'+
          '<button onclick="tgCm(\''+id+'\')">הערה</button>'+
          '<button class="edb" onclick="tgEd(\''+id+'\')">עריכה</button>'+
        '</span>'+
      '</div>'+
      '<div class="cm"><label>הערה לצוות הפיתוח</label>'+
        '<textarea oninput="setNote(\''+id+'\',this.value)" placeholder="מה צריך לשנות, ולמה">'+
        esc(meta.note||'')+'</textarea></div>'+
      '<div class="sec-b md">'+render(ST.secs[ix])+'</div>';
    host.appendChild(el);

    const a=document.createElement('a');
    a.href='#'+id; a.className=(s.lv===3?'sub':'');
    a.innerHTML='<i class="'+(meta.st||'')+'"></i><span>'+esc(s.t)+'</span>';
    nav.appendChild(a);
  });
  spy();
}

/* ---------- פעולות ---------- */

};

/* ייצוא: מרכיב את ה-Markdown מחדש, והערות שנכתבו נוספות בסוף */
window.exportMd=function(){
  let out=[];

    if(s.t&&s.lv>=2) out.push('#'.repeat(s.lv)+' '+s.t);
    out.push(ST.secs[ix]);
  });
  const notes=BASE.map((s,ix)=>{
    const m=ST.meta['s'+ix]||{};
    if(!m.note&&!m.st) return null;
    return '- **'+s.t+'** — '+(m.st==='ok'?'אושר':m.st==='talk'?'דורש דיון':'—')+
           (m.note?': '+m.note:'');
  }).filter(Boolean);
  if(notes.length) out.push('\n---\n\n## הערות מהסקירה\n\n'+notes.join('\n')+'\n');
  const blob=new Blob([out.join('\n')],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='NIGHTLY_COMM_SPEC.md';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
window.resetAll=function(){
  if(!confirmBox()) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  ST={secs:BASE.map(s=>s.body.join('\n')),meta:{}};
  build(); mark('שוחזר למקור',true);
};
/* אין confirm של הדפדפן — שאלה בתוך הדף */
function confirmBox(){
  const w=document.getElementById('cfm');
  w.style.display='flex';
  return false;
}
window.cfmDo=function(yes){
  document.getElementById('cfm').style.display='none';
  if(!yes) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  ST={secs:BASE.map(s=>s.body.join('\n')),meta:{}};
  build(); mark('שוחזר למקור',true);
};

/* ---------- «איפה אני» בניווט ---------- */
function spy(){
  const links=[...document.querySelectorAll('#nav a')];
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(!e.isIntersecting) return;
      const ix=+e.target.id.slice(1);
      links.forEach((a,i)=>a.classList.toggle('on',i===ix)); });
  },{rootMargin:'-80px 0px -70% 0px',threshold:0});
  document.querySelectorAll('.sec').forEach(s=>io.observe(s));
}

addEventListener('beforeunload',e=>{ if(dirty){ save(); } });
addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='s'){ e.preventDefault(); save(); }
  if(e.key==='Escape') document.getElementById('cfm').style.display='none';
});
build();
mark('נטען','');
</script>
