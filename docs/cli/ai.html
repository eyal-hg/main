<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אנרגי אינטרנשיונל · עוזר AI · HK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cli.css">
<style>
/* =====================================================================
   עוזר AI — CLIENT_SCREENS_SPEC §3.4
   מסך שיחה, לא דשבורד. שני עמודים בלבד: השיחה, וההיסטוריה של החברה.
   הכלל שמנהל את המסך: תשובה גרפית רק כששאלו על **המצב עכשיו** או על
   **החברה / איש קשר** מתוך הזיכרון — שם ההקשר כבר טעון והתשובה מיידית.
   כל השאר: טקסט. בלי כרטיסים, בלי גרפים, בלי קישוטים.
   ===================================================================== */

.ai{display:grid;grid-template-columns:minmax(0,1fr) 262px;gap:34px;align-items:start}
@media(max-width:1040px){.ai{grid-template-columns:minmax(0,1fr)}}

/* ---------- עמודת השיחה ----------
   כל התוכן יושב על קו טקסט אחד (16px מהקצה), והפס הקורלי של השאלה
   נתלה מחוצה לו — כך השאלה, התשובה ותיבת הכתיבה מיושרות לאותה עמודה. */
/* העמודה ממלאת את הגובה שנשאר מתחת לכרום, כדי שהמצב ההתחלתי לא ירחף
   בשליש העליון עם חצי מסך ריק מתחתיו. --chrome = ניווט + רצועה + פס. */
.ai{--chrome:182px;min-height:calc(100vh - var(--chrome) - 64px)}
.conv{display:flex;flex-direction:column;min-height:inherit}
.stream{flex:1}
/* בשיחה ריקה הפתיחה והתיבה יושבות יחד במרכז האנכי */
.conv.empty{justify-content:center}
.conv.empty .stream{flex:0}
.conv.empty .comp{padding-top:26px}
@media(max-width:1399px){.ai{--chrome:214px}}

/* פתיחה — רק כשאין עדיין שיחה */
.hello{max-width:70ch;padding-inline-start:16px;padding-top:24px}
.hello h2{font-size:27px;font-weight:800;color:var(--navy);letter-spacing:-.6px;line-height:1.25}
.hello p{margin-top:9px;font-size:15.5px;line-height:1.75;font-weight:300;color:var(--ink2)}

/* שאלות מוכנות — גדולות בפתיחה, דקות מעל תיבת הכתיבה אחרי שהשיחה התחילה */
.sug{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
.sug button{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:9px 18px;
  font-size:14px;font-weight:500;color:var(--navy);box-shadow:0 1px 2px rgba(12,64,104,.045)}
.sug button:hover{border-color:var(--sky);background:var(--tint)}
.suggrp{margin-top:20px}
.suggrp .glb{display:block;font-size:11.5px;font-weight:700;color:var(--ink3);
  letter-spacing:.3px;margin-inline-start:2px}
.suggrp .sug{margin-top:9px}
.sug.mini{margin:0 0 10px;gap:7px}
.sug.mini button{font-size:12.5px;padding:5px 13px;font-weight:500;color:var(--ink2);
  background:transparent;box-shadow:none}
.sug.mini button:hover{color:var(--navy)}

/* ---------- תור בשיחה: שאלה למעלה, תשובה מתחתיה ----------
   בלי אווטארים ובלי בועות. השאלה היא הכותרת (הפס הקורלי = פעולה של היועץ),
   התשובה היא הגוף. שתיהן על אותו קו, כדי שהעמודה תישאר שקטה. */
.turn.q{position:relative;padding-inline-start:16px;margin-bottom:13px;
  font-size:17px;font-weight:600;color:var(--navy);letter-spacing:-.2px;max-width:76ch}
.turn.q::before{content:"";position:absolute;inset-inline-start:0;top:4px;bottom:4px;
  width:3px;border-radius:99px;background:var(--coral)}
.turn.a{padding-inline-start:16px;margin-bottom:38px;max-width:900px}
.turn.a>*{max-width:884px}
.txt{font-size:16px;line-height:1.85;font-weight:300;color:var(--ink);max-width:76ch}
.txt p+p{margin-top:13px}
.txt b{font-weight:600;color:var(--navy)}
.txt .rd{color:var(--bad);font-weight:600}

/* "חושב" — רק לתשובות טקסט. תשובה גרפית חוזרת מיד, בלי המתנה */
.think{display:flex;gap:5px;padding:12px 0}
.think i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:bl 1.1s infinite}
.think i:nth-child(2){animation-delay:.18s}
.think i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,80%,100%{opacity:.3}40%{opacity:1}}

/* ---------- הכרטיס — שני המקרים היחידים ---------- */
.ansc{max-width:884px;overflow:hidden}
.ansc .lbl{font-size:11.5px;font-weight:700;color:var(--ink3);letter-spacing:.3px;padding:14px 20px 0}
.ansc .foot{border-top:1px solid var(--tint);background:#FCFDFE;padding:10px 20px;
  font-size:11.5px;line-height:1.6;color:var(--faint)}

/* (א) המצב עכשיו — מספרים גדולים, מגמה, שורת משמעות */
.nums{display:flex;flex-wrap:wrap;padding:13px 20px 4px}
.nums .n{padding-inline-end:26px;margin-inline-end:26px;border-inline-end:1px solid var(--tint);margin-bottom:10px}
.nums .n:last-child{border-inline-end:0;margin-inline-end:0;padding-inline-end:0}
.nums .n span{display:block;font-size:12px;color:var(--ink3);margin-bottom:2px}
.nums .n i{display:block;font-style:normal;font-size:12px;color:var(--ink2);margin-top:3px}
.nums .n.bad .big{color:var(--bad)}
.trend{padding:6px 20px 4px}
.trend .th{font-size:11.5px;color:var(--ink3);margin-bottom:9px}
.trend .bars{display:flex;align-items:flex-end;gap:10px;height:74px;max-width:380px}
.trend .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}
.trend .b u{text-decoration:none;font-size:11.5px;font-weight:600;color:var(--ink2)}
.trend .b em{font-style:normal;font-size:11px;color:var(--faint)}
.trend .b s{text-decoration:none;display:block;width:100%;border-radius:5px 5px 0 0;background:#CFE3F2}
.trend .b.on s{background:var(--band)}
.trend .b.on u{color:var(--navy)}
.mean{margin:12px 20px 14px 20px;padding-top:13px;border-top:1px solid var(--tint);
  font-size:14.5px;line-height:1.8;font-weight:300;color:var(--ink)}
.mean b{font-weight:600;color:var(--navy)}
.mean .rd{color:var(--bad);font-weight:600}

/* (ב) כרטיס מהזיכרון — שורות עם המקור והתאריך שלהן */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 16px;
  padding:11px 20px;border-top:1px solid var(--tint);align-items:center}
.mrow:first-of-type{border-top:0}
.ansc .lbl+.mrow{border-top:0}
.mrow .t{font-size:14.5px;line-height:1.6;color:var(--ink)}
.mrow .t b{font-weight:600;color:var(--navy)}
.mrow .s{font-size:11.5px;color:var(--faint);white-space:nowrap}
.mrow .t .dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--bad);margin-inline-end:8px;vertical-align:middle}
.mrow .t .dot.mid{background:#E0A32B}
.mrow .t .dot.ok{background:var(--good)}
.mrow.done .t{color:var(--ink3)}
.mrow .tag{display:inline-block;font-size:10.5px;font-weight:600;color:var(--warn);
  border:1px solid #EADDBF;background:#FCF7EC;border-radius:999px;padding:1px 8px;margin-inline-start:8px}
.mrow .st{font-size:11.5px;font-weight:600;color:var(--navy);border:1px solid var(--bd);
  border-radius:999px;padding:3px 11px;white-space:nowrap}
.mrow .st.wait{color:var(--warn);border-color:#EADDBF;background:#FCF7EC}
/* אנשי קשר — אווטאר, שם ותפקיד, ומתחת מה שהזיכרון יודע */
.prow{display:flex;gap:13px;padding:13px 20px;border-top:1px solid var(--tint)}
.ansc .lbl+.prow{border-top:0}
.prow .pav{flex:none;width:34px;height:34px;border-radius:50%;background:var(--tint);
  border:1px solid var(--bd);color:var(--navy);display:grid;place-items:center;font-size:14px;font-weight:600}
.prow .pb2{min-width:0}
.prow h4{font-size:14.5px;font-weight:700;color:var(--navy)}
.prow h4 em{font-style:normal;font-weight:400;font-size:12.5px;color:var(--ink3);margin-inline-start:7px}
.prow p{font-size:13.5px;line-height:1.65;color:var(--ink);margin-top:4px}
.prow p i{font-style:normal;color:var(--faint);font-size:11.5px;margin-inline-start:6px}

/* ---------- תיבת הכתיבה ---------- */
/* התיבה נצמדת לתחתית החלון כשהשיחה ארוכה; הדהייה מונעת שהטקסט ייקרא מתחתיה */
.comp{position:sticky;bottom:16px;padding:18px 0 0;padding-inline-start:16px;
  background:linear-gradient(to bottom,rgba(246,248,251,0) 0,var(--bg) 18px)}
/* אותו רוחב של כרטיס התשובה — הקצוות נופלים על קו אחד */
.comp .row{display:flex;align-items:center;gap:10px;max-width:884px}
.comp .hint{max-width:884px}
.sug.mini{padding-inline-start:0}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:4px;background:#fff;
  border:1px solid var(--bd);border-radius:999px;padding:6px;box-shadow:var(--lift)}
.field input{flex:1;min-width:0;border:0;outline:none;background:none;height:38px;
  font-size:15px;padding:0 14px}
.field input::placeholder{color:var(--faint)}
/* ---------- וואטסאפ: רק השורה ברשימה מסמנת את הערוץ ---------- */
/* הוואטסאפ הוא הערוץ הפתוח תמיד — ולכן הוא מודגש בכהה בראש הרשימה,
   עם הסמל הירוק שממשיך לזהות את הערוץ. השיחה עצמה נראית כמו כל שיחה. */
.hrow.wa{background:var(--band);border-color:var(--band);margin-bottom:10px}
.hrow.wa:hover{background:var(--navy);border-color:var(--navy)}
.hrow.wa b{display:flex;align-items:center;gap:8px;color:#fff;font-weight:600}
.hrow.wa span{color:rgba(255,255,255,.72)}
.hrow.wa.on{background:var(--navy);border-color:var(--navy);box-shadow:var(--lift)}
.hrow.wa.on b{color:#fff}
.hrow .wa-ico{color:#25D366;flex:none}
.iconb{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.iconb:hover{background:var(--tint);color:var(--navy)}
.sendb{flex:none;width:38px;height:38px;border-radius:50%;background:var(--coral);color:#fff;
  display:grid;place-items:center;transition:background .15s}
.sendb:hover{background:var(--coral-d)}
.sendb:disabled{background:#DCE5EE;color:#fff;cursor:default}
.hint{font-size:11.5px;color:var(--faint);margin:9px 4px 0}

/* מצב הקלטה — אותה תיבה, תוכן אחר */
.field.rec{border-color:var(--coral);box-shadow:0 0 0 3px rgba(228,130,110,.13)}
.recdot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--coral);
  margin-inline-start:12px;animation:pp 1.2s infinite}
@keyframes pp{0%,100%{opacity:1}50%{opacity:.25}}
.wave{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;
  height:38px;padding:0 14px;overflow:hidden}
.wave i{flex:none;width:3px;border-radius:2px;background:var(--coral);opacity:.8;animation:wv 1s ease-in-out infinite}
@keyframes wv{0%,100%{height:5px}50%{height:22px}}
.rect{flex:none;font-size:13px;font-weight:600;color:var(--navy)}
.recstop{flex:none}

/* ---------- ההיסטוריה של החברה ---------- */
.hist{position:sticky;top:16px}
.hist .newc{width:100%;justify-content:center;margin-bottom:16px}
.hrow{display:block;width:100%;text-align:start;border-radius:11px;padding:9px 11px;
  border:1px solid transparent}
.hrow b{display:block;font-size:13px;font-weight:500;color:var(--ink);line-height:1.45;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow span{display:block;font-size:11px;color:var(--faint);margin-top:2px}
.hrow:hover{background:#fff;border-color:var(--cardbd)}
.hrow.on{background:#fff;border-color:var(--bd);box-shadow:var(--lift)}
.hrow.on b{color:var(--navy);font-weight:600}
.hnote{font-size:11px;line-height:1.6;color:var(--faint);margin:14px 6px 0}

/* כפתור השיחה הקולית — הפעולה הבולטת ביותר בתיבה */
.vcbtn{position:relative;display:flex;align-items:center;gap:10px;flex:none;
  background:var(--coral);color:#fff;border-radius:999px;padding:9px 20px 9px 16px;
  box-shadow:0 6px 18px -6px rgba(228,130,110,.75);transition:background .15s,transform .12s}
.vcbtn:hover{background:var(--coral-d);transform:translateY(-1px)}
.vcbtn .tx{display:block;text-align:start;line-height:1.25}
.vcbtn .tx b{display:block;font-size:13.5px;font-weight:700}
.vcbtn .tx em{display:block;font-style:normal;font-size:11px;font-weight:400;color:rgba(255,255,255,.82)}
.vcbtn .ring{position:absolute;inset:-4px;border-radius:999px;border:2px solid var(--coral);
  opacity:.45;animation:vcr 2.6s ease-out infinite;pointer-events:none}
@keyframes vcr{0%{transform:scale(1);opacity:.45}70%{transform:scale(1.09);opacity:0}100%{opacity:0}}

/* ---------- שיחה קולית ---------- */
.vc{width:min(460px,92vw);text-align:center;padding:26px 24px 20px}
.orb{width:96px;height:96px;margin:6px auto 0;border-radius:50%;position:relative;
  display:grid;place-items:center;background:var(--band);color:#fff}
.orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;
  border:2px solid rgba(57,171,226,.5);animation:rp 2.2s ease-out infinite}
.orb::after{animation-delay:1.1s}
@keyframes rp{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.vc h3{margin-top:16px}
.vc .vt{font-size:13px;font-weight:600;color:var(--ink2);margin-top:3px}
.vc .caps{margin-top:16px;text-align:start;border-top:1px solid var(--tint);padding-top:14px;
  min-height:132px;display:flex;flex-direction:column;gap:11px}
.cap{font-size:14px;line-height:1.65;animation:fi .35s ease-out}
.cap b{display:block;font-size:11px;font-weight:600;color:var(--ink3);margin-bottom:2px}
.cap.hk{color:var(--ink)}
.cap.me{color:var(--ink2)}
.cap.live b::after{content:" · מקשיב";color:var(--coral)}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.vc .vf{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px}
</style>
</head>
<body data-cli="ai">
<main class="wrap">
  <div class="ai">

    <!-- ===== השיחה ===== -->
    <section class="conv">
      <div class="stream" id="stream" role="log" aria-live="polite" aria-label="השיחה עם העוזר"></div>

      <form class="comp" id="comp" onsubmit="event.preventDefault();sendTyped()">
        <div class="sug mini" id="sugMini"></div>
        <div class="row">
          <div class="field" id="field">
            <input id="q" autocomplete="off" aria-label="שאלה לעוזר" oninput="syncSend()"
                   placeholder="שאלו על אנרגי אינטרנשיונל — מספרים, זיכרון, פגישות או משימות">
            <button type="button" class="iconb" id="micBtn" onclick="recStart()" aria-label="הקלטת שאלה">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            </button>
            <button type="submit" class="sendb" id="sendBtn" disabled aria-label="שליחה">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
            </button>
          </div>
          <!-- השיחה הקולית היא הפיצ'ר הבולט של המסך — קורל, לא כפתור משני -->
          <button type="button" class="vcbtn" onclick="vcOpen()">
            <span class="ring"></span>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12v1M7.5 8v8M12 4.5v15M16.5 8v8M21 12v1"/></svg>
            <span class="tx"><b>שיחה קולית</b><em>לדבר עם העוזר במקום להקליד</em></span>
          </button>
        </div>
        <div class="hint" id="compHint">המספרים החיים של אנרגי והזיכרון של החברה כבר בהקשר — אין צורך לצרף נתונים.</div>
      </form>
    </section>

    <!-- ===== היסטוריית השיחות של החברה ===== -->
    <aside class="hist">
      <!-- הקורל שמור לפעולה המרכזית של המסך — שליחת השאלה -->
      <button class="btn pln big newc" onclick="newConv()">+ שיחה חדשה</button>
      <div class="sect" id="histSect">שיחות קודמות · אנרגי</div>
      <div id="histList"></div>
      <p class="hnote" id="histNote">השיחות נשמרות פר חברה. שיחה שנפתחת כאן ממשיכה מאותה נקודה.</p>
    </aside>

  </div>
</main>

<!-- שיחה קולית — פופאפ עם ✕, לחיצה בחוץ ו-Escape -->
<div class="ov" id="vcOv" onclick="if(event.target===this)vcClose()">
  <div class="md vc">
    <button class="x" onclick="vcClose()" aria-label="סגירה">✕</button>
    <div class="orb">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12v1M8 8.5v7M12 5v14M16 8.5v7M20 12v1"/></svg>
    </div>
    <h3>שיחה קולית עם העוזר</h3>
    <div class="vt num" id="vcTime">00:00</div>
    <div class="caps" id="vcCaps"></div>
    <div class="vf">
      <button class="btn pri big" onclick="vcEnd()">סיום השיחה</button>
      <button class="btn pln" onclick="vcClose()">ביטול</button>
    </div>
  </div>
</div>

<script src="cli.js"></script>
<script>
hkChrome('ai',{strip:false});

/* =====================================================================
   1 · הנתונים — מקבצי המערכת
   זיכרון: js/memory.js (MEM_DATA[0] · MEM_NUMS[0] · MEM_USERS[0])
   מספרים: js/memory.js + הפס הכחול · פגישות: js/meetings.js
   משימות: js/ops.js (ADV_TASKS[0]) · התראות ופערים: js/alerts.js
   ===================================================================== */
const REV={lbl:'הכנסות · 6 חודשים אחורה (א׳ ₪)',
  m:['פבר','מרץ','אפר','מאי','יוני','יולי'], v:[242,268,255,300,307,301]};

/* ---------- (א) המצב עכשיו — מספרים גדולים, מגמה, שורת משמעות ---------- */
function cardState(){
  const mx=Math.max(...REV.v);
  return `<article class="panel ansc">
    <div class="lbl">מצב אנרגי אינטרנשיונל · עכשיו</div>
    <div class="nums">
      <div class="n"><span>יתרה נוכחית</span><div class="big num">75,187 ₪</div>
        <i>לאומי 604 · פועלים 112</i></div>
      <div class="n bad"><span>חריגה צפויה</span><div class="big num">11.07</div>

  'מה מצב החברה עכשיו?'        :()=>({t:'card',k:'state'}),
  'כמה הכנסנו החודש מול היעד?' :()=>({t:'txt',h:T.revenue}),
  'כמה יצא לספקים ביוני?'      :()=>({t:'txt',h:T.suppliers}),
  'מה הרווח התזרימי החודש?'    :()=>({t:'txt',h:T.profit}),
  'מי אנשי הקשר ומה תפקידם?'   :()=>({t:'card',k:'contacts'}),
  'איך כדאי לדבר עם צחי?'      :()=>({t:'card',k:'comm'}),
  'מה הכאבים הפתוחים?'         :()=>({t:'card',k:'pains'}),
  'מה סוכם ועדיין לא נסגר?'    :()=>({t:'card',k:'goals'}),
};
function route(q){
  const k=q.trim();
  if(PRESET[k]) return PRESET[k]();
  for(const [re,fn] of ROUTES) if(re.test(q)) return fn(q);
  return {t:'txt',h:T.none};
}

/* =====================================================================
   3 · השיחה — מצב, רינדור ושליחה
   ===================================================================== */
/* שתי משפחות במפורש — בלי זה נראה שהעוזר עונה רק על "רכות" ולא על מספרים */
/* בעל העסק שואל על העסק שלו בגוף ראשון; היועץ שואל על לקוח, מבחוץ.
   אותו מסך, אותה מכונה — רק השאלות והפנייה משתנות. */
const CLI=document.documentElement.classList.contains('r-cli');
const SUGG = CLI ? [
  {g:'הכסף שלי', q:['מה מגמת ההכנסות?','מה תהיה היתרה בעוד שבועיים?',
                    'מתי צפויה חריגה?','כמה קניתי מסונול החודש?']},
  /* הלקוח לא מכיר את HK — מולו עומד היועץ והמשרד שלו. */
  {g:'הליווי שלי', q:['מה נעשה עבורי החודש?','מה פתוח אצלי?',
                      'מתי הפגישה הבאה שלי?','מה סוכם בפגישה האחרונה?']},
] : [
  {g:'מספרים', q:['מה מצב החברה עכשיו?','כמה הכנסנו החודש מול היעד?',
                  'כמה יצא לספקים ביוני?','מה הרווח התזרימי החודש?']},
  {g:'החברה והאנשים', q:['מי אנשי הקשר ומה תפקידם?','איך כדאי לדבר עם צחי?',
                          'מה הכאבים הפתוחים?','מה סוכם ועדיין לא נסגר?']},
];
const SUG=SUGG.reduce((a,s)=>a.concat(s.q.map(x=>[x])),[]);
if(CLI){const _q=document.getElementById('q');
  if(_q)_q.placeholder='שאלו על העסק שלכם — מספרים, פגישות או משימות';}

/* היסטוריית השיחות — לבעל העסק שיחות משלו, בשאלות שהוא באמת שואל.
   התשובות הן אותן תשובות; רק מי ששאל ולמה — שונה. */
const HIST_CLI=[
  {id:'c1', title:'החריגה הצפויה ב-11.07', when:'היום 09:12', turns:[
    {q:'מה בונה את החריגה הצפויה ב-11.07?', t:'txt', h:T.exposure},
    {q:'מה פתוח אצלי?',                     t:'txt', h:T.tasks}]},
  {id:'c2', title:'לאן הלך הכסף ביוני', when:'30.06', turns:[
    {q:'כמה יצא לספקים ביוני?',  t:'txt', h:T.suppliers},
    {q:'מה הרווח התזרימי החודש?', t:'txt', h:T.profit}]},
  {id:'c3', title:'קניות המלאי מול התקציב', when:'26.06', turns:[
    {q:'למה קניות המלאי חורגות?', t:'txt', h:T.stock}]},
];
const HIST_ADV=[
  {id:'h1', title:'החריגה ב-11.07 וההעברה מפועלים', when:'היום 09:12', turns:[
    {q:'מה בונה את החריגה הצפויה ב-11.07?', t:'txt', h:T.exposure},
    {q:'מה פתוח מול טל בנושא?',          t:'txt', h:T.tasks}]},
  {id:'h2', title:'הכנה לפגישת הסקירה של הבוקר', when:'היום 08:40', turns:[
    {q:'איך כדאי לדבר עם צחי?',              t:'card', k:'comm'},
    {q:'מה הכאבים הפתוחים שלו?',             t:'card', k:'pains'}]},
  {id:'h3', title:'עלות המכר לפי ספקים', when:'30.06', turns:[
    {q:'מי הספקים הגדולים ומה חלקם ברכש?',   t:'txt',
     h:`<p>שלושה ספקים מחזיקים את כל הרכש כמעט: בז״ן — דלקים 45%, פז חברת נפט 28%, וספקי משנה 12%.
        היתר מפוזר בין ספקים קטנים.</p>
        <p>הפילוח המלא לפי עלות המכר עדיין פתוח כמשימה אצל טל — הוא נדרש לפגישה, והיא באיחור מ-30.06.</p>`}]},
  {id:'h4', title:'המכרז של חברת האוטובוסים', when:'20.06', turns:[
    {q:'איך הזכייה במכרז משפיעה על התזרים?', t:'txt',
     h:`<p>הזכייה באספקה לחברת האוטובוסים ירושלים צפויה להוסיף כ-1.5 מ׳ ₪ למחזור השנתי, מאוגוסט.
        זה אירוע מהותי שנכנס לזיכרון ב-20.06 משיחת טלפון.</p>
        <p>ההשפעה על התזרים אינה מיידית: המימון קודם לגבייה, כלומר קניות מלאי גדולות יותר לפני
        התקבול הראשון. זו בדיוק הסיבה שהיעד לפתיחת מסגרת נוספת של 100 א׳ ₪ עד 15.7 קריטי,
        ולא רק נחמד שיהיה.</p>`}]},
  {id:'h5', title:'אנשי הקשר של אנרגי', when:'25.06', turns:[
    {q:'מי אנשי הקשר ומה תפקידם?',           t:'card', k:'contacts'}]},
];
/* הוואטסאפ של בעל העסק מול העוזר — שיחה אחת ויחידה שממשיכה תמיד.
   היא מוצגת כשיחה רגילה לכל דבר; רק השורה ברשימה מסמנת שזה הערוץ. */
const WA_CHAT={
  id:'wa', wa:true, title:'וואטסאפ · העוזר שלי', when:'היום 08:41', turns:[
    {q:'מה היתרה עכשיו?', t:'txt',
     h:`<p>היתרה בעו״ש עומדת על <b>75,187 ₪</b>. צפויה חריגה ב-11.07 אם ההעברה
        מפועלים 112 ללאומי 604 לא תבוצע.</p>`},
    {q:'מה זאת אומרת חריגה?', t:'txt',
     h:`<p>המסגרת היא <b>150,000 ₪</b>. לפי התחזית היתרה יורדת מתחתיה ב-11.07,
        בגלל תשלום ספק גדול שמתוכנן ל-14.7 ומשכורות ב-10.7.</p>`},
    {q:'כמה קניתי מסונול החודש?', t:'txt',
     h:`<p>חשבונית אחת — <b>4,820 ₪</b> ב-30.06, שויכה להוצאות דלק.</p>`},
    {q:'תזכיר לי מתי הפגישה', t:'txt',
     h:`<p>סקירת רבעון Q3 — <b>10 ביולי, 14:00–15:00</b>, בזום. אשלח תזכורת יום לפני.</p>`},
  ]};
const HIST = CLI ? [WA_CHAT].concat(HIST_CLI) : HIST_ADV;

if(CLI){
  const set=(id,txt)=>{const e=document.getElementById(id); if(e)e.textContent=txt;};
  set('histSect','השיחות שלי');
  set('histNote','שיחה שנפתחת כאן ממשיכה מאותה נקודה.');
  set('compHint','המספרים החיים של העסק כבר בהקשר — אין צורך לצרף נתונים.');
}

let CONV={id:null, turns:[]};      // השיחה שעל המסך
let SEEN=new Set();                // שאלות מוכנות שכבר נשאלו — יורדות מהשורה הדקה

function turnHtml(t){
  const ans = t.pending ? '<div class="think"><i></i><i></i><i></i></div>'
            : t.t==='card' ? CARDS[t.k]()
            : `<div class="txt">${t.h}</div>`;
  return `<div class="turn q">${t.q}</div><div class="turn a">${ans}</div>`;
}
function render(){
  const s=document.getElementById('stream');
  if(!CONV.turns.length){
    s.innerHTML=`<div class="hello">
      <h2>${CLI?'מה תרצה לדעת על העסק שלך?':'מה תרצה לדעת על אנרגי אינטרנשיונל?'}</h2>
      <p>${CLI
        ?'המספרים החיים של העסק כבר כאן — יתרה, הכנסות, הוצאות ורווח — וגם מה פתוח בליווי והפגישות. שאלו במילים שלכם.'
        :'המספרים החיים של אנרגי והזיכרון שלה כבר בהקשר — אפשר לשאול <b>מספרים</b> (יתרה, הכנסות, הוצאות, רווח) בדיוק כמו ששואלים על החברה ועל האנשים. שאלות מצב וזיכרון חוזרות מיד; כל השאר — תשובה בכתב.'}</p>
      ${SUGG.map(s=>`<div class="suggrp"><span class="glb">${s.g}</span>
        <div class="sug">${s.q.map(x=>`<button onclick="ask('${x.replace(/'/g,"\\'")}')">${x}</button>`).join('')}</div>
      </div>`).join('')}
    </div>`;
  } else {
    s.innerHTML=CONV.turns.map(turnHtml).join('');
  }
  document.querySelector('.conv').classList.toggle('empty',!CONV.turns.length);
  /* השורה הדקה מעל תיבת הכתיבה — רק שאלות שעוד לא נשאלו, ורק כשהשיחה כבר רצה */
  const left=SUG.filter(x=>!SEEN.has(x[0])).slice(0,3);
  document.getElementById('sugMini').innerHTML =
    (CONV.turns.length&&left.length)
      ? left.map(x=>`<button type="button" onclick="ask('${x[0]}')">${x[0]}</button>`).join('') : '';
  document.querySelectorAll('.hrow').forEach(el=>el.classList.toggle('on',el.dataset.id===CONV.id));
}

/* שאלה חדשה. תשובה גרפית חוזרת מיד; תשובת טקסט מקבלת רגע חשיבה */
function ask(q){
  q=(q||'').trim(); if(!q) return;
  SEEN.add(q);
  const a=route(q), t={q, pending:true};
  CONV.turns.push(t); render(); toEnd();
  const fill=()=>{delete t.pending; Object.assign(t,a); render(); toEnd();};
  a.t==='card' ? fill() : setTimeout(fill,700);
}
function sendTyped(){
  const i=document.getElementById('q');
  if(!i.value.trim()) return;
  ask(i.value); i.value=''; syncSend();
}
function syncSend(){
  document.getElementById('sendBtn').disabled=!document.getElementById('q').value.trim();
}
function toEnd(){
  requestAnimationFrame(()=>{
    const c=document.getElementById('comp').getBoundingClientRect();
    if(c.bottom>innerHeight) scrollTo({top:scrollY+c.bottom-innerHeight+24, behavior:'smooth'});
  });
}

const WA_ICO='<svg class="wa-ico" width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2A9.9 9.9 0 0 0 2.1 11.9c0 1.75.46 3.46 1.34 4.97L2 22l5.28-1.38a9.9 9.9 0 0 0 4.76 1.21h.01a9.9 9.9 0 0 0 9.9-9.9A9.9 9.9 0 0 0 12.04 2zm0 18.05h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.13.82.84-3.05-.2-.31a8.2 8.2 0 1 1 6.99 3.87zm4.5-6.14c-.25-.12-1.46-.72-1.68-.8-.23-.09-.39-.13-.55.12s-.64.8-.78.97c-.14.16-.29.18-.53.06a6.7 6.7 0 0 1-3.36-2.94c-.25-.43.25-.4.72-1.33.08-.16.04-.3-.02-.42s-.55-1.33-.76-1.82c-.2-.48-.4-.41-.55-.42h-.47c-.16 0-.42.06-.64.3s-.84.82-.84 2 .86 2.32.98 2.48c.12.16 1.69 2.58 4.1 3.62 1.53.66 2.13.72 2.89.6.47-.07 1.46-.6 1.66-1.17.21-.58.21-1.07.14-1.17-.06-.11-.22-.17-.47-.29z"/></svg>';
/* ---------- היסטוריה ---------- */
function renderHist(){
  document.getElementById('histList').innerHTML=HIST.map(h=>
    `<button class="hrow${h.wa?' wa':''}" data-id="${h.id}" onclick="loadConv('${h.id}')">
      <b>${h.wa?WA_ICO:''}${h.title}</b><span>${h.when} · ${h.turns.length*2} הודעות</span></button>`).join('');
}
function loadConv(id){
  const h=HIST.find(x=>x.id===id); if(!h) return;
  /* טעינת שיחה = המשך שלה: התורים חוזרים כמו שהיו, וממשיכים לשאול מכאן */
  CONV={id:h.id, turns:h.turns.map(t=>Object.assign({},t))};
  h.turns.forEach(t=>SEEN.add(t.q));
  render(); scrollTo({top:0,behavior:'smooth'});
}
function newConv(){
  CONV={id:null, turns:[]}; SEEN=new Set(); render();
  scrollTo({top:0,behavior:'smooth'});
  document.getElementById('q').focus();
}

/* =====================================================================
   4 · קול — הקלטת שאלה, ושיחה קולית מלאה
   ===================================================================== */
let recT=null, recSec=0;
function recStart(){
  recSec=0;
  const f=document.getElementById('field');
  f.classList.add('rec');
  const bars=Array.from({length:44},(_,i)=>
    `<i style="animation-delay:${(i%9)*.09}s"></i>`).join('');
  f.innerHTML=`<span class="recdot"></span>
    <span class="wave">${bars}</span>
    <span class="rect num" id="recT">00:00</span>
    <button type="button" class="btn pri recstop" onclick="recStop()">עצירה ושליחה</button>
    <button type="button" class="iconb" onclick="recCancel()" aria-label="ביטול ההקלטה">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`;
  recT=setInterval(()=>{recSec++;
    const e=document.getElementById('recT');
    if(e)e.textContent='0'+Math.floor(recSec/60)+':'+String(recSec%60).padStart(2,'0');},1000);
}
/* שחזור התיבה הרגילה — נשמרת כתבנית אחת ומוזרקת בחזרה */
const FIELD_HTML=document.getElementById('field').innerHTML;
function recRestore(){
  clearInterval(recT); recT=null;
  const f=document.getElementById('field');
  f.classList.remove('rec'); f.innerHTML=FIELD_HTML;
  syncSend();
}
function recCancel(){ recRestore(); toast('ההקלטה בוטלה'); }
function recStop(){
  recRestore();
  /* בדמו: התמלול מוחזר מוכן. במערכת — הקובץ עולה לתמלול ומשם לשאלה */
  ask('מה מצב החברה עכשיו?');
  toast('התמלול הוחזר — ' + recSec + ' שניות הקלטה');
}

/* ---------- שיחה קולית ---------- */
const VC=[
  {w:'me', n:'אילון', t:'מה חשוב שאדע לפני הפגישה של 17:00?'},
  {w:'hk', n:'העוזר', t:'שלושה דברים: החריגה הצפויה ב-11 ביולי, ההעברה של 42,000 ₪ מפועלים שעדיין פתוחה אצל טל, וקניות המלאי שחורגות חודש שלישי ברצף.'},
  {w:'me', n:'אילון', t:'ומה עם התלות ברימון?'},
  {w:'hk', n:'העוזר', t:'היא עלתה בפגישת הבוקר ונכנסה לזיכרון ככאב חדש — כ-70% מהמחזור. צחי רגיש לנושא, כדאי לגעת בו בעדינות ובלי לחץ.'},
];
let vcT=null, vcSec=0, vcStep=0, vcNext=null;
function vcOpen(){
  if(recT) recCancel();
  vcSec=0; vcStep=0;
  document.getElementById('vcTime').textContent='00:00';
  document.getElementById('vcCaps').innerHTML='<div class="cap me live"><b>אילון</b>…</div>';
  document.getElementById('vcOv').classList.add('on');
  vcT=setInterval(()=>{vcSec++;
    document.getElementById('vcTime').textContent='0'+Math.floor(vcSec/60)+':'+String(vcSec%60).padStart(2,'0');},1000);
  vcTick();
}
const VC_LIVE='<div class="cap me live"><b>אילון</b>…</div>';
function vcTick(){
  const c=document.getElementById('vcCaps');
  const live=c.querySelector('.cap.live'); if(live) live.remove();
  if(vcStep>=VC.length){ c.insertAdjacentHTML('beforeend',VC_LIVE); return; }
  const v=VC[vcStep++];
  c.insertAdjacentHTML('beforeend',`<div class="cap ${v.w}"><b>${v.n}</b>${v.t}</div>`);
  /* מציגים לכל היותר שלוש שורות — זו שיחה, לא תמלול */
  const rows=c.querySelectorAll('.cap');
  if(rows.length>3) rows[0].remove();
  if(vcStep<VC.length) c.insertAdjacentHTML('beforeend',VC_LIVE);
  vcNext=setTimeout(vcTick, v.w==='me'?1600:3400);
}
function vcStopTimers(){ clearInterval(vcT); clearTimeout(vcNext); vcT=null; vcNext=null; }
function vcClose(){ vcStopTimers(); document.getElementById('vcOv').classList.remove('on'); }
function vcEnd(){
  const secs=vcSec; vcClose();
  /* השיחה הקולית נשמרת כשיחה בהיסטוריה של החברה, כמו כל שיחה אחרת */
  HIST.unshift({id:'v'+Date.now(), title:'שיחה קולית — לפני הפגישה של 17:00',
    when:'היום ' + CO.clock, turns:[
      {q:VC[0].t, t:'txt', h:'<p>'+VC[1].t+'</p>'},
      {q:VC[2].t, t:'txt', h:'<p>'+VC[3].t+'</p>'}]});
  renderHist(); render();
  toast('השיחה הקולית נשמרה בהיסטוריה · ' + secs + ' שניות');
}

/* =====================================================================
   5 · הפעלה
   ===================================================================== */
renderHist();
/* Escape סוגר גם את ההקלטה וגם את השיחה הקולית (הכרום סוגר את הפופאפ עצמו) */
addEventListener('keydown',e=>{ if(e.key!=='Escape') return;
  if(recT) recCancel();
  if(vcT) vcClose();
});

/* שאלה שהגיעה מהדשבורד או מהמדדים — ?q=... */
const urlQ=new URLSearchParams(location.search).get('q');
render();
if(urlQ) ask(urlQ);
</script>
