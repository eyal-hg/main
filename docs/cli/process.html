<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אנרגי אינטרנשיונל · התהליך שלי · HK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cli.css">
<style>
/* =====================================================================
   התהליך שלי — תוכנית ליווי עסקי (המרה ויזואלית של js/flow.js)
   המבנה, הנתונים והזרימה זהים למקור: תוכנית אחת (GOLD) שנושאת 27 מפגשים,
   כל מפגש עם רשימת נושאים, ומפגש שנקשר לפגישה אמיתית ממתין לאישור סיכום.
   · הבלוק הכהה היחיד במסך: כותרת התוכנית.
   · קורל = פעולה בלבד (הוספת מפגש · אישור הסיכום · הסרה מאושרת).
   · סטטוס = מצב: אפור טרם התחיל · ענבר ממתין לאישור · ירוק הושלם.
   ===================================================================== */

/* ---------- ראש המסך: הכותרת וההתקדמות ---------- */
.pr-head{position:relative;background:#fff;border:1px solid var(--cardbd);border-radius:14px;
  box-shadow:var(--lift);padding:15px 22px 17px;margin-bottom:18px}
.pr-head::before{content:"";position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:3px;
  border-radius:0 99px 99px 0;background:var(--coral)}
.pr-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pr-top h2{font-size:21px;font-weight:800;color:var(--navy);letter-spacing:-.4px}
.pr-top .sp{margin-inline-start:auto}
.pr-prog{display:flex;align-items:center;gap:14px;margin-top:14px}
.pr-plbl{flex:none;font-size:12.5px;font-weight:600;color:var(--ink2)}
/* הבר נשאר צמוד לתווית — בר ריק שנמתח על כל הרוחב נקרא כקו מפריד, לא כהתקדמות */
.pr-bar{flex:0 1 440px;height:7px;border-radius:99px;background:var(--chip);overflow:hidden}
.pr-bar i{display:block;height:100%;border-radius:99px;background:var(--sky);
  transition:width .45s cubic-bezier(.2,.75,.3,1)}

/* ---------- כותרת התוכנית — הבלוק הכהה היחיד ---------- */
.pr-ph{display:flex;align-items:center;gap:11px;padding:13px 18px;background:var(--band);color:#fff;
  border-radius:14px 14px 0 0;cursor:pointer}
.pr-ph .nm{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.pr-ph .n{font-size:11.5px;font-weight:700;color:var(--on-navy);line-height:1.5;
  border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:2px 11px}
.pr-ph .sp{margin-inline-start:auto}
.pr-ph .pr-ic{color:var(--on-navy2)}
.pr-ph .pr-ic:hover{background:rgba(255,255,255,.13);color:#fff}
.pr-ph .pr-ic.del:hover{background:rgba(228,130,110,.22);color:#FFC9BB}

/* ---------- כפתורי איקון משותפים ---------- */
.pr-ic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  color:var(--ink3);transition:background .14s,color .14s}
.pr-ic:hover{background:var(--bg);color:var(--navy)}
.pr-ic.cv svg{transition:transform .18s}
.pr-ic.cv.on svg{transform:rotate(180deg)}

/* ---------- המפגשים ---------- */
.pr-steps{padding:14px}
.pr-step{background:#fff;border:1px solid var(--cardbd);border-radius:12px;margin-bottom:9px;
  transition:border-color .14s,box-shadow .14s}
.pr-step:last-child{margin-bottom:0}
.pr-step:hover{border-color:var(--bd)}
.pr-step.open{border-color:var(--bd);box-shadow:var(--lift)}
.pr-h{position:relative;display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer}
.pr-n{flex:none;width:27px;height:27px;border-radius:50%;background:var(--chip);color:var(--ink2);
  display:grid;place-items:center;font-size:12px;font-weight:700}
.pr-step.open .pr-n{background:var(--tint);color:var(--navy)}
/* הכותרות באורכים שונים; הסטטוס נשאר בעמודה קבועה לפני הפקדים, כך שאפשר
   לרוץ עם העין למטה על 27 השורות ולראות מה הושלם ומה ממתין. */
.pr-t{flex:0 1 auto;min-width:0;font-size:13.5px;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-h .sp{flex:1 1 auto;min-width:14px}
.pr-step.open .pr-t{color:var(--navy)}
.pr-st{flex:none;font-size:11px;font-weight:600;line-height:1.5;border-radius:999px;
  padding:3px 11px;white-space:nowrap}
.pr-st.none{background:var(--chip);color:var(--ink3)}
.pr-st.wait{background:#FFF4E2;color:var(--warn)}
.pr-st.ok{background:#E9F6EF;color:var(--good)}
.pr-grip{flex:none;width:20px;height:24px;display:grid;place-items:center;color:var(--faint);cursor:grab}
.pr-h:hover .pr-grip{color:var(--ink3)}

/* תפריט שלוש הנקודות — נתלה על הכפתור עצמו ולא על השורה, אחרת בפריסה מלאה
   הוא נופל בקצה השני של המסך, רחוק מהמפגש שעליו לחצו. */
.pr-kbw{position:relative;flex:none;display:flex}
.pr-menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;z-index:20;min-width:160px;cursor:default;
  background:#fff;border:1px solid var(--cardbd);border-radius:11px;padding:5px;
  box-shadow:0 16px 38px -12px rgba(12,64,104,.3)}
.pr-menu button{display:block;width:100%;text-align:start;border-radius:8px;padding:7px 11px;
  font-size:12.5px;font-weight:500;color:var(--ink)}
.pr-menu button:hover{background:var(--tint);color:var(--navy)}
.pr-menu button.rm{color:var(--ink2)}
.pr-menu button.rm:hover{background:#FDF2EF;color:var(--coral-d)}

/* גוף המפגש — הנושאים */
.pr-body{padding:0 14px 14px;border-top:1px solid var(--tint)}
/* לכל מפגש ארבעה נושאים — ארבע עמודות בפריסה רחבה, שתיים בבינונית, אחת בצרה.
   auto-fill היה פורש אותם על יותר עמודות ממה שיש, והשורה נראתה קרועה. */
.pr-topics{list-style:none;display:grid;gap:9px 26px;margin-top:12px;
  grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.pr-topics{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1240px){.pr-topics{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pr-topics li{position:relative;padding-inline-start:17px;font-size:12.5px;color:var(--ink2);line-height:1.55}
.pr-topics li::before{content:"";position:absolute;inset-inline-start:2px;top:7px;width:6px;height:6px;
  border-radius:2px;background:var(--sky);transform:rotate(45deg)}

/* הפגישה המשויכת למפגש */
.pr-meet{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;
  background:var(--tint);border:1px solid var(--bd);border-radius:12px;padding:12px 15px}
.pm-l{flex:1 1 250px;min-width:0}
.pm-t{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13.5px;font-weight:700;color:var(--navy)}
.pm-m{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--ink3)}
.pm-m span{display:inline-flex;align-items:center;gap:5px}
.pm-done{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--good)}

/* אישור ההסרה — פופאפ פנימי של המסך */
.pr-cf .s b{color:var(--ink2);font-weight:600}
</style>
</head>
<body data-cli="flow">
<main class="wrap">
  <div id="flowRoot"></div>
</main>

<!-- אישור הסרת התוכנית — ✕, Escape ולחיצה על הרקע -->
<div class="ov" id="delOv" onclick="if(event.target===this)delClose()">
  <div class="md pr-cf" role="dialog" aria-modal="true" aria-labelledby="delTtl">
    <button class="x" onclick="delClose()" aria-label="סגירה">✕</button>
    <h3 id="delTtl">הסרת התוכנית</h3>
    <div class="s">התוכנית <b>GOLD</b> וכל 27 המפגשים יוסרו מהלקוח.</div>
    <div class="ft">
      <button class="btn pri" onclick="delYes()">הסרה</button>
      <button class="btn pln" onclick="delClose()">ביטול</button>
    </div>
  </div>
</div>

<script src="cli.js"></script>
<script>
hkChrome('flow',{strip:false});

/* ===== התוכנית והמפגשים — זהים ל-js/flow.js ===== */
var FLOW_PROG={ name:'GOLD', open:true };
var FLOW_STEPS=[
  {t:'בניית הזהות העסקית של העסק', topics:[
    'הגדרת האסטרטגיה העסקית',
    'בניית מודל עסקי רווחי וסקיילבילי',
    'הגדרת זהות עסקית מדויקת — קהל יעד, בידול, מתחרים',
    'בניית יעדים שנתיים מדידים וברורים'],
   meet:{who:'אסתי ביטון', date:'11.06.2026', time:'00:00-01:00', adv:'אופיר יועץ', st:'wait'}},
  {t:'בניית האסטרטגיה העסקית לשנה הקרובה', topics:[
    'קיבוע אסטרטגיה מותאמת אישית',
    'קביעת כיווני צמיחה',
    'סינון רעשים והחלטות עסקיות נכונות',
    'בניית תמונת עתיד עסקית ברורה']},
  {t:'בניית מוצרי הדגל של העסק', topics:[
    'מיפוי סל המוצרים הקיים',
    'זיהוי מוצר הדגל והמוצרים הנלווים',
    'תמחור לפי ערך ולא לפי עלות',
    'בניית מדרג מוצרים למכירה']},
  {t:'יסודות ההתנהלות הפיננסית בעסק', topics:[
    'הפרדה בין כספי העסק לכספים פרטיים',
    'הבנת מבנה ההוצאות הקבועות והמשתנות',
    'קריאת דוח רווח והפסד',
    'בניית שגרת בקרה חודשית']},
  {t:'בניית התחזית הפיננסית של העסק', topics:[
    'בניית תחזית הכנסות והוצאות',
    'הגדרת יעדי תזרים חודשיים',
    'זיהוי חודשי לחץ תזרימי מראש',
    'קביעת כרית ביטחון']},
  {t:'ניהול תזרים המזומנים בפועל', topics:[
    'קריאת התזרים השוטף',
    'ניהול גבייה מלקוחות',
    'ניהול תשלומים לספקים',
    'טיפול בפערים מול היעד']},
  {t:'תמחור נכון ורווחיות', topics:['חישוב עלות אמיתית','תמחור לפי ערך','ניתוח רווחיות פר מוצר','העלאת מחירים בלי לאבד לקוחות']},
  {t:'בניית תהליך מכירה מסודר', topics:['מיפוי מסע הלקוח','בניית שיחת מכירה','טיפול בהתנגדויות','מדידת יחסי המרה']},
  {t:'שיווק ממוקד קהל יעד', topics:['בחירת ערוצי שיווק','מסרים שיווקיים','תקציב שיווק ומדידתו','בניית תוכנית תוכן']},
  {t:'בניית תשתית לקוחות חוזרים', topics:['תוכנית שימור','מכירה חוזרת','המלצות והפניות','מדידת שביעות רצון']},
  {t:'ניהול ספקים והתקשרויות', topics:['מיפוי ספקים','תנאי תשלום','משא ומתן על מחירים','חוזים והתקשרויות']},
  {t:'בניית מבנה ארגוני', topics:['הגדרת תפקידים','חלוקת אחריות','גיוס נכון','בניית נהלים']},
  {t:'ניהול צוות ומוטיבציה', topics:['שגרות ניהול','משוב והערכה','תגמול ותמריצים','טיפול בעובד לא מתפקד']},
  {t:'ניהול זמן ותעדוף', topics:['מיפוי גוזלי זמן','סדר יום ניהולי','האצלת סמכויות','עבודה על העסק ולא בעסק']},
  {t:'בניית מדדי ביצוע (KPI)', topics:['בחירת המדדים הנכונים','הגדרת יעדים למדד','שגרת מדידה','תגובה לסטייה']},
  {t:'ניהול מלאי ורכש', topics:['רמות מלאי אופטימליות','ניהול הזמנות','מלאי מת','קשר בין מלאי לתזרים']},
  {t:'אשראי, מימון ובנקים', topics:['הבנת מסגרות אשראי','עלות המימון','הכנה לפגישה בבנק','מקורות מימון חלופיים']},
  {t:'מיסוי והתנהלות מול רשויות', topics:['מקדמות ומע״מ','תכנון מס בסיסי','עבודה נכונה מול רו״ח','חובות דיווח']},
  {t:'בניית תקציב שנתי', topics:['תקציב הכנסות','תקציב הוצאות','תקציב השקעות','מעקב תקציב מול ביצוע']},
  {t:'ניתוח נקודת האיזון', topics:['חישוב נקודת איזון','תרומה שולית','מכירות מינימום נדרשות','השפעת שינוי מחיר']},
  {t:'ייעול תהליכים בעסק', topics:['מיפוי תהליכים','זיהוי צווארי בקבוק','אוטומציה','מדידת שיפור']},
  {t:'דיגיטל ומערכות מידע', topics:['מערכות ניהול','אינטגרציות','דיגיטציה של תהליכים','אבטחת מידע בסיסית']},
  {t:'ניהול סיכונים בעסק', topics:['מיפוי סיכונים','ביטוחים','תלות בלקוח או ספק בודד','תוכנית המשכיות']},
  {t:'בניית תוכנית צמיחה', topics:['זיהוי הזדמנויות','הרחבת קווי מוצר','שווקים חדשים','גיוס משאבים לצמיחה']},
  {t:'הכנה לשנה הבאה', topics:['סיכום השנה','עדכון יעדים','תוכנית עבודה שנתית','לוח זמנים רבעוני']},
  {t:'מדידת התקדמות ותיקוני מסלול', topics:['השוואה ליעדים','ניתוח פערים','תיקוני מסלול','קיבוע הצלחות']},
  {t:'סיכום התהליך והמשך דרך', topics:['סיכום כלל המפגשים','מה הושג ומה נותר','תוכנית המשך','קביעת שגרת ליווי']}
];
var FLOW_OPEN=new Set([0,1]), FLOW_MENU=null;

/* ===== איקונים ===== */
var SVG={
  plus:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  chev:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  trash:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  kebab:'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>',
  grip:'<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor" aria-hidden="true"><circle cx="2.5" cy="3" r="1.4"/><circle cx="7.5" cy="3" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="13" r="1.4"/><circle cx="7.5" cy="13" r="1.4"/></svg>',
  cal:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  clock:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  user:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>',
  check:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
};

/* ===== פעולות ===== */
function flowTgProg(){ FLOW_PROG.open=!FLOW_PROG.open; render(); }
function flowTg(i){ FLOW_OPEN.has(i)?FLOW_OPEN.delete(i):FLOW_OPEN.add(i); render(); }
function flowMenu(i){ FLOW_MENU=(FLOW_MENU===i?null:i); render(); }
function flowAdd(){ toast('הוספת מפגש לתוכנית — נפתח בורר תבניות'); }
function flowOkSum(i){ FLOW_STEPS[i].meet.st='ok'; render(); toast('סיכום המפגש אושר'); }
function flowItem(i,msg){ FLOW_MENU=null; render(); toast(msg); }

/* הסרת התוכנית — אישור פנימי במסך */
function flowDel(){ document.getElementById('delOv').classList.add('on'); }
function delClose(){ document.getElementById('delOv').classList.remove('on'); }
function delYes(){ delClose(); toast('התוכנית הוסרה'); }

/* ===== רינדור ===== */
function stepH(s,i){
  var op=FLOW_OPEN.has(i), m=s.meet;
  var st = m ? (m.st==='ok'?['הושלם','ok']:['ממתין לאישור','wait']) : ['טרם התחיל','none'];
  return '<div class="pr-step'+(op?' open':'')+'">'
    +'<div class="pr-h" onclick="flowTg('+i+')">'
      +'<span class="pr-n num">'+(i+1)+'</span>'
      +'<span class="pr-t">מפגש '+(i+1)+' — '+s.t+'</span>'
      +'<div class="sp"></div>'
      +'<span class="pr-st '+st[1]+'">'+st[0]+'</span>'
      +'<button class="pr-ic cv'+(op?' on':'')+'" aria-expanded="'+op+'" aria-label="'+(op?'סגירת המפגש':'פתיחת המפגש')+'"'
        +' onclick="event.stopPropagation();flowTg('+i+')">'+SVG.chev+'</button>'
      +'<span class="pr-grip" title="גרירה לשינוי סדר">'+SVG.grip+'</span>'
      +'<span class="pr-kbw">'
        +'<button class="pr-ic kb" aria-label="עוד פעולות למפגש '+(i+1)+'" aria-haspopup="menu"'
          +' aria-expanded="'+(FLOW_MENU===i)+'" onclick="event.stopPropagation();flowMenu('+i+')">'+SVG.kebab+'</button>'
        +(FLOW_MENU===i
          ? '<div class="pr-menu" role="menu" onclick="event.stopPropagation()">'
            +'<button role="menuitem" onclick="flowItem('+i+',\'עריכת המפגש\')">עריכת מפגש</button>'
            +'<button role="menuitem" onclick="flowItem('+i+',\'שכפול המפגש\')">שכפול</button>'
            +'<button role="menuitem" class="rm" onclick="flowItem('+i+',\'המפגש הוסר\')">הסרה</button></div>'
          : '')
      +'</span>'
    +'</div>'
    +(op
      ? '<div class="pr-body">'
        +'<ul class="pr-topics">'+s.topics.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>'
        +(m
          ? '<div class="pr-meet"><div class="pm-l">'
            +'<div class="pm-t">'+m.who+', <span class="num" dir="ltr">'+m.date.split('.').reverse().join('-')+'</span>'
              +'<span class="pr-st '+(m.st==='ok'?'ok':'wait')+'">'+(m.st==='ok'?'אושר':'ממתין לאישור')+'</span></div>'
            +'<div class="pm-m">'
              +'<span>'+SVG.cal+'<span class="num">'+m.date+'</span></span>'
              +'<span dir="ltr">'+SVG.clock+'<span class="num">'+m.time+'</span></span>'
              +'<span>'+SVG.user+m.adv+'</span>'
            +'</div></div>'
            +(m.st==='ok'
              ? '<span class="pm-done">'+SVG.check+'הסיכום אושר</span>'
              : '<button class="btn pri" onclick="flowOkSum('+i+')">אישור הסיכום</button>')
          +'</div>'
          : '')
      +'</div>'
      : '')
  +'</div>';
}

function render(){
  var N=FLOW_STEPS.length;
  var done=FLOW_STEPS.filter(function(s){return s.meet&&s.meet.st==='ok';}).length;
  document.getElementById('flowRoot').innerHTML=
    '<div class="pr-head">'
      +'<div class="pr-top"><h2>תהליך ליווי עסקי</h2><div class="sp"></div>'
        +'<button class="btn pri" onclick="flowAdd()">'+SVG.plus+' הוספת מפגש</button></div>'
      +'<div class="pr-prog"><span class="pr-plbl num">שלב '+done+' מתוך '+N+'</span>'
        +'<div class="pr-bar"><i style="width:'+Math.round(done/N*100)+'%"></i></div></div>'
    +'</div>'
    +'<section class="panel">'
      +'<div class="pr-ph" onclick="flowTgProg()">'
        +'<span class="nm">'+FLOW_PROG.name+'</span>'
        +'<span class="n num">'+N+'</span>'
        +'<div class="sp"></div>'
        +'<button class="pr-ic cv'+(FLOW_PROG.open?' on':'')+'" aria-expanded="'+FLOW_PROG.open+'"'
          +' aria-label="'+(FLOW_PROG.open?'סגירת התוכנית':'פתיחת התוכנית')+'"'
          +' onclick="event.stopPropagation();flowTgProg()">'+SVG.chev+'</button>'
        +'<button class="pr-ic del" aria-label="הסרת התוכנית"'
          +' onclick="event.stopPropagation();flowDel()">'+SVG.trash+'</button>'
      +'</div>'
      +(FLOW_PROG.open
        ? '<div class="pr-steps">'+FLOW_STEPS.map(stepH).join('')+'</div>'
        : '')
    +'</section>';
}

/* סגירת תפריט שלוש הנקודות — לחיצה מחוץ לו או Escape */
document.addEventListener('click',function(e){
  if(FLOW_MENU!==null && !e.target.closest('.pr-menu') && !e.target.closest('.pr-ic.kb')){FLOW_MENU=null;render();}
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape') return;
  if(FLOW_MENU!==null){FLOW_MENU=null;render();}
  delClose();   /* אישור ההסרה נסגר גם אם הכרום המשותף לא הספיק */
});

render();
</script>
</body>
</html>
