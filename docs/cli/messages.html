<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אנרגי אינטרנשיונל · תקשורת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cli.css">
<style>
/* =====================================================================
   קבוצת הוואטסאפ — CLIENT_SCREENS_SPEC §3.2
   הגרסה העצמאית של המסך שנבנה בכרטיס החברה (js/ops.js · MSGS_THREADS).
   שלוש רמות כרונולוגיה: גלולת יום · בועות · כרטיס הסיכום הלילי.
   זה מסך יועץ — הסיכומים והתיוגים נשארים גלויים. אין תיבת כתיבה:
   היועץ עונה בוואטסאפ עצמו.
   ===================================================================== */
.mg{display:flex;gap:18px;align-items:flex-start}
.mg-side{flex:none;width:288px;position:sticky;top:20px}
.mg-main{flex:1;min-width:0}

/* ---------- סרגל הקבוצות ---------- */
.mg-grp+.mg-grp{margin-top:8px}
.mg-th{width:100%;display:flex;align-items:center;gap:10px;text-align:start;
  background:#fff;border:1px solid var(--cardbd);border-radius:14px;box-shadow:var(--lift);padding:12px 15px}
.mg-th:hover{border-color:#D6E3EF}
.mg-grp.on .mg-th{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy),var(--lift)}
.mg-tb{min-width:0;flex:1}
.mg-tb b{display:block;font-size:13.5px;font-weight:700;color:var(--navy)}
.mg-tb span{display:block;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mg-n{font-style:normal;flex:none;min-width:19px;height:19px;padding:0 6px;border-radius:99px;
  background:var(--coral);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
/* המשתתפים — תמיד תחת הקבוצה הנבחרת */
.mg-ppl{padding:12px 6px 4px}
.mg-ppl .h{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.3px;margin:0 9px 8px}
.mg-p{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:10px}
.mg-p i{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-style:normal;font-size:12px;font-weight:700}
.mg-p b{font-size:12.5px;font-weight:500;color:var(--ink)}
.mg-p span{font-size:11px;color:var(--ink3)}
.mg-p.unk b{font-variant-numeric:tabular-nums;direction:ltr}
.mg-p.unk span{color:var(--warn);font-weight:500}
/* גוון לפי תפקיד — אותו קוד צבע גם באווטאר בשיחה */
.cl  i{background:#E4F0F9;color:#0C4068}
.adv i{background:#FBEAE4;color:#B9553B}
.me  i{background:#E4F1EA;color:#0F7350}
.bot i{background:#EDF2F8;color:#8496A6}
.unk i{background:#FBF0DC;color:#9A6300}

/* ---------- חלון השיחה ---------- */
.mg-box{background:#fff;border:1px solid var(--cardbd);border-radius:14px;box-shadow:var(--lift);
  display:flex;flex-direction:column;overflow:hidden}
.mg-head{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--tint);flex:none}
.mg-head h2{font-size:15px;font-weight:700;color:var(--navy)}
.mg-head .cnt{font-size:11.5px;color:var(--ink3)}
.mg-head .sp{margin-inline-start:auto}
.mg-sr{position:relative}
.mg-sr input{width:210px;border:1px solid var(--bd);border-radius:999px;padding:6px 32px 6px 14px;font-size:12.5px}
.mg-sr input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(57,171,226,.15)}
.mg-sr svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
/* הגלילה קורית כאן בלבד — הכותרת וגלולת היום לא נגללות החוצה */
.mg-scroll{flex:1;overflow-y:auto;padding:16px 20px 20px;background:linear-gradient(180deg,#FAFCFE,#fff 90px)}

.mg-day{display:flex;align-items:center;justify-content:center;margin:14px 0 12px}
.mg-day span{background:var(--chip);color:var(--ink2);font-size:11.5px;font-weight:600;
  border-radius:999px;padding:4px 14px}
.mg-msg{display:flex;gap:11px;padding:7px 0}
.mg-msg i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-style:normal;font-size:12.5px;font-weight:700;margin-top:2px}
/* עמודת קריאה — בלי התקרה השעה נזרקת לקצה השני של המסך ומתנתקת מההודעה */
.mg-bd{min-width:0;flex:1;max-width:820px}
.mg-mh{display:flex;align-items:baseline;gap:8px}
.mg-mh b{font-size:12.5px;font-weight:600;color:var(--ink)}
.mg-mh .j{font-size:11px;color:var(--ink3)}
/* השעה צמודה לשם ולא נזרקת לקצה — ההודעות קצרות, ומרחק גדול מנתק אותה מהן */
.mg-mh .t{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.mg-mh .t::before{content:"· "}
.mg-t{font-size:13.5px;color:var(--ink);line-height:1.6;margin-top:2px}
.mg-msg.unk .mg-mh b{direction:ltr;font-variant-numeric:tabular-nums}
.mg-tag{display:inline-block;margin-top:5px;font-size:11px;font-weight:600;color:var(--navy);
  background:var(--tint);border-radius:999px;padding:2px 10px}
.mg-msg.hit .mg-t{background:#FFF4CF;border-radius:8px;padding:2px 6px;margin-inline-start:-6px}

/* ---------- כרטיס הסיכום הלילי ---------- */
.mg-sum{background:var(--band);color:#fff;border-radius:12px;padding:14px 17px;margin:14px 0 6px}
.mg-sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.mg-sh b{font-size:13px;font-weight:700}
.mg-sh span{font-size:11.5px;color:var(--on-navy3)}
.mg-sh a{margin-inline-start:auto;font-size:11.5px;font-weight:600;color:#7CC9F2}
.mg-sh a:hover{text-decoration:underline}
.mg-fam{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  color:var(--on-navy2);margin:9px 0 5px}
.mg-fam:first-child{margin-top:0}
.mg-fam .dot{width:7px;height:7px;border-radius:50%}
.mg-fam.co .dot{background:#7CC9F2}
.mg-fam.pr .dot{background:#A99BF0}
.mg-sl{display:flex;align-items:baseline;gap:10px;font-size:13px;color:#EAF3F9;
  line-height:1.6;padding:3px 0 3px 0;margin-inline-start:14px;position:relative}
.mg-sl::before{content:"";position:absolute;inset-inline-start:-14px;top:10px;width:4px;height:4px;
  border-radius:50%;background:rgba(255,255,255,.4)}
/* התגית צמודה לשורה שלה — ב"auto" היא נזרקת לקצה השני של הכרטיס */
.mg-slc{flex:none;font-size:10.5px;color:var(--on-navy3);
  border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:1px 9px}
.mg-unk{margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);
  font-size:11.5px;color:#F2C98A;display:flex;align-items:center;gap:7px}
.mg-unk svg{flex:none}
/* ממתין לעיבוד — לא כרטיס, רק שורה */
.mg-wait{display:flex;align-items:center;gap:8px;margin:14px 0 4px;padding:9px 14px;
  border:1px dashed var(--bd);border-radius:10px;font-size:12px;color:var(--ink3)}
.mg-wait .sd{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.mg-wait b{color:var(--ink2);font-weight:600}

/* ---------- הרגל: אין תיבת כתיבה ---------- */
.mg-foot{flex:none;display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--tint)}
.mg-foot .note{font-size:12px;color:var(--ink3)}
.mg-empty{padding:40px 0;text-align:center;font-size:13px;color:var(--ink3)}
@media(max-width:1100px){.mg{flex-direction:column}.mg-side{position:static;width:100%}}

/* =====================================================================
   תקשורת — שני ערוצים באותו מסך: הקבוצה בוואטסאפ, והשיחות בטלפון.
   פגישה מתואמת מראש ונמשכת שעה; שיחה קורית באמצע היום ונמשכת ארבע דקות,
   ובכל זאת נסגרות בה החלטות — ולכן גם לה יש תמלול, סיכום ומשימות.
   הקידומת cl- שומרת מהתנגשות עם .mg- של הוואטסאפ ועם cli.css.
   ===================================================================== */
.ch-tabs{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--cardbd)}
.ch-tabs button{position:relative;border:0;background:none;font:inherit;padding:9px 15px 12px;
  font-size:13.5px;font-weight:600;color:var(--ink3);cursor:pointer;display:flex;align-items:center;gap:7px}
.ch-tabs button:hover{color:var(--navy)}
.ch-tabs button.on{color:var(--navy)}
.ch-tabs button.on::after{content:"";position:absolute;inset-inline:10px;bottom:-1px;height:2px;
  border-radius:99px;background:var(--coral)}
.ch-tabs button i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink3);
  background:var(--bg);border-radius:999px;padding:1px 7px}
.ch-tabs button.on i{background:var(--tint);color:#14618F}

.cl-grid{display:grid;grid-template-columns:392px minmax(0,1fr);gap:16px;align-items:start}
/* display:grid מנצח את כלל ה-hidden של הדפדפן — בלי זה שני הערוצים
   מוצגים יחד. אותה מלכודת שכבר נפלנו בה ב-.born. */
.mg[hidden],.cl-grid[hidden]{display:none}
@media(max-width:1120px){.cl-grid{grid-template-columns:minmax(0,1fr)}}
.cl-sum{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 18px;
  border-bottom:1px solid var(--tint);font-size:11.5px;color:var(--ink3)}
.cl-sum b{color:var(--navy);font-weight:600;font-variant-numeric:tabular-nums}
.cl-sum .dot{width:3px;height:3px;border-radius:50%;background:var(--bd2)}
.cl-fil{display:flex;gap:5px;padding:10px 16px;border-bottom:1px solid var(--tint)}
.cl-fil button{border:1px solid var(--cardbd);background:#fff;color:var(--ink3);font:inherit;
  font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 12px;cursor:pointer;transition:.12s}
.cl-fil button:hover{border-color:var(--sky);color:#14618F}
.cl-fil button.on{background:var(--band);border-color:var(--band);color:#fff}
.cl-list{max-height:min(64vh,600px);overflow-y:auto;padding:6px 0 8px}
.cl-day{font-size:10.5px;font-weight:700;color:var(--faint);padding:11px 18px 4px;letter-spacing:.03em}
.cl-row{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:11px;align-items:center;
  text-align:start;border:0;background:none;font:inherit;padding:9px 16px;cursor:pointer;
  border-inline-start:2.5px solid transparent;transition:.12s}
.cl-row:hover{background:#FBFDFF}
.cl-row.on{background:var(--tint);border-inline-start-color:var(--band)}
.cl-ico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  flex:none;background:#EAF4FB;color:#14618F}
.cl-row.out .cl-ico{background:#EDE9FD;color:#5B41C4}
.cl-b{min-width:0}
.cl-b b{display:block;font-size:13px;font-weight:600;color:var(--navy);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-b span{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-w{text-align:end;flex:none}
.cl-w b{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.cl-w span{display:block;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:1px}

.cl-h{padding:16px 20px 14px;border-bottom:1px solid var(--tint)}
.cl-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  border-radius:999px;padding:3px 11px;margin-bottom:9px}
.cl-tag.in{background:#EAF4FB;color:#14618F}
.cl-tag.out{background:#EDE9FD;color:#5B41C4}
.cl-h h2{font-size:17px;font-weight:600;color:var(--navy);line-height:1.35}
.cl-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:8px;
  font-size:12px;color:var(--ink3)}
.cl-meta b{color:var(--navy);font-weight:600}
.cl-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--bd2)}
.cl-play{display:inline-flex;align-items:center;gap:9px;margin-top:12px;border:1px solid var(--cardbd);
  background:#fff;border-radius:999px;padding:6px 8px 6px 14px;cursor:pointer;transition:.13s}
.cl-play:hover{border-color:var(--sky);background:#FBFDFF}
.cl-play .pl{width:24px;height:24px;border-radius:50%;background:var(--band);color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center}
.cl-play .wv{display:flex;align-items:center;gap:2px;height:17px}
.cl-play .wv i{width:2px;border-radius:2px;background:#9EC6E2}
.cl-play b{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}

.cl-tabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--tint);background:#FCFDFE}
.cl-tabs button{position:relative;border:0;background:none;font:inherit;padding:12px 14px;
  font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer}
.cl-tabs button:hover{color:var(--navy)}
.cl-tabs button.on{color:var(--navy)}
.cl-tabs button.on::after{content:"";position:absolute;inset-inline:12px;bottom:-1px;height:2px;
  border-radius:99px;background:var(--coral)}
.cl-body{padding:16px 20px 20px}
.cl-dh{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.03em;margin-bottom:9px}
.cl-dh.t2{margin-top:18px}
.cl-pnt{display:flex;gap:9px;font-size:13px;color:var(--ink);line-height:1.65;padding:5px 0}
.cl-pnt .n{font-weight:700;color:#39ABE2;flex:none;font-variant-numeric:tabular-nums}
.cl-tsk{display:flex;align-items:center;gap:9px;background:#FBFDFE;border:1px solid var(--tint);
  border-radius:10px;padding:9px 12px;margin-top:6px;font-size:12.5px;color:var(--navy)}
.cl-tsk .mk{width:17px;height:17px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:700;border:1.5px solid var(--bd2);color:transparent}
.cl-tsk.ok .mk{background:#0B6E4B;border-color:#0B6E4B;color:#fff}
.cl-tsk .who{margin-inline-start:auto;font-size:10.5px;color:var(--faint);flex:none}

.cl-tx{display:flex;flex-direction:column}
.cl-txr{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:8px 0;
  border-bottom:1px solid #F4F8FB}
.cl-txr:last-child{border-bottom:0}
.cl-txr .tm{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:2px}
.cl-txr .sp2{display:block;font-size:11px;font-weight:700;color:#14618F;margin-bottom:2px}
.cl-txr.them .sp2{color:#5B41C4}
.cl-txr p{font-size:13px;color:var(--ink);line-height:1.65}
.cl-txf{display:flex;align-items:center;gap:9px;margin-top:14px;padding-top:13px;
  border-top:1px solid var(--tint);font-size:11.5px;color:var(--ink3)}
.cl-txf .sp{flex:1}
.cl-note{font-size:12px;color:var(--ink3);line-height:1.7;background:#FBFDFE;border:1px solid var(--tint);
  border-radius:11px;padding:13px 15px}
.cl-empty{padding:40px 20px;text-align:center;font-size:12.5px;color:var(--ink3)}
</style>
</head>
<body data-cli="msgs">
<main class="wrap">
  <div class="ch-tabs" id="chTabs"></div>

  <div class="mg" id="chWa">
    <aside class="mg-side" id="mgSide"></aside>
    <div class="mg-main">
      <div class="mg-box" id="mgBox">
        <div class="mg-head">
          <h2 id="mgName"></h2><span class="cnt" id="mgCnt"></span>
          <span class="sp"></span>
          <div class="mg-sr">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.2-4.2"/></svg>
            <input id="mgQ" placeholder="חיפוש בהודעות" oninput="mgRender(false)">
          </div>
        </div>
        <div class="mg-scroll" id="mgScroll"></div>
        <div class="mg-foot">
          <a class="btn pri" href="#" onclick="toast('בדמו: וואטסאפ ייפתח על הקבוצה');return false">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 20.5l1.7-5.5A8.4 8.4 0 1 1 21 11.5z"/></svg>
            המשך בוואטסאפ</a>
          <span class="note">התשובות נכתבות בוואטסאפ עצמו — כאן קוראים מה עבר ומה נכנס לזיכרון.</span>
        </div>
      </div>
    </div>
  </div>

  <div class="cl-grid" id="chCalls" hidden>
    <section class="panel">
      <div class="cl-sum" id="clSum"></div>
      <div class="cl-fil" id="clFil"></div>
      <div class="cl-list" id="clList"></div>
    </section>
    <section class="panel" id="clOne"></section>
  </div>
</main>

<script src="cli.js"></script>
<script>
hkChrome('msgs',{strip:false});

/* הנתונים כמו ב-js/ops.js · MSGS_THREADS — לא שוכפלו ברוח, הועתקו במדויק */
const S=(t,cat,sc,on)=>({t,cat,sc:sc||'co',on:on||''});
const THREADS={
  group:{name:'תפעול · אנרגי אינטרנשיונל', ppl:[
      {n:'צחי עובד',j:'בעלים',r:'cl'},{n:'רות אלמוג',j:'מנהלת כספים',r:'cl'},
      {n:'אילון שחר',j:'יועץ',r:'adv'},{n:'טל מלקר',j:'מנהל תזרים · HK',r:'me'},
      {n:'054-771-2280',r:'unk',unk:1},{n:'בוט HK',j:'אוטומטי',r:'bot'}], msgs:[
    {day:'אתמול · רביעי 01.07'},
    {who:'צחי עובד', job:'בעלים', role:'cl', t:'מצרף את אישור ההעברה ללדובק [קובץ]', time:'10:12', tag:'משימת הזנה'},
    {who:'טל מלקר', job:'מנהל תזרים · HK', role:'me', t:'תודה! חסר לי עוד מועד פירעון לשיק 21036', time:'10:20', tag:'בקשה פתוחה'},
    {who:'אילון שחר', job:'יועץ', role:'adv', t:'צחי, מחר ב-16:00 עוברים על התקציב לקראת הרבעון', time:'12:40'},
    {who:'צחי עובד', job:'בעלים', role:'cl', t:'סגור. דרך אגב — סגרנו את החוזה עם מרכז הבנייה', time:'12:44'},
    {who:'רות אלמוג', job:'מנהלת כספים', role:'cl', t:'אני אשלח את הדוח, צחי לא מעורב בזה בדרך כלל', time:'12:51'},
    {who:'054-771-2280', role:'unk', t:'שלום, מצרף את הצעת המחיר לליסינג החדש [PDF]', time:'12:58'},
    {who:'בוט HK', job:'אוטומטי', role:'bot', t:'סיכום פגישת 09:00 נשלח · נפתחו 3 משימות', time:'13:05'},

/* קיבוץ לפי משפחת זיכרון — קודם העסק ואז אדם-אדם, כמו שתי העמודות במסך הזיכרון.
   הנקודה הצבועה עולה מהשורה לכותרת המשפחה, ולכן שם האדם נאמר פעם אחת. */
function fam(lines){
  const out=[];
  lines.forEach(l=>{const sc=l.sc==='pr'?'pr':'co', k=sc==='pr'?'pr:'+l.on:'co';
    let g=out.find(x=>x.k===k);
    if(!g){g={k,sc,n:sc==='pr'?(l.on||'זיכרון האדם'):'העסק',lines:[]};out.push(g);}
    g.lines.push(l);});
  return out.sort((a,b)=>(a.sc==='co'?0:1)-(b.sc==='co'?0:1));
}
const pendOf=g=>{const m=[...g.msgs].reverse().find(x=>x.sum&&x.sum.pending);return m?m.sum.pending:0};

function sumHtml(s){
  if(s.pending) return `<div class="mg-wait"><span class="sd"></span>
    הסיכום הלילי ירוץ הלילה ב-02:00 · <b>${s.pending}</b> הודעות ממתינות לעיבוד</div>`;
  return `<div class="mg-sum">
    <div class="mg-sh"><b>נכנס לזיכרון החברה</b>
      <span>סיכום לילי · רץ ב-${s.ran} · ${s.n} הודעות</span>
      <a href="ai.html?q=${encodeURIComponent('מה נכנס לזיכרון מהקבוצה?')}">לזיכרון המלא ←</a></div>
    <div>${fam(s.lines).map(g=>
      `<div class="mg-fam ${g.sc}"><span class="dot"></span>${esc(g.n)}</div>`+
      g.lines.map(l=>`<div class="mg-sl">${esc(l.t)}<span class="mg-slc">${esc(l.cat)}</span></div>`).join('')
    ).join('')}</div>
    ${s.unk?`<div class="mg-unk">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <span><bdo dir="ltr">${esc(s.unk)}</bdo> אינו מזוהה — מה שנאמר ממנו לא שויך לזיכרון אישי</span></div>`:''}
  </div>`;
}

function mgRender(toBottom){
  const q=(document.getElementById('mgQ').value||'').trim();
  const T=THREADS[SEL];

  /* סרגל הקבוצות + המשתתפים של הנבחרת */
  document.getElementById('mgSide').innerHTML=Object.keys(THREADS).map(k=>{
    const g=THREADS[k], last=[...g.msgs].reverse().find(m=>!m.day&&!m.sum), p=pendOf(g);
    return `<div class="mg-grp ${k===SEL?'on':''}">
      <button class="mg-th" onclick="SEL='${k}';document.getElementById('mgQ').value='';mgRender(true)">
        <div class="mg-tb"><b>${esc(g.name)}</b>
          <span>${last?esc(last.t.slice(0,40)+(last.t.length>40?'…':'')):''}</span></div>
        ${p?`<i class="mg-n">${p}</i>`:''}
      </button>
      ${k===SEL?`<div class="mg-ppl"><div class="h">משתתפים · ${g.ppl.length}</div>
        ${g.ppl.map(p=>`<div class="mg-p ${p.r}"><i>${p.r==='unk'?'?':esc(INI(p.n))}</i>
          <div><b>${esc(p.n)}</b>${p.j?`<span> · ${esc(p.j)}</span>`:'<span> · לא מזוהה</span>'}</div>
        </div>`).join('')}</div>`:''}
    </div>`;}).join('');

  document.getElementById('mgName').textContent=T.name;
  const nMsg=T.msgs.filter(m=>!m.day&&!m.sum).length;
  document.getElementById('mgCnt').textContent=q
    ? nMsg+' הודעות · מסונן ל"'+q+'"' : nMsg+' הודעות אחרונות';

  /* הזרם: גלולת יום · בועות · כרטיס סיכום */
  let html='',shown=0;
  T.msgs.forEach(m=>{
    if(m.day){ if(!q) html+=`<div class="mg-day"><span>${esc(m.day)}</span></div>`; return; }
    if(m.sum){ if(!q) html+=sumHtml(m.sum); return; }
    const hit=q&&(m.t.includes(q)||String(m.who).includes(q));
    if(q&&!hit) return;
    shown++;
    html+=`<div class="mg-msg ${m.role} ${hit?'hit':''}">
      <i>${m.role==='unk'?'?':esc(INI(m.who))}</i>
      <div class="mg-bd">
        <div class="mg-mh"><b>${esc(m.who)}</b>
          <span class="j">${m.job?esc(m.job):'לא מזוהה'}</span>
          <span class="t">${esc(m.time)}</span></div>
        <div class="mg-t">${esc(m.t)}</div>
        ${m.tag?`<span class="mg-tag">${esc(m.tag)}</span>`:''}
      </div></div>`;
  });
  if(q&&!shown) html='<div class="mg-empty">לא נמצאו הודעות שמכילות "'+esc(q)+'"</div>';
  const sc=document.getElementById('mgScroll');
  sc.innerHTML=html;
  /* הכניסה נוחתת על ההודעה האחרונה */
  if(toBottom!==false) sc.scrollTop=sc.scrollHeight;
}

/* גובה החלון נגזר מהכרום — הכותרת, גלולת היום והרגל לא נגללים */
function mgFit(){
  const box=document.getElementById('mgBox');
  const top=box.getBoundingClientRect().top;
  box.style.height=Math.max(420,innerHeight-top-44)+'px';
  const sc=document.getElementById('mgScroll'); sc.scrollTop=sc.scrollHeight;
}

}
function kFil(){
  const n=k=>k==='all'?CALLS.length:CALLS.filter(c=>c.dir===k).length;
  document.getElementById('clFil').innerHTML=
    [['all','הכול'],['in','נכנסות'],['out','יוצאות']].map(([k,l])=>
      `<button class="${KFIL===k?'on':''}" onclick="kSetFil('${k}')">${l} ${n(k)}</button>`).join('');
}
function kSetFil(k){KFIL=k;kFil();kRows();}
function kRows(){
  const l=kList(), host=document.getElementById('clList');
  if(!l.length){host.innerHTML='<div class="cl-empty">אין שיחות בתצוגה הזאת.</div>';return}
  let last='',h='';
  l.forEach(c=>{
    if(c.date!==last){h+=`<div class="cl-day">${kDay(c.date)}</div>`;last=c.date}
    h+=`<button class="cl-row ${c.dir} ${KSEL===c.id?'on':''}" onclick="kPick('${c.id}')">
      <span class="cl-ico">${KICO[c.dir]}</span>
      <span class="cl-b"><b>${c.who}</b><span>${c.topic}</span></span>
      <span class="cl-w"><b dir="ltr">${c.at}</b><span dir="ltr">${c.dur}</span></span>
    </button>`;
  });
  host.innerHTML=h;
}
function kPick(id){KSEL=id;KTAB='sum';kRows();kOne();}
function kSetTab(k){KTAB=k;kOne();}
function kOne(){
  const c=CALLS.find(x=>x.id===KSEL), host=document.getElementById('clOne');
  if(!c){host.innerHTML='<div class="cl-empty">בחרו שיחה מהרשימה.</div>';return}
  const dl=KDIR[c.dir][0], dc=KDIR[c.dir][1];
  /* התמלול הוא כלי עבודה של היועץ — אצל בעל העסק נשארים הסיכום והמשימות */
  const tabs=[['sum','סיכום השיחה',1],['tx','תמלול',!KCLI],
              ['tasks','משימות',!!(c.tasks&&c.tasks.length)]].filter(x=>x[2]);
  if(!tabs.some(x=>x[0]===KTAB)) KTAB=tabs[0][0];
  const wave=Array.from({length:22},(_,i)=>`<i style="height:${4+((i*7)%12)}px"></i>`).join('');
  host.innerHTML=`
    <div class="cl-h">
      <span class="cl-tag ${dc}">${KICO[c.dir]} שיחה ${dl}</span>
      <h2>${c.topic}</h2>
      <div class="cl-meta">
        <span>${c.dir==='in'?'מ־':'אל '}<b>${c.who}</b> · ${c.role}</span><span class="dot"></span>
        <span>${c.dir==='in'?'ענתה':'התקשר'} <b>${c.side}</b> · ${c.sideRole}</span><span class="dot"></span>
        <span>${kDay(c.date)} ${c.at}</span><span class="dot"></span>
        <span dir="ltr"><b>${c.dur}</b> דק׳</span>
      </div>
      ${KCLI?'':`<button class="cl-play" onclick="toast('נגן ההקלטה — הדגמה')">
        <span class="pl"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
        <span class="wv">${wave}</span><b dir="ltr">${c.dur}</b></button>`}
    </div>
    <div class="cl-tabs">${tabs.map(x=>
      `<button class="${KTAB===x[0]?'on':''}" onclick="kSetTab('${x[0]}')">${x[1]}</button>`).join('')}</div>
    <div class="cl-body">${kBody(c)}</div>`;
  if(typeof fit==='function') fit();
}
function kBody(c){
  if(KTAB==='sum') return `
    <div class="cl-dh">מה נסגר בשיחה</div>
    ${c.sum.map((x,i)=>`<div class="cl-pnt"><span class="n">${i+1}.</span><span>${x}</span></div>`).join('')}
    ${c.tasks&&c.tasks.length?`<div class="cl-dh t2">משימות שנפתחו מהשיחה</div>
      ${c.tasks.map(k=>`<div class="cl-tsk ${k.done?'ok':''}"><span class="mk">✓</span>
        <span>${k.t}</span><span class="who">${k.who}</span></div>`).join('')}`:''}`;
  if(KTAB==='tasks') return `
    <div class="cl-note">אלה המשימות שנפתחו מהשיחה הזאת. הן חיות באותו מקום כמו המשימות
      שנפתחות מפגישה — אצל בעל העסק ואצל מנהלת התזרים.</div>
    <div style="margin-top:12px">${c.tasks.map(k=>`<div class="cl-tsk ${k.done?'ok':''}">
      <span class="mk">✓</span><span>${k.t}</span>
      <span class="who">${k.done?'הושלמה · ':''}${k.who}</span></div>`).join('')}</div>`;
  return `<div class="cl-dh">התמלול המלא · ${c.dur} דקות</div>
    <div class="cl-tx">${c.tr.map(r=>
      `<div class="cl-txr ${r[1]==='them'?'them':''}">
        <span class="tm" dir="ltr">${r[0]}</span>
        <div><span class="sp2">${r[2]}</span><p>${r[3]}</p></div>
      </div>`).join('')}</div>
    <div class="cl-txf"><span>התמלול נוצר אוטומטית מההקלטה, והוא המקור לסיכום ולמשימות.</span>
      <span class="sp"></span>
      <button class="btn pln" onclick="toast('התמלול ירד כקובץ')">הורדת התמלול</button></div>`;
}
function kRender(){kSum();kFil();kRows();kOne();}
chTabs();

</script>
</body>
</html>
