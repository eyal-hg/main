.wrap{max-width:1580px;margin:0 auto;padding:16px 20px 28px}

html.embed,html.embed body{height:100%}

.cl-grid{display:grid;grid-template-columns:392px minmax(0,1fr);gap:16px;align-items:stretch}
.cl-grid>.panel{display:flex;flex-direction:column;min-height:0}

  tr:[['0:05','them','054-771-2280','שלום, שלחתי לכם בקבוצה הצעת מחיר לליסינג. ראיתם?'],
      ['0:12','us','טל מלקר','ראיתי את ההודעה. סליחה, עם מי אני מדברת?'],
      ['0:18','them','054-771-2280','זה בקשר לרכבים החדשים, דיברנו על זה עם צחי.'],
      ['0:26','us','טל מלקר','מצוין. תוכל לשלוח לי את ההצעה כקובץ מסודר? כרגע יש לי רק צילום מסך בקבוצה.'],
      ['0:39','them','054-771-2280','אשלח היום.'],
      ['0:43','us','טל מלקר','תודה. וברשותך אני מוסיפה אותך אצלנו במערכת, כדי שהשיחות יירשמו על שמך.']]},

 {id:'k3', dir:'in', ph:'052-441-3908', side:'טל מלקר', sideRole:'מנהלת התזרים',
  date:'28.06.2026', at:'11:40', dur:'2:55', topic:'חיוב כפול ב-Payment',
  sum:['צחי זיהה חיוב כפול של 3,540 ₪ מ-Payment בכרטיס האשראי',
       'טל אישרה שהחיוב נרשם פעמיים גם בתזרים והתחילה בירור מול הספק',
       'סוכם שהזיכוי לא ייכנס לתזרים עד שיתברר שהחיוב המקורי לא יורד פעמיים'],
  tasks:[{t:'בירור חיוב כפול מול Payment', done:true, who:'טל מלקר'}],
  tr:[['0:03','them','צחי עובד','טל, יש לי חיוב כפול בכרטיס. Payment, 3,540, פעמיים באותו יום.'],
      ['0:12','us','טל מלקר','שנייה… כן, אני רואה. זה נכנס פעמיים גם אצלי בתזרים.'],
      ['0:20','them','צחי עובד','תוכלי לטפל?'],
      ['0:23','us','טל מלקר','כן, אני פותחת בירור מולם. שים לב שכשיגיע הזיכוי אני לא מכניסה אותו אוטומטית — קודם מוודאת שהחיוב המקורי לא ירד פעמיים, אחרת נוריד כפול ונקבל חור.'],
      ['0:44','them','צחי עובד','הבנתי. תעדכני אותי.']]},

 {id:'km', dir:'in', miss:1, ph:'053-820-1174', side:'טל מלקר', sideRole:'מנהלת התזרים',
  date:'26.06.2026', at:'17:32', tries:1, topic:'לא נענתה — טרם הוחזרה',
  backTo:null},

 {id:'k4', dir:'out', ph:'052-441-3908', side:'אילון שחר', sideRole:'היועץ',
  date:'24.06.2026', at:'15:10', dur:'12:47', topic:'מסגרת אשראי נוספת מול הבנק',
  sum:['הבנק מוכן לדון במסגרת נוספת של 100 אש״ח',
       'נדרש תכנון תזרימי לשישה חודשים — יופק מהמערכת ויישלח לסניף',
       'היעד: סגירה עד 15.07, לפני עונת הרכש של אוגוסט'],
  tasks:[{t:'הפקת תכנון תזרימי לשישה חודשים לבנק', done:true, who:'אילון שחר'},
         {t:'פגישה בסניף — סגירת המסגרת', done:false, who:'צחי עובד'}],
  tr:[['0:08','us','אילון שחר','צחי, דיברתי עם הסניף. הם מוכנים לדבר על עוד 100 אלף מסגרת.'],
      ['0:18','them','צחי עובד','מצוין. מה הם צריכים?'],
      ['0:22','us','אילון שחר','תכנון תזרימי לשישה חודשים. יש לנו את זה במערכת, אני מפיק ושולח להם.'],
      ['0:33','them','צחי עובד','כמה זמן זה ייקח להם?'],
      ['0:37','us','אילון שחר','שבועיים בערך. אם נסגור עד ה-15 ביולי אנחנו מסודרים לפני הרכש של אוגוסט.'],
      ['0:49','them','צחי עובד','בוא נכוון לזה.']]},
];
/* הנציגים של החברה, והמספרים שמשויכים אליהם. מספר שלא שויך נשאר
   "לא מזוהה" — בדיוק כמו בקבוצת הוואטסאפ, ששם אותו 054-771-2280
   שולח הצעת מחיר ואיש לא יודע מי הוא. השיוך נעשה פעם אחת, כאן. */
let PEOPLE=[{id:'p1',n:'צחי עובד',r:'בעלים'},{id:'p2',n:'רות אלמוג',r:'מנהלת כספים'}];
let PHONES={'052-441-3908':'p1','053-820-1174':'p2','054-771-2280':null};
const perOf=ph=>{const id=PHONES[ph];return id?PEOPLE.find(p=>p.id===id)||null:null};
const whoOf=c=>{const p=perOf(c.ph);return p?p.n:c.ph};
const roleOf=c=>{const p=perOf(c.ph);return p?p.r:'לא מזוהה'};
const isUnk=c=>!perOf(c.ph);

const KDIR={in:['נכנסת','in'],out:['יוצאת','out'],miss:['שלא נענתה','miss']};
const kKind=c=>c.miss?'miss':c.dir;
const KICO={
  in:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/><path d="M16 8l6-6M22 8V2h-6"/></svg>',
  out:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/><path d="M16 2l6 6M16 8V2h6"/></svg>',
  miss:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/><path d="M23 1l-6 6M17 1l6 6"/></svg>'};
let KSEL=CALLS[0].id, KFIL='all', KTAB='sum';

const kSecs=d=>{const a=d.split(':');return +a[0]*60+ +a[1]};
const kList=()=>KFIL==='all'?CALLS
  :KFIL==='miss'?CALLS.filter(c=>c.miss)
  :CALLS.filter(c=>c.dir===KFIL&&!c.miss);
const kDay=d=>d==='02.07.2026'?'היום · חמישי':d==='01.07.2026'?'אתמול · רביעי':d.slice(0,5);


function kSum(){
  const spoke=CALLS.filter(c=>!c.miss);
  const tot=spoke.reduce((s,c)=>s+kSecs(c.dur),0);
  const open=CALLS.filter(c=>c.miss&&!c.backTo).length;
  document.getElementById('clSum').innerHTML=
    `<b>${spoke.length}</b> שיחות<span class="dot"></span><b>${Math.round(tot/60)}</b> דקות בסך הכול`
   +`<span class="dot"></span>האחרונה <b>היום ${CALLS[0].at}</b>`
   +(open?`<span class="dot"></span><span class="no">${open===1?'שיחה אחת לא הוחזרה':open+' שיחות לא הוחזרו'}</span>`:'')
   +`<button class="cl-cog" onclick="phOpen()">
       <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
       מספרים${unkPhones().length?`<i>${unkPhones().length}</i>`:''}</button>`;
}
/* מספרים שהופיעו בשיחות ואינם משויכים לאף נציג */
const unkPhones=()=>[...new Set(CALLS.map(c=>c.ph))].filter(p=>!PHONES[p]);
function kFil(){
  const n=k=>k==='all'?CALLS.length:k==='miss'?CALLS.filter(c=>c.miss).length
                                   :CALLS.filter(c=>c.dir===k&&!c.miss).length;
  document.getElementById('clFil').innerHTML=
    [['all','הכול'],['in','נכנסות'],['out','יוצאות'],['miss','לא נענו']].map(([k,l])=>
      `<button class="${KFIL===k?'on':''}" onclick="kSetFil('${k}')">${l} ${n(k)}</button>`).join('');
}
function kSetFil(k){KFIL=k;kFil();kRows();}
function kRows(){
  const l=kList(), host=document.getElementById('clList');
  if(!l.length){host.innerHTML='<div class="cl-empty">אין שיחות בתצוגה הזאת.</div>';return}
  let last='',h='';
  l.forEach(c=>{
    if(c.date!==last){h+=`<div class="cl-day">${kDay(c.date)}</div>`;last=c.date}
    const k=kKind(c);
    h+=`<button class="cl-row ${k} ${KSEL===c.id?'on':''}" onclick="kPick('${c.id}')">
      <span class="cl-ico">${KICO[k]}</span>
      <span class="cl-b"><b>${whoOf(c)}${isUnk(c)?'<span class="cl-unk">לא מזוהה</span>':''}</b>
        <span>${c.topic}</span></span>
      <span class="cl-w"><b dir="ltr">${c.at}</b>
        <span ${c.miss?'class="no"':'dir="ltr"'}>${c.miss?'לא נענתה':c.dur}</span></span>
    </button>`;
  });
  host.innerHTML=h;
}
function kPick(id){KSEL=id;KTAB='sum';kRows();kOne();}
function kSetTab(k){KTAB=k;kOne();}
function kOne(){
  const c=CALLS.find(x=>x.id===KSEL), host=document.getElementById('clOne');
  if(!c){host.innerHTML='<div class="cl-empty">בחרו שיחה מהרשימה.</div>';return}
  const k=kKind(c), dl=KDIR[k][0], dc=KDIR[k][1];
  /* שיחה שלא נענתה אינה שיחה: אין הקלטה, אין תמלול ואין ממה לסכם.
     מה שיש לה זה מי חיפש, כמה פעמים, ומה נעשה עם זה. */
  if(c.miss){
    const back=c.backTo?CALLS.find(x=>x.id===c.backTo):null;
    host.innerHTML=`
      <div class="cl-h">
        <span class="cl-tag miss">${KICO.miss} שיחה שלא נענתה</span>
        <h2>${whoOf(c)} ${perOf(c.ph)&&perOf(c.ph).r.startsWith('מנהלת')?'חיפשה':'חיפש'} אותנו</h2>
        <div class="cl-meta">
          <span><b>${whoOf(c)}</b> · ${roleOf(c)}</span><span class="dot"></span>
          <span>${kDay(c.date)} ${c.at}</span><span class="dot"></span>
          <span>${c.tries===1?'ניסיון אחד':c.tries+' ניסיונות'}</span>
        </div>
      </div>
      <div class="cl-miss">
        <div class="cl-mbox">
          <span class="ic">${KICO.miss}</span>
          <div><b>אין הקלטה ואין תמלול</b>
            <p>השיחה לא נענתה, ולכן אין ממה לסכם ואין משימות שנפתחו ממנה.
              מה שנשאר הוא לחזור אליה${back?' — וזה כבר נעשה.':'.'}</p></div>
        </div>
        <div class="cl-back">
          ${back?`<span class="ok2">✓ הוחזרה</span>
            <span>ב-<b>${c.backAt}</b> באותו יום, ומשם יצאה השיחה
              <button class="lnk2" onclick="kPick('${back.id}')">${back.topic}</button></span>`
          :`<span class="no2">טרם הוחזרה</span>
            <span>עברו <b>6 ימים</b> מאז. אם היה נושא — הוא עדיין פתוח.</span>`}
        </div>
        ${back?'':`<div class="cl-macts">
          <button class="btn pri" onclick="toast('חיוג ל${whoOf(c)}')">חיוג חזרה</button>
          <button class="btn pln" onclick="toast('הודעה נשלחה ל${whoOf(c)} בוואטסאפ')">שליחת הודעה</button>
        </div>`}
      </div>`;
    return;
  }
  /* התמלול הוא כלי עבודה של היועץ — אצל בעל העסק נשארים הסיכום והמשימות */
  const tabs=[['sum','סיכום השיחה',1],['tx','תמלול',!KCLI],
              ['tasks','משימות',!!(c.tasks&&c.tasks.length)]].filter(x=>x[2]);
  if(!tabs.some(x=>x[0]===KTAB)) KTAB=tabs[0][0];
  const wave=Array.from({length:22},(_,i)=>`<i style="height:${4+((i*7)%12)}px"></i>`).join('');
  host.innerHTML=`
    <div class="cl-h">
      <span class="cl-tag ${dc}">${KICO[c.dir]} שיחה ${dl}</span>
      <h2>${c.topic}</h2>
      <div class="cl-meta">
        <span>${c.dir==='in'?'מ־':'אל '}<b>${whoOf(c)}</b> · ${roleOf(c)}</span><span class="dot"></span>
        <span>${c.dir==='in'?'ענתה':'התקשר'} <b>${c.side}</b> · ${c.sideRole}</span><span class="dot"></span>
        <span>${kDay(c.date)} ${c.at}</span><span class="dot"></span>
        <span dir="ltr"><b>${c.dur}</b> דק׳</span>
      </div>
      ${KCLI?'':`<button class="cl-play" onclick="toast('נגן ההקלטה — הדגמה')">
        <span class="pl"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
        <span class="wv">${wave}</span><b dir="ltr">${c.dur}</b></button>`}
    </div>
    <div class="cl-tabs">${tabs.map(x=>
      `<button class="${KTAB===x[0]?'on':''}" onclick="kSetTab('${x[0]}')">${x[1]}</button>`).join('')}</div>
    <div class="cl-body">${kBody(c)}</div>`;
}
function kBody(c){
  if(KTAB==='sum') return `
    <div class="cl-dh">מה נסגר בשיחה</div>
    ${c.sum.map((x,i)=>`<div class="cl-pnt"><span class="n">${i+1}.</span><span>${x}</span></div>`).join('')}
    ${c.tasks&&c.tasks.length?`<div class="cl-dh t2">משימות שנפתחו מהשיחה</div>
      ${c.tasks.map(k=>`<div class="cl-tsk ${k.done?'ok':''}"><span class="mk">✓</span>
        <span>${k.t}</span><span class="who">${k.who}</span></div>`).join('')}`:''}`;
  if(KTAB==='tasks') return `
    <div class="cl-note">אלה המשימות שנפתחו מהשיחה הזאת. הן חיות באותו מקום כמו המשימות
      שנפתחות מפגישה — אצל בעל העסק ואצל מנהלת התזרים.</div>
    <div style="margin-top:12px">${c.tasks.map(k=>`<div class="cl-tsk ${k.done?'ok':''}">
      <span class="mk">✓</span><span>${k.t}</span>
      <span class="who">${k.done?'הושלמה · ':''}${k.who}</span></div>`).join('')}</div>`;
  return `<div class="cl-dh">התמלול המלא · ${c.dur} דקות</div>
    <div class="cl-tx">${c.tr.map(r=>
      `<div class="cl-txr ${r[1]==='them'?'them':''}">
        <span class="tm" dir="ltr">${r[0]}</span>
        <div><span class="sp2">${r[2]}</span><p>${r[3]}</p></div>
      </div>`).join('')}</div>
    <div class="cl-txf"><span>התמלול נוצר אוטומטית מההקלטה, והוא המקור לסיכום ולמשימות.</span>
      <span class="sp"></span>
      <button class="btn pln" onclick="toast('התמלול ירד כקובץ')">הורדת התמלול</button></div>`;
}
/* ================= שיוך מספר לנציג ================= */
let phNew=null;                      /* המספר שנפתחה עבורו שורת "נציג חדש" */
function phOpen(){phNew=null;phDraw();document.getElementById('phOv').classList.add('on');}
function phClose(){document.getElementById('phOv').classList.remove('on');}
function phDraw(){
  const nums=[...new Set(CALLS.map(c=>c.ph))];
  document.getElementById('phList').innerHTML=nums.map(ph=>{
    const mine=CALLS.filter(c=>c.ph===ph), p=perOf(ph);
    const last=mine[0];
    return `<div class="ph-row ${p?'':'unk'}">
      <div class="ph-top">
        <span class="ph-num" dir="ltr">${ph}</span>
        <span class="ph-meta">${mine.length===1?'שיחה אחת':mine.length+' שיחות'} · האחרונה ${kDay(last.date)} ${last.at}</span>
        <span class="ph-now ${p?'':'no'}">${p?p.n:'לא מזוהה'}</span>
      </div>
      <div class="ph-pick">
        ${PEOPLE.map(x=>`<button class="${p&&p.id===x.id?'on':''}" onclick="phSet('${ph}','${x.id}')">${x.n} · ${x.r}</button>`).join('')}
        <button class="add" onclick="phAddRow('${ph}')">＋ נציג חדש</button>
      </div>
      ${phNew===ph?`<div class="ph-new">
        <input id="phN" placeholder="שם הנציג" onkeydown="if(event.key==='Enter')phAdd('${ph}')">
        <input id="phR" placeholder="תפקיד — למשל אחראי רכש" onkeydown="if(event.key==='Enter')phAdd('${ph}')">
        <button onclick="phAdd('${ph}')">הוספה ושיוך</button></div>`:''}
    </div>`;}).join('');
  const n=document.getElementById('phN'); if(n) n.focus();
}
function phSet(ph,id){
  PHONES[ph]=id; phNew=null; phDraw(); kRender();
  const p=PEOPLE.find(x=>x.id===id);
  toast(ph+' שויך ל'+p.n+' — כל השיחות מהמספר נרשמו על שמו');
}
function phAddRow(ph){phNew=(phNew===ph?null:ph);phDraw();}
function phAdd(ph){
  const n=document.getElementById('phN'), r=document.getElementById('phR');
  const name=(n.value||'').trim(); if(!name){n.focus();return}
  const id='p'+(PEOPLE.length+1);
  PEOPLE.push({id,n:name,r:(r.value||'').trim()||'נציג'});
  phSet(ph,id);
}
addEventListener('keydown',e=>{if(e.key==='Escape')phClose()});

function kRender(){kSum();kFil();kRows();kOne();}
kRender();
</script>
</body>
