<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לקוחות · HK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   HK · מסך לקוחות — נבנה על שפת today.html (אותם טוקנים, אותו אוצר רכיבים)
   הכחול: (א) MASTHEAD — רצועת navy הנושאת ניווט, שם המסך, תאריך
           ו־ציר המחזור כמסלול אמיתי על קו אחד.
           (ב) thead של הטבלה — navy עם לבן. מנה קטנה, אותו חומר.
   בגוף: אין כרטיסים. טבלה אחת על לבן, קווי שיער בלבד.
   ===================================================================== */
:root{
  --navy:#0C4068; --navy2:#0A3557; --sky:#39ABE2; --coral:#E8635A;
  --bg:#F4F7FA; --bd:#E6ECF4;
  --green:#13895b; --red:#dc4436; --orange:#c98404; --purple:#7557E3;
  --ink:#123049; --mute:#5F7A93; --mute2:#8AA0B4;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#fff; color:var(--ink);
  font-family:Rubik,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1560px;margin:0 auto;padding:0 56px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.serif{font-family:"Frank Ruhl Libre",Rubik,serif}

/* ============ MASTHEAD ============ */
.band{background:var(--navy);color:#fff;position:relative}
.band::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;
  background:linear-gradient(to left,var(--sky),var(--sky) 26%,rgba(57,171,226,0) 26%)}
.topline{display:flex;align-items:center;gap:44px;padding:20px 0 0}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-size:21px;font-weight:700;letter-spacing:.14em;color:#fff}
.brand span{font-size:12px;color:#7FB4D8;letter-spacing:.04em}
nav{display:flex;gap:4px;flex:1}
nav a{padding:8px 14px 10px;font-size:14.5px;font-weight:400;color:rgba(255,255,255,.60);
  border-bottom:2px solid transparent;transition:color .15s}
nav a:hover{color:#fff}
nav a[aria-current]{color:#fff;font-weight:500;border-bottom-color:var(--sky)}
.who{font-size:13px;color:#8FBBDB;white-space:nowrap}
.who b{color:#fff;font-weight:500}

.bandmain{display:flex;align-items:baseline;gap:22px;flex-wrap:wrap;padding:34px 0 30px}
.bandmain h1{margin:0;font-size:78px;line-height:.82;font-weight:700;letter-spacing:-.015em}
.bandmain .date{font-size:15.5px;color:#9CCBEA;letter-spacing:.03em}
.bandmain .date i{font-style:normal;color:#6C9EC4;padding:0 6px}

/* --- ציר המחזור · מסלול --- */
.rail{display:flex;align-items:flex-end;gap:34px;padding-bottom:40px}
.track{position:relative;display:grid;grid-template-columns:repeat(5,1fr);flex:1;min-width:0}
.track::before{content:"";position:absolute;inset-inline:5px var(--le,6px);bottom:5px;height:1px;
  background:rgba(255,255,255,.22)}
.stn{display:flex;flex-direction:column;align-items:flex-start;gap:7px;
  padding:0 0 0;padding-inline-end:26px;text-align:start;position:relative}
.stn .lb{font-size:13.5px;font-weight:400;color:rgba(255,255,255,.60);
  white-space:nowrap;transition:color .15s}
.stn .n{font-size:31px;line-height:.9;font-weight:700;color:rgba(255,255,255,.80);
  transition:color .15s;margin-bottom:2px}
.stn .dot{width:11px;height:11px;border-radius:50%;background:var(--navy);
  border:2px solid rgba(255,255,255,.42);transition:.15s;position:relative;z-index:1}
.stn:hover .lb,.stn:hover .n{color:#fff}
.stn:hover .dot{border-color:#fff}
.stn.on .lb{color:#9FD2F2;font-weight:500}
.stn.on .n{color:#fff}
.stn.on .dot{background:var(--sky);border-color:var(--sky);
  box-shadow:0 0 0 5px rgba(57,171,226,.22)}
.clearf{font-size:13.5px;color:#fff;border-bottom:1px solid rgba(255,255,255,.38);
  padding-bottom:2px;margin-bottom:2px;white-space:nowrap;visibility:hidden}
.clearf:hover{color:var(--sky);border-bottom-color:var(--sky)}
.clearf.show{visibility:visible}

/* ============ הטבלה ============ */
main.wrap{padding:48px 56px 74px}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.tbl thead th{background:var(--navy);color:#fff;font-size:12px;font-weight:500;
  letter-spacing:.13em;text-align:start;padding:13px 18px;white-space:nowrap}
.tbl thead th:first-child{padding-inline-start:26px}
.tbl thead th:last-child{padding-inline-end:26px}
.tbl thead th{position:sticky;top:0;z-index:5}
.tbl td{padding:13px 18px;border-bottom:1px solid var(--bd);vertical-align:middle}
.tbl td:first-child{padding-inline-start:26px}
.tbl td:last-child{padding-inline-end:26px}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--bg)}
.co{font-size:16.5px;font-weight:600;color:var(--navy);letter-spacing:-.005em}
.tbl tbody tr:hover .co{color:var(--sky)}
.sub{font-size:12.5px;color:var(--mute2);margin-top:3px}
.stg{font-size:14.5px;color:var(--ink)}
.nxt{font-size:14.5px;color:var(--mute)}
.dash{color:#C7D4E0}
.pkg{font-size:14px;color:var(--ink)}
.mt{font-size:14.5px;color:var(--ink)}
.mt.today{font-weight:500;color:var(--navy)}
.nomeet{font-size:14px;color:var(--red)}
.send{display:block;margin-top:3px;font-size:12.5px;font-weight:500;color:var(--navy);
  border-bottom:1px solid #BFD3E4;padding-bottom:1px}
.send:hover{color:var(--sky);border-bottom-color:var(--sky)}
.alrt{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
.alrt span{font-size:12.5px;color:var(--coral);white-space:nowrap;
  display:flex;align-items:center;gap:7px}
.alrt span::before{content:"";width:7px;height:7px;background:var(--coral);flex:none}
.alrt span.off{visibility:hidden}
.mgr{font-size:13.5px;color:var(--mute)}

/* ============ מודאל · כרטיס לקוח ============ */
.ov{position:fixed;inset:0;background:rgba(10,53,87,.55);display:none;
  align-items:center;justify-content:center;z-index:50}
.ov.open{display:flex}
.dlg{background:#fff;width:560px;max-width:92vw;max-height:86vh;overflow:auto;
  border-top:3px solid var(--sky);padding:28px 32px 30px;position:relative}
.dlg .x{position:absolute;inset-inline-start:22px;top:18px;font-size:22px;
  color:var(--mute2);line-height:1}
.dlg .x:hover{color:var(--navy)}
.dlg h3{margin:0;font-size:27px;font-weight:700;color:var(--navy);letter-spacing:-.01em}
.dlg .idl{margin-top:5px;font-size:12.5px;color:var(--mute2);letter-spacing:.02em}
.dsec{margin-top:24px;padding-top:18px;border-top:1px solid var(--bd)}
.dsec h4{margin:0 0 11px;font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--mute2)}
.dsec .line{font-size:15px;color:var(--ink);padding:3px 0}
.dsec .line em{font-style:normal;color:var(--mute)}
.dsec .line i{font-style:normal;color:#C2CFDB;padding:0 7px}
.dsec .al{color:var(--coral);font-weight:500;display:flex;align-items:center;gap:8px;padding:3px 0}
.dsec .al::before{content:"";width:7px;height:7px;background:var(--coral);flex:none}
.dsec .memr{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;
  padding:7px 0;align-items:baseline}
.dsec .memr .cat{font-size:12.5px;font-weight:500;color:var(--purple)}
.dsec .memr .q{font-size:14.5px;color:var(--ink)}
.dsec .memr .tm{font-size:12px;color:var(--mute2);margin-top:3px}
.empty{font-size:14.5px;color:var(--mute2)}
.dacts{margin-top:26px;display:flex;gap:10px}
.btn-ghost{padding:10px 18px;font-size:13.5px;color:var(--mute);border:1px solid var(--bd)}
.btn-ghost:hover{color:var(--navy);border-color:var(--navy)}
.toast{position:fixed;bottom:34px;inset-inline-start:50%;transform:translateX(50%) translateY(14px);
  background:var(--navy2);color:#fff;font-size:14px;padding:13px 26px;opacity:0;
  transition:.22s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translateX(50%) translateY(0)}

@media (max-width:1440px){
  .wrap{padding:0 36px}
  main.wrap{padding:40px 36px 64px}
  .bandmain h1{font-size:58px}
  .bandmain{padding:30px 0 28px}
  .rail{gap:22px;padding-bottom:34px}
  .stn{padding-inline-end:16px}
  .stn .n{font-size:27px}
  .stn .lb{font-size:12.5px}
  .tbl td,.tbl thead th{padding-inline:13px}
  .tbl td:first-child,.tbl thead th:first-child{padding-inline-start:18px}
  .co{font-size:15.5px}
  .alrt{gap:6px}
}
</style>
</head>
<body>

<header class="band">
  <div class="wrap">
    <div class="topline">
      <div class="brand"><b>HK</b><span>חזות קריספין</span></div>
      <nav>
        <a href="today.html">היום</a>
        <a href="tasks.html">משימות</a>
        <a href="clients.html" aria-current="page">לקוחות</a>
        <a href="meetings.html">פגישות</a>
        <a href="memory.html">זיכרון לקוחות</a>
      </nav>
      <div class="who"><b>אילון אשכנזי</b> · אשכנזי ייעוץ עסקי</div>
    </div>

    <div class="bandmain">
      <h1 class="serif">לקוחות</h1>
      <div class="date num">יום חמישי<i>·</i>02.07.2026<i>·</i>10:54</div>
    </div>

    <div class="rail">
      <div class="track" id="track"></div>
      <button class="clearf" id="cf" onclick="setStage(-1)">כל התיק</button>
    </div>
  </div>
</header>

<main class="wrap">
  <table class="tbl">
    <thead>
      <tr>
        <th style="width:22%">חברה</th>
        <th style="width:9%">חבילה</th>
        <th style="width:15%">שלב במחזור</th>
        <th style="width:11%">פגישה אחרונה</th>
        <th style="width:14%">פגישה הבאה</th>
        <th style="width:18%">התראות</th>
        <th style="width:11%">מנהל תזרים</th>
      </tr>
    </thead>
    <tbody id="tb"></tbody>
  </table>
</main>

<div class="ov" id="ov" onclick="if(event.target===this)closeDlg()">
  <div class="dlg" id="dlg"></div>
</div>

<div class="toast" id="tst"></div>

<script>
var STAGES=['ממתין לחומר','הוזן','יעדים עודכנו','מוכן לפגישה','סיכום אושר'];
var L='לירון בן כליפא', S='שמרית טובול';

var C=[
 {n:'אנרגי אינטרנשיונל',id:'511327876',pl:'Money',s:3,last:'02.07',next:'היום 17:00',
  a:[1,1],m:L,
  t:[['אישור סיכום — פגישה שוטפת','היום'],['עדכון תקציב שיווק ליולי','בלי תאריך']],
  mem:[['שביעות רצון','ירידה: תסכול מקצב התגובה בוואטסאפ','מפגישה מוקלטת 09:00 · היום 10:03'],
       ['כאבי לקוח','נוסף כאב: תלות בלקוח מרכזי — רימון מוצרי אנרגיה','מפגישה מוקלטת 09:00 · היום 10:02']]},
 {n:'מטעי גבעון',id:'514778220',pl:'Money+',s:2,last:'12.05',next:'היום 13:00',
  a:[1,0],m:L,
  t:[['לחזור לרו״ח על המע״מ','היום']],
  mem:[['יעדים והסכמות','יעד קניות מלאי סומן בסיכון','מתפעול שוטף · אתמול 16:40']]},
 {n:'רימון יצחק',id:'025664109',pl:'Money+',s:1,last:'17.03',next:null,
  a:[0,0],m:S,t:[],
  mem:[['סגנון תקשורת','מבקש פילוחים, לא סכומים','מפגישה 17.03 · 29.06']]},
 {n:'אנרגי גולני',id:'511200341',pl:'Meeting',s:0,last:'24.06',lastNote:'לא התקיימה',next:null,
  a:[0,0],m:L,
  t:[['תיאום מחדש — הפגישה לא התקיימה','היום']],
  mem:[['שיתוף פעולה','חומר אחרון לתזרים: 30.6 · דפי בנק התקבלו בוואטסאפ','משיחת טלפון מוקלטת (SIM) · אתמול 11:15']]},
 {n:'משה עובד',id:'039112774',pl:'Money',s:3,last:null,next:'היום 16:00',
  a:[0,0],m:S,
  t:[['הכנה לפגישת רבעון','08.07']],mem:[]},

 {n:'אלפא בנייה',s:0},
 {n:'ברק ושות׳ הנדסה',s:2},
 {n:'גל תעשיות',s:0},
 {n:'דלתא אריזות',s:1},
 {n:'הדר טכנולוגיות',s:3},
 {n:'ורד מזון',s:3},
 {n:'זוהר חשמל',s:2},
 {n:'חורש תקשורת',s:4},
 {n:'טל לוגיסטיקה',s:0},
 {n:'יובל מזון',s:3},
 {n:'כרמל אנרגיה',s:1},
 {n:'לביא ביטחון',s:4},
 {n:'מגן מערכות',s:3},
 {n:'נוף טקסטיל',s:0},
 {n:'סהר בנייה',s:2},
 {n:'עומר רהיטים',s:3},
 {n:'פלג שיווק',s:4}
];

var cur=-1, tt;

function toast(m){var e=document.getElementById('tst');e.textContent=m;e.classList.add('show');
  clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('show')},2600);}

/* ---- ציר המחזור ---- */
function drawRail(){
  var t=document.getElementById('track'),h='';
  for(var i=0;i<5;i++){
    var c=0;for(var j=0;j<C.length;j++)if(C[j].s===i)c++;
    h+='<button class="stn'+(cur===i?' on':'')+'" onclick="setStage('+i+')">'+
       '<span class="lb">'+STAGES[i]+'</span>'+
       '<span class="n num serif">'+c+'</span>'+
       '<span class="dot"></span></button>';
  }
  t.innerHTML=h;
  var dots=t.querySelectorAll('.dot');
  if(dots.length){
    var tr=t.getBoundingClientRect(), lr=dots[dots.length-1].getBoundingClientRect();
    t.style.setProperty('--le',Math.max(0,lr.left-tr.left+lr.width/2-1)+'px');
  }
  document.getElementById('cf').classList.toggle('show',cur>=0);
}
function setStage(i){
  cur=(i===cur)?-1:i;
  drawRail();drawTable();
  toast(cur<0?'מוצג כל התיק':'סינון: '+STAGES[cur]);
}

/* ---- הטבלה ---- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function pkg(p){return p==='Money+'?'<span dir="ltr">Money+</span>':esc(p);}
function drawTable(){
  var b=document.getElementById('tb'),h='';
  for(var i=0;i<C.length;i++){
    var r=C[i];
    if(cur>=0&&r.s!==cur)continue;
    var lastCell = r.last
      ? '<div class="mt num">'+r.last+'</div>'+(r.lastNote?'<div class="sub">'+r.lastNote+'</div>':'')
      : (r.id?'<span class="dash">—</span>':'');
    var nextCell;
    if(r.next) nextCell='<span class="mt'+(r.next.indexOf('היום')===0?' today':'')+'">'+r.next+'</span>';
    else if(r.id) nextCell='<span class="nomeet">לא נקבעה</span><button class="send" onclick="sendLink(event,'+i+')">שליחת לינק</button>';
    else nextCell='';
    var a=r.a||[0,0];
    h+='<tr onclick="openCard('+i+')">'+
       '<td><div class="co">'+esc(r.n)+'</div>'+(r.id?'<div class="sub num">ח.פ. '+r.id+'</div>':'')+'</td>'+
       '<td>'+(r.pl?'<span class="pkg">'+pkg(r.pl)+'</span>':'')+'</td>'+
       '<td><span class="stg">'+STAGES[r.s]+'</span></td>'+
       '<td>'+lastCell+'</td>'+
       '<td>'+nextCell+'</td>'+
       '<td><div class="alrt"><span class="'+(a[0]?'':'off')+'">בעיה תזרימית</span>'+
       '<span class="'+(a[1]?'':'off')+'">חוסר שביעות רצון</span></div></td>'+
       '<td>'+(r.m?'<span class="mgr">'+r.m+'</span>':'')+'</td>'+
       '</tr>';
  }
  b.innerHTML=h;
}

function sendLink(e,i){e.stopPropagation();toast('לינק לתיאום פגישה נשלח ל'+C[i].n);}

/* ---- כרטיס הלקוח ---- */
function openCard(i){
  var r=C[i],h='';
  h+='<button class="x" onclick="closeDlg()" aria-label="סגירה">&times;</button>';
  h+='<h3 class="serif">'+esc(r.n)+'</h3>';
  h+='<div class="idl num">'+(r.id?('ח.פ. '+r.id+' · '+r.pl+' · '+r.m):'הפרטים טרם הוזנו')+'</div>';

  h+='<div class="dsec"><h4>שלב במחזור</h4><div class="line">'+STAGES[r.s]+'</div></div>';

  var a=r.a||[0,0];
  if(a[0]||a[1]){
    h+='<div class="dsec"><h4>התראות</h4>';
    if(a[0])h+='<div class="al">בעיה תזרימית</div>';
    if(a[1])h+='<div class="al">חוסר שביעות רצון</div>';
    h+='</div>';
  }
  if(r.t&&r.t.length){
    h+='<div class="dsec"><h4>משימות פתוחות</h4>';
    for(var k=0;k<r.t.length;k++)
      h+='<div class="line">'+esc(r.t[k][0])+'<i>·</i><em>'+r.t[k][1]+'</em></div>';
    h+='</div>';
  }
  if(r.mem&&r.mem.length){
    h+='<div class="dsec"><h4>עדכוני זיכרון אחרונים</h4>';
    for(var q=0;q<Math.min(2,r.mem.length);q++)
      h+='<div class="memr"><span class="cat">'+r.mem[q][0]+'</span><span><span class="q">'+
         esc(r.mem[q][1])+'</span><div class="tm">'+r.mem[q][2]+'</div></span></div>';
    h+='</div>';
  }
  if(!(a[0]||a[1])&&!(r.t&&r.t.length)&&!(r.mem&&r.mem.length))
    h+='<div class="dsec"><div class="empty">אין התראות, משימות פתוחות או עדכוני זיכרון.</div></div>';

  h+='<div class="dacts"><button class="btn-ghost" onclick="closeDlg()">סגירה</button></div>';

  document.getElementById('dlg').innerHTML=h;
  document.getElementById('ov').classList.add('open');
}
function closeDlg(){document.getElementById('ov').classList.remove('open');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDlg()});

drawRail();drawTable();
</script>
</body>
</html>
