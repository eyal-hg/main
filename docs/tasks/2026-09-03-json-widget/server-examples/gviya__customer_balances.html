:#F3FBF6}\n.hkjt tr.rc-b td{background:#F2F8FD}\n.hkjt td.al-s{text-align:start}\n.hkjt td.al-c{text-align:center}\n.hkjt th.fz, .hkjt td.fz{position:sticky;inset-inline-start:0;background:#fff;z-index:2;box-shadow:-1px 0 0 var(--line)}\n.hkjt th.fz{z-index:3;background:var(--tint)}\n.hkjt .ft{display:flex;align-items:center;gap:12px;padding:9px 20px;font-size:11.5px;color:var(--gray);border-top:1px solid var(--line);background:#fff}\n.hkjt .ft b{font-weight:600;color:var(--ink2)}\n.hkjt .ft .sp{flex:1}\n.hkjt .st{padding:34px 18px;text-align:center;color:var(--gray);font-size:13px;line-height:1.6}\n.hkjt .st b{display:block;color:var(--navy);font-weight:600;margin-bottom:3px}\n.hkjt .st.err b{color:var(--bad)}\n.hkjt .st code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--ink2);background:#F4F7FA;border-radius:6px;padding:1px 6px}";

    function nfd(v,d){ return new Intl.NumberFormat('he-IL',{minimumFractionDigits:d,maximumFractionDigits:d}).format(v); }
    /* צבע לערך לפי הגדרת העמודה: color:{neg,pos,zero} או rules:[{lt|lte|gt|gte|eq, color}] */
    function colorOf(v,c){
