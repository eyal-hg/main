<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>HK-APP · אפיון האפליקציה הסלולרית</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* =====================================================================
   MOBILE_SPEC.html — אפיון HK-APP · 14.09.2026
   הטוקנים הם css/tokens.css של הפרוטוטיפ. Jampa = אותם תפקידים, ערכים אחרים.
   ===================================================================== */
:root{
  --navy:#0C4068; --navy-2:#104A76; --coral:#E4826E; --coral-2:#D96A55;
  --danger:#C43D30; --danger-t:#dc4436; --sky:#39ABE2; --link:#14618F;
  --ok:#13895b; --ok-bg:#E7F7EF; --warn:#c98404; --warn-bg:#FFF6E6; --info-bg:#E8F4FB;
  --ink:#12263A; --ink-2:#44566A; --ink-3:#7A8898; --on-navy:#DCEBF5; --on-navy-2:#9FC0DA;
  --bg:#F6F8FB; --panel:#fff; --chip:#F0F4F8; --row-on:#EEF6FC; --tint:#EAF3FA;
  --line:#E3EAF3; --line-2:#CBD6E2;
  --rec:#B3372A; --rec-2:#8F2B21; --pausebar:#5B6673; --mark:#F5B841; --mark-ink:#5A3C00;
  --shadow:0 1px 2px rgba(12,64,104,.04),0 10px 28px -18px rgba(12,64,104,.18);
  --font:'Rubik','Heebo',system-ui,-apple-system,sans-serif;
  --page:#E9EEF3;
}
/* Jampa — אותם תפקידים, ערכי Jampa-Fig */
body.jp{
  --navy:#6F62AC; --navy-2:#5C5192; --coral:#7557E3; --coral-2:#5F45C4;
  --sky:#7557E3; --link:#5F45C4; --info-bg:#F0EBFF;
  --ink:#3F3D4A; --ink-2:#696971; --ink-3:#9B9BA6; --on-navy:#F0EBFF; --on-navy-2:#CBC0F7;
  --bg:#FFFBF3; --chip:#E5E7FF; --row-on:#F0EBFF; --tint:#F0EBFF;
  --line:#EFEAE0; --line-2:#DAD4E8;
  --rec:#37306B; --rec-2:#2A2452; --pausebar:#8C88A3; --mark:#FFD096; --mark-ink:#5A3C00;
  --shadow:0 0 6.7px rgba(55,48,107,.10);
  --page:#F2EEE6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--page);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.cur{font-size:.52em;font-weight:400;margin-inline-start:2px;opacity:.85}

/* ---------------- המסמך ---------------- */
.doc-top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.doc-top-in{max-width:1480px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.doc-logo{font-weight:800;font-size:22px;color:var(--navy);letter-spacing:-.02em}
.doc-logo small{display:block;font-size:12px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:13px;padding:8px 18px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.doc-sp{flex:1}
.doc-meta{font-size:12px;color:var(--ink-3)}
.doc-idx{max-width:1480px;margin:0 auto;padding:0 32px 12px;display:flex;gap:6px;flex-wrap:wrap}
.doc-idx a{font-size:12px;font-weight:600;color:var(--ink-2);text-decoration:none;background:var(--chip);border-radius:999px;padding:5px 11px;white-space:nowrap}
.doc-idx a b{color:var(--navy);font-weight:700;margin-inline-end:4px}
.doc-idx a:hover{background:var(--row-on)}
.doc{max-width:1480px;margin:0 auto;padding:8px 32px 80px}

.intro{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;margin:24px 0 8px}
.card-doc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow)}
.card-doc h2{margin:0 0 4px;font-size:22px;font-weight:800;color:var(--navy)}
.card-doc h2::after{content:"";display:block;width:26px;height:3px;background:var(--coral);border-radius:3px;margin-top:8px}
.card-doc p{margin:10px 0 0;font-size:14px;line-height:1.65;color:var(--ink-2)}
.card-doc ul{margin:10px 0 0;padding-inline-start:18px;color:var(--ink-2);line-height:1.7;font-size:13px}
.card-doc b{color:var(--ink)}
.navmap{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.navmap span{font-size:12.5px;font-weight:600;background:var(--chip);color:var(--ink-2);border-radius:999px;padding:6px 12px}
.navmap span.c{background:var(--coral);color:#fff}

.part{margin-top:44px}
.part-h{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--navy);padding-bottom:10px}
.part-h h2{margin:0;font-size:28px;font-weight:800;color:var(--navy)}
.part-h span{font-size:13px;color:var(--ink-3)}

.sec{display:grid;grid-template-columns:auto minmax(320px,1fr);gap:36px;padding:36px 0;border-bottom:1px solid var(--line-2);align-items:start}
.sec.wide{grid-template-columns:1fr}
.sec.wide .notes{max-width:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:4px 32px}
.sec.wide .notes .n-h,.sec.wide .notes .n-top{grid-column:1/-1}
.phones{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.ph-wrap{display:flex;flex-direction:column;gap:10px;align-items:center}
.ph-cap{font-size:13px;font-weight:600;color:var(--ink-2);text-align:center;max-width:390px}
.ph-cap b{color:var(--navy)}
.notes{max-width:560px}
.n-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.n-code{font-size:12px;font-weight:700;color:#fff;background:var(--navy);border-radius:7px;padding:3px 8px}
.n-h h3{margin:0;font-size:22px;font-weight:800;color:var(--navy)}
.n-blk{margin-top:14px}
.n-blk h4{margin:0 0 4px;font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
.n-blk p,.n-blk li{font-size:13.5px;line-height:1.65;color:var(--ink-2);margin:0}
.n-blk ul{margin:0;padding-inline-start:18px}
.n-blk b{color:var(--ink);font-weight:600}
.n-blk code{white-space:nowrap;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--chip);color:var(--ink);border-radius:5px;padding:1px 5px;direction:ltr;unicode-bidi:isolate}
.n-blk .miss{color:var(--danger-t);font-weight:600}
.n-blk .miss::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-inline-end:6px;vertical-align:middle}
.n-chg{background:var(--tint);border-radius:10px;padding:10px 14px;margin-top:14px}
.n-chg h4{color:var(--navy)}

/* דיאגרמת מצבים */
.sm{display:flex;align-items:stretch;gap:0;margin:18px 0 6px;flex-wrap:wrap;row-gap:12px}
.sm-st{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:170px;flex:1;box-shadow:var(--shadow)}
.sm-st b{display:block;font-size:14px;color:var(--navy)}
.sm-st span{display:block;font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.sm-st i{font-style:normal;display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;color:#fff;background:var(--coral);border-radius:999px;padding:3px 10px}
.sm-st.rec b{color:var(--rec)}
.sm-ar{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 6px;color:var(--ink-3);font-size:11.5px;min-width:64px;text-align:center}
.sm-ar::before{content:"←";font-size:18px;color:var(--line-2)}

/* שאלות */
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:10px;margin-top:18px}
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.q.q-other{opacity:.55}
.q-n{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.q b{font-size:14px;color:var(--navy);font-weight:600}
.q p{margin:3px 0 0;font-size:13px;line-height:1.6;color:var(--ink-2)}
.q-t{margin-inline-start:auto;font-size:11.5px;font-weight:600;color:var(--ink-3);background:var(--chip);border-radius:999px;padding:2px 9px;flex:none}

/* ---------------- מסגרת טלפון ---------------- */
.phone{width:414px;height:868px;padding:12px;border-radius:60px;background:#1B1F24;box-shadow:0 0 0 1.5px #3a3f46 inset,0 30px 60px -30px rgba(12,38,58,.45);position:relative;flex:none}
.phone.mini{zoom:.62}
.scr{width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.island.act{width:188px}
.island .idot{width:8px;height:8px;border-radius:50%;background:#FF453A;animation:blink 1.4s infinite}
body.jp .island .idot{background:#FF5D6C}
.island .itime{color:#FF6B5F;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.sbar{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 30px;font-weight:600;font-size:15px;color:var(--ink);position:relative;z-index:20;direction:rtl}
.sbar.dark{color:#fff}
.sbar .st-r{display:flex;gap:6px;align-items:center;direction:ltr}
.sbar svg{display:block}
.homeind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#12263A;z-index:40;opacity:.9}
.homeind.light{background:#fff}
.body{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}

/* ---------------- רכיבי האפליקציה ---------------- */
.band{background:var(--navy);color:#fff;padding:2px 20px 18px;flex:none}
.band-top{display:flex;align-items:center;gap:10px;min-height:40px}
.band h1{margin:0;font-size:28px;font-weight:800;line-height:1.1}
.band h1::after{content:"";display:block;width:26px;height:3px;border-radius:3px;background:var(--coral);margin-top:7px}
body.jp .band h1::after{background:#CBC0F7}
.band .sub{font-size:12.5px;color:var(--on-navy-2);margin-top:8px}
.band-sp{flex:1}
.av{width:36px;height:36px;border-radius:50%;background:var(--navy-2);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.35);flex:none}
.av.l{background:var(--tint);color:var(--navy);border:0}
.ic-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--on-navy);background:rgba(255,255,255,.08);flex:none}
.ic-btn.l{color:var(--ink-2);background:var(--chip)}

.hdr{display:flex;align-items:center;gap:10px;padding:4px 16px 10px;flex:none;background:var(--bg)}
.hdr .t{font-size:19px;font-weight:700;color:var(--navy);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .t small{display:block;font-size:12px;font-weight:400;color:var(--ink-3)}
.back{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--navy);flex:none}
.bigtitle{padding:2px 20px 12px;flex:none}
.bigtitle h1{margin:0;font-size:28px;font-weight:800;color:var(--navy)}
.bigtitle h1::after{content:"";display:block;width:26px;height:3px;border-radius:3px;background:var(--coral);margin-top:7px}
.bigtitle .sub{font-size:12.5px;color:var(--ink-3);margin-top:8px}

.pad{padding:0 16px}
.stack{display:flex;flex-direction:column;gap:12px;padding:12px 16px 24px}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pn-h{display:flex;align-items:baseline;gap:8px;padding:14px 16px 8px}
.pn-h b{font-size:17px;font-weight:600;color:var(--navy)}
.pn-h span{font-size:12.5px;color:var(--ink-3)}
.pn-h a{margin-inline-start:auto;font-size:12.5px;font-weight:600;color:var(--link);text-decoration:none;white-space:nowrap}
.pn-b{padding:0 16px 14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .mn{flex:1;min-width:0}
.row .t1{font-size:14px;font-weight:500;color:var(--ink);line-height:1.35}
.row .t1 b{font-weight:600;color:var(--navy)}
.row .t2{font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.4}
.row .end{flex:none;text-align:end}
.chev{color:var(--line-2);flex:none}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-inline-end:5px;vertical-align:middle;position:relative;top:-1px}
.al{color:var(--danger-t)} .okc{color:var(--ok)} .wrn{color:var(--warn)} .inf{color:var(--link)} .mut{color:var(--ink-3)}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:999px;background:var(--chip);color:var(--ink-2);white-space:nowrap;flex:none;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--navy);color:#fff}
.chip i{font-style:normal;font-weight:700;font-size:11.5px;opacity:.75}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;display:inline-block}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.wait{background:var(--warn-bg);color:var(--warn)} .tag.info{background:var(--info-bg);color:var(--link)} .tag.mute{background:var(--chip);color:var(--ink-2)}

.btn{height:44px;border-radius:999px;border:1px solid var(--line-2);background:#fff;color:var(--navy);font-size:14px;font-weight:600;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.sm{height:32px;font-size:12.5px;padding:0 13px}
.btn.blk{width:100%}
.btn.ghost-n{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.btn.dis{background:var(--chip);border-color:var(--chip);color:var(--ink-3)}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff}

.live{display:flex;gap:0}
.live>div{flex:1;padding:14px 16px}
.live>div+div{border-inline-start:1px solid var(--line)}
.lv-l{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.lv-n{font-size:27px;font-weight:600;color:var(--navy);line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.lv-n.bad{color:var(--danger)}
.lv-m{font-size:12px;color:var(--ink-3);margin-top:3px}

.input{height:45px;border:1px solid var(--line-2);border-radius:12px;background:#fff;display:flex;align-items:center;padding:0 14px;gap:8px;color:var(--ink-3);font-size:14px}
.input.focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(57,171,226,.15);color:var(--ink)}
.search{height:40px;border-radius:999px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--ink-3);font-size:14px;margin:4px 16px 8px}

/* טאב־בר תחתון */
.tabs{flex:none;height:84px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;align-items:flex-start;padding:7px 6px 0;position:relative;z-index:25}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:11.5px;font-weight:500;padding-top:2px}
.tab.on{color:var(--navy);font-weight:700}
.tab.on svg{stroke-width:2.2}
.tab.fab{margin-top:-20px}
.fabb{width:58px;height:58px;border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -6px rgba(228,130,110,.7);border:4px solid #fff}
body.jp .fabb{box-shadow:0 8px 18px -6px rgba(117,87,227,.55)}
.fabb.recording{background:var(--rec);box-shadow:0 0 0 6px rgba(179,55,42,.18)}
.tab.fab span{margin-top:1px}
.badge{position:absolute;top:-4px;inset-inline-end:-9px;min-width:17px;height:17px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:1.5px solid #fff}
.tab .icw{position:relative}

/* פס ההקלטה — מצב של המערכת, לא מסך */
.recbar{flex:none;background:var(--rec);color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;height:48px;position:relative;z-index:22}
.recbar.paused{background:var(--pausebar)}
.recbar .rdot{width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1.5s infinite;flex:none}
.recbar.paused .rdot{animation:none;opacity:.55;border-radius:2px;width:9px}
.recbar .rclock{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;flex:none}
.recbar .rwho{flex:1;min-width:0;font-size:12.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recbar .rwho b{font-weight:600}
.recbar .rwho small{display:block;font-size:11.5px;opacity:.8}
.recbar .rbtn{height:32px;border-radius:999px;border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;gap:5px;padding:0 11px;font-size:12.5px;font-weight:600;flex:none}
.recbar .rbtn.mk{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.recbar .rbtn.sq{width:32px;padding:0}
.recbar .rup{display:flex;align-items:center;gap:4px;font-size:11.5px;opacity:.9;flex:none}
@keyframes blink{50%{opacity:.25}}

/* מסך ההקלטה המלא */
.recscr{background:#0E2236;color:#fff}
body.jp .recscr{background:#2E2950}
.rs-top{display:flex;align-items:center;gap:10px;padding:4px 18px 0}
.rs-live{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#FFB4AB}
body.jp .rs-live{color:#FFC2C9}
.rs-live i{width:8px;height:8px;border-radius:50%;background:#FF6B5F;animation:blink 1.4s infinite}
.rs-who{text-align:center;padding:22px 20px 0}
.rs-who b{display:block;font-size:22px;font-weight:700}
.rs-who span{display:block;font-size:13px;color:#9FC0DA;margin-top:4px}
body.jp .rs-who span{color:#CBC0F7}
.rs-clock{text-align:center;font-size:64px;font-weight:300;letter-spacing:.01em;font-variant-numeric:tabular-nums;direction:ltr;margin-top:14px;line-height:1}
.rs-wave{display:flex;align-items:center;justify-content:center;gap:3px;height:56px;margin:16px 26px 0}
.rs-wave i{display:block;width:4px;border-radius:2px;background:rgba(255,255,255,.75)}
.rs-wave.flat i{background:rgba(255,255,255,.25)}
.rs-ctl{display:flex;align-items:center;justify-content:center;gap:30px;margin-top:26px}
.rs-c{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;color:#DCEBF5}
.rs-c .cb{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#fff}
.rs-c .cb.mk{width:84px;height:84px;background:var(--mark);color:var(--mark-ink)}
.rs-c .cb.stop{background:#fff;color:var(--rec)}
.rs-sheet{background:#fff;color:var(--ink);border-radius:22px 22px 0 0;margin-top:26px;flex:1;padding:6px 0 0}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:4px auto 8px}

/* גיליון תחתון / פופאפ */
.dim{position:absolute;inset:0;background:rgba(12,38,58,.42);z-index:60}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;z-index:61;padding:6px 20px 34px;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet h3{margin:6px 0 4px;font-size:19px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-inline-start:auto;width:32px;height:32px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.sheet p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.opt{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;margin-top:10px}
.opt.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy) inset;background:var(--row-on)}
.opt .oi{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:none}
.opt b{display:block;font-size:14px;color:var(--ink);font-weight:600}
.opt span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.toast{position:absolute;left:14px;right:14px;bottom:98px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;display:flex;align-items:center;gap:10px;z-index:55;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast a{margin-inline-start:auto;color:#9FD6F2;font-weight:600;text-decoration:none;white-space:nowrap}
body.jp .toast a{color:#CBC0F7}

/* ציר היום */
.tl{position:relative;padding:4px 0}
.tl-r{display:flex;gap:12px;padding:10px 16px;position:relative}
.tl-time{width:44px;flex:none;font-size:14px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums;padding-top:1px}
.tl-time small{display:block;font-size:11.5px;font-weight:400;color:var(--ink-3)}
.tl-bar{width:3px;border-radius:2px;flex:none;align-self:stretch}
.tl-mn{flex:1;min-width:0}
.tl-r.done .t1{color:var(--ink-3)}
.tl-now{display:flex;align-items:center;gap:8px;padding:0 16px;margin:2px 0}
.tl-now b{font-size:11.5px;font-weight:700;color:var(--coral);font-variant-numeric:tabular-nums;width:44px}
.tl-now i{flex:1;height:1.5px;background:var(--coral);border-radius:1px}

/* מסך נעילה */
.lock{background:linear-gradient(180deg,#27425E,#16293D 60%,#0F1E2E);color:#fff}
body.jp .lock{background:linear-gradient(180deg,#5B5190,#3A3366 60%,#29244A)}
.lk-date{text-align:center;font-size:17px;font-weight:500;margin-top:18px;opacity:.9}
.lk-time{text-align:center;font-size:88px;font-weight:600;line-height:1;margin-top:2px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.la{margin:28px 12px 0;background:rgba(20,24,30,.72);backdrop-filter:blur(20px);border-radius:24px;padding:14px 16px}
.la-top{display:flex;align-items:center;gap:10px}
.la-logo{width:30px;height:30px;border-radius:8px;background:var(--navy);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.la-top b{font-size:14px;font-weight:600}
.la-top span{font-size:12px;opacity:.7;display:block}
.la-clock{margin-inline-start:auto;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;color:#FF6B5F;direction:ltr}
.la-btns{display:flex;gap:8px;margin-top:12px}
.la-btns div{flex:1;height:40px;border-radius:999px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600}
.la-btns div.mk{background:var(--mark);color:var(--mark-ink)}
.notif{margin:10px 12px 0;background:rgba(245,247,250,.88);color:#12263A;border-radius:22px;padding:12px 14px;display:flex;gap:10px}
.notif .la-logo{flex:none}
.notif b{font-size:14px;display:block}
.notif span{font-size:13px;color:#44566A;display:block;line-height:1.4;margin-top:1px}
.notif small{margin-inline-start:auto;font-size:12px;color:#7A8898;flex:none}

/* אנדרואיד */
.andr .scr{border-radius:34px}
.andr.phone{border-radius:44px}
.a-shade{background:#1F2428;color:#fff;flex:1;padding:8px 14px}
.a-qs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 4px 18px}
.a-qs i{height:54px;border-radius:18px;background:#343A40;display:block}
.a-n{background:#2B3137;border-radius:22px;padding:14px 16px;margin-top:10px}
.a-n .an-h{display:flex;align-items:center;gap:8px;font-size:12px;color:#B7C3CF}
.a-n .an-h .la-logo{width:20px;height:20px;border-radius:50%;font-size:9px}
.a-n b{display:block;font-size:15px;margin-top:8px}
.a-n span{display:block;font-size:13px;color:#B7C3CF;margin-top:2px}
.a-n .an-a{display:flex;gap:18px;margin-top:12px;font-size:13.5px;font-weight:600;color:#9FD6F2}

/* מצלמה */
.cam{background:#0B0D10;color:#fff}
.cam-view{flex:1;position:relative;background:radial-gradient(ellipse at 50% 45%,#5d5a52,#2a2925 70%);overflow:hidden}
.paper{position:absolute;left:62px;right:58px;top:92px;bottom:120px;background:#F4F1E8;transform:rotate(-3deg);border-radius:3px;box-shadow:0 20px 40px rgba(0,0,0,.5);padding:26px 22px;color:#555}
.paper i{display:block;height:7px;background:#cfcabc;border-radius:3px;margin-top:10px}
.edge{position:absolute;left:54px;right:50px;top:84px;bottom:112px;border:3px solid #7FD1F7;border-radius:6px;transform:rotate(-3deg);box-shadow:0 0 0 2000px rgba(0,0,0,.28)}
body.jp .edge{border-color:#CBC0F7}
.cam-ctl{height:170px;display:flex;align-items:center;justify-content:space-around;padding-bottom:30px}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center}
.shutter i{width:60px;height:60px;border-radius:50%;background:#fff;display:block}

/* צ׳אט AI */
.bub{max-width:82%;border-radius:18px;padding:10px 13px;font-size:14px;line-height:1.5}
.bub.me{background:var(--navy);color:#fff;margin-inline-start:auto;border-end-end-radius:6px}
.bub.ai{background:#fff;border:1px solid var(--line);color:var(--ink);border-end-start-radius:6px}

/* שלד טעינה */
.sk{background:linear-gradient(90deg,#E9EEF3 0,#F3F6F9 40%,#E9EEF3 80%);background-size:300px 100%;border-radius:8px;animation:sk 1.3s infinite linear}
body.jp .sk{background:linear-gradient(90deg,#EEEAF6 0,#F7F4FC 40%,#EEEAF6 80%);background-size:300px 100%}
@keyframes sk{from{background-position:-300px 0}to{background-position:300px 0}}

/* מצב "רק אחד" לצילום */
body.only .doc-top,body.only .intro,body.only .part-h,body.only .doc-idx{display:none}
body.only .doc{padding:24px}
body.only .sec{border:0;padding:0}
@media (max-width:1100px){.sec{grid-template-columns:1fr}.intro{grid-template-columns:1fr}}
</style>

<body>
<header class="doc-top">
  <div class="doc-top-in">
    <div class="doc-logo">HK-APP <small>אפיון האפליקציה הסלולרית · 14.09.2026 · טיוטה לבוקר</small></div>
    <div class="seg"><button data-tab="adv" onclick="setTab('adv')">יועץ</button><button data-tab="cli" onclick="setTab('cli')">לקוח</button></div>
    <div class="seg"><button data-brand="hk" onclick="setBrand('hk')">HK</button><button data-brand="jp" onclick="setBrand('jp')">Jampa</button></div>
    <span class="doc-sp"></span>
    <span class="doc-meta">TASK.md באותה תיקייה · מסמך סטטי, נפתח מ-file://</span>
  </div>

</header>
<main class="doc" id="doc"></main>
<script>
/* =====================================================================
   מנוע המסמך: מותג, מונחים, אייקונים, מסגרת טלפון
   ===================================================================== */
const S = { tab:'adv', brand:'hk' };
const JP = () => S.brand === 'jp';

/* מונחים — כל טקסט תלוי־מותג עובר כאן. HK ↔ Jampa */
const TERMS = {
  client:      ['לקוח','מטופלת'],
  clients:     ['לקוחות','מטופלים'],
  clientOf:    ['של הלקוח','של המטופלת'],
  toClient:    ['ללקוח','למטופלת'],
  advisor:     ['יועץ','מטפלת'],
  prep:        ['הכנה לפגישה','בריף לפגישה'],
  memory:      ['זיכרון','פרופיל'],
  memoryOf:    ['הזיכרון של','הפרופיל של'],
  feedback:    ['משוב עליך','סופרוויזיון'],
  portfolio:   ['התיק שלי','המטופלים שלי'],
  searchCl:    ['חיפוש לקוח','חיפוש מטופל'],
  company:     ['חברה','מטופלת'],
};
const t = k => (TERMS[k] ? TERMS[k][JP()?1:0] : k);
const pick = (hk, jp) => JP() ? jp : hk;

/* אייקונים — קו אחד, 24px, בלי קישוט */
const P = {
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  tasks:'<path d="M3 6l2 2 4-4M3 14l2 2 4-4"/><path d="M13 6h8M13 14h8M13 20h8"/>',
  mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  home:'<path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/>',
  camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7z"/>',
  flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
  pause:'<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',
  play:'<path d="M7 4l13 8-13 8z"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  back:'<path d="M9 18l6-6-6-6"/>',
  chev:'<path d="M15 18l-6-6 6-6"/>',
  down:'<path d="M6 9l6 6 6-6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  wifioff:'<path d="M2 2l20 20M8.5 16.4a5 5 0 0 1 7 0M5 12.6a10 10 0 0 1 5.2-2.8M19 12.6a10 10 0 0 0-2.1-1.6M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8A15 15 0 0 0 10.7 5M12 20h.01"/>',
  cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9z"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
  battery:'<rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  headset:'<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>',
  people:'<circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M15 14.5a5 5 0 0 1 6.5 4.8"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/>',
  down2:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  storage:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
};
const ic = (n, s=22, w=1.8, extra='') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}>${P[n]||''}</svg>`;
const icf = (n, s=22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor">${P[n]||''}</svg>`;

/* מספר: LTR, tabular, מינוס משמאל, ₪ קטן וקבוע */
const nis = (v, cls='') => {
  const neg = v < 0, a = Math.abs(v).toLocaleString('en-US');
  return `<span class="num ${cls}">${neg?'-':''}${a}<span class="cur">₪</span></span>`;
};

/* פס סטטוס iOS (RTL: שעה מימין) */
const sbar = (time='10:54', dark=false, bg='') => `
  <div class="sbar ${dark||bg?'dark':''}" style="${bg?`background:${bg}`:''}">
    <span class="num">${time}</span>
    <span class="st-r">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.3c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .5C5.2.5 2.7 1.6.8 3.4L2 4.7a8.6 8.6 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.8 6.8 0 0 0 8 4.1a6.8 6.8 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3zM8 9.5a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/><path d="M24 4v4c.8-.3 1.3-1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>`;

/* מסגרת טלפון. o: {time, dark, island:'rec'|'', homeLight, cls, scrCls} */
const phone = (inner, o={}) => `
  <div class="phone ${o.cls||''}">
    <div class="scr ${o.scrCls||''}">
      ${o.noIsland?'':`<div class="island ${o.island?'act':''}">`}${o.island==='rec'?`<i class="idot"></i><span class="itime num">${o.islandTime||'12:04'}</span>`:''}${o.noIsland?'':'</div>'}
      ${o.noSbar?'':sbar(o.time, o.dark, o.sbg || (o.dark && !o.scrCls && !o.cls ? 'var(--navy)' : ''))}
      ${inner}
      <div class="homeind ${o.homeLight?'light':''}"></div>
    </div>
  </div>`;

/* טאב־בר תחתון */
const TABS = {
  adv: () => [
    {k:'today', l:'היום', i:'sun'},
    {k:'tasks', l:'משימות', i:'tasks', b:3},
    {k:'rec', l:'הקלטה', i:'mic', fab:true},
    {k:'clients', l:t('clients'), i:'users'},
    {k:'meet', l:'פגישות', i:'cal', b: JP()?1:2},
  ],
  cli: () => [
    {k:'home', l:'בית', i:'home'},
    {k:'wait', l:'מחכה ממני', i:'inbox', b:2},
    {k:'doc', l:'מסמך', i:'camera', fab:true},
    {k:'meet', l:'פגישות', i:'cal'},
    {k:'ai', l:'עוזר', i:'spark'},
  ],
};
const tabbar = (set, on, o={}) => { const rec = o.recording || !!o.rec, pz = !!(o.rec && o.rec.paused), rt = (o.rec && o.rec.time) || o.recTime || '12:04'; return `
  <div class="tabs">${TABS[set]().map(x => x.fab
    ? `<div class="tab fab"><div class="fabb ${rec?'recording':''}" style="${pz?'background:var(--pausebar);box-shadow:none':''}">${rec?`<span class="num" style="font-size:12.5px;font-weight:700">${rt}</span>`:ic(x.i,26,2)}</div><span>${rec?(pz?'מושהה':'מקליט'):x.l}</span></div>`
    : `<div class="tab ${x.k===on?'on':''}"><div class="icw">${ic(x.i,24)}${x.b&&!o.noBadge?`<span class="badge num">${x.b}</span>`:''}</div><span>${x.l}</span></div>`
  ).join('')}</div>`; };

/* פס ההקלטה — מופיע מעל כל מסך כשיש הקלטה פעילה או מושהית */
const recbar = (o={}) => {
  const paused = o.paused;
  return `<div class="recbar ${paused?'paused':''}">

/* שאלות לאייל — אותה רשימה כמו בסוף TASK.md */

  ['adv','אין "סיום" בפס ההקלטה','SPEC §3 שם "סיום ההקלטה" בפס. בטלפון זה סיום מהכיס — הסיום רק ממסך ההקלטה, עם גיליון.'],
  ['adv','איזה מודל משימות','באפליקציה היום משימה = אירוע ב-/events ("לטיפול"); בדשבורד = advisor_task. הנחתי advisor_task — משימה אחת בשני המקומות.'],

  ['adv','פורמט ההקלטה','WAV ≈ 115MB לשעה. AAC 64kbps ≈ 29MB. להעביר לעידו כבדיקת איכות תמלול?'],
  ['adv','רגעים מסומנים = שדה חדש בשרת','פריט מוצר לעידו — לא נפתח בלוח עד שתאשר.'],
  ['cli','קול לבעל העסק','ההכרעה של 06.09: "בקרוב". אבל באפליקציה הקול כבר עובד (Soniox). הנחתי טקסט קודם, קול "בקרוב".'],
  ['cli','Jampa ללקוח','אין ממשק מטופל (07.09), אבל באפליקציה יש טעם nlp ל-CUSTOMER. הנחתי שיורד.'],
  ['cli','תכנון ותמונת תזרים בטלפון','לא אופיין. מסך קריאה בטלפון, או לפתוח את הדשבורד בדפדפן?'],

  ['both','גיליון לא נסגר ברקע','לפי הבריף. החלקה למטה סוגרת רק גיליון מידע, לא גיליון עם פעולה.'],
  ['adv','"חברה חדשה" לאזור האישי','יוצא מהכותרת.'],
  ['both','התראות push','"הסיכום מוכן" צריך שרת; "לא נשלח לסיכום" ו"להתחבר מחדש" — מקומית. פריט לעידו?'],
  ['adv','iOS מינימלי','האפליקציה ל-15.1. כפתורים ב-Live Activity — iOS 17; ב-16.1–16.x בלי כפתורים.'],
];
/* =====================================================================
   רינדור + חוזה כתובת: #adv/hk · #cli · ?only=R3&tab=adv&brand=jp (לצילום)
   ===================================================================== */
const Q = new URLSearchParams(location.search);
function intro(jpCli){
  if(S.tab==='adv') return `
  <div class="intro">
    <div class="card-doc">
      <h2>${pick('האפליקציה של היועץ','האפליקציה של המטפלת')}</h2>
      <p>${pick('היועץ לא יושב מול הטלפון. הוא פותח אותו בין פגישות, בדרך, בחדר ההמתנה. לכן שלושה דברים בלבד: <b>מה קורה היום</b>, <b>להקליט בלחיצה</b>, ו<b>לאשר את מה שנולד מהפגישה</b>. כל השאר — בדשבורד.','המטפלת פותחת את הטלפון בין מטופלים. שלושה דברים בלבד: <b>מה קורה היום</b>, <b>להקליט בלחיצה</b>, ו<b>לאשר את הסיכום</b>. בלי כסף, בלי זיכרון חברה, בלי עוזר AI (חסומים ב-Jampa, 07.09).')}</p>

      <p style="font-size:13px">טאב־בר תחתון קבוע. הכפתור האמצעי מתחיל הקלטה מכל מסך, ובזמן הקלטה הופך לשעון. אזור אישי (הרשאות, יציאה) — מהאווטאר.</p>
    </div>
    <div class="card-doc">
      <h2>החוקים, מותאמים לטלפון</h2>
      <ul>
        <li><b>אותה שפה כמו הדשבורד:</b> Rubik, סקאלה סגורה, בלוק ${pick('נייבי','סגול')} אחד, ${pick('קורל','סגול')} = הפעולה הראשית, אחת למסך. מספרים LTR ו-tabular.</li>
        <li><b>מטרת לחיצה 44px</b> — כפתורים 44, שורות 56. זו החריגה היחידה מ-${code('css/tokens.css')} (כפתור 37).</li>
        <li><b>גיליון תחתון במקום פופאפ.</b> נסגר ב-✕ או בכפתור — לא בלחיצה על הרקע. אין ${code('alert')} / ${code('confirm')} / ${code('Alert.alert')}. בורר — צ׳יפים, לא picker נייטיב.</li>
        <li><b>התראה = טקסט צבוע + נקודה 6px.</b> גלולות צבעוניות רק למצבים ("ממתין לאישור").</li>
        <li><b>אין נתונים מומצאים:</b> שדה בלי מקור = "—". <span class="miss" style="color:var(--danger-t);font-weight:600">● חסר בשרת</span> מסומן ליד כל מסך.</li>

      <p style="font-size:13px">הכפתור האמצעי פותח מצלמה. אזור אישי (יציאה) — מהאווטאר.</p>
    </div>
    <div class="card-doc">

      <ul>
        <li>HK, "מלווה על ידי", שמות עובדי HK.</li>
        <li>שלבי עיבוד ("הוקלטה · תמלול · סיכום"), תמלול, משוב ליועץ, זיכרון, הכנה לפגישה.</li>
        <li>תור התפעול, קיטלוג, "אצל המתפעל", טקסט מערכת באנגלית, markdown גולמי.</li>
        <li>עריכה של תכנון תזרימי ותמונת תזרים — השרת מחזיר 403, לא רק הממשק.</li>

function render(){
  const only = Q.get('only');
  document.body.classList.toggle('jp', JP() && S.tab==='adv');
  document.body.classList.toggle('only', !!only);
  const brandForCli = S.brand; if(S.tab==='cli') S.brand='hk';
  const list = SECTIONS[S.tab]();
  let html = only ? '' : intro(brandForCli==='jp'), idx='';
  list.forEach(s=>{
    if(s.part){ if(!only) html += `<div class="part"><div class="part-h"><h2>${s.part}</h2><span>${s.sub||''}</span></div></div>`; return; }
    idx += `<a href="#${s.code}"><b>${s.code}</b>${s.title}</a>`;
    if(only && only!==s.code) return;
    const ph = (s.phones||[]).map(p=>`<div class="ph-wrap">${p.html()}<div class="ph-cap">${p.cap||''}</div></div>`).join('');
    html += `<section class="sec ${s.wide?'wide':''}" id="${s.code}">
      ${s.wide ? `${notes(s)}${ph?`<div class="phones" style="margin-top:18px">${ph}</div>`:''}` : `<div class="phones">${ph}</div>${notes(s)}`}
    </section>`;
  });
  if(!only){
    html += `<div class="part"><div class="part-h"><h2>הנחות ושאלות לאייל</h2><span>החלטתי במקום לא ברור — לסמן ✓ או לתקן. אותה רשימה בסוף TASK.md</span></div></div>
    <div class="qs">${QUESTIONS.map((q,i)=>`<div class="q ${q[0]===S.tab||q[0]==='both'?'':'q-other'}"><span class="q-n num">${i+1}</span><div><b>${q[1]}</b><p>${q[2]}</p></div><span class="q-t">${q[0]==='adv'?'יועץ':q[0]==='cli'?'לקוח':'שניהם'}</span></div>`).join('')}</div>`;
  }
  S.brand = brandForCli;
  document.getElementById('doc').innerHTML = html;
  document.getElementById('idx').innerHTML = idx;
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on', b.dataset.tab===S.tab));
  document.querySelectorAll('[data-brand]').forEach(b=>b.classList.toggle('on', b.dataset.brand===S.brand));
  document.querySelector('.doc-logo').firstChild.textContent = JP() && S.tab==='adv' ? 'Jampa-APP ' : 'HK-APP ';
  if(!only) try{ localStorage.setItem('mspec', JSON.stringify(S)); }catch(e){}
  if(only) document.title = 'SHOT-READY';
}
function setTab(v){ S.tab=v; location.hash=S.tab+'/'+S.brand; render(); window.scrollTo(0,0); }
function setBrand(v){ S.brand=v; location.hash=S.tab+'/'+S.brand; render(); }

(function boot(){
  try{ Object.assign(S, JSON.parse(localStorage.getItem('mspec')||'{}')); }catch(e){}
  const h = location.hash.replace('#','').split('/');
  if(h[0]==='adv'||h[0]==='cli') S.tab=h[0];
  if(h[1]==='hk'||h[1]==='jp') S.brand=h[1];
  if(Q.get('tab')) S.tab=Q.get('tab');
  if(Q.get('brand')) S.brand=Q.get('brand');
  render();
  if(/^[ARC]\d+$/.test(h[0])) document.getElementById(h[0])?.scrollIntoView();
})();
</script>
