<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAMPA · הקליניקה של ענת שלו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   JAMPA — המעטפת. אותו מבנה של המערכת ב-HK: פס עליון, סרגל דו-רמתי,
   ומסגרת אחת לכל מסך. המסכים עצמם חיים ב-adv/ (הרובד של המטפלת,
   לכל המטופלים) וב-cli/ (הרובד של מטופל אחד) ונטענים עצל.
   המעטפת לא מכילה תוכן — היא רק מנתבת. כל מה שנראה על המסך מגיע
   מהמסך המוטמע, ולכן אין כאן כפילות עיצוב מול המסכים.
   ===================================================================== */
/* הטוקנים מ-Jampa-Fig בפיגמה. המפה המלאה עם שמות המשתנים — cli/cli.css. */
:root{
  --navy:#6F62AC;--navy2:#5C5192;   /* Purple 01 */
  --sky:#7557E3;                     /* Purple 01 */
  --coral:#7557E3;--coral-d:#5F45C4; /* פעולה */
  --ink:#696971;--ink2:#949494;--ink3:#9B9BA6;--faint:#C8C8CF;
  --bd:#E3E3E3;--cardbd:#EFEFEF;--bg:#FFFBF3;
  --tint:#F0EBFF;--chip:#E5E7FF;     /* NLP/Purple 04 · Purple 04 */
  --on-navy:#F1EEFB;--on-navy2:#DAD3F2;--on-navy3:#BCB2E4;
  --lift:0 0 6.7px rgba(12,64,104,.15);   /* Gentle */
  --rail:264px;--top:60px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:Rubik,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#C8CCFF;border-radius:99px;border:3px solid var(--bg);background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#9481DA;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ---------- הזהות והמשתמשת — בקצוות הסרגל ----------
   אין פס עליון: הוא היה מחזיק לוגו ושם בלבד, ועלה 58px מגובה המסכים
   שרובם נעולי-גובה. הזהות עוברת לראש הסרגל, המשתמשת לתחתיתו, וכותרת
   המסך המוטמע עצמו הופכת לכותרת העליונה — לשם היא ממילא עוצבה. */
/* הפס העליון — הזהות והפעולה הראשית. */
.top{position:fixed;inset-inline:0;top:0;height:var(--top);z-index:30;background:#fff;
  border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:18px;padding:0 20px}
.top .sp{flex:1}
.brand{flex:none;display:flex;align-items:center}
/* הלוגו המקורי (Logo.png · 299×108). הגובה קובע, הרוחב נגזר —
   34px מציגים אותו ב-2x מתוך 108, כלומר חד גם ברטינה. */
.brand img{height:34px;width:auto;display:block}
/* הפעולה הראשית — גלולה מתוארת, כמו בפיגמה */
.top-act{flex:none;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 18px;
  border:1px solid var(--sky);border-radius:999px;color:var(--sky);
  font-size:14px;font-weight:500;transition:.14s}
.top-act:hover{background:var(--tint)}
.top-act svg{flex:none}

.me-wrap{flex:none;position:relative;border-top:1px solid var(--cardbd)}
.me{width:100%;display:flex;align-items:center;gap:10px;padding:11px 16px;text-align:start;
  transition:background .12s}
.me:hover{background:var(--bg)}
.me .chev{margin-inline-start:auto;flex:none;color:var(--faint);transition:transform .15s}
.me[aria-expanded="true"] .chev{transform:rotate(180deg)}
/* התפריט נפתח כלפי מעלה — הוא יושב בתחתית המסך */
.me-menu{position:absolute;inset-inline:10px;bottom:calc(100% + 6px);background:#fff;
  border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 24px rgba(12,64,104,.18);
  padding:6px;display:none;z-index:40}
.me-menu.on{display:block}
.me-menu button{width:100%;text-align:start;padding:9px 11px;border-radius:8px;font-size:13px;
  color:var(--ink);transition:background .12s}
.me-menu button:hover{background:var(--tint);color:var(--navy)}
.me-menu .sep{height:1px;background:var(--cardbd);margin:5px 4px}
/* לא אדום: אדום שמור לסכנה, ויציאה היא לא סכנה. אפור-דיו, כמו
   פריט ההסרה בתפריט של "התהליך הטיפולי" (.pr-menu button.rm). */
.me-menu .out{color:var(--ink2)}
.me i{flex:none;width:31px;height:31px;border-radius:50%;background:var(--chip);color:#7557E3;
  font-style:normal;font-size:12px;font-weight:600;display:grid;place-items:center}
.me div{min-width:0;line-height:1.35}
.me b{display:block;font-size:12.5px;font-weight:500;color:var(--navy)}
.me span{display:block;font-size:11px;color:var(--ink3)}

/* ---------- הפריסה ----------
   grid ולא מיקום קבוע: ב-RTL העמודה הראשונה היא הימנית, ולכן הסרגל
   נוחת בצד הנכון מעצמו. inset-inline-end היה מציב אותו בשמאל. */
.shell{display:grid;grid-template-columns:var(--rail) 1fr;height:calc(100vh - var(--top));margin-top:var(--top)}

/* ---------- הסרגל ----------
   אותם רכיבים של המערכת (css/base.css), במידות המקוריות:
   .gn-item · .gn-back · .gn-co · .rail-head · .rail-search · .cli
   עמודת flex: הניווט קבוע למעלה, הרשימה לוקחת את השארית וגוללת בעצמה. */
.rail{height:calc(100vh - var(--top));background:#fff;border-inline-end:1px solid var(--bd);
  display:flex;flex-direction:column;min-height:0}
.rail-body{flex:1;min-height:0;display:flex;flex-direction:column}
.rail-nav{flex:none;padding:12px 10px}
.rail-nav.solo{flex:1;overflow-y:auto}
.rail-pt{flex:1;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--cardbd)}

/* פריט ניווט */
.gn-item{width:100%;display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:12px;
  color:var(--ink);font-size:14px;font-weight:500;text-align:start;transition:.12s}
.gn-item svg{color:var(--ink3);flex:0 0 auto}
.gn-item:hover{background:var(--bg)}
.gn-item.on{background:var(--navy);color:#fff;font-weight:600}
.gn-item.on svg{color:#CBC0F7}
.gn-item.sec{padding:9.5px 14px;font-size:13.5px}
.gn-item em{margin-inline-start:auto;font-style:normal;min-width:18px;height:18px;padding:0 5px;
  border-radius:999px;background:var(--coral);color:#fff;font-size:11px;font-weight:600;
  display:flex;align-items:center;justify-content:center}
.gn-item.on em{background:#fff;color:var(--navy)}

/* חזרה ושם המטופל */
.gn-back{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#7557E3;
  padding:6px 12px;border-radius:999px;margin:0 2px 2px}
.gn-back:hover{background:var(--chip)}
.gn-co.big{font-size:15px;font-weight:700;color:var(--navy);padding:4px 14px 2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gn-sub{font-size:11.5px;color:var(--ink3);padding:0 14px 12px;line-height:1.5;
  border-bottom:1px solid var(--cardbd);margin-bottom:8px}

/* כותרת הרשימה */
.rail-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.rail-head .rt{font-size:13px;font-weight:600;color:var(--navy);white-space:nowrap}
.rail-head .badge{background:var(--chip);color:var(--navy);font-size:11px;font-weight:600;
  padding:1px 8px;border-radius:999px}
.allbtn{margin-inline-start:auto;font-size:11.5px;font-weight:500;color:var(--ink3);
  padding:4px 9px;border-radius:999px;transition:.12s;white-space:nowrap}
.allbtn:hover{background:var(--bg);color:var(--navy)}
.allbtn.on{background:var(--chip);color:var(--navy)}

/* חיפוש */
.rail-search{margin:0 16px 8px;display:flex;align-items:center;gap:8px;background:var(--bg);
  border:1px solid var(--bd);border-radius:10px;padding:8px 11px}
.rail-search input{border:none;outline:none;background:transparent;font-family:inherit;
  font-size:13px;width:100%;color:var(--ink)}
.rail-search input::placeholder{color:var(--faint)}
.rail-search svg{opacity:.5;flex:0 0 auto;color:var(--ink3)}

/* שורת מטופל — .cli של המערכת */
.rail-list{flex:1;overflow-y:auto;padding:2px 10px 16px}
.cli{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;
  margin-bottom:2px;border:1px solid transparent;text-align:start;transition:.12s}
.cli:hover{background:var(--bg)}
.cli .ci{min-width:0;flex:1}
.cli .cn{font-size:13.5px;font-weight:500;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli .cs{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.cli-none{padding:18px 12px;text-align:center;font-size:12px;color:var(--ink3);line-height:1.9}
.cli-none .lnk{font-size:12px;font-weight:500;color:#7557E3}
.cli-none .lnk:hover{text-decoration:underline}

/* ---------- הבמה ---------- */
.stage{min-width:0;overflow-y:auto}
.fr{width:100%;border:0;display:none;background:transparent}
#shToast{position:fixed;bottom:26px;inset-inline:0;margin-inline:auto;width:max-content;
  max-width:calc(100vw - 48px);background:var(--navy);color:#fff;font-size:13px;
  padding:10px 20px;border-radius:999px;box-shadow:0 8px 24px rgba(12,64,104,.22);
  opacity:0;transform:translateY(14px);pointer-events:none;transition:.2s;z-index:60}
#shToast.on{opacity:1;transform:none}
.fr.on{display:block}
@media(max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);height:auto;min-height:100vh;margin-top:0}
  .rail{height:auto;border-inline-end:0;border-bottom:1px solid var(--bd);
    flex-direction:row;align-items:center;overflow-x:auto;padding:8px 12px;gap:8px}
  .top{position:static;height:auto;padding:9px 14px}
  .top-act{height:34px;padding:0 14px;font-size:13px}
  .me{border:0}
  .me div,.me .chev{display:none}
  .me{width:auto;padding:0}
  .rail-body{flex-direction:row;align-items:center;gap:8px;flex:1}
  .rail-nav,.rail-pt{padding:0;border:0;margin:0;flex:none;display:flex;gap:6px;align-items:center}
  .rail-head,.rail-search,.gn-sub{display:none}
  .rail-pt{border-inline-start:1px solid var(--cardbd);padding-inline-start:8px}
  .rail-list{display:flex;gap:6px;overflow:visible;padding:0}
  .gn-item,.cli{width:auto;flex:none;white-space:nowrap;padding:8px 12px}
  .cli .cs{display:none}
  .stage{overflow:visible}
}
</style>
</head>
<body>



<header class="top">
  <a class="brand" href="#" onclick="go('today');return false" aria-label="JAMPA — לדף הבית">
    <img src="Logo.png" alt="JAMPA" width="299" height="108"></a>
  <div class="sp"></div>
  <button class="top-act" onclick="toast('בדמו: קביעת פגישה')">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
    קביעת פגישה</button>
</header>

<div class="shell">
  <nav class="rail">
    <div class="rail-body" id="rail"></div>
    <div class="me-wrap">
      <div class="me-menu" id="meMenu" role="menu">
        <button role="menuitem" onclick="meGo('איזור אישי')">איזור אישי</button>
        <button role="menuitem" onclick="meGo('הגדרות הקליניקה')">הגדרות הקליניקה</button>
        <div class="sep"></div>
        <button role="menuitem" class="out" onclick="meGo('יציאה')">יציאה מהמערכת</button>
      </div>
      <button class="me" id="meBtn" onclick="meTg(event)" aria-haspopup="menu" aria-expanded="false">
        <i>עש</i>
        <div><b>ענת שלו</b><span>פסיכולוגית קלינית</span></div>
        <svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
  </nav>
  <main class="stage" id="stage"></main>
</div>

<script>
/* =====================================================================
   הנתונים של המעטפת בלבד: מי המטופלים, ומה המסכים בכל רובד.
   כל היתר חי בתוך המסכים עצמם.
   ===================================================================== */
/* sub = מה שרלוונטי עכשיו — מתי הפגישה ואיפה הוא בתהליך. הנקודה
   הקורלית היא סימן אחד בלבד: משהו מחכה כאן. בלי מערכת צבעים —
   השורה עצמה אומרת את המצב, הנקודה רק מסמנת מי צריך אותך. */
const PT=[
  {id:'p1',n:'נועה ברק',   f:'חרדה חברתית',         st:'שלב 4 · עבודה על דפוסים', sub:'היום 16:00 · שלב 4',  unread:2},
  {id:'p4',n:'דניאל כהן',  f:'ויסות רגשי · מתבגרים', st:'שלב 3 · כלים להתמודדות',  sub:'היום 17:30 · לא ענה', attn:1},
  {id:'p3',n:'מיכל אדרי',  f:'ביטחון עצמי בעבודה',   st:'שלב 5 · יישום והטמעה',    sub:'שבועיים בלי פגישה',   attn:1, unread:1},
  {id:'p2',n:'יואב פרידמן', f:'משבר זוגי',            st:'שלב 2 · מיפוי צרכים',     sub:'מחר 10:00 · שלב 2'},
  {id:'p5',n:'שרה לוינסון', f:'אבל ואובדן',           st:'שלב 1 · בניית קשר',       sub:'ראשון 09:00 · שלב 1'},
  {id:'p6',n:'עומר גל',    f:'דחיינות ומיקוד',       st:'שלב 4 · עבודה על דפוסים', sub:'רביעי 13:00 · שלב 4'},
];

const I={
  today:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  tasks:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l2 2 3.5-3.5M4 14.5l2 2 3.5-3.5"/><path d="M13 7h7M13 15h7"/></svg>',
  people:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3.6"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>',
  meets:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  mem:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7-4.6-7-10a4.5 4.5 0 0 1 7-3.7A4.5 4.5 0 0 1 19 11c0 5.4-7 10-7 10z"/></svg>',
  cal:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M16 2v4M8 2v4M3 10h18"/><circle cx="8.5" cy="14.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="14.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="14.5" r="1.1" fill="currentColor" stroke="none"/></svg>',
  dash:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  msgs:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.4 8.6 8.6 0 0 1-3.9-.9L3 21l1.9-5.5A8.4 8.4 0 1 1 21 11.5z"/></svg>',
  ai:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-3.5 3 1 4.6L12 14.7 8 16.6l1-4.6L5.5 9l4.6-1.4z"/></svg>',
  flow:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M7.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h7.5"/></svg>',
};

/* הרובד של המטפלת — לכל המטופלים */
/* הניווט הרוחבי. "כל המטופלים" (adv/clients.html) לא יושב כאן אלא
   בראש רשימת המטופלים — הוא הלוח שלה, לא עוד יעד ברשימת יעדים. */
const ADV=[
  {k:'today', f:'adv/today.html',    l:'היום',            i:'today'},
  {k:'tasks', f:'adv/tasks.html',    l:'משימות',          i:'tasks'},
  {k:'meetings',f:'adv/meetings.html',l:'פגישות',         i:'meets'},
  {k:'memory',f:'adv/memory.html',   l:'פרופילי מטופלים', i:'mem'},
  {k:'cal',   f:'adv/calendar.html', l:'יומן',            i:'cal'},
];
const BOARD={k:'clients', f:'adv/clients.html', l:'כל המטופלים', i:'people'};
/* הרובד של מטופל אחד */
const CLI=[
  {k:'dash',  f:'cli/dashboard.html', l:'דשבורד',           i:'dash'},
  {k:'msgs',  f:'cli/messages.html',  l:'השיחה',            i:'msgs', badge:p=>p.unread},
  {k:'meets', f:'cli/meetings.html',  l:'פגישות',           i:'meets'},
  {k:'ai',    f:'cli/ai.html',        l:'עוזר AI',          i:'ai'},
  {k:'flow',  f:'cli/process.html',   l:'התהליך הטיפולי',   i:'flow'},
];

let SCOPE='adv';     /* adv = כל המטופלים · cli = מטופל אחד */
let VIEW='today';    /* המסך הפעיל בתוך הרובד */
let CUR=null;        /* המטופל הפתוח */

/* ---------- הבמה: מסגרת אחת לכל מסך, נטענת בכניסה הראשונה ---------- */
const stage=document.getElementById('stage');
function frame(k,src){
  let f=document.getElementById('f_'+k);
  if(!f){
    f=document.createElement('iframe');
    f.id='f_'+k; f.className='fr'; f.title=k; f.loading='lazy';
    f.style.minHeight='calc(100vh - var(--top))';
    f.src=src+(src.indexOf('?')>-1?'&':'?')+'embed=1';
    stage.appendChild(f);
  }
  return f;
}
function show(k,src){
  stage.querySelectorAll('.fr').forEach(x=>x.classList.remove('on'));
  frame(k,src).classList.add('on');
}

/* ---------- ניווט ---------- */
function go(k){                       /* רובד המטפלת */
  const it=ADV.find(x=>x.k===k)||ADV[0];
  SCOPE='adv'; VIEW=it.k; CUR=null;
  show('adv_'+it.k,it.f); rail();
  scrollTo({top:0,behavior:'instant'});
}
function openPt(id,k){                /* רובד המטופל */
  const p=PT.find(x=>x.id===id); if(!p) return;
  const it=CLI.find(x=>x.k===k)||CLI[0];
  SCOPE='cli'; VIEW=it.k; CUR=p;
  /* בדמו כל המסכים בנויים סביב נועה — המעטפת אומרת את זה במפורש
     במקום להעמיד פנים שהתוכן מתחלף. */
  show('cli_'+it.k,it.f); rail(); 
  scrollTo({top:0,behavior:'instant'});
}
function cliGo(k){ if(CUR) openPt(CUR.id,k); }

/* ---------- הסרגל ----------
   בנוי על אותם רכיבים של המערכת (css/base.css): .gn-item לניווט,
   .rail-head לכותרת הרשימה, .rail-search לחיפוש, .cli לשורת אדם.
   שני מצבים:
   · ברמה הגלובלית — ניווט רוחבי, ומתחתיו רשימת המטופלים. הרשימה היא
     הדלת; בלעדיה צריך לדעת לחפש בפס העליון, וזה לא מתגלה מעצמו.
   · בתוך מטופל — נקי. חזרה, השם, והסקציות שלו בלבד. */
let RQ='';

/* שם ושורת משנה. בלי מונים ובלי נקודות — שורת המשנה כבר אומרת את
   המצב ("היום 17:30 · לא ענה"), וסימן נוסף מעליה הוא רעש. */
function ptRow(p){
  return `<button class="cli" onclick="openPt('${p.id}')">
    <div class="ci"><div class="cn">${p.n}</div><div class="cs">${p.sub}</div></div>
  </button>`;
}

function rail(){
  const r=document.getElementById('rail');

  if(SCOPE==='cli'){
    r.innerHTML=`<div class="rail-nav solo">
      <button class="gn-back" onclick="go('clients')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
        כל המטופלים</button>
      <div class="gn-co big">${CUR.n}</div>
      <div class="gn-sub">${CUR.f} · ${CUR.st}</div>`+
      CLI.map(c=>{const b=c.badge&&c.badge(CUR);
        return `<button class="gn-item sec ${VIEW===c.k?'on':''}" onclick="cliGo('${c.k}')">${I[c.i]}<span>${c.l}</span>${b?`<em>${b}</em>`:''}</button>`}).join('')+
      `</div>`;
    return;
  }

  const nav = ADV.map(a=>
    `<button class="gn-item ${VIEW===a.k?'on':''}" onclick="go('${a.k}')">${I[a.i]}<span>${a.l}</span></button>`).join('');
  const hits = PT.filter(p=>!RQ||p.n.includes(RQ)||p.f.includes(RQ)||p.sub.includes(RQ));

  r.innerHTML =
    `<div class="rail-nav">${nav}</div>
     <div class="rail-pt">
       <div class="rail-head">
         <span class="rt">מטופלים</span><span class="badge num">${PT.length}</span>
         <button class="allbtn ${VIEW==='clients'?'on':''}" onclick="go('clients')">כל 23 בלוח</button>
       </div>
       <div class="rail-search">
         <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
         <input id="rq" placeholder="חיפוש מטופל" autocomplete="off" value="${RQ}" oninput="rqSet(this.value)">
       </div>
       <div class="rail-list">${
         hits.length ? hits.map(ptRow).join('')
                     : `<div class="cli-none">אין מטופל פעיל שמתאים ל"${RQ}"<br><button class="lnk" onclick="go('clients')">לחיפוש בלוח המלא</button></div>`}</div>
     </div>`;
}
function rqSet(v){
  RQ=v.trim(); rail();
  const el=document.getElementById('rq');
  if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); }
}


/* =====================================================================
   הפרוטוקול מול המסכים המוטמעים — זהה לזה של המערכת ב-HK:
   hkAdv/hkCli מדווחים גובה · hkAdvGo/hkCliGo מבקשים החלפת מסך ·
   hkAdvOpen פותח מטופל · hkAdvLock נועל את המסגרת לגובה החלון.
   ===================================================================== */
const ADVKEY={}, CLIKEY={};
ADV.forEach(a=>ADVKEY[a.f.split('/').pop().replace('.html','')]=a.k);
CLI.forEach(c=>CLIKEY[c.f.split('/').pop().replace('.html','')]=c.k);

addEventListener('message',e=>{
  const d=e.data||{}; if(typeof d!=='object') return;
  if(d.hkAdv&&d.h>200){ const f=document.getElementById('f_adv_'+d.hkAdv); if(f)f.style.minHeight=d.h+'px'; return; }
  if(d.hkCli&&d.h>200){ const f=document.getElementById('f_cli_'+d.hkCli); if(f)f.style.minHeight=d.h+'px'; return; }
  if(d.hkAdvLock){ const f=stage.querySelector('.fr.on'); if(f)f.style.minHeight='calc(100vh - var(--top))'; return; }
  if(d.hkAdvGo){ const k=ADVKEY[d.hkAdvGo]; if(k) go(k); return; }
  if(d.hkAdvOpen){ openPt(d.hkAdvOpen); return; }
  if(d.hkCliGo){
    const k=CLIKEY[d.hkCliGo]; if(!k||!CUR) return;
    openPt(CUR.id,k);
    /* שאלה שנשלחה לעוזר — נכנסת ל-src של המסגרת */
    if(k==='ai'&&d.q){ const f=document.getElementById('f_cli_ai');
      if(f) f.src='cli/ai.html?embed=1&q='+encodeURIComponent(d.q); }
    return;
  }
});

/* ---------- תפריט המשתמשת ---------- */
function meTg(e){
  e.stopPropagation();
  const m=document.getElementById('meMenu'), on=!m.classList.contains('on');
  m.classList.toggle('on',on);
  document.getElementById('meBtn').setAttribute('aria-expanded',on);
}
function meClose(){
  document.getElementById('meMenu').classList.remove('on');
  document.getElementById('meBtn').setAttribute('aria-expanded','false');
}
function meGo(w){ meClose(); toast(w==='יציאה'?'בדמו: יציאה מהמערכת':'בדמו: '+w); }
addEventListener('click',e=>{ if(!e.target.closest('.me-wrap')) meClose(); });
addEventListener('keydown',e=>{ if(e.key==='Escape') meClose(); });

/* טוסט קטן של המעטפת — למה שקורה מחוץ למסכים */
let _tt;
function toast(m){
  let el=document.getElementById('shToast');
  if(!el){ el=document.createElement('div'); el.id='shToast'; document.body.appendChild(el); }
  el.textContent=m; el.classList.add('on');
  clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('on'),2400);
}

/* ---------- פתיחה ---------- */
go('today');
</script>
