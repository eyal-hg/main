<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>נועה ברק · השיחה · JAMPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cli.css">
<style>
/* =====================================================================
   השיחה — אותו מנגנון של קבוצת הוואטסאפ ב-HK: גלולת יום · בועות ·
   כרטיס הזיקוק הלילי. ההבדל המבני: **בג'מפה אין קבוצות** — יש הודעות
   ישירות מול המטופל, ולכן עמודת הקבוצות של HK ירדה והשיחה תופסת את
   כל הרוחב. המערכת פונה לנועה בטון ובגישה של ענת, נועה עונה, וג'מפה
   מזקקת מזה מה שנכנס לפרופיל. אין תיבת כתיבה — ענת עונה בוואטסאפ עצמו.
   ===================================================================== */
body{font-family:Rubik,system-ui,sans-serif}
.mg{display:flex;gap:18px;align-items:flex-start}
.mg-main{flex:1;min-width:0}
/* שורת המשתתפים בכותרת — מחליפה את עמודת הקבוצות של HK */
.mg-who{display:flex;align-items:center;gap:12px;margin-inline-start:14px;
  padding-inline-start:14px;border-inline-start:1px solid var(--tint)}
.mg-w{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2)}
.mg-w i{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;
  font-style:normal;font-size:10.5px;font-weight:600}

/* גוון לפי תפקיד — אותו קוד צבע באווטאר בשיחה ובשורת המשתתפים */
.cl  i{background:#EFECFD;color:#5b3fd6}   /* המטופלת */
.adv i{background:#F0E7F7;color:#8E4BA8}   /* המטפלת עצמה */
.bot i{background:#F1EEF9;color:#7C74A0}   /* המערכת, בטון של המטפלת */

/* ---------- חלון השיחה ---------- */
.mg-box{background:#fff;border:1px solid var(--cardbd);border-radius:14px;box-shadow:var(--lift);
  display:flex;flex-direction:column;overflow:hidden}
.mg-head{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--tint);flex:none}
.mg-head h2{font-size:15px;font-weight:700;color:var(--navy)}
.mg-head .cnt{font-size:11.5px;color:var(--ink3)}
.mg-head .sp{margin-inline-start:auto}
.mg-sr{position:relative}
.mg-sr input{width:210px;border:1px solid var(--bd);border-radius:999px;padding:6px 32px 6px 14px;font-size:12.5px}
.mg-sr input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(117,87,227,.16)}
.mg-sr svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
/* הגלילה קורית כאן בלבד — הכותרת וגלולת היום לא נגללות החוצה */
.mg-scroll{flex:1;overflow-y:auto;padding:16px 20px 20px;background:linear-gradient(180deg,#FBF9FE,#fff 90px)}

.mg-day{display:flex;align-items:center;justify-content:center;margin:14px 0 12px}
.mg-day span{background:var(--chip);color:var(--ink2);font-size:11.5px;font-weight:600;
  border-radius:999px;padding:4px 14px}
.mg-msg{display:flex;gap:11px;padding:7px 0}
.mg-msg i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-style:normal;font-size:12.5px;font-weight:700;margin-top:2px}
/* עמודת קריאה — בלי התקרה השעה נזרקת לקצה השני של המסך ומתנתקת מההודעה */
.mg-bd{min-width:0;flex:1;max-width:820px}
.mg-mh{display:flex;align-items:baseline;gap:8px}
.mg-mh b{font-size:12.5px;font-weight:600;color:var(--ink)}
.mg-mh .j{font-size:11px;color:var(--ink3)}
/* השעה צמודה לשם ולא נזרקת לקצה — ההודעות קצרות, ומרחק גדול מנתק אותה מהן */
.mg-mh .t{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.mg-mh .t::before{content:"· "}
.mg-t{font-size:13.5px;color:var(--ink);line-height:1.6;margin-top:2px}
.mg-msg.unk .mg-mh b{direction:ltr;font-variant-numeric:tabular-nums}
.mg-tag{display:inline-block;margin-top:5px;font-size:11px;font-weight:600;color:var(--navy);
  background:var(--tint);border-radius:999px;padding:2px 10px}
.mg-msg.hit .mg-t{background:#FFF4CF;border-radius:8px;padding:2px 6px;margin-inline-start:-6px}

/* ---------- כרטיס הסיכום הלילי ---------- */
.mg-sum{background:var(--navy);color:#fff;border-radius:12px;padding:14px 17px;margin:14px 0 6px}
.mg-sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.mg-sh b{font-size:13px;font-weight:700}
.mg-sh span{font-size:11.5px;color:var(--on-navy3)}
.mg-sh a{margin-inline-start:auto;font-size:11.5px;font-weight:600;color:#B9A9F7}
.mg-sh a:hover{text-decoration:underline}
.mg-fam{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  color:var(--on-navy2);margin:9px 0 5px}
.mg-fam:first-child{margin-top:0}
.mg-fam .dot{width:7px;height:7px;border-radius:50%}
.mg-fam.co .dot{background:#B9A9F7}
.mg-fam.pr .dot{background:#E0B7F0}
.mg-sl{display:flex;align-items:baseline;gap:10px;font-size:13px;color:#EDE9F8;
  line-height:1.6;padding:3px 0 3px 0;margin-inline-start:14px;position:relative}
.mg-sl::before{content:"";position:absolute;inset-inline-start:-14px;top:10px;width:4px;height:4px;
  border-radius:50%;background:rgba(255,255,255,.4)}
/* התגית צמודה לשורה שלה — ב"auto" היא נזרקת לקצה השני של הכרטיס */
.mg-slc{flex:none;font-size:10.5px;color:var(--on-navy3);
  border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:1px 9px}
.mg-unk{margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);
  font-size:11.5px;color:#F2C98A;display:flex;align-items:center;gap:7px}
.mg-unk svg{flex:none}
/* ממתין לעיבוד — לא כרטיס, רק שורה */
.mg-wait{display:flex;align-items:center;gap:8px;margin:14px 0 4px;padding:9px 14px;
  border:1px dashed var(--bd);border-radius:10px;font-size:12px;color:var(--ink3)}
.mg-wait .sd{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.mg-wait b{color:var(--ink2);font-weight:600}

/* ---------- הרגל: אין תיבת כתיבה ---------- */
.mg-foot{flex:none;display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--tint)}
.mg-foot .note{font-size:12px;color:var(--ink3)}
.mg-empty{padding:40px 0;text-align:center;font-size:13px;color:var(--ink3)}
@media(max-width:820px){.mg-who{display:none}}
</style>
</head>
<body data-cli="msgs">
<main class="wrap">
  <div class="mg">
    <div class="mg-main">
      <div class="mg-box" id="mgBox">
        <div class="mg-head">
          <h2 id="mgName"></h2><span class="cnt" id="mgCnt"></span>
          <span class="mg-who" id="mgWho"></span>
          <span class="sp"></span>
          <div class="mg-sr">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.2-4.2"/></svg>
            <input id="mgQ" placeholder="חיפוש בשיחה" oninput="mgRender(false)">
          </div>
        </div>
        <div class="mg-scroll" id="mgScroll"></div>
        <div class="mg-foot">
          <a class="btn pri" href="#" onclick="toast('בדמו: וואטסאפ ייפתח על השיחה עם נועה');return false">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 20.5l1.7-5.5A8.4 8.4 0 1 1 21 11.5z"/></svg>
            המשך בוואטסאפ</a>
          <span class="note">המערכת פונה בטון ובגישה שלך; מה שדורש אותך — נענה בוואטסאפ עצמו.</span>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="cli.js"></script>
<script>
hkChrome('msgs',{strip:false});

/* הנתונים כמו ב-jampa/js/data.js · PATIENTS[0].chat — הורחבו לשבוע שלם
   כדי שלזיקוק הלילי יהיה על מה לעבוד. תפקידים: cl=נועה · adv=ענת · bot=ג'מפה. */
const S=(t,cat,sc,on)=>({t,cat,sc:sc||'co',on:on||''});
const THREADS={
  main:{name:'הודעות ישירות · נועה ברק', ppl:[
      {n:'נועה ברק',j:'מטופלת',r:'cl'},
      {n:'ענת שלו',j:'מטפלת',r:'adv'},
      {n:'ג׳מפה',j:'אוטומטי · בטון של ענת',r:'bot'}], msgs:[
    {day:'שני · 29.06'},
    {who:'ג׳מפה', job:'אוטומטי', role:'bot', t:'בוקר טוב נועה 🌸 שבוע חדש. מה התרגול שהכי עזר לך בשבוע שעבר?', time:'08:30', tag:'פתיחת שבוע'},
    {who:'נועה ברק', job:'מטופלת', role:'cl', t:'הנשימות. אני עושה אותן בדרך לעבודה וזה עוזר לי להיכנס יותר רגועה', time:'09:12'},
    {who:'ג׳מפה', job:'אוטומטי', role:'bot', t:'יפה. מחר יש לך ישיבת צוות — רוצה שנזכיר לך את זה בבוקר?', time:'09:15'},
    {who:'נועה ברק', job:'מטופלת', role:'cl', t:'כן. אני כבר עכשיו חושבת על זה יותר מדי', time:'09:20', tag:'ציפייה מלחיצה'},
    {sum:{ran:'02:00', n:7, lines:[
      S('הנשימות הפכו לכלי שהיא מיישמת מיוזמתה — לפני החשיפה ולא אחריה','כלים שעובדים'),
      S('מחשבות חוזרות יום לפני ישיבת צוות','דפוס ההימנעות','pr','נועה ברק')]}},

    {day:'שלישי · 30.06'},
    {who:'ג׳מפה', job:'אוטומטי', role:'bot', t:'היום הישיבה. תזכורת אחת: המטרה היא לא לא-להילחץ, אלא להישאר בחדר 💜', time:'08:00', tag:'תזכורת שסוכמה'},
    {who:'נועה ברק', job:'מטופלת', role:'cl', t:'אמרתי משפט אחד. הלב דפק חזק אבל לא יצאתי', time:'14:35'},
    {who:'ג׳מפה', job:'אוטומטי', role:'bot', t:'זה בדיוק מה שסיכמתן. נשמור את זה לפגישה — ענת תרצה לשמוע איך זה הרגיש', time:'14:38'},
    {who:'נועה ברק', job:'מטופלת', role:'cl', t:'אני מניחה. אני גם חושבת שיכולתי להגיד את זה יותר טוב', time:'14:52', tag:'ביקורת עצמית'},
    {sum:{ran:'02:00', n:9, lines:[
      S('נשארה בישיבה ואמרה משפט — הפעם הראשונה שהיא מדווחת על כך בזמן אמת','נקודת מפנה'),
      S('מיד אחרי ההצלחה הגיעה ביקורת עצמית שמנטרלת את החיזוק','דפוס חדש','pr','נועה ברק'),
      S('יומן המצבים לא מולא — שבוע שני ברציפות','משימות פתוחות')]}},

    {day:'היום · חמישי 02.07'},
    {who:'ג׳מפה', job:'אוטומטי', role:'bot', t:'היום ב-16:00 הפגישה עם ענת. משהו שהיית רוצה שנעלה?', time:'08:10'},
    {who:'נועה ברק', job:'מטופלת', role:'cl', t:'כן — למה אחרי שמשהו מצליח לי אני מיד מוצאת מה היה לא בסדר בו', time:'09:41', tag:'ביקשה להעלות'},
    {who:'ג׳מפה', job:'אוטומטי', role:'bot', t:'רשמתי. זה יחכה לענת בראש הפגישה 🌸', time:'09:42'},
    {sum:{pending:3}},
  ]},
};
/* אות אחת. לעברית אין קונבנציה לראשי-תיבות דו-אותיים, ו"בוט HK" יוצא "בH". */
const INI=n=>String(n||'').trim().charAt(0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let SEL='main';

/* קיבוץ לפי משפחה — קודם התהליך ואז הדפוסים האישיים, כמו שתי העמודות
   בפרופיל. הנקודה הצבועה עולה מהשורה לכותרת המשפחה. */
function fam(lines){
  const out=[];
  lines.forEach(l=>{const sc=l.sc==='pr'?'pr':'co', k=sc==='pr'?'pr:'+l.on:'co';
    let g=out.find(x=>x.k===k);
    if(!g){g={k,sc,n:sc==='pr'?(l.on||'דפוסים'):'התהליך',lines:[]};out.push(g);}
    g.lines.push(l);});
  return out.sort((a,b)=>(a.sc==='co'?0:1)-(b.sc==='co'?0:1));
}

function sumHtml(s){
  if(s.pending) return `<div class="mg-wait"><span class="sd"></span>
    הזיקוק הלילי ירוץ הלילה ב-02:00 · <b>${s.pending}</b> הודעות ממתינות לעיבוד</div>`;
  return `<div class="mg-sum">
    <div class="mg-sh"><b>נכנס לפרופיל של נועה</b>
      <span>זיקוק לילי · רץ ב-${s.ran} · ${s.n} הודעות</span>
      <a href="ai.html?q=${encodeURIComponent('מה נכנס לפרופיל של נועה מהשיחה?')}">לפרופיל המלא ←</a></div>
    <div>${fam(s.lines).map(g=>
      `<div class="mg-fam ${g.sc}"><span class="dot"></span>${esc(g.n)}</div>`+
      g.lines.map(l=>`<div class="mg-sl">${esc(l.t)}<span class="mg-slc">${esc(l.cat)}</span></div>`).join('')
    ).join('')}</div>
    ${s.unk?`<div class="mg-unk">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <span><bdo dir="ltr">${esc(s.unk)}</bdo> אינו מזוהה — מה שנאמר ממנו לא שויך לזיכרון אישי</span></div>`:''}
  </div>`;
}

function mgRender(toBottom){
  const q=(document.getElementById('mgQ').value||'').trim();
  const T=THREADS[SEL];

  /* אין קבוצות בג'מפה — הודעות ישירות בלבד. במקום סרגל הקבוצות של HK
     יושבת בכותרת שורה אחת של מי בשיחה. */
  document.getElementById('mgWho').innerHTML=T.ppl.map(p=>
    `<span class="mg-w ${p.r}"><i>${esc(INI(p.n))}</i>${esc(p.n.split(' ')[0])}</span>`).join('');

  document.getElementById('mgName').textContent=T.name;
  const nMsg=T.msgs.filter(m=>!m.day&&!m.sum).length;
  document.getElementById('mgCnt').textContent=q
    ? nMsg+' הודעות · מסונן ל"'+q+'"' : nMsg+' הודעות אחרונות';

  /* הזרם: גלולת יום · בועות · כרטיס סיכום */
  let html='',shown=0;
  T.msgs.forEach(m=>{
    if(m.day){ if(!q) html+=`<div class="mg-day"><span>${esc(m.day)}</span></div>`; return; }
    if(m.sum){ if(!q) html+=sumHtml(m.sum); return; }
    const hit=q&&(m.t.includes(q)||String(m.who).includes(q));
    if(q&&!hit) return;
    shown++;
    html+=`<div class="mg-msg ${m.role} ${hit?'hit':''}">
      <i>${m.role==='unk'?'?':esc(INI(m.who))}</i>
      <div class="mg-bd">
        <div class="mg-mh"><b>${esc(m.who)}</b>
          <span class="j">${m.job?esc(m.job):'לא מזוהה'}</span>
          <span class="t">${esc(m.time)}</span></div>
        <div class="mg-t">${esc(m.t)}</div>
        ${m.tag?`<span class="mg-tag">${esc(m.tag)}</span>`:''}
      </div></div>`;
  });
  if(q&&!shown) html='<div class="mg-empty">לא נמצאו הודעות שמכילות "'+esc(q)+'"</div>';
  const sc=document.getElementById('mgScroll');
  sc.innerHTML=html;
  /* הכניסה נוחתת על ההודעה האחרונה */
  if(toBottom!==false) sc.scrollTop=sc.scrollHeight;
}

/* גובה החלון נגזר מהכרום — הכותרת, גלולת היום והרגל לא נגללים */
function mgFit(){
  const box=document.getElementById('mgBox');
  const top=box.getBoundingClientRect().top;
  box.style.height=Math.max(420,innerHeight-top-44)+'px';
  const sc=document.getElementById('mgScroll'); sc.scrollTop=sc.scrollHeight;
}
mgRender(true); mgFit(); addEventListener('resize',mgFit);
</script>
</body>
</html>
