<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לוח המשימות</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap">
<style>
:root{--navy:#0C4068;--coral:#E4826E;--coral2:#D96A55;--sky:#39ABE2;--bg:#F6F8FB;--panel:#FFFFFF;--line:#E3EAF3;--line2:#CBD6E2;--ink:#12263A;--ink2:#44566A;--ink3:#7A8898;--tint:#EAF3FA;--chip:#EDF2F8;--bad:#C43D30;--warn:#C98404;--ok:#13895B;--okbg:#0E6B47;--onnavy:#DCEBF5;--onnavy2:#9FC0DA;--shadow:0 1px 2px rgba(12,64,104,.04),0 10px 28px -18px rgba(12,64,104,.18)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Rubik,system-ui,sans-serif;font-size:14px;line-height:1.55}
a{color:inherit}
button{font:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:18px 24px 70px}
/* ---- top nav ---- */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top .brand{font-weight:800;font-size:18px;color:var(--navy);letter-spacing:-.3px;margin-inline-end:8px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{text-decoration:none;font-size:13px;font-weight:600;color:var(--ink2);padding:6px 12px;border-radius:999px}
.nav a:hover{background:var(--chip)}
.nav a.on{background:var(--navy);color:#fff}
.nav a i{font-style:normal;font-size:11px;background:var(--chip);color:var(--ink2);border-radius:999px;padding:0 6px;line-height:16px;margin-inline-start:4px;font-variant-numeric:tabular-nums}
.nav a.on i{background:rgba(255,255,255,.22);color:#fff}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 11px;background:var(--chip);color:var(--ink2);border:0;cursor:pointer;white-space:nowrap}
.pill:hover{background:#E2EAF3}
.pill.on{background:var(--navy);color:#fff}
.pill i{font-style:normal;font-size:11px;background:rgba(255,255,255,.22);border-radius:999px;padding:0 6px;line-height:16px;font-variant-numeric:tabular-nums}
.pill:not(.on) i{background:#fff;color:var(--ink2)}
.btn{font-size:13px;font-weight:600;border-radius:999px;padding:7px 16px;border:1px solid var(--line2);background:var(--panel);color:var(--navy);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--chip)}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.pri:hover{background:var(--coral2)}
.btn.sm{padding:4px 11px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,.pill:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.editonly{display:none!important}
body.edit .editonly{display:inline-flex!important}
body.edit .viewonly{display:none!important}
/* ---- band ---- */
.band{background:var(--navy);color:#fff;border-radius:14px;padding:16px 22px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:end;margin-bottom:14px}
.band.closed{background:var(--okbg)}
.band .eyebrow{font-size:11.5px;letter-spacing:.4px;color:var(--onnavy2);font-weight:500}
.band h1{margin:2px 0 0;font-size:25px;font-weight:800;letter-spacing:-.5px;line-height:1.2;position:relative;display:inline-block;padding-bottom:6px}
.band h1::after{content:"";position:absolute;inset-inline-start:1px;bottom:0;width:26px;height:4px;border-radius:99px;background:var(--coral)}
.band.closed h1::after{background:#fff}
.band .meta{font-size:12.5px;color:var(--onnavy);display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.band .meta a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.35)}
.band .meta code{font-family:inherit;color:#fff}
.counts{display:flex;gap:16px;align-items:baseline;text-align:center;font-variant-numeric:tabular-nums}
.counts b{display:block;font-size:24px;font-weight:700;line-height:1}
.counts span{font-size:11px;color:var(--onnavy2)}
.closedmsg{font-size:15px;font-weight:600;color:#fff}
/* ---- bar / tabs ---- */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 10px;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{font-size:13.5px;font-weight:600;border-radius:999px;padding:7px 14px;border:1px solid transparent;background:transparent;color:var(--ink2);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.tab:hover{background:var(--chip)}
.tab.on{background:var(--navy);color:#fff}
.tab i{font-style:normal;font-size:11.5px;background:rgba(255,255,255,.18);border-radius:999px;padding:0 7px;line-height:17px;font-variant-numeric:tabular-nums}
.tab:not(.on) i{background:var(--chip);color:var(--ink2)}
.tab.zero i{background:var(--ok);color:#fff}
.bar .sp{flex:1}
.lead{font-size:13px;color:var(--ink3);margin:0 2px 12px}
/* ---- items ---- */
.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:visible}
.item.done{opacity:.55}
.ih{display:flex;align-items:center;gap:10px;padding:12px 18px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.num{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.ih h2{margin:0;font-size:16px;font-weight:700;color:var(--navy);flex:1;min-width:200px}
.ih .scr{font-size:12px;color:var(--ink3);text-decoration:none;border-bottom:1px dashed var(--line2)}
.kind{font-size:11.5px;font-weight:600;color:var(--ink3);background:var(--chip);border-radius:999px;padding:2px 9px}
.sev{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sev::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sev.s1{color:var(--bad)}.sev.s2{color:var(--warn)}.sev.s3{color:var(--ink3)}
body.edit .sev{cursor:pointer;border-bottom:1px dashed currentColor}
.dev{position:relative}
.dev>button{font-size:12.5px;font-weight:600;color:var(--navy);background:var(--tint);border:0;border-radius:999px;padding:3px 11px;cursor:default;white-space:nowrap}
body.edit .dev>button{cursor:pointer;border:1px dashed var(--sky)}
.dev .dd{display:none;position:absolute;top:calc(100% + 4px);inset-inline-start:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(12,38,58,.16);padding:4px;z-index:9;min-width:120px}
.dev.open .dd{display:block}
.dev .dd button{display:block;width:100%;text-align:start;border:0;background:none;padding:7px 10px;border-radius:7px;font-size:13px;cursor:pointer}
.dev .dd button:hover,.dev .dd button.on{background:var(--tint);color:var(--navy)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);cursor:pointer;user-select:none;white-space:nowrap}
.st input{appearance:none;width:16px;height:16px;border:1.5px solid var(--line2);border-radius:4px;margin:0;display:grid;place-items:center;background:var(--panel);cursor:pointer}
.st input:checked{background:var(--ok);border-color:var(--ok)}
.st input:checked::after{content:"✓";color:#fff;font-size:11px;line-height:1}
.del{color:var(--bad);background:none;border:0;font-size:12.5px;cursor:pointer}
.ib{display:grid;grid-template-columns:1fr 1fr}
.item.one .ib{grid-template-columns:1fr}
.col{padding:10px 18px 14px;min-width:0}
.col+.col{border-inline-start:1px solid var(--line)}
.col h3{margin:0 0 4px;font-size:11.5px;font-weight:600;letter-spacing:.3px;color:var(--ink3)}
.col p{margin:0 0 8px;color:var(--ink2);font-size:14px;max-width:62ch;white-space:pre-wrap;min-height:1.4em}
.col figure{margin:0}
.col img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.col figcaption{font-size:12px;color:var(--ink3);margin-top:5px}
.empty{padding:30px 20px;text-align:center;color:var(--ok);font-weight:600;font-size:15px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.ed[contenteditable="true"]{outline:1px dashed var(--sky);outline-offset:3px;border-radius:4px;background:var(--tint)}
/* ---- home / center ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;text-decoration:none;color:inherit;display:block}
.card:hover{border-color:var(--line2)}
.card.closed{border-color:#BFE3D2;background:#F1FAF5}
.card b{display:block;font-size:15px;color:var(--navy);margin-bottom:6px}
.card .n{display:flex;gap:12px;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.card .n em{font-style:normal;color:var(--ink);font-weight:700}
.card .ok{color:var(--ok);font-weight:600;font-size:13px}
h2.sec{font-size:14px;font-weight:700;color:var(--navy);margin:18px 0 8px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters .lbl{font-size:12px;color:var(--ink3);margin-inline-end:4px}

.quick input{font:inherit;font-size:14px;border:1px solid var(--line2);border-radius:999px;padding:7px 14px;min-width:0}
.quick input:focus{outline:none;border-color:var(--sky)}
.sel{position:relative}
.sel>button{font-size:12.5px;font-weight:600;color:var(--navy);background:var(--chip);border:0;border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.sel .dd{display:none;position:absolute;top:calc(100% + 4px);inset-inline-start:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(12,38,58,.16);padding:4px;z-index:9;min-width:160px;max-height:280px;overflow:auto}
.sel.open .dd{display:block}
.sel .dd button{display:block;width:100%;text-align:start;border:0;background:none;padding:7px 10px;border-radius:7px;font-size:13px;cursor:pointer;white-space:nowrap}
.sel .dd button:hover,.sel .dd button.on{background:var(--tint);color:var(--navy)}
.row{display:grid;grid-template-columns:26px 1fr auto auto auto auto;gap:10px;align-items:center;padding:9px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer}
.row:hover{border-color:var(--line2)}
.row .t{font-weight:600;color:var(--ink);min-width:0}
.row .t small{display:block;font-weight:400;color:var(--ink3);font-size:12px}
.row.done{opacity:.5}
.banner{background:#FFF6E5;color:#7A4E00;border:1px solid #F1D9A8;border-radius:10px;padding:8px 14px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner .sp{flex:1}
.pop{position:fixed;inset:0;background:rgba(12,38,58,.4);display:none;place-items:center;z-index:50}
.pop.on{display:grid}
.pop .md{width:420px;max-width:92vw;background:var(--panel);border-radius:14px;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.pop h3{margin:0 0 6px;font-size:17px;color:var(--navy)}
.pop p{margin:0 0 12px;color:var(--ink3);font-size:13px}
.pop .f{display:flex;gap:8px;justify-content:flex-start;margin-top:6px}
.pop .md.add{width:640px}
.pop .fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink3);margin-bottom:12px}
.pop .fl input,.pop .fl textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;margin:0;resize:vertical}
.pop .fl input:focus,.pop .fl textarea:focus{outline:none;border-color:var(--sky)}
.pop .fr{display:flex;gap:10px;flex-wrap:wrap}
.pop .fr .fl{margin-bottom:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.on{opacity:1}
@media (max-width:760px){.ib{grid-template-columns:1fr}.col+.col{border-inline-start:0;border-top:1px solid var(--line)}.band{grid-template-columns:1fr}.row{grid-template-columns:26px 1fr;}.row>*:nth-child(n+3){display:none}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.howto{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px 10px;margin:14px 0 6px;font-size:13px;color:var(--ink2)}.howto>b{display:block;color:var(--navy);font-size:13.5px;margin-bottom:4px}.howto ol{margin:0;padding-inline-start:18px}.howto li{margin:3px 0;line-height:1.5}.howto li b{color:var(--ink)}.howto code{font-size:12px;background:#F0F4F8;border-radius:4px;padding:0 4px}
.fail{border:1px solid #E9B4AB;background:#fff;color:#C43D30;font:inherit;font-size:12px;font-weight:600;border-radius:999px;padding:3px 11px;cursor:pointer}.fail:hover{background:#FDECEB}
.btn.danger{background:#C43D30;color:#fff;border-color:#C43D30}
.askb{border:1px solid var(--line2);background:#fff;color:var(--ink2);font:inherit;font-size:12px;font-weight:600;border-radius:999px;padding:3px 11px;cursor:pointer;white-space:nowrap}.askb:hover{border-color:var(--sky);color:#14618F}.askb.on{border-color:#c98404;color:#c98404}
.from.bad{background:var(--bad)}
.from{display:inline-block;margin-inline-start:8px;font-size:11px;font-weight:700;color:#fff;background:var(--coral);border-radius:999px;padding:1px 8px;vertical-align:middle}
.wait{font-size:11.5px;font-weight:600;color:#c98404;white-space:nowrap}.qn{display:inline-block;background:#c98404;color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;margin-inline-start:6px}
.qrow{display:flex;align-items:flex-start;gap:12px;background:#FFF9EC;border:1px solid #F3DFA8;border-radius:12px;padding:10px 16px;margin-bottom:8px;font-size:13px}.qrow>div{flex:1}.qrow .w{color:var(--ink3);font-size:11.5px}.qrow p{margin:4px 0 0;color:var(--ink)}.qrow a{color:#14618F;text-decoration:none;font-weight:600}
.log{border-top:1px dashed var(--line);padding:8px 16px;font-size:12px;color:var(--ink2)}.log>div{padding:2px 0}.log span{color:var(--ink3)}.log .failed b{color:#C43D30}.log .built b,.log .passed b{color:#0B6E4B}
.sec{display:flex;align-items:center;gap:10px}
.drow{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}.drow .row{border:0;border-radius:0;margin:0;grid-template-columns:26px 1fr auto auto auto auto auto 14px;cursor:pointer}.drow .car{color:var(--ink3);transition:.15s;display:inline-block}.drow.open .car{transform:rotate(90deg)}.drow.done{opacity:.75}.cwhen{font-size:11.5px;color:var(--ink3);white-space:nowrap}.golink{font-size:12px;color:#14618F;text-decoration:none;font-weight:600;white-space:nowrap}.drow.done .row{cursor:default}.donehdr{margin-top:26px}
.drow .dbody{display:none;border-top:1px solid var(--line)}.drow.open .dbody{display:block}.drow .dfoot{padding:8px 16px 12px;font-size:12.5px}.drow .dfoot a{color:var(--sky,#14618F);text-decoration:none;font-weight:600}.drow .st{white-space:nowrap}.secmd{margin-inline-start:auto;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="brand">לוח המשימות</span>
    <nav class="nav" id="nav"></nav>
    <span class="sp"></span>
    <button class="btn sm viewonly" id="bEdit">עריכה</button>
    <button class="btn sm editonly" id="bCancel">ביטול</button>
    <button class="btn sm pri editonly" id="bSave">שמירה</button>
    <button class="btn sm" id="bMd" title="הורדת MD">MD ⤓</button>
    <button class="btn sm" id="bRefresh" title="מביא את הגרסה האחרונה מגיט, בלי לטעון את הדף">↻ רענון</button>
  </div>
  <div id="banner"></div>
  <div id="app"></div>
</div>
<div class="pop" id="pop"><div class="md add"><h3>פריט חדש</h3>
  <label class="fl">כותרת<input id="aTitle" type="text" placeholder="משפט אחד שאומר מה הפריט"></label>
  <div class="fr"><span class="fl">סוג<span id="aKind"></span></span><span class="fl">מסך<span id="aScreen"></span></span><span class="fl">על מי<span id="aDev"></span></span><span class="fl" id="aSevW">חומרה<span id="aSev"></span></span></div>
  <label class="fl"><span id="aWhatL">מה חסר</span><textarea id="aWhat" rows="3"></textarea></label>
  <label class="fl" id="aNeedW"><span id="aNeedL">מה צריך להיות</span><textarea id="aNeed" rows="3"></textarea></label>
  <div class="f"><button class="btn pri" id="aOk">שמירה לגיט</button><button class="btn" id="aX">ביטול</button></div></div></div>
<div class="pop" id="npop"><div class="md"><h3 id="nTitle">הערה</h3><p id="nSub"></p>
  <label class="fl"><textarea id="nTxt" rows="4"></textarea></label>
  <div class="f"><button class="btn pri" id="nOk">אישור</button><button class="btn" id="nX">ביטול</button></div></div></div>
<div class="toast" id="toast"></div>
<script src="../js/gate.js" defer></script>
<script src="data.js"></script>
<script>
(function(){
'use strict';
/* ---------- נתונים ---------- */
var KINDS=[['spec','אפיון','מה שעוד לא אופיין. פריט = מה חסר באפיון, ומה צריך להחליט.'],['todo','נשאר לפתח','מה שאופיין ועוד לא נבנה. פריט = מה חסר, ומה צריך להיות.'],['fix','תיקונים','מה שנבנה ולא לפי הפרוטוטיפ. פריט = היום בסטייג׳ינג, וצריך להיות.'],['check','בדיקות','מה שעוד לא אומת. "נבדק" = עבר; מה שנכשל חוזר לתיקונים.']];
var KN={spec:'אפיון',todo:'לפתח',fix:'תיקון',check:'בדיקה'};
var DONE_LABEL={spec:'אופיין',todo:'נבנה',fix:'תוקן',check:'נבדק'};
var GENERAL={key:'general',name:'כללי (לא קשור למסך)',task:'',asana:'',proto:'',items:[]};
var FILE=window.HK_BOARD||{version:0,devs:['אייל','אופיר','עומרי','עידו'],screens:[]};
var B=FILE, DRAFT=false;
try{var d=JSON.parse(localStorage.getItem('hkBoardDraft')||'null'); if(d&&d.version>FILE.version){B=d;DRAFT=true;}}catch(e){}
if(!B.screens.some(function(s){return s.key==='general'})) B.screens.push(GENERAL);
B.devs=B.devs&&B.devs.length?B.devs:['אייל','אופיר','עומרי','עידו'];
var ONLINE=/^https?:/.test(location.protocol)&&!/localhost|127\.0\.0\.1/.test(location.hostname);
var EDIT=false;
var app=document.getElementById('app');
/* ---------- עזרים ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sevCls(s){return s==='חוסם'?'s1':s==='גבוה'?'s2':'s3'}
function open_(it){return it.status!=='done'}
function scr(k){return B.screens.filter(function(s){return s.key===k})[0]}
function today(){return new Date().toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'})}
function now(){return new Date().toLocaleString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(',','')}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2600)}
function allItems(){var out=[];B.screens.forEach(function(s){s.items.forEach(function(it){out.push({s:s,it:it})})});return out}
function counts(items){var c={spec:0,todo:0,fix:0,check:0};items.forEach(function(it){if(open_(it))c[it.kind]++});return c}
function route(){var h=location.hash.replace('#','');var q={};h.split('&').forEach(function(p){var kv=p.split('=');if(kv[0])q[kv[0]]=decodeURIComponent(kv[1]||'')});return q}
function go(h){location.hash=h}
/* ---------- ניווט ---------- */
function renderNav(q){
  var h='<a href="#center"'+(q.center!==undefined||(!q.screen&&!q.dev&&q.closed===undefined)?' class="on"':'')+'>מרכז</a>';

  var s=scr(key); if(!s){go('#center');return}
  var c=counts(s.items), total=c.spec+c.todo+c.fix+c.check, closed=total===0;
  if(!tab||!KN[tab]) tab=c.spec?'spec':c.todo?'todo':c.fix?'fix':'check'; TAB=tab;
  var h='<div class="band'+(closed?' closed':'')+'"><div><div class="eyebrow">מסך · עודכן '+esc(B.updated||'')+'</div><h1 class="ed" data-k="name">'+esc(s.name)+'</h1>'
   +'<div class="meta">'+(s.task?'<span>האפיון המלא: <code>'+esc(s.task)+'</code></span>':'')+(s.proto?'<span>פרוטוטיפ: <code>'+esc(s.proto)+'</code></span>':'')+(s.asana?'<a href="'+esc(s.asana)+'" target="_blank" rel="noopener">Asana</a>':'')+'</div></div>'
   +(closed?'<div class="closedmsg">✓ המסך סגור — אין מה לאפיין, לפתח, לתקן או לבדוק</div>':'<div class="counts">'+KINDS.map(function(k){return '<div><b>'+c[k[0]]+'</b><span>'+k[1]+'</span></div>'}).join('')+'</div>')+'</div>';
  h+='<div class="bar">'+KINDS.map(function(k){return '<button class="tab'+(tab===k[0]?' on':'')+(c[k[0]]===0?' zero':'')+'" data-tab="'+k[0]+'">'+k[1]+'<i>'+c[k[0]]+'</i></button>'}).join('')+'<span class="sp"></span><button class="btn sm pri" id="bAdd">＋ פריט</button></div>';
  var kd=KINDS.filter(function(k){return k[0]===tab})[0]; h+='<p class="lead">'+esc(kd[2])+'</p>';
  var list=s.items.filter(function(it){return it.kind===tab});
  if(!list.length) h+='<div class="empty">✓ אין פריטים כאן</div>';
  h+=list.map(function(f,i){
    var one=(tab==='check')||(!f.need&&!f.imgB);
    var hA=tab==='check'?'מה בודקים ואיך':tab==='spec'?'מה חסר באפיון':tab==='todo'?'מה חסר':'היום בסטייג׳ינג', hB=tab==='spec'?'מה צריך להחליט':tab==='todo'?'מה צריך להיות':'צריך להיות';
    return '<section class="item'+(f.status==='done'?' done':'')+(one?' one':'')+'" data-id="'+f.id+'">'
     +'<div class="ih"><span class="num">'+(i+1)+'</span><h2 class="ed" data-k="title">'+esc(f.title)+'</h2>'
     +(tab==='fix'?'<span class="sev '+sevCls(f.sev)+'" data-act="sev">'+esc(f.sev||'בינוני')+'</span>':'')
     +'<span class="dev"><button type="button" data-act="dev">'+esc(f.dev||'—')+'</button><div class="dd">'+B.devs.map(function(d){return '<button type="button" data-dev="'+esc(d)+'"'+(d===f.dev?' class="on"':'')+'>'+esc(d)+'</button>'}).join('')+'</div></span>'
     +'<label class="st"><input type="checkbox" data-act="done"'+(f.status==='done'?' checked':'')+'> '+DONE_LABEL[tab]+'</label>'
     +(tab==='check'&&f.status!=='done'?'<button class="fail" data-act="fail">נכשל</button>':'')
     +(f.ask?'<button class="askb on" data-act="answer">Reject · תשובה</button>':(f.status!=='done'?'<button class="askb" data-act="ask">שאלה / בעיה</button>':''))
     +'<button class="del editonly" data-act="del">הסרה</button></div>'
     +'<div class="ib"><div class="col"><h3>'+hA+'</h3><p class="ed" data-k="what">'+esc(f.what)+'</p>'
     +(f.imgA?'<figure><img src="'+esc(f.imgA)+'" alt="" loading="lazy"><figcaption class="ed" data-k="capA">'+esc(f.capA)+'</figcaption></figure>':'')+'</div>'
     +(one?'':'<div class="col"><h3>'+hB+'</h3><p class="ed" data-k="need">'+esc(f.need)+'</p>'
     +(f.imgB?'<figure><img src="'+esc(f.imgB)+'" alt="" loading="lazy"><figcaption class="ed" data-k="capB">'+esc(f.capB)+'</figcaption></figure>':'')+'</div>')+'</div>'+logHTML(f)+'</section>';
  }).join('');
  app.innerHTML=h;
  app.querySelectorAll('.ed').forEach(function(el){el.contentEditable=EDIT?'true':'false'});
  app.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){collect(s);go('#screen='+key+'&tab='+b.dataset.tab)}});
  var b=document.getElementById('bAdd'); if(b)b.onclick=function(){collect(s);openAdd(tab,key)};
  app.querySelectorAll('.dev>button').forEach(function(bt){bt.onclick=function(e){if(!EDIT)return;e.stopPropagation();var p=bt.parentNode;var was=p.classList.contains('open');closeDD();if(!was)p.classList.add('open')}});
  app.querySelectorAll('.dev .dd button').forEach(function(bt){bt.onclick=function(e){e.stopPropagation();var sec=bt.closest('.item');var f=byId(s,sec.dataset.id);collect(s);f.dev=bt.dataset.dev;f.updated=today();markDirty();renderScreen(key,tab)}});
}
function byId(s,id){return s.items.filter(function(x){return x.id===id})[0]}
function collect(s){
  var sc=app.querySelector('h1.ed'); if(sc)s.name=sc.textContent.trim();
  app.querySelectorAll('.item').forEach(function(sec){var f=byId(s,sec.dataset.id);if(!f)return;sec.querySelectorAll('.ed').forEach(function(el){var v=el.textContent.trim();if(f[el.dataset.k]!==v){f[el.dataset.k]=v;f.updated=today();markDirty();}})});
}
app.addEventListener('click',function(e){
  var q=route(); if(!q.screen)return; var s=scr(q.screen);
  var t=e.target.closest('[data-act]'); if(!t)return; var sec=t.closest('.item'); if(!sec)return; var f=byId(s,sec.dataset.id);
  if(t.dataset.act==='sev'&&EDIT){collect(s);f.sev=f.sev==='חוסם'?'גבוה':f.sev==='גבוה'?'בינוני':'חוסם';f.updated=today();markDirty();renderScreen(q.screen,TAB);}
  if(t.dataset.act==='del'){collect(s);s.items=s.items.filter(function(x){return x!==f});markDirty();renderScreen(q.screen,TAB);}
});
/* סימון "אופיין/נבנה/תוקן" לא סוגר — מעביר לשלב הבא. רק "נבדק" סוגר. משותף לדף המסך ולדף המתכנת.
   בדרך לבדיקות נשמר "back" — המצב המקורי — כדי ש"נכשל" יחזיר את הפריט למי שבנה, עם החומרה והדרישה שהיו. */
function logAdd(f,ev,who,txt,via){var e={when:now(),who:who||'',ev:ev,txt:txt||''};if(via)e.via=via;(f.log=f.log||[]).push(e)}
function advance(f,checked,note){
  if(!checked){f.status='open';if(f.kind==='check'&&f.back&&f.back.dev&&f.dev!=='אייל'){}logAdd(f,'reopened','אייל','');f.updated=today();markDirty();toast('נפתח מחדש — חזר ל'+(f.dev||'הלוח'));return}
  var from=f.kind;
  if(from==='spec'){f.kind='todo';f.what=f.need||f.what;f.need='';logAdd(f,'spec',f.dev,note);toast('עבר ל"נשאר לפתח"')}
  else if(from==='todo'||from==='fix'){var by=f.dev;f.back={kind:from,dev:f.dev,sev:f.sev,what:f.what,need:f.need};
    f.kind='check';f.what='לבדוק: '+(f.need||f.what)+(by?' (נבנה על ידי '+by+')':'');f.need='';f.sev='';f.dev='אייל';logAdd(f,'built',by,note);toast('עבר ל"בדיקות" — על אייל')}
  else{f.status='done';var qq=route();logAdd(f,'passed','אייל',note,qq.dev?'דף '+qq.dev:qq.screen?'מסך '+((scr(qq.screen)||{}).name||qq.screen):'מרכז');toast('נבדק ✓')}
  f.updated=today();markDirty();
}
function fail(f,note){
  var b=f.back||{};
  f.kind='fix';f.dev=b.dev||f.dev||'עידו';f.sev=b.sev||'גבוה';f.need=b.need||f.what.replace(/^לבדוק: /,'');
  f.what='נכשל בבדיקה '+now()+': '+note;f.status='open';logAdd(f,'failed','אייל',note);
  f.updated=today();markDirty();toast('חזר לתיקונים — על '+f.dev);
}
/* פופאפ הערה: ב"נבנה/תוקן" רשות (מה עשיתי ואיך לבדוק), ב"נכשל" חובה (מה נכשל) */
function askNote(title,sub,o,cb){
  if(typeof o!=='object')o={required:!!o,ok:o?'החזרה לתיקונים':'אישור',ph:o?'מה בדיוק לא עבד, ואיפה':'לא חובה',danger:!!o};
  var p=document.getElementById('npop'),t=document.getElementById('nTxt');
  document.getElementById('nTitle').textContent=title;document.getElementById('nSub').textContent=sub;t.value='';t.placeholder=o.ph||'';
  p.classList.add('on');setTimeout(function(){t.focus()},50);
  var ok=document.getElementById('nOk'),required=o.required;ok.textContent=o.ok||'אישור';ok.className='btn '+(o.danger?'danger':'pri');
  document.getElementById('nX').onclick=function(){p.classList.remove('on')};
  p.onclick=function(e){if(e.target===p)p.classList.remove('on')};
  ok.onclick=function(){var v=t.value.trim();if(required&&!v){t.focus();return}p.classList.remove('on');cb(v)};
}
function afterChange(q){if(!EDIT)save();if(q.dev)renderDev(q.dev);else if(q.closed!==undefined)renderClosed();else renderScreen(q.screen,TAB)}
function findItem(t){var q=route();if(q.dev||q.closed!==undefined){var sx=scr(t.dataset.screen);return [sx,byId(sx,t.dataset.id)]}var sx2=scr(q.screen);var sec=t.closest('.item');return [sx2,byId(sx2,sec.dataset.id)]}
app.addEventListener('change',function(e){
  var t=e.target; if(t.dataset.act!=='done')return;
  var q=route(), r=findItem(t), s=r[0], f=r[1]; if(q.screen)collect(s);
  if(!t.checked){advance(f,false);afterChange(q);return}
  if(f.kind==='check'){advance(f,true);afterChange(q);return}
  askNote(DONE_LABEL[f.kind]+' — '+f.title,'מה עשית ואיך לבדוק, בשורה. אייל יראה את זה בפריט הבדיקה.',false,function(v){advance(f,true,v);afterChange(q)});
  t.checked=false;
});
function renderNow(q){if(q.dev)renderDev(q.dev);else renderScreen(q.screen,TAB)}
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act="fail"]'); if(!t)return; e.stopPropagation();
  var q=route(), r=findItem(t), s=r[0], f=r[1]; if(q.screen)collect(s);
  askNote('נכשל — '+f.title,'מה לא עבד. הפריט חוזר לתיקונים אצל '+((f.back&&f.back.dev)||f.dev||'המתכנת')+'.',true,function(v){fail(f,v);afterChange(q)});
});
function ask(f,txt){f.ask={who:f.dev||'',txt:txt,when:now()};logAdd(f,'question',f.dev,txt);f.updated=today();markDirty();toast('ה-Reject נשלח לאייל')}
function answer(f,txt){logAdd(f,'answer','אייל',txt);f.ask=null;f.updated=today();markDirty();toast('התשובה נשמרה — '+(f.dev||'')+' יראה אותה בפריט')}
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act="ask"],[data-act="answer"]'); if(!t)return; e.stopPropagation();
  var q=route(), r=findItem(t), s=r[0], f=r[1]; if(q.screen)collect(s);
  if(t.dataset.act==='ask') askNote('Reject — '+f.title,'מה לא ברור או מה תקוע. אייל רואה את זה בראש הדף שלו ועונה כאן, בפריט.',{required:true,ok:'שליחה לאייל',ph:'מה לא ברור, או מה תקוע ואיפה'},function(v){ask(f,v);afterChange(q)});
  else askNote('תשובה — '+f.title,(f.ask?'ה-Reject של '+f.ask.who+': '+f.ask.txt:''),{required:true,ok:'שמירת התשובה',ph:'התשובה, בשורה או שתיים'},function(v){answer(f,v);afterChange(q)});
});
function logHTML(f){if(!f.log||!f.log.length)return '';var L={built:'נבנה',failed:'נכשל',passed:'נבדק',spec:'אופיין',question:'Reject',answer:'תשובה',reopened:'נפתח מחדש'};
  return '<div class="log">'+f.log.map(function(l){return '<div class="'+esc(l.ev)+'"><span>'+esc(l.when)+' · '+esc(l.who)+' · <b>'+(L[l.ev]||l.ev)+'</b></span>'+(l.txt?' '+esc(l.txt):'')+'</div>'}).join('')+'</div>'}
/* ---------- שמירה ---------- */
function markDirty(){B.version=(FILE.version||0)+1;B.updated=today();DRAFT=true;try{localStorage.setItem('hkBoardDraft',JSON.stringify(B))}catch(e){}renderNav(route())}
function fileText(){return '/* לוח המשימות — מקור האמת. נערך מהמסך (board/index.html) ונשמר לגיט. */\nwindow.HK_BOARD = '+JSON.stringify(B,null,1)+';\n'}
function download(name,text){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function save(){
  var q=route(); if(q.screen)collect(scr(q.screen));
  B.updated=today();
  try{localStorage.setItem('hkBoardDraft',JSON.stringify(B))}catch(e){}
  if(!ONLINE){download('data.js',fileText());toast('data.js ירד — להחליף את board/data.js בריפו');EDIT=false;render();return}
  var pass=localStorage.getItem('hkBoardPass')||'';
  if(!pass){toast('הסיסמה לא שמורה — רענן את הדף והיכנס שוב');return}
  var b=document.getElementById('bSave');if(b)b.disabled=true;
  fetch('/api/save-board',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pass,board:B,who:localStorage.getItem('hkBoardWho')||''})})
   .then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j}})})
   .then(function(x){if(b)b.disabled=false;
     if(x.ok){FILE.version=B.version;DRAFT=false;try{localStorage.removeItem('hkBoardDraft')}catch(e){}toast('נשמר לגיט (קומיט '+x.j.commit+')');EDIT=false;render();}
     else if(x.status===401){localStorage.removeItem('hkBoardPass');toast('הסיסמה השתנתה — רענן את הדף והיכנס שוב');}
     else{toast('השמירה נכשלה: '+(x.j.error||x.status)+' — הקובץ ירד במקום');download('data.js',fileText());}
   }).catch(function(){if(b)b.disabled=false;toast('אין חיבור לשרת — הקובץ ירד במקום');download('data.js',fileText())});
}
var AD={kind:'todo',screen:'general',dev:'עידו',sev:'בינוני'};
function openAdd(kind,screen){
  AD.kind=kind||'todo'; AD.screen=screen||'general'; AD.dev=AD.kind==='check'?'אייל':'עידו'; AD.sev='בינוני';
  var p=document.getElementById('pop'); p.classList.add('on');
  document.getElementById('aTitle').value=''; document.getElementById('aWhat').value=''; document.getElementById('aNeed').value='';
  function labels(){var k=AD.kind;document.getElementById('aWhatL').textContent=k==='check'?'מה בודקים ואיך':k==='spec'?'מה חסר באפיון':k==='todo'?'מה חסר':'היום בסטייג׳ינג';
    document.getElementById('aNeedL').textContent=k==='spec'?'מה צריך להחליט':'מה צריך להיות';document.getElementById('aNeedW').style.display=k==='check'?'none':'';document.getElementById('aSevW').style.display=k==='fix'?'':'none'}
  document.getElementById('aKind').innerHTML=sel('sKind',KINDS.map(function(k){return [k[0],k[1]]}),AD.kind);
  document.getElementById('aScreen').innerHTML=sel('sScreen',B.screens.map(function(x){return [x.key,x.name]}),AD.screen);
  document.getElementById('aDev').innerHTML=sel('sDev',B.devs.map(function(d){return [d,d]}),AD.dev);
  document.getElementById('aSev').innerHTML=sel('sSev',[['חוסם','חוסם'],['גבוה','גבוה'],['בינוני','בינוני'],['נמוך','נמוך']],AD.sev);
  wireSel('sKind',function(v){AD.kind=v;labels()});wireSel('sScreen',function(v){AD.screen=v});wireSel('sDev',function(v){AD.dev=v});wireSel('sSev',function(v){AD.sev=v});
  labels(); setTimeout(function(){document.getElementById('aTitle').focus()},50);
  document.getElementById('aX').onclick=function(){p.classList.remove('on')};
  p.onclick=function(e){if(e.target===p)p.classList.remove('on')};
  document.getElementById('aOk').onclick=function(){
    var t=document.getElementById('aTitle').value.trim(); if(!t){document.getElementById('aTitle').focus();return}
    var it=newItem(AD.kind,t,AD.dev); it.what=document.getElementById('aWhat').value.trim()||it.what; it.need=AD.kind==='check'?'':(document.getElementById('aNeed').value.trim()||it.need); if(AD.kind==='fix')it.sev=AD.sev;
    var sc=scr(AD.screen)||scr('general'); sc.items.push(it); markDirty(); p.classList.remove('on');
    toast('נוסף ל'+sc.name+' — שומר…'); save();
  };
}
/* ---------- MD ----------
   ה-MD תמיד פר מסך: גם הקובץ של מתכנת וגם של המרכז בנויים מסך-מסך —
   כותרת המסך, קישור לאפיון ולפרוטוטיפ, ואז הפריטים לפי טאב. */
function md(sk,dv){
  var q=sk?{screen:sk}:route(), lines=[];
  function item(it){lines.push('### '+it.title+(it.sev?'  \n*חומרה: '+it.sev+'*':'')+(it.dev?'  \n*על: '+it.dev+'*':''));
    if(it.what)lines.push('\n**'+(it.kind==='check'?'מה בודקים ואיך':it.kind==='fix'?'היום בסטייג׳ינג':'מה חסר')+':** '+it.what);
    if(it.need)lines.push('\n**'+(it.kind==='spec'?'מה צריך להחליט':'צריך להיות')+':** '+it.need);
    if(it.imgA)lines.push('\nצילום (סטייג׳ינג): board/'+it.imgA+(it.capA?' — '+it.capA:''));
    if(it.imgB)lines.push('\nצילום (פרוטוטיפ): board/'+it.imgB+(it.capB?' — '+it.capB:''));
    if(it.log&&it.log.length)lines.push('\nהיסטוריה: '+it.log.map(function(l){return l.when+' '+l.who+' '+({built:'נבנה',failed:'נכשל',passed:'נבדק',spec:'אופיין',question:'שאלה',answer:'תשובה'}[l.ev]||l.ev)+(l.txt?': '+l.txt:'')}).join(' | '));
    lines.push('');}
  /* מסך אחד: כותרת + קישורים + הפריטים לפי טאב. lvl = רמת הכותרת */
  function screen(s,items,lvl){
    if(!items.length)return;
    lines.push(lvl+' '+s.name+' ('+items.length+')','');
    lines.push('לפני שמתחילים: לקרוא את docs/AI-GUIDE.md בריפו — מה אייל רוצה, מה אסור, והכרעות שכבר נפלו.');
    if(s.task)lines.push('האפיון המלא: '+s.task);
    if(s.proto)lines.push('הפרוטוטיפ: '+s.proto);
    lines.push('');
    KINDS.forEach(function(k){var l=items.filter(function(it){return it.kind===k[0]});if(!l.length)return;
      lines.push(lvl+'# '+k[1]+' ('+l.length+')','');l.forEach(item)});
  }
  function byScreens(filter){B.screens.forEach(function(s){screen(s,s.items.filter(function(it){return open_(it)&&filter(it)}),'##')})}
  if(q.screen){var s=scr(q.screen);lines.push('# '+s.name+(dv?' — מה על '+dv:' — מה נשאר')+' ('+B.updated+')','');
    screen(s,s.items.filter(function(it){return open_(it)&&(!dv||it.dev===dv)}),'#');download('hk-'+q.screen+(dv?'-'+dv:'')+'.md',lines.join('\n'));}
  else if(q.dev){lines.push('# מה על '+q.dev+' ('+B.updated+')','');
    byScreens(function(it){return it.dev===q.dev});download('hk-'+q.dev+'.md',lines.join('\n'));}
  else{lines.push('# לוח המשימות — כל הפתוחים ('+B.updated+')','');
    byScreens(function(){return true});download('hk-board.md',lines.join('\n'));}
  toast('קובץ ה-MD ירד');
}
/* ---------- רינדור ---------- */
function render(){
  var q=route(); document.body.classList.toggle('edit',EDIT); renderNav(q);
  if(q.screen)renderScreen(q.screen,q.tab); else if(q.dev)renderDev(q.dev); else if(q.closed!==undefined)renderClosed(); else renderCenter();
  app.querySelectorAll('.ed').forEach(function(el){el.contentEditable=EDIT?'true':'false'});
}
document.getElementById('bEdit').onclick=function(){EDIT=true;render()};
document.getElementById('bRefresh').onclick=function(){
  var b=document.getElementById('bRefresh'); if(EDIT||DRAFT){toast('יש שינויים לא שמורים — קודם שמירה או ביטול');return}
  b.disabled=true; var before=B.version||0;
  loadLatest(function(){b.disabled=false; render(); toast((B.version||0)>before?'הלוח התעדכן':'אין חדש')});
};
document.getElementById('bCancel').onclick=function(){EDIT=false;render()};
document.getElementById('bSave').onclick=save;
document.getElementById('bMd').onclick=md;
window.addEventListener('hashchange',render);
/* באתר החי: הגרסה העדכנית מגיט, לא הקובץ שנפרס. אם יש טיוטה מקומית חדשה יותר — היא גוברת. */
function loadLatest(cb){
  var pass=null; try{pass=localStorage.getItem('hkBoardPass')}catch(e){}
  if(!ONLINE||!pass){cb();return}
  fetch('/api/save-board',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pass,action:'load'})})
   .then(function(r){return r.json()}).then(function(j){
     if(j&&j.ok&&j.board&&j.board.screens){var g=j.board; g.devs=g.devs&&g.devs.length?g.devs:FILE.devs;
       if(!g.screens.some(function(x){return x.key==='general'}))g.screens.push(GENERAL);
       if((g.version||0)>=(FILE.version||0)){FILE=g; if(!DRAFT||(B.version||0)<=(g.version||0)){B=g;DRAFT=false;try{localStorage.removeItem('hkBoardDraft')}catch(e){}}}}
     cb();
   }).catch(function(){cb()});
}
loadLatest(render);
/* רענון אוטומטי כל דקה: מביא מגיט, ומצייר מחדש רק אם יש גרסה חדשה יותר.
   לא בזמן עריכה ולא כשפופאפ פתוח — כדי לא למחוק למישהו טקסט באמצע. */
setInterval(function(){
  if(EDIT||DRAFT)return;
  if(document.querySelector('.pop.on'))return;
  var before=B.version||0;
  loadLatest(function(){ if((B.version||0)>before){render();toast('הלוח התעדכן')} });
},60000);
})();
</script>
</body>
</html>
