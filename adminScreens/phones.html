<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HK Money – מספרי טלפון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0C4068; --blue:#39ABE2; --blue-soft:#E4F6FE;
    --salmon:#c97b6e; --salmon-h:#b8685c;
    --green:#1e8e5f; --green-bg:#dff3e9;
    --amber:#b46e0e; --amber-bg:#fbecd0;
    --divider:#E3E3E3; --muted:#7E7E7E; --muted-2:#a9a9a9;
    --bg:#F4F7FA; --off:#F8FAFC; --white:#fff;
    --shadow-card:7px 5px 21.4px rgba(104,105,106,.10), -3px -6px 19.3px rgba(138,138,138,.13);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{direction:rtl}
  body{font-family:'Rubik',sans-serif;background:var(--bg);color:var(--navy);line-height:1.5;
    min-height:100vh;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit;font-size:.92rem;color:var(--navy)}

  .top{background:var(--white);padding:14px 32px;display:flex;align-items:center;
    justify-content:space-between;border-bottom:1px solid var(--divider)}
  .top__brand{display:flex;align-items:center;gap:14px}
  .top__logo{width:40px;height:40px;border-radius:10px;background:var(--blue);display:flex;
    align-items:center;justify-content:center;font-weight:600;color:#fff}
  .top__title{font-size:1.05rem;font-weight:500}
  .top__sub{font-size:.78rem;color:var(--muted);margin-top:2px}
  body.is-embedded .top{display:none}
  body.is-embedded .wrap{max-width:none;margin:0;padding:18px 0 28px 18px}
  .wrap{max-width:1500px;margin:0 auto;padding:32px 40px 60px}
  .card{background:var(--white);border-top:2px solid var(--blue);box-shadow:var(--shadow-card);
    padding:26px 32px 30px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;
    flex-wrap:wrap;gap:14px}
  .page-head__title{font-size:1.7rem;font-weight:500;letter-spacing:-.7px}
  .page-head__meta{color:var(--muted);font-size:.88rem;margin-top:4px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:60px;
    font-weight:500;font-size:.88rem;transition:all .15s;border:1px solid transparent}
  .btn--primary{background:var(--salmon);color:#fff}
  .btn--primary:hover{background:var(--salmon-h)}
  .btn--ghost{background:#fff;color:var(--navy);border-color:var(--divider)}
  .btn--ghost:hover{border-color:var(--blue);color:var(--blue)}
  .btn--sm{padding:6px 14px;font-size:.85rem}

  /* פס מצב — כמה מספרים עוד לא שויכו */
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--off);
    border:1px solid var(--divider);border-radius:12px;padding:11px 16px;margin-bottom:18px;
    font-size:.88rem;color:var(--muted)}
  .bar b{color:var(--navy);font-weight:500}
  .bar .warn{color:var(--amber);font-weight:500}
  .bar .sp{flex:1}

  /* הטבלה */
  .tbl{width:100%;border-collapse:collapse}
  .tbl th{text-align:start;font-size:.76rem;font-weight:500;color:var(--muted);
    padding:0 12px 9px;border-bottom:1px solid var(--divider);white-space:nowrap}
  .tbl td{padding:11px 12px;border-bottom:1px solid #F0F0F0;vertical-align:middle}
  .tbl tr:last-child td{border-bottom:0}
  .tbl tr.open td{background:#FFFDF7}
  .num{font-size:.98rem;font-weight:500;font-variant-numeric:tabular-nums;direction:ltr;
    text-align:start;display:block}
  .calls{font-size:.78rem;color:var(--muted-2);margin-top:2px}
  .st{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:500;
    border-radius:60px;padding:3px 11px;white-space:nowrap}
  .st--ok{background:var(--green-bg);color:var(--green)}
  .st--no{background:var(--amber-bg);color:var(--amber)}
  .rm{color:var(--muted-2);font-size:1rem;padding:4px 8px;border-radius:8px}
  .rm:hover{background:#FDECEB;color:#c0392b}

  /* דרופדאון — רכיב משלנו, לא select של הדפדפן */
  .dd{position:relative;min-width:186px}
  .dd__b{width:100%;display:flex;align-items:center;gap:8px;padding:8px 14px;
    border:1px solid var(--divider);border-radius:60px;background:#fff;font-size:.88rem;
    color:var(--navy);transition:border-color .15s;text-align:start}
  .dd__b:hover{border-color:var(--blue)}
  .dd.on .dd__b{border-color:var(--blue);box-shadow:0 0 0 3px rgba(57,171,226,.14)}
  .dd__b.empty{color:var(--muted-2)}
  .dd__b i{margin-inline-start:auto;flex:none;transition:transform .15s;line-height:0}
  .dd.on .dd__b i{transform:rotate(180deg)}
  .dd__m{position:absolute;z-index:20;top:calc(100% + 5px);inset-inline-start:0;min-width:100%;
    background:#fff;border:1px solid var(--divider);border-radius:12px;padding:5px;
    box-shadow:0 12px 30px rgba(12,64,104,.16);display:none;max-height:236px;overflow:auto}
  .dd.on .dd__m{display:block}
  .dd__m button{display:block;width:100%;text-align:start;padding:8px 12px;border-radius:8px;
    font-size:.88rem;color:var(--navy);white-space:nowrap}
  .dd__m button:hover{background:var(--blue-soft)}
  .dd__m button.on{background:var(--navy);color:#fff}
  .dd__m button small{display:block;font-size:.74rem;color:var(--muted);margin-top:1px}
  .dd__m button.on small{color:rgba(255,255,255,.7)}
  .dd__m .sep{font-size:.72rem;color:var(--muted-2);padding:7px 12px 3px}

  /* הוספת מספר */
  .add{display:flex;gap:9px;align-items:center;margin-top:16px;padding-top:16px;
    border-top:1px solid var(--divider)}
  .add input{padding:8px 14px;border:1px solid var(--divider);border-radius:60px;outline:none;
    width:190px;direction:ltr;text-align:start}
  .add input:focus{border-color:var(--blue)}
  .add .hint{font-size:.8rem;color:var(--muted-2)}
</style>
</head>
<body>

<header class="top">
  <div class="top__brand">
    <div class="top__logo">HK</div>
    <div><div class="top__title">מספרי טלפון</div>
      <div class="top__sub">שיוך מספר לנציג ולחברת הייעוץ שלו</div></div>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <div class="page-head">
      <div>
        <div class="page-head__title">מספרי טלפון</div>
        <div class="page-head__meta">כל מספר שנקלט במערכת, ולמי הוא שייך</div>
      </div>
    </div>
    <div class="bar" id="bar"></div>
    <table class="tbl">
      <thead><tr>
        <th style="width:200px">מספר טלפון</th>
        <th style="width:230px">נציג</th>
        <th style="width:230px">חברת ייעוץ</th>
        <th>סטטוס</th>
        <th style="width:44px"></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="add">
      <input id="newPh" placeholder="050-000-0000" inputmode="tel"
             onkeydown="if(event.key==='Enter')addPh()">
      <button class="btn btn--primary btn--sm" onclick="addPh()">הוספת מספר</button>
      <span class="hint">מספר שנקלט משיחה נכנסת מופיע כאן לבד — ההוספה הידנית היא למספרים שעוד לא התקשרו.</span>
    </div>
  </section>
</main>

<script>
if(location.search.includes('embed=1')) document.body.classList.add('is-embedded');

/* ===================================================================
   הנציגים הם אנשי חברות הייעוץ — אלה שמדברים עם הלקוחות בטלפון.
   בחירת נציג גוררת את חברת הייעוץ שלו, כדי שלא ייווצרו שורות סותרות;
   בחירת חברה מצמצמת את רשימת הנציגים לאותה חברה בלבד.
   =================================================================== */
const FIRMS=['חזות קריספין','שחר ייעוץ עסקי','ברק ושות׳'];
const REPS=[
  {n:'אייל חזות',  r:'מנהל מערכת',    f:'חזות קריספין'},
  {n:'מיכל שגב',   r:'רואת חשבון',     f:'חזות קריספין'},
  {n:'אילון שחר',  r:'יועץ',           f:'שחר ייעוץ עסקי'},
  {n:'טל מלקר',    r:'מנהלת תזרים',    f:'שחר ייעוץ עסקי'},
  {n:'נועה ברק',   r:'יועצת',          f:'ברק ושות׳'},
];
let ROWS=[
  {ph:'03-644-2180',  rep:'טל מלקר',   firm:'שחר ייעוץ עסקי', n:38},
  {ph:'054-882-3311', rep:'אילון שחר', firm:'שחר ייעוץ עסקי', n:21},
  {ph:'03-529-7740',  rep:'נועה ברק',  firm:'ברק ושות׳',      n:12},
  {ph:'052-771-4409', rep:null,        firm:'שחר ייעוץ עסקי', n:4},
  {ph:'050-338-9017', rep:null,        firm:null,             n:1},
];
const repsOf=f=>f?REPS.filter(r=>r.f===f):REPS;
const CHEV='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';

function ddHtml(kind,i,row){
  const cur = kind==='rep'?row.rep:row.firm;
  const lbl = cur || (kind==='rep'?'בחירת נציג':'בחירת חברה');
  let items='';
  if(kind==='rep'){
    const list=repsOf(row.firm);
    items = list.length
      ? list.map(r=>`<button class="${r.n===cur?'on':''}" onclick="pick(${i},'rep','${r.n}')">${r.n}<small>${r.r} · ${r.f}</small></button>`).join('')
      : '<div class="sep">אין נציגים בחברה הזאת</div>';
    if(row.firm) items='<div class="sep">נציגי '+row.firm+'</div>'+items;
  } else {
    items = FIRMS.map(f=>`<button class="${f===cur?'on':''}" onclick="pick(${i},'firm','${f}')">${f}</button>`).join('');
  }
  return `<div class="dd" data-i="${i}" data-k="${kind}">
    <button class="dd__b ${cur?'':'empty'}" onclick="ddTg(this)">${lbl}<i>${CHEV}</i></button>
    <div class="dd__m">${items}${cur?`<button onclick="pick(${i},'${kind}','')">— ניקוי —</button>`:''}</div>
  </div>`;
}
function render(){
  const open=ROWS.filter(r=>!r.rep).length;
  document.getElementById('bar').innerHTML=
    `<b>${ROWS.length}</b> מספרים במערכת<span class="sp"></span>`
   +(open?`<span class="warn">${open===1?'מספר אחד ללא נציג':open+' מספרים ללא נציג'}</span> · שיחה ממספר שלא שויך לא נקשרת לאיש`
         :'<span>כל המספרים משויכים</span>');
  document.getElementById('rows').innerHTML=ROWS.map((r,i)=>`
    <tr class="${r.rep?'':'open'}">
      <td><span class="num">${r.ph}</span><span class="calls">${r.n===1?'שיחה אחת':r.n+' שיחות'}</span></td>
      <td>${ddHtml('rep',i,r)}</td>
      <td>${ddHtml('firm',i,r)}</td>
      <td><span class="st ${r.rep?'st--ok':'st--no'}">${r.rep?'משויך':'ללא נציג'}</span></td>
      <td><button class="rm" onclick="del(${i})" aria-label="הסרה">✕</button></td>
    </tr>`).join('');
}
function ddTg(b){
  const dd=b.closest('.dd'), was=dd.classList.contains('on');
  document.querySelectorAll('.dd.on').forEach(x=>x.classList.remove('on'));
  if(!was) dd.classList.add('on');
}
function pick(i,kind,v){
  const r=ROWS[i];
  if(kind==='rep'){
    r.rep=v||null;
    /* נציג גורר את החברה שלו — כך אין שורה עם נציג מחברה אחרת */
    if(v){const p=REPS.find(x=>x.n===v); if(p) r.firm=p.f;}
  } else {
    r.firm=v||null;
    /* החלפת חברה מנקה נציג ששייך לחברה אחרת */
    if(r.rep){const p=REPS.find(x=>x.n===r.rep); if(!p||p.f!==r.firm) r.rep=null;}
  }
  render();
}
function del(i){const r=ROWS[i];ROWS.splice(i,1);render();}
function addPh(){
  const el=document.getElementById('newPh'), v=(el.value||'').trim();
  if(!v){el.focus();return}
  if(ROWS.some(r=>r.ph===v)){el.select();return}
  ROWS.unshift({ph:v,rep:null,firm:null,n:0}); el.value=''; render();
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.dd')) document.querySelectorAll('.dd.on').forEach(x=>x.classList.remove('on'));
});
addEventListener('keydown',e=>{
  if(e.key==='Escape') document.querySelectorAll('.dd.on').forEach(x=>x.classList.remove('on'));
});
render();
</script>
</body>
</html>
