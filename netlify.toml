# המוקאפ מתפרסם מהשורש. פונקציה אחת: שמירת לוח המשימות (board/data.js) ל-GitHub.
[build]
  publish = "."
  command = ""
  # שמירה מהלוח = קומיט של board/data.js בלבד (דיווח באג: גם צילום ב-board/img/bugs). הלוח קורא אותו ישירות מגיט (action:load),
  # אז קומיט כזה לא צריך פריסה. יציאה 0 = לדלג על הבנייה.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)board/data.js' ':(exclude)board/img/bugs'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
